  <style>
    :root { -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      height: 100vh;

    .bubble-outgoing{
        line-height:1.7;
        word-wrap:break-word;
        overflow-wrap:anywhere;
        white-space:pre-wrap;            /* preserve newlines */

    }

    .bubble-incoming p,
    .bubble-outgoing p{
        margin:0 0 12px;
    }

    .bubble-incoming p:last-child,

        margin-bottom:0;
    }

        font-weight:700;
        margin:18px 0 12px;
    }

    .bubble-incoming h3,
    .bubble-outgoing h3{

        margin:16px 0 10px;
    }

    .bubble-incoming ul,

        list-style:disc;
        padding-left:22px;
        margin:12px 0;

    .bubble-incoming ol,

        margin:12px 0;
    }

    .bubble-incoming li,

    .bubble-incoming blockquote,

    .bubble-incoming pre,
    .bubble-outgoing pre{
        background:#111827;
        color:#fff;
        padding:14px;
        border-radius:12px;
        overflow-x:auto;
        margin:14px 0;
    }

    .bubble-incoming pre code,
    .bubble-outgoing pre code{
        background:none;
        color:inherit;
        padding:0;
    }

    .bubble-incoming code,
    .bubble-outgoing code{
        background:#eef2f7;
        padding:2px 6px;
        border-radius:6px;

    }

    .bubble-incoming table,
    .bubble-outgoing table{
        border-collapse:collapse;
        width:100%;
        margin:14px 0;
    }

    .bubble-incoming th,
    .bubble-outgoing th,
    .bubble-incoming td,
    .bubble-outgoing td{

    .bubble-incoming hr,

        border-top:1px solid #ddd;
    }

    .md-table-wrap { overflow-x:auto; }

    /* textarea styling: allow internal scrolling once max height reached */
    #messageInput {
      resize: none;
      overflow-y: auto;
      min-height: 36px;
      max-height: 140px; /* maximum visible height; beyond this, the field will scroll internally */
      line-height: 1.25;
      padding-top: 6px;
      padding-bottom: 6px;

    width:100%;

    overflow-wrap:anywhere;
    word-break:break-word;

    line-height:1.5;
    padding:0;
    }

  <script>
  (function () {
    'use strict';
    const API_BASE = 'https://examguide.onrender.com/api';
    const MESSAGES_API = `${API_BASE}/messages`;
    const DISCUSSIONS_API = `${API_BASE}/discussions`;
    const UPLOAD_ENDPOINT = `${API_BASE}/uploads`;
    const SOCKET_URL = 'https://examguide.onrender.com';
    const POLL_INTERVAL_FALLBACK = 2000;
    const FETCH_TIMEOUT_MS = 10000;
    const MAX_UPLOAD_SIZE_BYTES = 10 * 1024 * 1024;
    const INPUT_MAX_HEIGHT = 140; // matches CSS max-height

    const messagesWrapper = document.getElementById('messagesWrapper');
    const messagesList = document.getElementById('messagesList');
    const skeletonLoader = document.getElementById('skeletonLoader');
    const messageInput = document.getElementById('messageInput'); // textarea
    const actionBtn = document.getElementById('actionBtn');
    const actionIcon = document.getElementById('actionIcon');
    const attachBtn = document.getElementById('attachBtn');
    const fileInput = document.getElementById('fileInput');
    const attachmentsPreview = document.getElementById('attachmentsPreview');
    const addBtn = document.getElementById('addBtn');
    const chatTitle = document.getElementById('chatTitle');
    const chatSub = document.getElementById('chatSub');
    const chatAvatar = document.getElementById('chatAvatar');
    const chatEmoji = document.getElementById('chatEmoji');
    const pinnedContainer = document.getElementById('pinnedContainer');
    const pinnedText = document.getElementById('pinnedText');
    const clearPinBtn = document.getElementById('clearPinBtn');

    let token = localStorage.getItem('token') || null;
    let userId = getQueryParam('userId');
    let groupId = getQueryParam('groupId');
    const isGroup = !!groupId;
    let currentUserId = null;
    let messages = [];
    let lastMessageId = null;
    let isAtBottom = true;
    let attachmentsToUpload = [];
    let pendingUploads = {};
    let socket = null;
    let fallbackPollHandle = null;
    let consecutiveErrors = 0;
    const EMOJIS = ['👍','❤️','😂','🎉','😮','😢','👏','🤔'];

    function getQueryParam(name) { return new URLSearchParams(window.location.search).get(name); }
    function safeHtml(s){ if (s===null||s===undefined) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
    function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
    // Generate a thumbnail from an image file
function createThumbnail(file) {
    return new Promise((resolve, reject) => {

        if (!file.type.startsWith("image/")) {
            resolve(null);
            return;
        }

        const reader = new FileReader();

        reader.onload = function(e){

            const img = new Image();

            img.onload = function(){

                const canvas = document.createElement("canvas");
                const ctx = canvas.getContext("2d");

                const MAX = 300;

                let w = img.width;
                let h = img.height;

                if (w > h) {
                    if (w > MAX) {
                        h *= MAX / w;
                        w = MAX;
                    }
                } else {
                    if (h > MAX) {
                        w *= MAX / h;
                        h = MAX;
                    }
                }

                canvas.width = w;
                canvas.height = h;

                ctx.drawImage(img,0,0,w,h);

                resolve(canvas.toDataURL("image/jpeg",0.7));

            };

            img.onerror = reject;
            img.src = e.target.result;

        };

        reader.onerror = reject;
        reader.readAsDataURL(file);

    });
            }
    async function uploadImageToBackend(file){

    const formData = new FormData();

    formData.append("image", file, file.name);

    const response = await fetch(
        "https://examguide.onrender.com/api/images",
        {
            method:"POST",
            body:formData
        }
    );

    const result = await response.json();

    if(!result.url){
        throw new Error("Upload failed");
    }

    return result.url;

}
    function isImage(file){

    return file.type.startsWith("image/");

    }

    async function fetchWithTimeout(url, opts={}, timeout=FETCH_TIMEOUT_MS){
      const c = new AbortController(); opts.signal = c.signal;
      const timer = setTimeout(()=>c.abort(), timeout);
      try {
        const res = await fetch(url, opts);
        clearTimeout(timer);
        return res;
      } catch (err) {
        clearTimeout(timer);
        throw err;
      }
    }

    function showSkeleton(show=true){ skeletonLoader.style.display = show ? '' : 'none'; messagesList.style.display = show ? 'none' : ''; }
    function setHeaderDefaults(){
      if (isGroup){ chatTitle.textContent='Group'; chatSub.textContent='— members'; chatAvatar.src=`https://ui-avatars.com/api/?name=Group&background=F59E0B&color=fff`; chatEmoji.textContent='👥'; }
      else if (userId){ chatTitle.textContent='Direct'; chatSub.textContent='One-on-one'; chatAvatar.src=`https://ui-avatars.com/api/?name=User&background=34C759&color=fff`; chatEmoji.textContent='💬'; }
      else { chatTitle.textContent='Chat'; chatSub.textContent=''; }
    }
    function checkIfAtBottom(){ const threshold = 120; const pos = messagesWrapper.scrollTop + messagesWrapper.clientHeight; isAtBottom = (messagesWrapper.scrollHeight - pos) < threshold; }
    function scrollToBottom(smooth=true){ try{ messagesWrapper.scrollTo({ top: messagesWrapper.scrollHeight, behavior: smooth ? 'smooth' : 'auto' }); }catch(e){ messagesWrapper.scrollTop = messagesWrapper.scrollHeight; } }

    function formatTime(ts){ if (!ts) return ''; const d=new Date(ts); const now=new Date(); const diff=Math.round((now-d)/1000); if (diff<60) return 'Just now'; if (diff<3600) return d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' }); if (diff<86400) return d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' }); return d.toLocaleDateString([], { day:'numeric', month:'short' }); }

    function normalizeMessages(arr){ return (arr||[]).map(m => ({
      _id: m._id,
      from: m.from,
      fromName: m.fromName || m.from?.fullname || m.from?.username || '',
      fromAvatar: m.fromAvatar || m.from?.profilePicture || '',
      text: m.text || '',
      attachments: m.attachments || (m.attachmentUrl ? [{ url: m.attachmentUrl, filename: m.attachmentFilename || '', contentType: m.attachmentType }] : []),
      reactions: m.reactions || {},
      time: m.time || m.createdAt || m.createdAt
    })); }

    // Render markdown safely with improvements
    function renderMessage(rawText) {
      let text = (rawText == null) ? '' : String(rawText);

      // preserve consecutive blank lines: collapse 3+ -> 2, trim edges
      text = text.replace(/\n{3,}/g, "\n\n").trim();

      // auto-link bare URLs by enclosing in angle brackets (helps marked auto-link)
      // avoid converting inside existing markdown links: naive but practical
      text = text.replace(/(^|\s)(https?:\/\/[^\s<)]+)/g, '$1<$2>');

      try {
        const html = (window.marked ? marked.parse(text) : text.replace(/\n/g, '<br>'));

        // Wrap tables for responsiveness before sanitizing
        const withWrappedTables = html.replace(/<table>/g, '<div class="md-table-wrap"><table>').replace(/<\/table>/g, '</table></div>');

        // Sanitize
        const clean = (window.DOMPurify ? DOMPurify.sanitize(withWrappedTables) : withWrappedTables);

        return clean;
      } catch (e) {
        const fallback = safeHtml(text).replace(/\n/g, '<br>');
        return (window.DOMPurify ? DOMPurify.sanitize(fallback) : fallback);
      }
    }

    /* Auto-resize textarea until max; after max, allow internal scroll */
    function adjustInputHeight() {
      if (!messageInput) return;
      messageInput.style.height = 'auto';
      const scrollH = messageInput.scrollHeight;
      const newHeight = Math.min(scrollH, INPUT_MAX_HEIGHT);
      messageInput.style.height = newHeight + 'px';
      // if content taller than max, keep internal scroll (CSS overflow-y:auto handles it)
    }

    
function buildMessageHtml(m){

    const isOutgoing = String(m.from) === String(currentUserId);
    const time = formatTime(m.time);
    const messageHtml = renderMessage(m.text);

    const attachmentsHtml = (m.attachments || []).map(a => {

        const url = safeHtml(a.url || a.path || '');
        const name = safeHtml(a.filename || a.name || '');
        const type = (a.contentType || '').toLowerCase();

        // ==========================
        // IMAGE ATTACHMENT
        // ==========================
        if (type.startsWith('image') || /\.(png|jpe?g|gif|webp)$/i.test(name)) {

            const cachedImage = getCachedImage(url) || url;

            return `
                <div class="${isOutgoing ? 'justify-end' : ''}">
                    <img
                        src="${cachedImage}"
                        data-cloud="${url}"
                        alt="${name}"
                        class="chat-image block w-full max-w-xs rounded-xl object-cover cursor-pointer">
                </div>
            `;
        }

        // ==========================
        // OTHER FILES
        // ==========================
        return `
            <div class="${isOutgoing ? 'justify-end' : ''}">
                <a href="${url}"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="file-preview mt-2 ${isOutgoing ? 'mr-2' : ''}">

                    <div class="w-10 h-10 bg-gray-50 rounded flex items-center justify-center text-gray-700">
                        <i class="${type.startsWith('image') ? 'fa-regular fa-image' : 'fa-solid fa-file'}"></i>
                    </div>

                    <div class="flex-1 ml-2">
                        <div class="text-sm font-medium">${name}</div>
                        <div class="text-xs text-gray-500">
                            ${Math.round((a.size || 0) / 1024)} KB
                        </div>
                    </div>

                </a>
            </div>
        `;

    }).join('');

    const reactions = m.reactions || {};
    const reactMap = {};

    if (Array.isArray(reactions)) {

        reactions.forEach(r => {
            if (r.emoji) {
                reactMap[r.emoji] = {
                    count: (r.users?.length || 0),
                    users: r.users || []
                };
            }
        });

    } else if (typeof reactions === 'object') {

        for (const k of Object.keys(reactions)) {

            const v = reactions[k];

            if (Array.isArray(v))
                reactMap[k] = { count: v.length, users: v };

            else if (typeof v === 'number')
                reactMap[k] = { count: v, users: [] };

            else
                reactMap[k] = { count: 0, users: [] };
        }
    }

    const reactionItems = Object.keys(reactMap).map(emoji => {

        const info = reactMap[emoji];
        const you = info.users && info.users.includes(String(currentUserId));

        return `
            <div class="reaction-pill ${you ? 'you' : ''}"
                 data-msg="${safeHtml(m._id)}"
                 data-emoji="${safeHtml(emoji)}">

    async function cacheImage(url) {

    try {

        const key = "chat_image_" + btoa(url);

        const cached = localStorage.getItem(key);

        if (cached) return cached;

        const response = await fetch(url);

        const blob = await response.blob();

        const reader = new FileReader();

        return await new Promise(resolve => {

            reader.onloadend = () => {

                localStorage.setItem(key, reader.result);

                resolve(reader.result);

            };

            reader.readAsDataURL(blob);

        });

    } catch (err) {

        console.error(err);

        return url;

    }

}

function getCachedImage(url) {

    const key = "chat_image_" + btoa(url);

    return localStorage.getItem(key);

}

          parts.push(`<div class="flex justify-center my-2"><span class="bg-[#E4E6EB] text-gray-700 text-xs font-medium px-3 py-1 rounded-full">${safeHtml(dateStr)}</span></div>`);

    // single uploadFiles implementation (used by submit flow)
    async function uploadFiles(files, progressCallback = () => {}) {
    const uploaded = [];

    for (let i = 0; i < files.length; i++) {
        const file = files[i];

        if (file.size > MAX_UPLOAD_SIZE_BYTES) {
            alert(`${file.name} is larger than 10MB.`);
            continue;
        }

        try {
            progressCallback(i, "uploading");

            const formData = new FormData();

            // Same field name used by your working Image Editor
            formData.append("image", file, file.name);

            const response = await fetch(
                "https://examguide.onrender.com/api/images",
                {
                    method: "POST",
                    body: formData
                }
            );

            const result = await response.json();

            if (!result.url) {
                throw new Error("Upload failed");
            }

            uploaded.push({
                url: result.url,
                filename: file.name,
                contentType: file.type,
                size: file.size,
                thumbnail: URL.createObjectURL(file)
            });

            progressCallback(i, "done", result.url);

        } catch (err) {

            console.error(err);

            progressCallback(i, "failed");

        }
    }

    return uploaded;
}

    async function loadMessages(){
      if (!token) return;
      if (!userId && !groupId) return;
      const url = isGroup ? `${MESSAGES_API}/group/${groupId}/messages` : `${MESSAGES_API}/user/${userId}/messages`;
      try {
        const res = await fetchWithTimeout(url, { headers:{ 'Authorization': `Bearer ${token}` } }, FETCH_TIMEOUT_MS);
        if (!res.ok){ consecutiveErrors++; console.warn('loadMessages failed', res.status); return; }
        consecutiveErrors = 0;
        const arr = await res.json();
        const normalized = normalizeMessages(arr);
        await renderMessages(normalized);
      } catch (err) {
        consecutiveErrors++;
        if (err.name === 'AbortError') console.warn('loadMessages timeout');
        else console.warn('loadMessages error', err);
      }
    }

    function initSocket() {
      if (!window.io) {
        startFallbackPolling();
        return;
      }
      try {
        socket = io(SOCKET_URL, { auth: { token } , transports: ['websocket','polling'], reconnectionAttempts: 5 });
      } catch (err) {
        startFallbackPolling();
        return;
      }

      socket.on('connect', () => {
        stopFallbackPolling();
        if (isGroup) socket.emit('join', { room: `group_${groupId}` });
        else socket.emit('join', { room: `chat_user_${userId}` });
      });

      socket.on('connect_error', (err) => {});

      socket.on('message:created', async (payload) => {
        try {
          const msg = normalizeMessages([payload])[0];
          if (!msg) return;
          await loadMessages();
        } catch (err) {}
      });

      socket.on('message:updated', async (payload) => { await loadMessages(); });
      socket.on('message:deleted', async (payload) => { await loadMessages(); });
      socket.on('message:reaction', async (payload) => { await loadMessages(); });

      socket.on('disconnect', (reason) => { startFallbackPolling(); });

      setTimeout(()=>{ if (!socket.connected) startFallbackPolling(); }, 3000);
    }

    function startFallbackPolling() {
      if (fallbackPollHandle) return;
      fallbackPollHandle = setInterval(async () => {
        if (document.hidden) return;
        await loadMessages();
      }, POLL_INTERVAL_FALLBACK);
    }
    function stopFallbackPolling(){ if (fallbackPollHandle){ clearInterval(fallbackPollHandle); fallbackPollHandle = null; } }

    .map(file => ({
        url: URL.createObjectURL(file),

        filename: file.name,
        contentType: file.type,
        uploading: true
    }));

const optimisticMessage = {
    _id: `temp-${Date.now()}`,

    text,
    attachments: tempAttachments,
    reactions: {},
    time: new Date().toISOString()
};

await renderMessages([...messages, optimisticMessage]);
scrollToBottom(false);

    

    let uploadedMeta = [];

    if (files.length) {
        uploadedMeta = await uploadFiles(files);
    }

    if (!text && uploadedMeta.length === 0) return;

    await sendMessage(text, uploadedMeta);

}

    init().catch(err=>{ console.error('chat init failed', err); showSkeleton(false); });

    window._chatHelpers = { toggleReaction, sendMessage };
  })();
  </script>
</body>
