<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamGuard AI Tutor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
            chtml: { scale: 1, matchFontHeight: false }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; padding: 0; }
        body, #chatContainer { -ms-overflow-style: none; scrollbar-width: none; }
        body::-webkit-scrollbar, #chatContainer::-webkit-scrollbar { display: none; }
        
        .chat-bubble { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        .typing-dots { display: inline-flex; gap: 4px; }
        .typing-dot { width: 8px; height: 8px; border-radius: 50%; background: #d1d5db; animation: bounce 1.4s infinite; }
        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        
        .material-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 6px; font-size: 12px; color: #1e40af; }
        .material-badge .remove { cursor: pointer; font-weight: bold; }
        .material-badge .remove:hover { color: #dc2626; }

        .btn-primary { background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-primary:disabled { background: #cbd5e1; cursor: not-allowed; }
        
        .btn-secondary { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; padding: 8px 16px; border-radius: 6px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
        .btn-secondary:hover { background: #e5e7eb; }

        .input-file { padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
        
        .badge-info { display: inline-block; padding: 4px 8px; background: #dbeafe; color: #0c4a6e; border-radius: 4px; font-size: 11px; font-weight: 600; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); display: none; align-items: center; justify-content: center; z-index: 9999; }
        .modal-overlay.show { display: flex; }
        .modal { background: white; border-radius: 12px; max-width: 600px; width: 95%; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .modal-header { padding: 20px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: white; }
        .modal-body { padding: 20px; }
        .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: #6b7280; padding: 0; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
        .modal-close:hover { color: #111827; }

        .empty-state { text-align: center; padding: 32px 16px; color: #9ca3af; }
        .empty-state i { font-size: 48px; opacity: 0.5; margin-bottom: 12px; display: block; }

        .quiz-question { padding: 16px; background: #f9fafb; border-radius: 8px; margin-bottom: 12px; border-left: 4px solid #2563eb; }
        .quiz-question-text { font-weight: 600; color: #111827; margin-bottom: 12px; }
        .quiz-option { display: flex; align-items: center; padding: 8px; margin: 6px 0; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        .quiz-option:hover { background: #f3f4f6; }
        .quiz-option input { margin-right: 8px; }
        .quiz-answer { padding: 8px 12px; background: #dbeafe; color: #0c4a6e; border-radius: 6px; font-size: 12px; margin-top: 8px; }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .chat-container { margin: 0; }
        }
    </style>
</head>
<body class="bg-white">
    <div class="flex h-full">
        <!-- Sidebar (Materials Panel) -->
        <div class="hidden lg:flex flex-col w-80 bg-gray-50 border-r border-gray-200 overflow-y-auto">
            <div class="p-6 border-b border-gray-200 sticky top-0 bg-white">
                <h2 class="text-lg font-bold text-gray-900">Materials</h2>
                <p class="text-xs text-gray-500 mt-1">Upload files for analysis</p>
            </div>

            <div class="p-6 flex flex-col gap-4 flex-1">
                <!-- Upload Section -->
                <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center cursor-pointer hover:border-blue-400 transition" id="uploadZone">
                    <i class="fas fa-cloud-upload-alt text-3xl text-gray-400 mb-2 block"></i>
                    <p class="text-sm font-medium text-gray-700">Drop files here</p>
                    <p class="text-xs text-gray-500 mt-1">or click to browse</p>
                    <input id="materialInput" type="file" multiple accept=".pdf,.docx,.doc,.jpg,.jpeg,.png,.txt" style="display: none;">
                </div>

                <!-- Upload Status -->
                <div id="uploadStatus" style="display: none;" class="p-3 rounded-lg text-sm text-blue-700 bg-blue-50"></div>

                <!-- Materials List -->
                <div>
                    <h3 class="text-sm font-semibold text-gray-900 mb-3">Uploaded Materials</h3>
                    <div id="materialsList" class="space-y-2 max-h-96 overflow-y-auto">
                        <div class="empty-state text-xs">
                            <i class="fas fa-inbox"></i>
                            No materials yet
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="flex flex-col flex-1 bg-white">
            <!-- Header -->
            <div class="border-b border-gray-200 bg-white p-4 lg:p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <h1 class="text-xl lg:text-2xl font-bold text-gray-900">Prof. Adeyemi</h1>
                        <p class="text-sm text-gray-500 mt-1">AI Tutor Assistant</p>
                    </div>
                    <div class="text-right">
                        <div class="text-sm font-semibold text-gray-900" id="creditsDisplay">— Credits</div>
                        <button onclick="clearChat()" class="mt-2 text-xs font-medium text-gray-600 hover:text-red-600 transition">
                            <i class="fas fa-trash-alt"></i> Clear
                        </button>
                    </div>
                </div>
            </div>

            <!-- Chat Container -->
            <div id="chatContainer" class="flex-1 overflow-y-auto p-4 lg:p-6 space-y-4 max-w-4xl mx-auto w-full">
                <div class="empty-state">
                    <i class="fas fa-comments"></i>
                    <p class="text-gray-600">Start a conversation with Prof. Adeyemi</p>
                </div>
            </div>

            <!-- Input Area -->
            <div class="border-t border-gray-200 bg-white p-4 lg:p-6">
                <div class="max-w-4xl mx-auto">
                    <!-- Materials Badge Row -->
                    <div id="materialsBadgeRow" class="mb-3 flex flex-wrap gap-2" style="display: none;"></div>

                    <!-- Message Input -->
                    <form id="chatForm" class="flex gap-2">
                        <textarea 
                            id="chatInput" 
                            placeholder="Ask anything..." 
                            rows="1" 
                            class="flex-1 border border-gray-300 rounded-lg px-4 py-3 text-sm resize-none focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                            oninput="this.style.height=''; this.style.height = Math.min(this.scrollHeight, 120) + 'px'">
                        </textarea>
                        <button type="submit" id="sendBtn" class="bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-lg transition flex items-center justify-center" style="width: 44px; height: 44px;">
                            <i class="fas fa-arrow-up text-lg"></i>
                        </button>
                    </form>
                    
                    <!-- Mobile Material Upload Button -->
                    <div class="lg:hidden mt-3">
                        <button type="button" onclick="document.getElementById('materialInput').click()" class="btn-secondary w-full text-sm">
                            <i class="fas fa-cloud-upload-alt"></i> Add Material
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Quiz Modal -->
    <div id="quizModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2 class="text-lg font-bold text-gray-900">Generated Quiz</h2>
                <button type="button" class="modal-close" onclick="closeQuizModal()">×</button>
            </div>
            <div class="modal-body" id="quizContent"></div>
        </div>
    </div>

    <script>
        const BACKEND_BASE = "https://examguide.onrender.com";
        const API = (path) => `${BACKEND_BASE}/api/ai-chat${path}`;

        let token = localStorage.getItem('student_jwt_token') || null;
        let userData = null;
        let materials = [];
        let selectedMaterialIds = [];
        let sessionId = null;

        try { userData = JSON.parse(localStorage.getItem('studentData') || "null"); } catch (e) { userData = null; }

        function updateCreditsDisplay() {
            const credits = userData?.creditPoints ?? "—";
            document.getElementById('creditsDisplay').textContent = credits + " Credits";
        }

        function authHeaders(json = true) {
            const h = {};
            if (json) h['Content-Type'] = 'application/json';
            if (token) h['Authorization'] = 'Bearer ' + token;
            return h;
        }

        function notify(msg, type = 'info') {
            const div = document.createElement('div');
            const bgColor = type === 'error' ? 'bg-red-100' : 'bg-blue-100';
            const textColor = type === 'error' ? 'text-red-700' : 'text-blue-700';
            div.className = `fixed bottom-4 right-4 p-3 rounded-lg text-sm font-medium ${bgColor} ${textColor} z-50 max-w-sm`;
            div.textContent = msg;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        // Material upload handling
        const uploadZone = document.getElementById('uploadZone');
        const materialInput = document.getElementById('materialInput');

        uploadZone.addEventListener('click', () => materialInput.click());
        uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.style.borderColor = '#3b82f6'; });
        uploadZone.addEventListener('dragleave', () => { uploadZone.style.borderColor = '#d1d5db'; });
        uploadZone.addEventListener('drop', (e) => { 
            e.preventDefault(); 
            uploadZone.style.borderColor = '#d1d5db';
            if (e.dataTransfer.files.length > 0) {
                materialInput.files = e.dataTransfer.files;
                handleMaterialUpload();
            }
        });

        materialInput.addEventListener('change', handleMaterialUpload);

        async function handleMaterialUpload() {
            if (!materialInput.files.length) return;
            if (!token) { notify('Please login first', 'error'); return; }

            const statusDiv = document.getElementById('uploadStatus');
            statusDiv.textContent = `Uploading ${materialInput.files.length} file(s)...`;
            statusDiv.style.display = 'block';

            for (const file of materialInput.files) {
                try {
                    const fd = new FormData();
                    fd.append('file', file);
                    const res = await fetch(API('/upload'), { 
                        method: 'POST', 
                        headers: { 'Authorization': 'Bearer ' + token }, 
                        body: fd 
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.message || 'Upload failed');

                    materials.push({
                        id: data.materialId,
                        name: file.name,
                        size: file.size,
                        type: file.type
                    });
                    renderMaterialsList();
                    notify(`${file.name} uploaded`, 'success');
                } catch (err) {
                    notify(`Failed: ${file.name}`, 'error');
                }
            }

            statusDiv.textContent = 'Upload complete';
            setTimeout(() => { statusDiv.style.display = 'none'; }, 2000);
            materialInput.value = '';
        }

        function renderMaterialsList() {
            const list = document.getElementById('materialsList');
            if (materials.length === 0) {
                list.innerHTML = '<div class="empty-state text-xs"><i class="fas fa-inbox"></i> No materials yet</div>';
                return;
            }

            list.innerHTML = materials.map((m, idx) => `
                <div class="p-3 bg-white border border-gray-200 rounded-lg flex items-start justify-between hover:border-blue-300 transition cursor-pointer group">
                    <div class="flex-1 min-w-0" onclick="toggleMaterial('${m.id}')">
                        <p class="text-sm font-medium text-gray-900 truncate">${m.name}</p>
                        <p class="text-xs text-gray-500">${(m.size / 1024).toFixed(0)} KB</p>
                    </div>
                    <input type="checkbox" class="material-checkbox" data-id="${m.id}" style="margin-left: 8px; cursor: pointer;" onchange="toggleMaterial('${m.id}')">
                </div>
            `).join('');
        }

        function toggleMaterial(id) {
            const idx = selectedMaterialIds.indexOf(id);
            if (idx > -1) selectedMaterialIds.splice(idx, 1);
            else selectedMaterialIds.push(id);

            document.querySelectorAll('.material-checkbox').forEach(cb => {
                cb.checked = selectedMaterialIds.includes(cb.dataset.id);
            });

            updateSelectedMaterialsDisplay();
        }

        function updateSelectedMaterialsDisplay() {
            const row = document.getElementById('materialsBadgeRow');
            if (selectedMaterialIds.length === 0) {
                row.style.display = 'none';
                return;
            }
            row.style.display = 'flex';
            row.innerHTML = selectedMaterialIds.map(id => {
                const mat = materials.find(m => m.id === id);
                return `<span class="material-badge">${mat?.name || 'Material'} <span class="remove" onclick="removeMaterial('${id}', event)">×</span></span>`;
            }).join('');
        }

        function removeMaterial(id, e) {
            e.stopPropagation();
            selectedMaterialIds = selectedMaterialIds.filter(m => m !== id);
            document.querySelectorAll('.material-checkbox').forEach(cb => {
                cb.checked = selectedMaterialIds.includes(cb.dataset.id);
            });
            updateSelectedMaterialsDisplay();
        }

        // Chat functionality
        const chatContainer = document.getElementById('chatContainer');
        const chatForm = document.getElementById('chatForm');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');

        function clearChatUI() {
            chatContainer.innerHTML = '<div class="empty-state"><i class="fas fa-comments"></i> <p class="text-gray-600">Start a conversation</p></div>';
        }

        function clearChat() {
            if (confirm('Clear chat history?')) clearChatUI();
        }

        function extractJSONFromText(text) {
            // Try to find JSON array in the text
            const jsonMatch = text.match(/\[\s*\{[\s\S]*?\}\s*\]/);
            if (jsonMatch) {
                try {
                    return JSON.parse(jsonMatch[0]);
                } catch (e) {
                    return null;
                }
            }
            return null;
        }

        function addMessage(text, sender = 'bot') {
            if (chatContainer.querySelector('.empty-state')) chatContainer.innerHTML = '';

            const div = document.createElement('div');
            div.className = `chat-bubble flex gap-3 ${sender === 'user' ? 'justify-end' : 'justify-start'}`;

            if (sender === 'user') {
                div.innerHTML = `
                    <div class="max-w-xs lg:max-w-md xl:max-w-lg bg-blue-600 text-white p-3 rounded-lg text-sm leading-relaxed">
                        ${escapeHtml(text).replace(/\n/g, '<br>')}
                    </div>
                `;
            } else {
                // Extract JSON from text before displaying
                const questions = extractJSONFromText(text);
                let displayText = text;

                if (questions && Array.isArray(questions)) {
                    // Remove JSON from display text
                    displayText = text.replace(/\[\s*\{[\s\S]*?\}\s*\]/, '').trim();
                }

                div.innerHTML = `
                    <div class="max-w-xs lg:max-w-md xl:max-w-lg bg-gray-100 text-gray-900 p-3 rounded-lg text-sm leading-relaxed chat-message">
                        ${formatText(displayText)}
                    </div>
                `;

                chatContainer.appendChild(div);
                chatContainer.scrollTop = chatContainer.scrollHeight;

                if (window.MathJax) {
                    MathJax.typesetPromise([div]).catch(() => {});
                }

                // If JSON questions found, show modal
                if (questions && Array.isArray(questions) && questions.length > 0) {
                    setTimeout(() => showQuizModal(questions), 300);
                }

                return;
            }

            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function formatText(text) {
            let html = escapeHtml(text || '');
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
            return html.replace(/\n/g, '<br>');
        }

        function escapeHtml(s) {
            return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function showTypingIndicator() {
            if (chatContainer.querySelector('.empty-state')) chatContainer.innerHTML = '';
            
            const div = document.createElement('div');
            div.className = 'chat-bubble flex gap-3 justify-start';
            div.id = 'typingIndicator';
            div.innerHTML = `
                <div class="max-w-xs lg:max-w-md xl:max-w-lg bg-gray-100 text-gray-900 p-3 rounded-lg">
                    <div class="typing-dots">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            `;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div;
        }

        function removeTypingIndicator() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = chatInput.value.trim();
            if (!message) return;
            if (!token) { notify('Please login first', 'error'); return; }

            addMessage(message, 'user');
            chatInput.value = '';
            chatInput.style.height = '';
            sendBtn.disabled = true;

            showTypingIndicator();
            try {
                const payload = {
                    messages: [{ role: 'user', content: message }],
                    channel: 'general',
                    materialIds: selectedMaterialIds.length > 0 ? selectedMaterialIds : undefined
                };
                const res = await fetch(API('/send'), {
                    method: 'POST',
                    headers: authHeaders(true),
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                removeTypingIndicator();

                if (!res.ok) {
                    addMessage('Server error: ' + (data.error || 'Unknown error'), 'bot');
                    return;
                }

                addMessage(data.reply || 'No response', 'bot');
            } catch (err) {
                removeTypingIndicator();
                console.error('Chat error:', err);
                addMessage('Connection error. Please try again.', 'bot');
            } finally {
                sendBtn.disabled = false;
            }
        });

        // Quiz Modal
        function showQuizModal(questions) {
            const content = document.getElementById('quizContent');
            content.innerHTML = questions.map((q, idx) => `
                <div class="quiz-question">
                    <div class="quiz-question-text">${idx + 1}. ${escapeHtml(q.text)}</div>
                    <div class="space-y-2">
                        ${q.options.map((opt, i) => `
                            <label class="quiz-option">
                                <input type="radio" name="q${idx}" value="${i}" />
                                <span class="text-sm text-gray-700">${escapeHtml(opt)}</span>
                            </label>
                        `).join('')}
                    </div>
                    <div class="quiz-answer">
                        <strong>Answer:</strong> ${q.answer} – ${escapeHtml(q.explanation || '')}
                    </div>
                </div>
            `).join('');
            document.getElementById('quizModal').classList.add('show');
        }

        function closeQuizModal() {
            document.getElementById('quizModal').classList.remove('show');
        }

        // Initialize
        updateCreditsDisplay();
        clearChatUI();
    </script>
</body>
</html>
