<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=0.80, maximum-scale=0.8, user-scalable=no" />
    <title>Chats - OAU Campus Hub</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        body { margin:0; padding:0; background:#FFFFFF; font-family:'Inter',sans-serif; overflow:hidden; }
        .mobile-container { width:100%; height:100vh; height:100dvh; background:#FFFFFF; display:flex; flex-direction:column; overflow:hidden; position:relative; }
        .no-scrollbar::-webkit-scrollbar { display:none; } .no-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }
        .skeleton { background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%); background-size:200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { 0% { background-position:200% 0 } 100% { background-position:-200% 0 } }
        .tab-content { display: none; }
        .tab-content.flex { display:flex; }
        .user-search-result { opacity:0; animation: slideIn 0.18s ease-out forwards; }
        @keyframes slideIn { from { opacity:0; transform:translateY(-8px) } to { opacity:1; transform:translateY(0) } }
    </style>
</head>
<body>
    <div class="mobile-container">

        <header class="bg-white px-4 py-2 flex items-center justify-between shrink-0 z-10 w-full border-b border-gray-100">
            <div class="flex items-center gap-3">
                <div class="relative">
                    <img id="headerUserAvatar" src="https://ui-avatars.com/api/?name=User&background=1664FF&color=fff" alt="Profile" class="w-10 h-10 rounded-full object-cover">
                    <div class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-[#34C759] border-[2.5px] border-white rounded-full"></div>
                </div>
                <h1 class="text-[28px] font-bold text-gray-900 tracking-tight leading-none truncate">Chats</h1>
            </div>
            <div class="flex items-center gap-3">
                <button id="openNewChat" class="w-10 h-10 rounded-full bg-[#F4F5F7] text-gray-700 flex items-center justify-center hover:bg-gray-200 transition-colors" title="New Chat">
                    <i class="fa-solid fa-plus text-[18px]"></i>
                </button>
            </div>
        </header>

        <div class="px-4 py-2 flex items-center gap-3 bg-white w-full border-b border-gray-100">
            <div class="flex-1 bg-[#F4F5F7] rounded-[14px] px-3.5 h-[42px] flex items-center gap-2.5 min-w-0">
                <i class="fa-solid fa-magnifying-glass text-gray-400 text-[15px] shrink-0"></i>
                <input id="searchInput" type="text" placeholder="Search chats" class="bg-transparent flex-1 w-full h-full outline-none text-[16px] placeholder-gray-500 text-gray-800 min-w-0" />
            </div>
        </div>

        <div class="flex px-4 border-b border-gray-100 gap-4 bg-white z-10 mt-1 w-full overflow-x-auto no-scrollbar">
            <button id="tabBtnDirect" data-tab="direct" class="py-3 border-b-[2.5px] border-brand-blue flex items-center gap-2 relative top-[1.5px] shrink-0"> 
                <span class="text-brand-blue font-semibold text-[14px] whitespace-nowrap">Chats</span>
                <span id="totalChatsCount" class="bg-brand-blue text-white text-[10px] font-bold min-w-[18px] h-[18px] px-1 rounded-full flex items-center justify-center ml-1">0</span>
            </button>
            <button id="tabBtnForums" data-tab="forums" class="py-3 flex items-center gap-2 text-gray-500 hover:text-gray-700 transition-colors relative top-[1.5px] shrink-0">
                <span class="font-medium text-[14px] whitespace-nowrap">Forums</span>
                <span id="totalForumsCount" class="bg-[#F2F2F2] text-gray-600 text-[10px] font-bold min-w-[18px] h-[18px] px-1 rounded-full flex items-center justify-center ml-1">0</span>
            </button>
            <button id="tabBtnDiscussions" data-tab="discussions" class="py-3 flex items-center gap-2 text-gray-500 hover:text-gray-700 transition-colors relative top-[1.5px] shrink-0">
                <span class="font-medium text-[14px] whitespace-nowrap">Discussions</span>
                <span id="totalDiscussionsCount" class="bg-[#F2F2F2] text-gray-600 text-[10px] font-bold min-w-[18px] h-[18px] px-1 rounded-full flex items-center justify-center ml-1">0</span>
            </button>
        </div>

        <main class="flex-1 overflow-y-auto no-scrollbar pb-6 w-full">
            <div id="tab-direct" class="tab-content flex flex-col w-full">
                <div id="chatsMain" class="w-full">
                    <div class="pt-4 px-4 space-y-3" id="chatsSkeleton">
                        <div class="flex gap-3">
                            <div class="w-14 h-14 rounded-full skeleton shrink-0"></div>
                            <div class="flex-1 space-y-2">
                                <div class="h-4 skeleton"></div>
                                <div class="h-3 w-3/4 skeleton"></div>
                            </div>
                        </div>
                        <div class="flex gap-3">
                            <div class="w-14 h-14 rounded-full skeleton shrink-0"></div>
                            <div class="flex-1 space-y-2">
                                <div class="h-4 skeleton"></div>
                                <div class="h-3 w-3/4 skeleton"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="emptyStateChats" class="hidden flex-1 flex items-center justify-center flex-col text-center px-4 py-12">
                    <i class="fa-solid fa-inbox text-gray-300 text-6xl mb-4"></i>
                    <p class="text-gray-500 text-lg font-medium mb-2">No chats yet</p>
                    <p class="text-gray-400 text-sm mb-6">Start a conversation to see it here</p>
                    <button id="newChatBtn" class="bg-[#1664FF] text-white px-6 py-2.5 rounded-full text-sm font-semibold hover:opacity-90 transition">
                        <i class="fa-solid fa-plus mr-2"></i> New Chat
                    </button>
                </div>
            </div>

            <div id="tab-forums" class="tab-content hidden flex-col w-full">
                <div id="forumsMain" class="w-full"></div>
                <div id="emptyStateForums" class="hidden flex-1 flex items-center justify-center flex-col text-center px-4 py-12">
                    <i class="fa-solid fa-users text-gray-300 text-6xl mb-4"></i>
                    <p class="text-gray-500 text-lg font-medium mb-2">No forums yet</p>
                    <p class="text-gray-400 text-sm mb-6">Join or create a forum to get started</p>
                    <button id="createForumBtn" class="bg-[#1664FF] text-white px-6 py-2.5 rounded-full text-sm font-semibold hover:opacity-90 transition">
                        <i class="fa-solid fa-plus mr-2"></i> Create Forum
                    </button>
                </div>
            </div>

            <div id="tab-discussions" class="tab-content hidden flex-col w-full">
                <div id="discussionsMain" class="w-full"></div>
                <div id="emptyStateDiscussions" class="hidden flex-1 flex items-center justify-center flex-col text-center px-4 py-12">
                    <i class="fa-solid fa-comments text-gray-300 text-6xl mb-4"></i>
                    <p class="text-gray-500 text-lg font-medium mb-2">No discussions yet</p>
                    <p class="text-gray-400 text-sm mb-6">Start a discussion to spark a conversation</p>
                    <button id="newDiscussionBtn" class="bg-[#1664FF] text-white px-6 py-2.5 rounded-full text-sm font-semibold hover:opacity-90 transition">
                        <i class="fa-solid fa-plus mr-2"></i> Start Discussion
                    </button>
                </div>
            </div>
        </main>

        <nav class="bg-white border-t border-gray-100 px-4 sm:px-8 pt-3 pb-8 flex justify-between items-center shrink-0 z-20 w-full">
            <a href="#" onclick="switchTab('direct'); return false;" data-nav="direct" class="flex flex-col items-center gap-1.5 text-[#1664FF] nav-item">
                <div class="relative">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4C2.9 2 2 2.9 2 4V22L6 18H20C21.1 18 22 17.1 22 16V4C22 2.9 21.1 2 20 2Z"/></svg>
                </div>
                <span class="text-[11px] font-semibold">Chats</span>
            </a>
            <a href="#" onclick="switchTab('forums'); return false;" data-nav="forums" class="flex flex-col items-center gap-1.5 text-[#536471] nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path></svg>
                <span class="text-[11px] font-medium">Forums</span>
            </a>
            <a href="#" onclick="switchTab('discussions'); return false;" data-nav="discussions" class="flex flex-col items-center gap-1.5 text-[#536471] nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                <span class="text-[11px] font-medium">Discussions</span>
            </a>
            <a href="#" class="flex flex-col items-center gap-1.5 text-[#536471]">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path></svg>
                <span class="text-[11px] font-medium">Profile</span>
            </a>
        </nav>

    </div>

<script>
(() => {
  const API_BASE = "https://examguide.onrender.com/api";
  const MESSAGES_API = API_BASE + "/messages";
  const DISCUSSIONS_API = API_BASE + "/discussions";
  const USER_API = API_BASE + "/users";
  const token = localStorage.getItem("token");

  let allChats = [];
  let allForums = [];
  let allDiscussions = [];
  let currentFilter = "direct";
  let currentUser = null;
  let currentUserId = null;
  const userCache = new Map();
  let autoRefreshHandle = null;
  let fetching = { chats: false, forums: false, discussions: false };

  function escapeHtml(s){ if(s===null||s===undefined) return ""; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
  function getQueryParam(n){ return new URLSearchParams(window.location.search).get(n); }
  function showSkeleton(show=true){ document.getElementById('chatsSkeleton').style.display = show ? '' : 'none'; }
  function formatTime(date){ if(!date) return 'Now'; const d = new Date(date); const now = new Date(); const diff = (now - d)/1000; if(diff<60) return 'Just now'; if(diff<3600) return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); if(diff<86400) return d.toLocaleDateString([], {weekday:'short'}); return d.toLocaleDateString(); }

  async function safeFetch(url, opts = {}, timeout = 10000){
    const controller = new AbortController(); opts.signal = controller.signal;
    const t = setTimeout(()=>controller.abort(), timeout);
    try {
      const res = await fetch(url, opts);
      clearTimeout(t);
      return res;
    } catch (err) {
      clearTimeout(t);
      throw err;
    }
  }

  async function loadCurrentUser(){
    if(!token) return;
    try {
      const res = await safeFetch(API_BASE + "/auth/me", { headers: { "Authorization": `Bearer ${token}` } }, 8000);
      if(!res.ok) return;
      const body = await res.json();
      currentUser = body.user;
      currentUserId = currentUser?._id || currentUser?.id || null;
      const initials = (currentUser?.fullname || currentUser?.username || "U").split(" ").map(p=>p[0]).join("").slice(0,2).toUpperCase();
      document.getElementById("headerUserAvatar").src = currentUser?.profilePicture || `https://ui-avatars.com/api/?name=${initials}&background=1664FF&color=fff`;
    } catch (e) {
      console.warn("loadCurrentUser", e);
    }
  }

  async function fetchUserById(id){
    if(!id) return null;
    if(userCache.has(id)) return userCache.get(id);
    try {
      const res = await safeFetch(`${USER_API}/${encodeURIComponent(id)}`, { headers: { "Authorization": `Bearer ${token}` } }, 8000);
      if(!res.ok) return null;
      const body = await res.json();
      userCache.set(id, body);
      return body;
    } catch (e) {
      return null;
    }
  }

  function normalizeChatItem(raw){
    const obj = Object.assign({}, raw);
    const otherId = obj.otherId || obj.otherUserId || obj.userId || obj.participantId || (obj.participants && Array.isArray(obj.participants) ? (() => {
      for(const p of obj.participants){
        if(String(p._id) !== String(currentUserId)) return p._id;
      }
      return null;
    })() : null) || null;
    const name = obj.fullname || obj.username || obj.name || (obj.participants && obj.participants.length === 2 ? (obj.participants.find(p => String(p._id) !== String(currentUserId))?.fullname || obj.participants.find(p => String(p._id) !== String(currentUserId))?.username) : null) || "Unknown";
    const avatar = obj.avatar || obj.profilePicture || obj.participants && obj.participants.length === 2 ? (obj.participants.find(p => String(p._id) !== String(currentUserId))?.profilePicture) : null;
    const lastText = obj.lastMessageText || obj.lastMessage?.text || obj.lastMessageText || obj.lastMessageText || "(No messages)";
    const lastTime = obj.lastMessageTime || obj.lastMessage?.createdAt || obj.lastMessageAt || obj.updatedAt || obj.lastMessageAt || null;
    const unread = obj.unreadCount || 0;
    return { ...obj, otherId, displayName: name, displayAvatar: avatar, lastMessageText: lastText, lastMessageTime: lastTime, unreadCount: unread };
  }

  async function loadChats(){
    if(fetching.chats) return;
    fetching.chats = true;
    try {
      const res = await safeFetch(MESSAGES_API + "/chats", { headers: { "Authorization": `Bearer ${token}` } }, 9000);
      if(!res.ok) throw new Error("Failed to load chats");
      const data = await res.json();
      const raw = data.chats || [];
      const mapped = raw.map(normalizeChatItem);
      for(const c of mapped){
        if((!c.displayName || c.displayName === "Unknown") && c.otherId){
          const u = await fetchUserById(c.otherId);
          if(u){
            c.displayName = u.fullname || u.username || c.displayName;
            c.displayAvatar = u.profilePicture || c.displayAvatar;
          }
        }
      }
      mapped.sort((a,b)=> {
        const ta = a.lastMessageTime ? new Date(a.lastMessageTime).getTime() : 0;
        const tb = b.lastMessageTime ? new Date(b.lastMessageTime).getTime() : 0;
        return tb - ta;
      });
      allChats = mapped;
      renderChats();
      updateChatCounts();
    } catch (err) {
      console.error("Error loadChats:", err);
    } finally {
      fetching.chats = false;
      showSkeleton(false);
    }
  }

  async function loadForums(){
    if(fetching.forums) return;
    fetching.forums = true;
    try {
      const res = await safeFetch(MESSAGES_API + "/chats", { headers: { "Authorization": `Bearer ${token}` } }, 9000);
      if(!res.ok) throw new Error("Failed to load forums");
      const data = await res.json();
      const raw = data.groups || [];
      const mapped = raw.map(g => {
        const lastText = g.lastMessageText || g.lastMessage?.text || "(No messages)";
        const lastTime = g.lastMessageTime || g.lastMessage?.createdAt || g.lastMessageAt || g.updatedAt || null;
        return { ...g, displayName: g.name || "Forum", displayAvatar: g.avatar, lastMessageText: lastText, lastMessageTime: lastTime, unreadCount: g.unreadCount || 0 };
      });
      mapped.sort((a,b)=> (new Date(b.lastMessageTime || 0)) - (new Date(a.lastMessageTime || 0)));
      allForums = mapped;
      renderForums();
      updateForumCounts();
    } catch (err) {
      console.error("loadForums error", err);
    } finally {
      fetching.forums = false;
    }
  }

  async function loadDiscussions(){
    if(fetching.discussions) return;
    fetching.discussions = true;
    try {
      const res = await safeFetch(DISCUSSIONS_API + "?limit=50", { headers: { "Authorization": `Bearer ${token}` } }, 9000);
      if(!res.ok){
        allDiscussions = [];
        renderDiscussions();
        updateDiscussionCounts();
        return;
      }
      const data = await res.json();
      allDiscussions = (data.discussions || []).map(d => ({
        _id: d._id,
        title: d.title,
        description: d.description,
        createdAt: d.createdAt,
        replies: d.replyCount ?? (d.replies ? d.replies.length : 0),
        author: d.author || null,
        category: d.category || 'general'
      }));
      allDiscussions.sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
      renderDiscussions();
      updateDiscussionCounts();
    } catch (err){
      console.error("loadDiscussions error", err);
      allDiscussions = [];
      renderDiscussions();
      updateDiscussionCounts();
    } finally {
      fetching.discussions = false;
    }
  }

  function renderChats(){
    const chatsMain = document.getElementById("chatsMain");
    const empty = document.getElementById("emptyStateChats");
    if(!chatsMain) return;
    if(allChats.length === 0){
      chatsMain.innerHTML = "";
      empty.classList.remove("hidden");
      return;
    }
    empty.classList.add("hidden");
    chatsMain.innerHTML = allChats.map(chat => {
      const timeStr = formatTime(chat.lastMessageTime);
      const lastMsg = chat.lastMessageText || "(No messages)";
      const unreadBadge = (chat.unreadCount || 0) > 0 ? `<span class="bg-[#1664FF] text-white text-[12px] font-bold min-w-[22px] h-[22px] px-1.5 rounded-full flex items-center justify-center">${chat.unreadCount}</span>` : "";
      const name = chat.displayName || "Unknown";
      const avatar = chat.displayAvatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=F59E0B&color=fff`;
      const targetId = chat.otherId || chat.otherUserId || chat.userId || chat._id;
      const chatUrl = `/tutor/chat.html?userId=${encodeURIComponent(targetId)}`;
      return `
        <a href="${chatUrl}" class="flex items-center gap-3.5 px-4 py-2.5 hover:bg-gray-50 cursor-pointer transition-colors w-full border-b border-gray-50 last:border-b-0">
          <img src="${avatar}" alt="${escapeHtml(name)}" class="w-[56px] h-[56px] rounded-full object-cover border border-gray-100">
          <div class="flex-1 min-w-0 pr-1 overflow-hidden">
            <div class="flex items-center justify-between mb-1">
              <h3 class="font-semibold text-gray-900 text-[15px] truncate">${escapeHtml(name)}</h3>
              <span class="text-gray-500 text-[12px] shrink-0 ml-2">${escapeHtml(timeStr)}</span>
            </div>
            <div class="flex justify-between items-center">
              <p class="text-gray-500 text-[13px] truncate mr-2">${escapeHtml(lastMsg)}</p>
              ${unreadBadge}
            </div>
          </div>
        </a>
      `;
    }).join("");
  }

  function renderForums(){
    const forumsMain = document.getElementById("forumsMain");
    const empty = document.getElementById("emptyStateForums");
    if(!forumsMain) return;
    if(allForums.length === 0){
      forumsMain.innerHTML = "";
      empty.classList.remove("hidden");
      return;
    }
    empty.classList.add("hidden");
    forumsMain.innerHTML = allForums.map(forum => {
      const timeStr = formatTime(forum.lastMessageTime);
      const lastMsg = forum.lastMessageText || "(No messages)";
      const unreadBadge = (forum.unreadCount || 0) > 0 ? `<span class="bg-[#1664FF] text-white text-[12px] font-bold min-w-[22px] h-[22px] px-1.5 rounded-full flex items-center justify-center">${forum.unreadCount}</span>` : "";
      const avatar = forum.displayAvatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(forum.displayName || forum.name)}&background=F59E0B&color=fff`;
      const forumUrl = `/tutor/groupchat.html?groupId=${forum._id}`;
      return `
        <a href="${forumUrl}" class="flex items-center gap-3.5 px-4 py-2.5 hover:bg-gray-50 cursor-pointer transition-colors w-full border-b border-gray-50 last:border-b-0">
          <img src="${avatar}" alt="${escapeHtml(forum.displayName)}" class="w-[56px] h-[56px] rounded-full object-cover border border-gray-100">
          <div class="flex-1 min-w-0 pr-1 overflow-hidden">
            <div class="flex items-center justify-between mb-1">
              <h3 class="font-semibold text-gray-900 text-[15px] truncate">${escapeHtml(forum.displayName || forum.name)}</h3>
              <span class="text-gray-500 text-[12px] shrink-0 ml-2">${escapeHtml(timeStr)}</span>
            </div>
            <div class="flex justify-between items-center">
              <p class="text-gray-500 text-[13px] truncate mr-2">${escapeHtml(lastMsg)}</p>
              ${unreadBadge}
            </div>
          </div>
        </a>
      `;
    }).join("");
  }

  function renderDiscussions(){
    const discussionsMain = document.getElementById("discussionsMain");
    const empty = document.getElementById("emptyStateDiscussions");
    if(!discussionsMain) return;
    if(allDiscussions.length === 0){
      discussionsMain.innerHTML = "";
      empty.classList.remove("hidden");
      return;
    }
    empty.classList.add("hidden");
    discussionsMain.innerHTML = allDiscussions.map(d => {
      const timeStr = formatTime(d.createdAt);
      const replies = d.replies || 0;
      const avatar = d.author?.profilePicture || `https://ui-avatars.com/api/?name=${encodeURIComponent(d.author?.fullname || 'A')}&background=F59E0B&color=fff`;
      const authorName = d.author?.fullname || d.author?.username || 'Anonymous';
      return `
        <a href="/tutor/discussion.html?id=${d._id}" class="flex items-center gap-3.5 px-4 py-3 hover:bg-gray-50 cursor-pointer transition-colors w-full border-b border-gray-50 last:border-b-0">
          <img src="${avatar}" alt="${escapeHtml(authorName)}" class="w-12 h-12 rounded-full object-cover border border-gray-100">
          <div class="flex-1 min-w-0 pr-1 overflow-hidden">
            <div class="flex items-center justify-between mb-1">
              <h3 class="font-semibold text-gray-900 text-[14px] truncate">${escapeHtml(d.title)}</h3>
              <span class="text-gray-500 text-[11px] shrink-0 ml-2">${escapeHtml(timeStr)}</span>
            </div>
            <p class="text-gray-600 text-[12px] truncate mb-1">${escapeHtml(authorName)}</p>
            <div class="flex items-center gap-3 text-gray-500 text-[11px]">
              <span><i class="fa-solid fa-comment text-[#1664FF]"></i> ${replies} replies</span>
            </div>
          </div>
        </a>
      `;
    }).join("");
  }

  function updateChatCounts(){
    document.getElementById("totalChatsCount").textContent = allChats.length || 0;
  }
  function updateForumCounts(){ document.getElementById("totalForumsCount").textContent = allForums.length || 0; }
  function updateDiscussionCounts(){ document.getElementById("totalDiscussionsCount").textContent = allDiscussions.length || 0; }

  function switchTab(tab){
    currentFilter = tab;
    document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
    const el = document.getElementById(`tab-${tab}`);
    if(el) el.classList.remove('hidden');
    document.querySelectorAll('[data-tab]').forEach(btn => btn.classList.remove('border-brand-blue'));
    const topBtn = document.querySelector(`[data-tab="${tab}"]`);
    if(topBtn) topBtn.classList.add('border-brand-blue');
  }

  document.getElementById('tabBtnDirect').addEventListener('click', ()=>switchTab('direct'));
  document.getElementById('tabBtnForums').addEventListener('click', ()=>switchTab('forums'));
  document.getElementById('tabBtnDiscussions').addEventListener('click', ()=>switchTab('discussions'));

  document.getElementById('openNewChat').addEventListener('click', ()=>document.getElementById('newChatModal')?.classList.remove('hidden'));
  document.getElementById('newChatBtn')?.addEventListener('click', ()=>document.getElementById('newChatModal')?.classList.remove('hidden'));
  document.getElementById('createForumBtn')?.addEventListener('click', ()=>document.getElementById('newForumModal')?.classList.remove('hidden'));
  document.getElementById('newDiscussionBtn')?.addEventListener('click', ()=>document.getElementById('newDiscussionModal')?.classList.remove('hidden'));

  document.getElementById('searchInput').addEventListener('input', (e)=> {
    const q = e.target.value.trim().toLowerCase();
    if(currentFilter === 'direct'){
      const filtered = allChats.filter(c => (c.displayName||'').toLowerCase().includes(q) || (c.lastMessageText||'').toLowerCase().includes(q));
      const container = document.getElementById('chatsMain');
      if(!container) return;
      if(filtered.length === 0) container.innerHTML = '<p class="text-center text-gray-400 py-8">No chats found</p>';
      else {
        const html = filtered.map(c => {
          const name = c.displayName; const avatar = c.displayAvatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=F59E0B&color=fff`;
          const timeStr = formatTime(c.lastMessageTime);
          const lastMsg = c.lastMessageText || "(No messages)";
          const unreadBadge = (c.unreadCount||0)>0 ? `<span class="bg-[#1664FF] text-white px-2 py-0.5 rounded-full text-xs">${c.unreadCount}</span>` : "";
          const targetId = c.otherId || c._id;
          return `<a href="/tutor/chat.html?userId=${encodeURIComponent(targetId)}" class="flex items-center gap-3.5 px-4 py-2.5 hover:bg-gray-50 w-full border-b border-gray-50">
                    <img src="${avatar}" class="w-[56px] h-[56px] rounded-full object-cover">
                    <div class="flex-1 min-w-0 pr-1 overflow-hidden">
                      <div class="flex items-center justify-between mb-1"><h3 class="font-semibold text-gray-900 truncate">${escapeHtml(name)}</h3><span class="text-gray-500 text-xs">${escapeHtml(timeStr)}</span></div>
                      <div class="flex justify-between items-center"><p class="text-gray-500 text-sm truncate mr-2">${escapeHtml(lastMsg)}</p>${unreadBadge}</div>
                    </div></a>`;
        }).join("");
        container.innerHTML = html;
      }
    } else if(currentFilter === 'forums') {
      const filtered = allForums.filter(f => (f.displayName||'').toLowerCase().includes(q) || (f.lastMessageText||'').toLowerCase().includes(q));
      const container = document.getElementById('forumsMain');
      if(!container) return;
      if(filtered.length === 0) container.innerHTML = '<p class="text-center text-gray-400 py-8">No forums found</p>';
      else {
        container.innerHTML = filtered.map(f => {
          const name = f.displayName || f.name; const avatar = f.displayAvatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=F59E0B&color=fff`;
          const timeStr = formatTime(f.lastMessageTime); const lastMsg = f.lastMessageText || "(No messages)";
          const forumUrl = `/tutor/groupchat.html?groupId=${f._id}`;
          return `<a href="${forumUrl}" class="flex items-center gap-3.5 px-4 py-2.5 hover:bg-gray-50 w-full border-b border-gray-50"><img src="${avatar}" class="w-[56px] h-[56px] rounded-full object-cover"><div class="flex-1 min-w-0 pr-1 overflow-hidden"><div class="flex items-center justify-between mb-1"><h3 class="font-semibold text-gray-900 truncate">${escapeHtml(name)}</h3><span class="text-gray-500 text-xs">${escapeHtml(timeStr)}</span></div><div class="flex justify-between items-center"><p class="text-gray-500 text-sm truncate mr-2">${escapeHtml(lastMsg)}</p></div></div></a>`;
        }).join("");
      }
    } else {
      const filtered = allDiscussions.filter(d => (d.title||'').toLowerCase().includes(q) || (d.description||'').toLowerCase().includes(q) || (d.author?.fullname||'').toLowerCase().includes(q));
      const container = document.getElementById('discussionsMain');
      if(!container) return;
      if(filtered.length === 0) container.innerHTML = '<p class="text-center text-gray-400 py-8">No discussions found</p>';
      else {
        container.innerHTML = filtered.map(d => {
          const avatar = d.author?.profilePicture || `https://ui-avatars.com/api/?name=${encodeURIComponent(d.author?.fullname||'A')}&background=F59E0B&color=fff`;
          return `<a href="/tutor/discussion.html?id=${d._id}" class="flex items-center gap-3.5 px-4 py-3 hover:bg-gray-50 w-full border-b border-gray-50"><img src="${avatar}" class="w-12 h-12 rounded-full object-cover"><div class="flex-1 min-w-0 pr-1 overflow-hidden"><div class="flex items-center justify-between mb-1"><h3 class="font-semibold text-gray-900 truncate">${escapeHtml(d.title)}</h3><span class="text-gray-500 text-xs">${escapeHtml(formatTime(d.createdAt))}</span></div><p class="text-gray-600 text-xs truncate mb-1">${escapeHtml(d.author?.fullname||d.author?.username||'Anonymous')}</p></div></a>`;
        }).join("");
      }
    }
  });

  function startAutoRefresh(intervalMs = 1000){
    if(autoRefreshHandle) clearInterval(autoRefreshHandle);
    autoRefreshHandle = setInterval(async () => {
      if(document.hidden) return;
      await Promise.allSettled([loadChats(), loadForums(), loadDiscussions()]);
    }, intervalMs);
  }

  document.addEventListener("visibilitychange", () => {
    if(!document.hidden) { loadCurrentUser().then(()=>loadChats()); }
  });

  async function init(){
    showSkeleton(true);
    await loadCurrentUser();
    await Promise.all([loadChats(), loadForums(), loadDiscussions()]);
    startAutoRefresh(1000);
    showSkeleton(false);
  }

  init();

})();
</script>
</body>
</html>
