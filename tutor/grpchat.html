<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.80, maximum-scale=0.8, user-scalable=no">
    <title>Chats - OAU Campus Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            blue: '#1664FF',
                            light: '#F4F5F7',
                            red: '#FF3B30',
                            green: '#34C759',
                            gray: '#8E8E93',
                            dark: '#000000'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #FFFFFF; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden;
        }
        .mobile-container { 
            width: 100%; 
            height: 100vh; 
            height: 100dvh; 
            background-color: #FFFFFF; 
            position: relative; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body>

    <div class="mobile-container">

        <!-- Header -->
        <header class="bg-white px-4 py-2 flex items-center justify-between shrink-0 z-10 relative w-full border-b border-gray-100">
            <div class="flex items-center gap-3">
                <div class="relative cursor-pointer shrink-0">
                    <img id="headerUserAvatar" src="https://ui-avatars.com/api/?name=User&background=1664FF&color=fff" alt="Profile" class="w-10 h-10 rounded-full object-cover">
                    <div class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-brand-green border-[2.5px] border-white rounded-full"></div>
                </div>
                <h1 class="text-[28px] font-bold text-gray-900 tracking-tight leading-none truncate">Chats</h1>
            </div>
            
            <div class="flex items-center gap-3 shrink-0">
                <button onclick="openNewChatModal()" class="w-10 h-10 rounded-full bg-brand-light text-gray-700 flex items-center justify-center hover:bg-gray-200 transition-colors" title="New Chat">
                    <i class="fa-solid fa-plus text-[18px]"></i>
                </button>
            </div>
        </header>

        <!-- Search Bar -->
        <div class="px-4 py-2 flex items-center gap-3 shrink-0 z-10 bg-white w-full border-b border-gray-100">
            <div class="flex-1 bg-brand-light rounded-[14px] px-3.5 h-[42px] flex items-center gap-2.5 min-w-0">
                <i class="fa-solid fa-magnifying-glass text-gray-400 text-[15px] shrink-0"></i>
                <input type="text" id="searchInput" placeholder="Search chats" class="bg-transparent flex-1 w-full h-full outline-none text-[16px] placeholder-gray-500 text-gray-800 min-w-0">
            </div>
        </div>

        <!-- Tabs -->
        <div class="flex px-4 border-b border-gray-100 gap-6 shrink-0 bg-white z-10 mt-1 w-full">
            <button onclick="filterChats('all')" class="py-3 border-b-[2.5px] border-brand-blue flex items-center gap-2 relative top-[1.5px] shrink-0 tab-btn active" data-filter="all">
                <span class="text-brand-blue font-semibold text-[15px]">All Chats</span>
                <span id="totalChatsCount" class="bg-brand-blue text-white text-[11px] font-bold min-w-[20px] h-[20px] px-1.5 rounded-full flex items-center justify-center">0</span>
            </button>
            <button onclick="filterChats('unread')" class="py-3 flex items-center gap-2 text-gray-500 hover:text-gray-700 transition-colors relative top-[1.5px] shrink-0 tab-btn" data-filter="unread">
                <span class="font-medium text-[15px]">Unread</span>
                <span id="unreadChatsCount" class="bg-[#F2F2F2] text-gray-600 text-[11px] font-bold min-w-[20px] h-[20px] px-1.5 rounded-full flex items-center justify-center">0</span>
            </button>
        </div>

        <!-- Scrollable Content -->
        <main id="chatsMain" class="flex-1 overflow-y-auto no-scrollbar pb-6 w-full">
            <!-- Loading skeleton -->
            <div class="pt-4 px-4 space-y-3">
                <div class="flex gap-3">
                    <div class="w-14 h-14 rounded-full skeleton shrink-0"></div>
                    <div class="flex-1 space-y-2">
                        <div class="h-4 skeleton"></div>
                        <div class="h-3 w-3/4 skeleton"></div>
                    </div>
                </div>
                <div class="flex gap-3">
                    <div class="w-14 h-14 rounded-full skeleton shrink-0"></div>
                    <div class="flex-1 space-y-2">
                        <div class="h-4 skeleton"></div>
                        <div class="h-3 w-3/4 skeleton"></div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Empty State -->
        <div id="emptyState" class="hidden flex-1 flex items-center justify-center flex-col text-center px-4 py-12">
            <i class="fa-solid fa-inbox text-gray-300 text-6xl mb-4"></i>
            <p class="text-gray-500 text-lg font-medium mb-2">No chats yet</p>
            <p class="text-gray-400 text-sm mb-6">Start a conversation to see it here</p>
            <button onclick="openNewChatModal()" class="bg-brand-blue text-white px-6 py-2.5 rounded-full text-sm font-semibold hover:opacity-90 transition">
                <i class="fa-solid fa-plus mr-2"></i> New Chat
            </button>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bg-white border-t border-gray-100 px-4 sm:px-8 pt-3 pb-8 flex justify-between items-center shrink-0 z-20 shadow-[0_-4px_15px_-5px_rgba(0,0,0,0.02)] w-full">
            
            <a href="#" class="flex flex-col items-center gap-1.5 text-brand-blue relative min-w-[50px]">
                <div class="relative">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20 2H4C2.9 2 2 2.9 2 4V22L6 18H20C21.1 18 22 17.1 22 16V4C22 2.9 21.1 2 20 2Z"/>
                        <circle cx="7" cy="10" r="1.5" fill="white"/>
                        <circle cx="12" cy="10" r="1.5" fill="white"/>
                        <circle cx="17" cy="10" r="1.5" fill="white"/>
                    </svg>
                    <span id="navChatsCount" class="absolute -top-2 -right-2 bg-brand-red text-white text-[10px] font-bold w-4 h-4 flex items-center justify-center rounded-full ring-2 ring-white border border-white hidden">0</span>
                </div>
                <span class="text-[11px] font-semibold">Chats</span>
            </a>
            
            <a href="#" class="flex flex-col items-center gap-1.5 text-[#536471] hover:text-gray-900 transition-colors min-w-[50px]">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <span class="text-[11px] font-medium">Groups</span>
            </a>
            
            <a href="#" class="flex flex-col items-center gap-1.5 text-[#536471] hover:text-gray-900 transition-colors min-w-[50px]">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span class="text-[11px] font-medium">Profile</span>
            </a>
        </nav>

    </div>

    <!-- New Chat Modal -->
    <div id="newChatModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center">
        <div class="bg-white w-full sm:w-96 rounded-t-3xl sm:rounded-2xl p-6 max-h-[80vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold text-gray-900">Start a Chat</h2>
                <button onclick="closeNewChatModal()" class="text-gray-500 hover:text-gray-700 text-2xl">
                    <i class="fa-solid fa-times"></i>
                </button>
            </div>
            
            <input type="text" id="userSearchInput" placeholder="Search users..." class="w-full px-4 py-2.5 border border-gray-200 rounded-lg mb-4 outline-none focus:border-brand-blue">
            
            <div id="usersList" class="space-y-2">
                <!-- Users will load here -->
            </div>
        </div>
    </div>

    <script>
        // API Configuration
        const API_BASE = "https://examguide.onrender.com/api";
        const MESSAGES_API = API_BASE + "/messages";
        const USER_API = API_BASE + "/users";
        const token = localStorage.getItem('token');

        let allChats = [];
        let filteredChats = [];
        let currentFilter = 'all';
        let currentUser = null;

        // --- Initialize on page load ---
        document.addEventListener('DOMContentLoaded', async () => {
            await loadCurrentUser();
            await loadChats();
            setupSearch();
        });

        // --- Load current user info ---
        async function loadCurrentUser() {
            try {
                const res = await fetch(`${API_BASE}/auth/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) throw new Error('Failed to fetch user');
                const data = await res.json();
                currentUser = data.user;
                
                const initials = (currentUser.fullname || currentUser.username)
                    .split(' ')
                    .map(n => n.charAt(0).toUpperCase())
                    .join('')
                    .slice(0, 2);
                
                const avatar = currentUser.profilePicture || 
                    `https://ui-avatars.com/api/?name=${initials}&background=1664FF&color=fff`;
                document.getElementById('headerUserAvatar').src = avatar;
            } catch (error) {
                console.error("Error loading user:", error);
            }
        }

        // --- Load all chats from backend ---
        async function loadChats() {
            try {
                const res = await fetch(`${MESSAGES_API}/chats`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) throw new Error('Failed to load chats');
                const data = await res.json();
                
                // Combine direct chats and group chats
                allChats = [
                    ...(data.chats || []).map(chat => ({ ...chat, type: 'direct' })),
                    ...(data.groups || []).map(group => ({ ...group, type: 'group' }))
                ];
                
                // Sort by latest activity
                allChats.sort((a, b) => new Date(b.lastMessageTime) - new Date(a.lastMessageTime));
                
                filterChats('all');
                updateChatCounts();
                renderChats();
            } catch (error) {
                console.error("Error loading chats:", error);
            }
        }

        // --- Filter chats ---
        function filterChats(filter) {
            currentFilter = filter;
            
            if (filter === 'all') {
                filteredChats = allChats;
            } else if (filter === 'unread') {
                filteredChats = allChats.filter(chat => chat.unreadCount > 0);
            }
            
            // Update active tab
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('border-brand-blue', 'text-brand-blue');
                btn.classList.add('text-gray-500');
            });
            document.querySelector(`[data-filter="${filter}"]`).classList.add('border-brand-blue', 'text-brand-blue');
            
            renderChats();
        }

        // --- Render chat list ---
        function renderChats() {
            const chatsMain = document.getElementById('chatsMain');
            const emptyState = document.getElementById('emptyState');
            
            if (filteredChats.length === 0) {
                chatsMain.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');
            
            chatsMain.innerHTML = filteredChats.map(chat => {
                const timeStr = formatTime(chat.lastMessageTime);
                const lastMsg = chat.lastMessageText || '(No messages)';
                const unreadBadge = chat.unreadCount > 0 ? `<span class="bg-brand-blue text-white text-[12px] font-bold min-w-[22px] h-[22px] px-1.5 rounded-full flex items-center justify-center shrink-0">${chat.unreadCount}</span>` : '';
                
                let avatar = '';
                let name = '';
                
                if (chat.type === 'direct') {
                    name = chat.fullname || chat.username;
                    avatar = chat.avatar || `https://ui-avatars.com/api/?name=${name}&background=random`;
                } else {
                    name = chat.name;
                    avatar = chat.avatar || `https://ui-avatars.com/api/?name=${name}&background=random`;
                }
                
                const chatUrl = chat.type === 'direct' 
                    ? `/tutor/chat.html?userId=${chat._id}` 
                    : `/tutor/groupchat.html?groupId=${chat._id}`;
                
                return `
                    <a href="${chatUrl}" class="flex items-center gap-3.5 px-4 py-2.5 hover:bg-gray-50 cursor-pointer transition-colors w-full border-b border-gray-50 last:border-b-0">
                        <img src="${avatar}" alt="${name}" class="w-[56px] h-[56px] rounded-full object-cover border border-gray-100">
                        
                        <div class="flex-1 min-w-0 pr-1 overflow-hidden">
                            <div class="flex items-center justify-between mb-1">
                                <h3 class="font-semibold text-gray-900 text-[15px] truncate">${name}</h3>
                                <span class="text-gray-500 text-[12px] shrink-0 ml-2">${timeStr}</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <p class="text-gray-500 text-[13px] truncate mr-2">${lastMsg}</p>
                                ${unreadBadge}
                            </div>
                        </div>
                    </a>
                `;
            }).join('');
        }

        // --- Update chat counts ---
        function updateChatCounts() {
            const totalCount = allChats.length;
            const unreadCount = allChats.reduce((sum, chat) => sum + (chat.unreadCount || 0), 0);
            
            document.getElementById('totalChatsCount').textContent = totalCount;
            document.getElementById('unreadChatsCount').textContent = unreadCount;
            
            if (unreadCount > 0) {
                document.getElementById('navChatsCount').classList.remove('hidden');
                document.getElementById('navChatsCount').textContent = unreadCount;
            } else {
                document.getElementById('navChatsCount').classList.add('hidden');
            }
        }

        // --- Format time display ---
        function formatTime(date) {
            if (!date) return 'Now';
            const d = new Date(date);
            const now = new Date();
            const diff = now - d;
            const hours = diff / (1000 * 60 * 60);
            const days = diff / (1000 * 60 * 60 * 24);
            
            if (hours < 1) return 'Just now';
            if (hours < 24) return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            if (days < 7) return d.toLocaleDateString('en-US', { weekday: 'short' });
            return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        // --- Setup search functionality ---
        function setupSearch() {
            document.getElementById('searchInput').addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                filteredChats = allChats.filter(chat => {
                    const name = (chat.fullname || chat.username || chat.name).toLowerCase();
                    const lastMsg = (chat.lastMessageText || '').toLowerCase();
                    return name.includes(query) || lastMsg.includes(query);
                });
                renderChats();
            });
        }

        // --- Modal functions ---
        function openNewChatModal() {
            document.getElementById('newChatModal').classList.remove('hidden');
            loadUsersList();
        }

        function closeNewChatModal() {
            document.getElementById('newChatModal').classList.add('hidden');
        }

        async function loadUsersList() {
            try {
                const res = await fetch(`${MESSAGES_API}/similar-users`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) throw new Error('Failed to load users');
                const users = await res.json();
                
                const usersList = document.getElementById('usersList');
                usersList.innerHTML = users.map(user => `
                    <a href="/tutor/chat.html?userId=${user._id}" 
                       onclick="closeNewChatModal()" 
                       class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-50 transition-colors cursor-pointer">
                        <img src="${user.avatar || `https://ui-avatars.com/api/?name=${user.fullname}&background=random`}" 
                             alt="${user.fullname}" class="w-10 h-10 rounded-full object-cover">
                        <div class="flex-1 min-w-0">
                            <p class="font-semibold text-gray-900 text-sm truncate">${user.fullname || user.username}</p>
                            <p class="text-gray-500 text-xs truncate">${user.department || 'Student'}</p>
                        </div>
                    </a>
                `).join('');
            } catch (error) {
                console.error("Error loading users:", error);
            }
        }

        // Search users in modal
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('userSearchInput');
            if (searchInput) {
                searchInput.addEventListener('input', async (e) => {
                    // Implement user search if needed
                });
            }
        });

        // Close modal on outside click
        document.getElementById('newChatModal')?.addEventListener('click', (e) => {
            if (e.target.id === 'newChatModal') closeNewChatModal();
        });
    </script>

</body>
</html>
