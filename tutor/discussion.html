<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.80, maximum-scale=0.8, user-scalable=no">
    <title>Discussion Thread</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Times New Roman', 'serif'] },
                    colors: {
                        brand: { blue: '#1664FF', light: '#F4F5F7', tag: '#2B57E4', badgebg: '#EBF2FF', modbg: '#F2EBFF', modtext: '#7033FF' }
                    }
                }
            }
        }
    </script>
    <style>
        body { margin: 0; padding: 0; background-color: #000000; font-family: 'Inter', sans-serif; overflow: hidden; }
        .mobile-container { width: 100%; height: 100vh; height: 100dvh; background-color: #F6F7FA; position: relative; display: flex; flex-direction: column; overflow: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .header-bg { background: linear-gradient(to right, rgba(16, 17, 36, 0.95), rgba(28, 23, 61, 0.85)), url('https://images.unsplash.com/photo-1635070041078-e363dbe005cb?auto=format&fit=crop&w=800&q=80'); background-size: cover; background-position: center; }
        .curved-top { border-top-left-radius: 20px; border-top-right-radius: 20px; }
        .reply-attachment { max-width: 280px; border-radius: 8px; }
        .reply-area img { max-width: 100%; height: auto; display: block; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- Header Section -->
        <div id="discussionHeader" class="shrink-0 relative header-bg pt-3 pb-8 px-4 w-full">
            <!-- Navigation -->
            <div class="flex justify-between items-center mb-6 text-white">
                <button id="backBtn" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 transition backdrop-blur-sm">
                    <i class="fa-solid fa-chevron-left text-[16px]"></i>
                </button>
                <div class="flex gap-3">
                    <button id="bookmarkBtn" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 transition backdrop-blur-sm">
                        <i class="fa-regular fa-bookmark text-[16px]"></i>
                    </button>
                    <button id="moreBtn" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 transition backdrop-blur-sm">
                        <i class="fa-solid fa-ellipsis text-[16px]"></i>
                    </button>
                </div>
            </div>

            <!-- Topic Info -->
            <div>
                <span id="groupBadge" class="bg-brand-tag text-white text-[11px] font-semibold px-2.5 py-1 rounded mb-3 inline-block">Group</span>
                <h1 id="discussionTitleEl" class="text-[26px] text-white font-bold leading-tight mb-3">Loading...</h1>
                <p id="discussionDescEl" class="text-gray-300 text-[14px] leading-relaxed mb-4 max-w-[90%]">...</p>
                <div class="flex items-center gap-5 text-gray-300 text-[12px]">
                    <span class="flex items-center gap-1.5"><i class="fa-solid fa-user-group text-[10px]"></i> <span id="membersCount">0</span> members</span>
                    <span class="flex items-center gap-1.5"><i class="fa-regular fa-comment text-[12px]"></i> <span id="repliesCount">0</span> replies</span>
                    <span class="flex items-center gap-1.5"><i class="fa-regular fa-eye text-[12px]"></i> <span id="viewsCount">0</span> views</span>
                </div>
            </div>
        </div>

        <!-- Scrollable Content Area -->
        <main class="flex-1 overflow-y-auto no-scrollbar bg-[#F6F7FA] curved-top -mt-5 relative z-10 w-full flex flex-col" id="mainContent">
            <!-- OP Post (rendered dynamically) -->
            <div id="opPostContainer" class="bg-white p-4 pt-5 shrink-0 curved-top mb-1.5 shadow-sm hidden">
               <div class="flex justify-between items-start mb-3">
                   <div class="flex gap-3 items-center">
                       <img id="opAvatar" src="https://i.pravatar.cc/150?u=12" alt="OP" class="w-10 h-10 rounded-full object-cover">
                       <div class="flex items-center gap-2">
                           <span id="opName" class="font-semibold text-gray-900 text-[15px]">Author</span>
                           <span id="opTime" class="text-gray-400 text-[12px] font-medium">• 2h ago</span>
                       </div>
                   </div>
                   <div class="flex items-center gap-3 mt-1">
                       <span id="opTag" class="text-brand-blue bg-brand-badgebg text-[11px] font-bold px-1.5 py-0.5 rounded hidden">OP</span>
                       <button id="opMenuBtn" class="text-gray-400"><i class="fa-solid fa-ellipsis"></i></button>
                   </div>
               </div>

               <p id="opContent" class="text-[15.5px] text-gray-900 leading-[1.4] mb-4 pr-2"></p>

               <div class="flex justify-between items-center text-gray-500 text-[13px] font-medium pt-1">
                   <div class="flex gap-6 items-center">
                       <button id="discussionLikeBtn" class="flex items-center gap-1.5 hover:text-gray-700"><i id="discussionLikeIcon" class="fa-regular fa-thumbs-up text-[15px]"></i> <span id="discussionLikeCount">0</span></button>
                       <button id="discussionReplyCountBtn" class="flex items-center gap-1.5 hover:text-gray-700"><i class="fa-regular fa-comment text-[15px]"></i> <span id="discussionReplyCount">0</span></button>
                   </div>
                   <button id="shareBtn" class="flex items-center gap-1.5 hover:text-gray-700"><i class="fa-solid fa-share text-[14px]"></i> Share</button>
               </div>
            </div>

            <!-- Replies Header -->
            <div id="repliesHeader" class="px-4 py-3 flex justify-between items-center shrink-0 w-full hidden">
                <span id="allRepliesLabel" class="font-semibold text-gray-900 text-[14px]">All replies (0)</span>
                <div class="flex items-center gap-2">
                    <select id="replySortSelect" class="text-[13px] text-gray-500 font-medium border border-gray-100 rounded px-2 py-1">
                        <option value="newest">Newest</option>
                        <option value="mostLiked">Most liked</option>
                    </select>
                    <button id="loadMoreRepliesBtn" class="text-[13px] text-gray-500 font-medium hidden">Load more</button>
                </div>
            </div>

            <!-- Replies Container -->
            <div id="repliesContainer" class="flex flex-col gap-1.5 shrink-0 w-full pb-4 px-4"></div>
        </main>

        <!-- Input Bar -->
        <div class="bg-white px-4 pt-3 pb-8 border-t border-gray-100 flex items-center gap-3 shrink-0 w-full z-20 shadow-[0_-5px_15px_rgba(0,0,0,0.02)]">
            <img id="meAvatar" src="https://i.pravatar.cc/150?u=15" alt="User" class="w-9 h-9 rounded-full object-cover shrink-0">
            
            <div class="flex-1 bg-brand-light rounded-full border border-gray-200 px-4 py-2 flex items-center min-w-0 h-10">
                <input id="replyInput" type="text" placeholder="Write a reply..." class="bg-transparent flex-1 outline-none text-[15px] placeholder-gray-500 text-gray-800 min-w-0 w-full">
                <div class="flex items-center gap-3 text-gray-500 pr-1 shrink-0 ml-2">
                    <label for="replyFiles" class="cursor-pointer"><i class="fa-regular fa-image text-[17px]"></i></label>
                    <input id="replyFiles" type="file" accept="image/*,video/*" multiple class="hidden" />
                    <button id="gifBtn" class="border-[1.5px] border-gray-400 rounded px-1.5 py-[1px] text-[10px] font-extrabold flex items-center justify-center tracking-wide">GIF</button>
                </div>
            </div>
            
            <button id="sendReplyBtn" class="w-10 h-10 rounded-full bg-[#5C7CFA] text-white flex items-center justify-center shrink-0 hover:bg-blue-500 transition-colors shadow-sm">
                <i class="fa-solid fa-chevron-right text-[15px] ml-0.5"></i>
            </button>
        </div>
    </div>

    <script>
        // API config
        const API_BASE = "https://examguide.onrender.com/api";
        const DISCUSSIONS_API = API_BASE + "/discussions";
        const IMAGES_API = API_BASE + "/images";
        const token = localStorage.getItem('token');

        // State
        let discussionId = null;
        let discussionData = null;
        let repliesPage = 1;
        let repliesLimit = 10;
        let replySort = 'newest';
        let currentUser = null;

        // DOM references
        const opContainer = document.getElementById('opPostContainer');
        const repliesContainer = document.getElementById('repliesContainer');
        const repliesHeader = document.getElementById('repliesHeader');

        // Helpers
        function getQueryParam(name) {
            const url = new URL(window.location.href);
            return url.searchParams.get(name);
        }

        function escapeHtml(str) {
            if (!str && str !== 0) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function formatTime(timestamp) {
            if (!timestamp) return "";
            const date = new Date(timestamp);
            if (isNaN(date.getTime())) return "";
            const now = new Date();
            const diff = now - date;
            const oneMinute = 60 * 1000; const oneHour = 60 * oneMinute; const oneDay = 24 * oneHour;
            if (diff < oneMinute) return "Just now";
            if (diff < oneHour) return date.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
            if (diff < oneDay) return date.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
            return date.toLocaleDateString();
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            discussionId = getQueryParam('id');
            if (!discussionId) {
                alert('No discussion id provided in URL (use ?id=...)');
                return;
            }
            await loadCurrentUser();
            await fetchAndRenderDiscussion();
            setupEventHandlers();
        });

        async function loadCurrentUser() {
            try {
                if (!token) return;
                const res = await fetch(`${API_BASE}/auth/me`, { headers: { 'Authorization': `Bearer ${token}` }});
                if (!res.ok) return;
                const body = await res.json();
                currentUser = body.user || null;
                const meAvatar = document.getElementById('meAvatar');
                if (meAvatar && currentUser) meAvatar.src = currentUser.profilePicture || `https://ui-avatars.com/api/?name=${encodeURIComponent((currentUser.fullname || currentUser.username) || 'U')}&background=1664FF&color=fff`;
            } catch (e) { console.warn('loadCurrentUser failed', e); }
        }

        async function fetchAndRenderDiscussion(resetReplies = true) {
            try {
                const res = await fetch(`${DISCUSSIONS_API}/${encodeURIComponent(discussionId)}?replyPage=${repliesPage}&replyLimit=${repliesLimit}&replySort=${replySort}`, {
                    headers: token ? { 'Authorization': `Bearer ${token}` } : {}
                });
                if (!res.ok) {
                    console.error('Failed to fetch discussion', res.status);
                    alert('Failed to load discussion');
                    return;
                }
                const data = await res.json();
                // backend returns { discussion, group, replies, repliesPagination, flags }
                discussionData = data.discussion || data;
                const group = data.group || (discussionData.group || null);
                const replies = data.replies || [];
                const pagination = data.repliesPagination || null;
                const flags = data.flags || {};

                // Header
                document.getElementById('discussionTitleEl').textContent = discussionData.title || 'Untitled';
                document.getElementById('discussionDescEl').textContent = discussionData.description || discussionData.content || '';
                document.getElementById('membersCount').textContent = (group && group.membersCount) ? group.membersCount : (group && group.members ? group.members.length : 0);
                document.getElementById('repliesCount').textContent = discussionData.replyCount ?? (pagination ? pagination.total : 0);
                document.getElementById('viewsCount').textContent = discussionData.views ?? 0;
                document.getElementById('groupBadge').textContent = (group && group.name) ? group.name : 'Public';

                // Bookmark UI
                const bookmarkBtn = document.getElementById('bookmarkBtn');
                if (flags.bookmarked) {
                    bookmarkBtn.querySelector('i').className = 'fa-solid fa-bookmark text-[16px]';
                } else {
                    bookmarkBtn.querySelector('i').className = 'fa-regular fa-bookmark text-[16px]';
                }

                // OP block
                renderOP(discussionData, flags);

                // Replies
                if (resetReplies) repliesContainer.innerHTML = '';
                renderReplies(replies, { append: !resetReplies });

                // Show replies header
                repliesHeader.classList.remove('hidden');
                document.getElementById('allRepliesLabel').textContent = `All replies (${discussionData.replyCount ?? (pagination ? pagination.total : replies.length)})`;

                // Load more button
                const loadMoreBtn = document.getElementById('loadMoreRepliesBtn');
                if (pagination && pagination.page < pagination.pages) {
                    loadMoreBtn.classList.remove('hidden');
                    loadMoreBtn.onclick = async () => {
                        repliesPage++;
                        await fetchAndRenderDiscussion(false);
                    };
                } else {
                    loadMoreBtn.classList.add('hidden');
                }
            } catch (e) {
                console.error('fetchAndRenderDiscussion error', e);
            }
        }

        function renderOP(discussion, flags = {}) {
            if (!discussion) return;
            opContainer.classList.remove('hidden');
            document.getElementById('opAvatar').src = discussion.author?.profilePicture || `https://ui-avatars.com/api/?name=${encodeURIComponent(discussion.author?.fullname || discussion.author?.username || 'OP')}&background=1664FF&color=fff`;
            document.getElementById('opName').textContent = discussion.author?.fullname || discussion.author?.username || 'Anonymous';
            document.getElementById('opTime').textContent = `• ${formatTime(discussion.createdAt)}`;
            document.getElementById('opContent').innerHTML = linkify(escapeHtml(discussion.content || discussion.description || ''));
            // OP tag visible
            document.getElementById('opTag').classList.remove('hidden');

            // Likes and counts
            document.getElementById('discussionLikeCount').textContent = discussion.likeCount ?? 0;
            document.getElementById('discussionReplyCount').textContent = discussion.replyCount ?? 0;
            const likeIcon = document.getElementById('discussionLikeIcon');
            if (flags.liked) likeIcon.className = 'fa-solid fa-thumbs-up text-[15px]'; else likeIcon.className = 'fa-regular fa-thumbs-up text-[15px]';
            // share handler (just copy url)
            document.getElementById('shareBtn').onclick = () => {
                const url = window.location.href;
                navigator.clipboard?.writeText(url).then(()=> alert('Link copied to clipboard'));
            };
        }

        // Render replies list (overwrites container unless append true)
        function renderReplies(replies = [], options = { append: false }) {
            if (!Array.isArray(replies)) return;
            const frag = document.createDocumentFragment();
            replies.forEach(r => {
                const wrap = document.createElement('div');
                wrap.className = 'bg-white p-4 w-full flex gap-3 shadow-sm';
                const authorAvatar = r.author?.profilePicture || `https://ui-avatars.com/api/?name=${encodeURIComponent(r.author?.fullname || r.author?.username || 'U')}&background=random`;
                const authorName = r.author?.fullname || r.author?.username || 'Anonymous';
                const isOP = r.isOP || (discussionData && discussionData.author && r.author && String(r.author._id || r.author._id) === String(discussionData.author._id || discussionData.author));
                const isAnswer = !!r.isAnswer;
                const liked = !!r.liked;
                const likeCount = r.likeCount ?? (r.likes ? r.likes.length : 0);

                wrap.innerHTML = `
                    <img src="${authorAvatar}" alt="${escapeHtml(authorName)}" class="w-9 h-9 rounded-full shrink-0 object-cover mt-0.5">
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-start mb-1.5">
                            <div class="flex items-center gap-2">
                                <span class="font-semibold text-gray-900 text-[14px]">${escapeHtml(authorName)}</span>
                                ${isOP ? `<span class="text-xs text-gray-400">OP</span>` : ''}
                                ${isAnswer ? `<span class="ml-2 text-[11px] bg-green-100 text-green-800 px-2 py-0.5 rounded">Accepted</span>` : ''}
                                <span class="text-gray-400 text-[12px] font-medium">• ${formatTime(r.createdAt)}</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <button class="reply-more-btn text-gray-400"><i class="fa-solid fa-ellipsis"></i></button>
                            </div>
                        </div>

                        <div class="reply-area text-[14.5px] text-gray-800 leading-snug mb-3">${linkify(escapeHtml(r.content || ''))}</div>
                        <div class="reply-attachments mb-3"></div>

                        <div class="flex gap-5 text-[13px] font-medium pt-1 items-center">
                            <button class="reply-like-btn flex items-center gap-1.5 ${liked ? 'text-brand-blue' : 'text-gray-500'}"><i class="${liked ? 'fa-solid fa-thumbs-up' : 'fa-regular fa-thumbs-up'}"></i> <span class="like-count">${likeCount}</span></button>
                            <button class="reply-reply-btn flex items-center gap-1.5 text-gray-500 hover:text-gray-700"><i class="fa-solid fa-share text-[14px]"></i> Reply</button>
                            ${canMarkAnswer() ? `<button class="mark-answer-btn ml-2 text-sm bg-brand-blue text-white px-2 py-1 rounded">${isAnswer ? 'Unmark' : 'Mark Answer'}</button>` : ''}
                        </div>
                    </div>
                `;

                // Attachments
                const attachmentsEl = wrap.querySelector('.reply-attachments');
                if (Array.isArray(r.attachments) && r.attachments.length) {
                    r.attachments.forEach(att => {
                        if (!att || !att.url) return;
                        const aWrap = document.createElement('div');
                        aWrap.className = 'mb-2';
                        if ((att.type || '').startsWith('image')) {
                            aWrap.innerHTML = `<img src="${att.url}" class="reply-attachment" alt="${escapeHtml(att.filename || '')}" />`;
                        } else {
                            aWrap.innerHTML = `<a href="${att.url}" target="_blank" class="text-sm text-brand-blue underline">${escapeHtml(att.filename || att.url)}</a>`;
                        }
                        attachmentsEl.appendChild(aWrap);
                    });
                }

                // Hook up like button
                const likeBtn = wrap.querySelector('.reply-like-btn');
                if (likeBtn) {
                    likeBtn.addEventListener('click', async () => {
                        await toggleLikeReply(r._id || r.id);
                        // optimistic update: toggle class & count
                        await fetchAndRenderDiscussion(true);
                    });
                }

                // Hook up mark answer if present
                const markBtn = wrap.querySelector('.mark-answer-btn');
                if (markBtn) {
                    markBtn.addEventListener('click', async () => {
                        try {
                            const res = await fetch(`${DISCUSSIONS_API}/reply/${encodeURIComponent(r._id || r.id)}/mark-answer`, {
                                method: 'POST',
                                headers: token ? { 'Authorization': `Bearer ${token}` } : {}
                            });
                            if (!res.ok) {
                                const body = await res.json().catch(()=>null);
                                alert(body?.error || 'Failed to mark answer');
                            } else {
                                await fetchAndRenderDiscussion(true);
                            }
                        } catch (e) { console.error(e); alert('Failed to mark answer'); }
                    });
                }

                frag.appendChild(wrap);
            });

            if (options.append) repliesContainer.appendChild(frag);
            else {
                repliesContainer.innerHTML = '';
                repliesContainer.appendChild(frag);
            }
        }

        function canMarkAnswer() {
            if (!currentUser || !discussionData) return false;
            return String(currentUser._id || currentUser.id) === String(discussionData.author || (discussionData.author && discussionData.author._id));
        }

        async function toggleLikeDiscussion() {
            try {
                const res = await fetch(`${DISCUSSIONS_API}/${encodeURIComponent(discussionId)}/like`, {
                    method: 'POST',
                    headers: token ? { 'Authorization': `Bearer ${token}` } : {}
                });
                if (!res.ok) {
                    console.warn('like discussion failed', res.status);
                }
                await fetchAndRenderDiscussion(true);
            } catch (e) { console.error('toggleLikeDiscussion', e); }
        }

        async function toggleBookmarkDiscussion() {
            try {
                const res = await fetch(`${DISCUSSIONS_API}/${encodeURIComponent(discussionId)}/bookmark`, {
                    method: 'POST',
                    headers: token ? { 'Authorization': `Bearer ${token}` } : {}
                });
                if (!res.ok) {
                    console.warn('bookmark failed', res.status);
                }
                await fetchAndRenderDiscussion(true);
            } catch (e) { console.error('toggleBookmarkDiscussion', e); }
        }

        async function toggleLikeReply(replyId) {
            try {
                const res = await fetch(`${DISCUSSIONS_API}/reply/${encodeURIComponent(replyId)}/like`, {
                    method: 'POST',
                    headers: token ? { 'Authorization': `Bearer ${token}` } : {}
                });
                if (!res.ok) console.warn('like reply failed', res.status);
            } catch (e) { console.error('toggleLikeReply', e); }
        }

        // Reply posting flow:
        // Preferred: upload each file to /api/images (returns { url }) then POST JSON to /api/discussions/:id/reply with { content, attachments }
        // Fallback: if the server expects multipart, send files in FormData directly to /api/discussions/:id/reply
        async function postReply() {
            const content = document.getElementById('replyInput').value.trim();
            const filesInput = document.getElementById('replyFiles');
            const files = filesInput.files ? Array.from(filesInput.files) : [];

            if (!content && files.length === 0) {
                alert('Please enter a reply or attach an image/GIF.');
                return;
            }

            const sendBtn = document.getElementById('sendReplyBtn');
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

            try {
                // 1) upload files to IMAGES_API sequentially (your existing endpoint)
                const attachments = [];
                for (const f of files) {
                    try {
                        const fd = new FormData();
                        fd.append('image', f);
                        const imRes = await fetch(IMAGES_API, {
                            method: 'POST',
                            headers: token ? { 'Authorization': `Bearer ${token}` } : {},
                            body: fd
                        });
                        const imBody = await imRes.json().catch(()=>null);
                        if (!imRes.ok) {
                            // If image upload fails, try continue or abort based on preference
                            console.warn('image upload failed', imRes.status, imBody);
                            throw new Error(imBody?.error || imBody?.message || 'Image upload failed');
                        }
                        // imBody expected { url: 'https://...' }
                        attachments.push({ url: imBody.url, type: f.type || 'image', filename: f.name });
                    } catch (uErr) {
                        console.warn('single image upload failed, will try multipart fallback', uErr);
                        // fallback to multipart below
                        throw uErr;
                    }
                }

                // 2) send JSON reply payload
                const payload = { content, attachments };
                let res = await fetch(`${DISCUSSIONS_API}/${encodeURIComponent(discussionId)}/reply`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...(token ? { 'Authorization': `Bearer ${token}` } : {})
                    },
                    body: JSON.stringify(payload)
                });

                // If server rejects JSON because it expects multipart (e.g., 400), fallback:
                if (!res.ok) {
                    const body = await res.json().catch(()=>null);
                    // If server indicates "No file uploaded" or similar, attempt FormData fallback
                    if (files.length > 0) {
                        console.debug('JSON reply rejected, trying multipart upload fallback', res.status, body);
                        const fd = new FormData();
                        fd.append('content', content);
                        for (const f of files) fd.append('attachments', f); // name 'attachments' matches earlier server examples
                        res = await fetch(`${DISCUSSIONS_API}/${encodeURIComponent(discussionId)}/reply`, {
                            method: 'POST',
                            headers: token ? { 'Authorization': `Bearer ${token}` } : {},
                            body: fd
                        });
                    }
                }

                if (!res.ok) {
                    const body = await res.json().catch(()=>null);
                    throw new Error(body?.error || body?.message || `Reply failed (${res.status})`);
                }

                // Success - clear input and files, update UI
                document.getElementById('replyInput').value = '';
                filesInput.value = '';
                await fetchAndRenderDiscussion(true);
                // scroll to bottom of replies
                setTimeout(()=> { window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); }, 150);
            } catch (err) {
                console.error('postReply error', err);
                alert('Failed to post reply: ' + (err.message || 'unknown'));
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerHTML = '<i class="fa-solid fa-chevron-right text-[15px] ml-0.5"></i>';
            }
        }

        // Small linkify to make URLs clickable
        function linkify(text) {
            if (!text) return '';
            const urlPattern = /((https?:\/\/)[\w\-.~:\/?#[\]@!$&'()*+,;=%]+)/g;
            return text.replace(urlPattern, '<a href="$1" target="_blank" class="text-brand-blue underline">$1</a>');
        }

        // Event hookups
        function setupEventHandlers() {
            document.getElementById('backBtn').addEventListener('click', () => window.history.back());
            document.getElementById('discussionLikeBtn').addEventListener('click', toggleLikeDiscussion);
            document.getElementById('bookmarkBtn').addEventListener('click', toggleBookmarkDiscussion);
            document.getElementById('sendReplyBtn').addEventListener('click', postReply);

            // Sort control
            const sortSelect = document.getElementById('replySortSelect');
            sortSelect.addEventListener('change', async (e) => {
                replySort = e.target.value || 'newest';
                repliesPage = 1;
                await fetchAndRenderDiscussion(true);
            });

            // Clicking reply count scrolls to replies area
            document.getElementById('discussionReplyCountBtn').addEventListener('click', () => {
                const el = document.getElementById('repliesContainer');
                if (el) el.scrollIntoView({ behavior: 'smooth' });
            });

            // Show OP label if current user is author: hide OP tag for replies etc handled by render
        }
    </script>
</body>
</html>
