<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAU ExamCompass</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Flowbite CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet" />
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 font-sans min-h-screen flex items-center justify-center relative overflow-hidden select-none">

    <!-- Ambient Glowing Background Orbs -->
    <div class="absolute top-[-20%] left-[-10%] w-[500px] h-[500px] bg-blue-600/20 rounded-full blur-[120px] animate-pulse pointer-events-none"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[600px] h-[600px] bg-amber-600/15 rounded-full blur-[140px] animate-pulse pointer-events-none" style="animation-delay: 2s;"></div>
    <div class="absolute top-[40%] left-[30%] w-[300px] h-[300px] bg-indigo-600/10 rounded-full blur-[100px] pointer-events-none"></div>

    <!-- Main Splash Wrapper -->
    <div class="z-10 w-full max-w-md mx-4 text-center">
        
        <!-- App Container Card -->
        <div class="bg-slate-800/40 backdrop-blur-xl border border-slate-700/50 rounded-3xl p-8 md:p-10 shadow-2xl shadow-black/40 transition-all duration-500">
            
            <!-- Logo Section with Spin Ring -->
            <div class="relative w-32 h-32 mx-auto mb-8 flex items-center justify-center">
                <!-- Outer Gradient Rotating Border -->
                <div class="absolute inset-0 rounded-3xl bg-gradient-to-tr from-amber-400 via-blue-600 to-amber-500 animate-spin opacity-80" style="animation-duration: 8s;"></div>
                <!-- Inner Shield Box -->
                <div class="absolute inset-[3px] bg-slate-900 rounded-[21px] flex items-center justify-center overflow-hidden border border-slate-700/50">
                    <!-- Replace with standard '../logo.png' if available -->
                    <img src="../logo.png" alt="OAU Crest" class="w-24 h-24 object-contain transition-transform duration-700 hover:scale-110" onerror="this.src='https://images.unsplash.com/photo-1546410531-bb4caa6b424d?auto=format&fit=crop&w=150&q=80'; this.className='w-full h-full object-cover opacity-25';">
                </div>
            </div>

            <!-- Typography Header -->
            <div class="space-y-2 mb-8">
                <span class="text-xs font-bold tracking-[0.2em] text-blue-400 uppercase">Obafemi Awolowo University</span>
                <h1 class="text-3xl md:text-4xl font-extrabold text-white tracking-tight">
                    Exam<span class="bg-gradient-to-r from-amber-300 to-amber-500 bg-clip-text text-transparent">Compass</span>
                </h1>
                <p class="text-sm text-slate-400 font-medium">Your academic navigation hub</p>
            </div>

            <!-- Loader Progress Component -->
            <div class="space-y-3 mb-6">
                <div class="flex justify-between items-center text-xs font-semibold px-1">
                    <span id="status-text" class="text-slate-400 transition-all duration-300">Initializing secure portal...</span>
                    <span id="progress-percentage" class="text-amber-400 font-mono">0%</span>
                </div>
                
                <!-- Flowbite Inspired Custom Progress Track -->
                <div class="w-full bg-slate-700/50 rounded-full h-2 overflow-hidden p-[2px] border border-slate-700/30">
                    <div id="progress-bar" class="bg-gradient-to-r from-blue-500 via-indigo-500 to-amber-400 h-full rounded-full w-0 transition-all duration-100 ease-out shadow-[0_0_12px_rgba(245,158,11,0.3)]"></div>
                </div>
            </div>

            <!-- Interactive Skip Button Area -->
            <div class="h-12 flex items-center justify-center">
                <button id="skip-btn" class="opacity-0 translate-y-2 pointer-events-none inline-flex items-center gap-2 text-xs font-semibold text-slate-300 bg-slate-700/40 hover:bg-slate-700/80 border border-slate-600/40 px-4 py-2 rounded-xl transition-all duration-300 hover:text-white group">
                    Skip Intro
                    <svg class="w-3 h-3 transform transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"></path>
                    </svg>
                </button>
            </div>

        </div>

        <!-- Footer Branding Meta -->
        <p class="mt-6 text-[11px] tracking-wider text-slate-500 font-medium uppercase">© 2026 OAU ICT Center. All Rights Reserved.</p>
    </div>

    <!-- Flowbite JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>

    <!-- Custom App Bootstrap Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const destination = '/tutor/Oau.html';
            const totalDuration = 6000; // Simulated 6-second premium boot time
            const stepInterval = 50;    // Tick update rate (ms)
            
            const progressBar = document.getElementById('progress-bar');
            const progressPercentage = document.getElementById('progress-percentage');
            const statusText = document.getElementById('status-text');
            const skipBtn = document.getElementById('skip-btn');

            // Sequential engine simulation states
            const loadingSequences = [
                { threshold: 0, text: "Configuring environment hooks..." },
                { threshold: 18, text: "Connecting to central database..." },
                { threshold: 38, text: "Syncing seat allocation graphs..." },
                { threshold: 60, text: "Downloading course maps & schedules..." },
                { threshold: 82, text: "Optimizing dashboard parameters..." },
                { threshold: 95, text: "Welcome! Launching Compass..." }
            ];

            let elapsedTime = 0;

            const updateLoader = setInterval(() => {
                elapsedTime += stepInterval;
                let currentProgress = Math.min((elapsedTime / totalDuration) * 100, 100);
                
                // Update interface components
                progressBar.style.width = `${currentProgress}%`;
                progressPercentage.textContent = `${Math.floor(currentProgress)}%`;

                // Update text sequence markers depending on current percentage progress
                const matchingState = [...loadingSequences]
                    .reverse()
                    .find(state => currentProgress >= state.threshold);
                
                if (matchingState && statusText.textContent !== matchingState.text) {
                    statusText.textContent = matchingState.text;
                }

                // Smoothly reveal Skip Button after 25% progress (~1.5 seconds)
                if (currentProgress >= 25) {
                    skipBtn.classList.remove('opacity-0', 'translate-y-2', 'pointer-events-none');
                }

                // Halt thread on absolute completion and forward user
                if (currentProgress >= 100) {
                    clearInterval(updateLoader);
                    setTimeout(redirectToApp, 400); 
                }
            }, stepInterval);

            // Forward routing logic
            function redirectToApp() {
                clearInterval(updateLoader);
                // Simple exit card flash animation prior to departure
                document.querySelector('.z-10').classList.add('scale-95', 'opacity-0', 'duration-300');
                setTimeout(() => {
                    window.location.href = destination;
                }, 250);
            }

            // Click Event Listener for explicit Bypass button
            skipBtn.addEventListener('click', redirectToApp);

            // Optional Keypress Shortcut (Spacebar or Enter to bypass instantly)
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    redirectToApp();
                }
            });
        });
    </script>
</body>
</html>
