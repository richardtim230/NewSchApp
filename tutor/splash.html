<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAU ExamCompass</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Flowbite CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet" />
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            dark: '#1e3a8a',   // Sidebar background
                            active: '#2563eb', // Active states
                            accent: '#3b82f6', // Lighter blue
                            light: '#f8fafc',  // Main background
                            warm: '#f59e0b'    // Lively amber for community vibe
                        }
                    },
                    boxShadow: {
                        'premium': '0 4px 20px -2px rgba(0,0,0,0.05), 0 8px 16px -6px rgba(0,0,0,0.02)',
                        'floating': '0 10px 25px -5px rgba(37, 99, 235, 0.15)'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-light font-sans min-h-screen flex flex-col justify-between relative overflow-hidden select-none">

    <!-- Top Canvas: Bright Royal & Electric Blue Gradient Arc using Config values -->
    <div class="absolute top-0 left-0 w-full h-[82vh] bg-gradient-to-b from-brand-dark via-brand-active to-brand-accent rounded-b-[40px] md:rounded-b-[80px] shadow-floating z-0">
        <!-- Ambient Light Flare -->
        <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-[150%] h-[50%] bg-gradient-to-t from-white/10 to-transparent blur-3xl pointer-events-none"></div>
    </div>

    <!-- Main Content Wrapper -->
    <div class="z-10 w-full max-w-md mx-auto px-6 flex-grow flex items-center justify-center pt-8">
        
        <!-- App Container Card with custom premium shadow configuration -->
        <div class="w-full bg-slate-900/30 backdrop-blur-xl border border-white/10 rounded-3xl p-8 md:p-10 shadow-premium transition-all duration-500">
            
            <!-- Logo Section with Spin Ring -->
            <div class="relative w-28 h-28 mx-auto mb-8 flex items-center justify-center">
                <!-- Rotation border using accent blue and warm amber -->
                <div class="absolute inset-0 rounded-3xl bg-gradient-to-tr from-brand-warm via-white to-brand-accent animate-spin opacity-90 shadow-md" style="animation-duration: 20s;"></div>
                <!-- Inner Shield Box -->
                <div class="absolute inset-[3px] bg-brand-dark rounded-[21px] flex items-center justify-center overflow-hidden border border-white/10">
                    <img src="../logo.png" alt="OAU Crest" class="w-20 h-20 object-contain" onerror="this.src='https://images.unsplash.com/photo-1546410531-bb4caa6b424d?auto=format&fit=crop&w=150&q=80'; this.className='w-full h-full object-cover opacity-20';">
                </div>
            </div>

            <!-- Header Typography using updated config styles -->
            <div class="space-y-2 text-center mb-8">
                <span class="text-[10px] font-bold tracking-[0.25em] text-blue-200/80 uppercase">Obafemi Awolowo University</span>
                <h1 class="text-4xl font-extrabold text-white tracking-tight">
                    OAU <span class="text-brand-warm">ExamCompass</span>
                </h1>
                <div class="inline-block bg-brand-warm text-brand-dark font-bold text-xs px-4 py-1.5 rounded-full mt-2 shadow-sm">
                    • Secure Student Portal
                </div>
            </div>

            <!-- Loader Progress Track Interface -->
            <div class="space-y-3 mb-4">
                <div class="flex justify-between items-center text-xs font-semibold px-1">
                    <span id="status-text" class="text-blue-100/80 transition-all duration-500 truncate max-w-[80%]">Establishing secure link...</span>
                    <span id="progress-percentage" class="text-brand-warm font-mono">0%</span>
                </div>
                
                <!-- Custom tracking track -->
                <div class="w-full bg-black/20 rounded-full h-2.5 overflow-hidden p-[2px] border border-white/5">
                    <div id="progress-bar" class="bg-gradient-to-r from-brand-accent via-white to-brand-warm h-full rounded-full w-0 transition-all duration-300 ease-out shadow-[0_0_10px_rgba(245,158,11,0.3)]"></div>
                </div>
            </div>

            <!-- Interactive Skip Action Bar -->
            <div class="h-10 flex items-center justify-center">
                <button id="skip-btn" class="opacity-0 translate-y-2 pointer-events-none inline-flex items-center gap-2 text-xs font-semibold text-white/80 bg-white/10 hover:bg-white/20 border border-white/10 px-4 py-2 rounded-xl transition-all duration-500 hover:text-white group">
                    Skip Intro
                    <svg class="w-3 h-3 transform transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"></path>
                    </svg>
                </button>
            </div>

        </div>
    </div>

    <!-- Brand Divider Line (Warm Amber) -->
    <div class="w-full h-[3px] bg-brand-warm z-10 relative"></div>

    <!-- Base Branding Footer (Matches target brand-light background) -->
    <div class="z-10 bg-brand-light w-full py-5 px-6 text-center">
        <div class="max-w-md mx-auto flex flex-col sm:flex-row items-center justify-between gap-2 text-xs font-medium text-slate-500">
            <span class="tracking-wider uppercase text-brand-dark font-bold">Great Ife Students' Union Hub</span>
            <span class="text-slate-300 hidden sm:inline">|</span>
            <span class="font-mono text-slate-400">v2.5.0 Stable</span>
        </div>
    </div>

    <!-- Flowbite JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>

    <!-- App Init Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const targetRoute = '/tutor/Oau.html';
            const totalDuration = 16000; // Increased to an ultra-smooth, slower 16-second timeline
            const tickRate = 100;        // Runs frame loops smoothly every 100ms
            
            const progressBar = document.getElementById('progress-bar');
            const progressPercentage = document.getElementById('progress-percentage');
            const statusText = document.getElementById('status-text');
            const skipBtn = document.getElementById('skip-btn');

            // Extended operational narration checkpoints adjusted for the longer duration
            const operationalMilestones = [
                { marker: 0, desc: "Initializing secure application kernels..." },
                { marker: 12, desc: "Connecting with OAU central dataset hubs..." },
                { marker: 28, desc: "Verifying current faculty seating graphs..." },
                { marker: 45, desc: "Syncing exam timetable index metrics..." },
                { marker: 65, desc: "Caching real-time navigational maps..." },
                { marker: 82, desc: "Optimizing dashboard configuration profiles..." },
                { marker: 94, desc: "Environment safe. Forwarding credentials..." }
            ];

            let runningTime = 0;

            const progressEngine = setInterval(() => {
                runningTime += tickRate;
                let activeMetrics = Math.min((runningTime / totalDuration) * 100, 100);
                
                // Update interface components
                progressBar.style.width = `${activeMetrics}%`;
                progressPercentage.textContent = `${Math.floor(activeMetrics)}%`;

                // Swap descriptive string tasks step-by-step
                const activeState = [...operationalMilestones]
                    .reverse()
                    .find(step => activeMetrics >= step.marker);
                
                if (activeState && statusText.textContent !== activeState.desc) {
                    statusText.textContent = activeState.desc;
                }

                // Show skip button early at 15% progress (~2.4 seconds) for safety/utility
                if (activeMetrics >= 15) {
                    skipBtn.classList.remove('opacity-0', 'translate-y-2', 'pointer-events-none');
                }

                // Finish pipeline route natively
                if (activeMetrics >= 100) {
                    clearInterval(progressEngine);
                    setTimeout(executeTransition, 400); 
                }
            }, tickRate);

            // Outbound page forwarding execution animation
            function executeTransition() {
                clearInterval(progressEngine);
                const coreWrapper = document.querySelector('.z-10.w-full');
                if (coreWrapper) {
                    coreWrapper.classList.add('opacity-0', 'scale-95', 'duration-500');
                }
                setTimeout(() => {
                    window.location.href = targetRoute;
                }, 450);
            }

            // Click listener
            skipBtn.addEventListener('click', executeTransition);

            // Key hook layout overrides (Space or Enter to skip instantly)
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    executeTransition();
                }
            });
        });
    </script>
</body>
</html>
