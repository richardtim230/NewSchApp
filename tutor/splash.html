<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAU ExamCompass</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Flowbite CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet" />
        <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brandBlue: {
                            deep: '#0047B2',
                            bright: '#0025cc',
                            electric: '#0044ff'
                        },
                        brandGold: '#eab308'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#f3f4f6] font-sans min-h-screen flex flex-col justify-between relative overflow-hidden select-none">

    <!-- Top Canvas: Bright Electric Blue Gradient Arc -->
    <div class="absolute top-0 left-0 w-full h-[82vh] bg-gradient-to-b from-brandBlue-deep via-brandBlue-bright to-brandBlue-electric rounded-b-[40px] md:rounded-b-[80px] shadow-2xl z-0">
        <!-- Abstract Ambient Light Glow -->
        <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-[150%] h-[60%] bg-gradient-to-t from-white/10 to-transparent blur-3xl pointer-events-none"></div>
    </div>

    <!-- Main Content Wrapper (Centered inside the blue section) -->
    <div class="z-10 w-full max-w-md mx-auto px-6 flex-grow flex items-center justify-center pt-8">
        
        <!-- Glass Container Box -->
        <div class="w-full bg-slate-900/30 backdrop-blur-xl border border-white/10 rounded-3xl p-8 md:p-10 shadow-2xl shadow-black/30 transition-all duration-500">
            
            <!-- Logo Module with Ultra-Slow Spin Accent Ring -->
            <div class="relative w-28 h-28 mx-auto mb-8 flex items-center justify-center">
                <!-- Slowed outer rotation border for premium feel -->
                <div class="absolute inset-0 rounded-3xl bg-gradient-to-tr from-brandGold via-white to-brandBlue-electric animate-spin opacity-90 shadow-lg" style="animation-duration: 16s;"></div>
                <!-- Inner Guard Box -->
                <div class="absolute inset-[3px] bg-brandBlue-deep rounded-[21px] flex items-center justify-center overflow-hidden border border-white/10">
                    <img src="../logo.png" alt="OAU Crest" class="w-20 h-20 object-contain" onerror="this.src='https://images.unsplash.com/photo-1546410531-bb4caa6b424d?auto=format&fit=crop&w=150&q=80'; this.className='w-full h-full object-cover opacity-20';">
                </div>
            </div>

            <!-- Header Typography -->
            <div class="space-y-2 text-center mb-8">
                <span class="text-[10px] font-bold tracking-[0.25em] text-blue-200/80 uppercase">Obafemi Awolowo University</span>
                <h1 class="text-4xl font-extrabold text-white tracking-tight">
                    Finance<span class="text-brandGold">Gist</span>
                </h1>
                <div class="inline-block bg-brandGold text-brandBlue-deep font-bold text-xs px-4 py-1.5 rounded-full mt-2 shadow-md">
                    • ExamCompass Edition
                </div>
            </div>

            <!-- Loader Track Interface -->
            <div class="space-y-3 mb-4">
                <div class="flex justify-between items-center text-xs font-semibold px-1">
                    <span id="status-text" class="text-blue-100/80 transition-all duration-500 truncate max-w-[80%]">Securing environment keys...</span>
                    <span id="progress-percentage" class="text-brandGold font-mono">0%</span>
                </div>
                
                <!-- Progress bar tracking graphic -->
                <div class="w-full bg-black/20 rounded-full h-2.5 overflow-hidden p-[2px] border border-white/5">
                    <div id="progress-bar" class="bg-gradient-to-r from-blue-400 via-white to-brandGold h-full rounded-full w-0 transition-all duration-300 ease-out shadow-[0_0_10px_rgba(234,179,8,0.4)]"></div>
                </div>
            </div>

            <!-- Intermittent Skip Action Bar -->
            <div class="h-10 flex items-center justify-center">
                <button id="skip-btn" class="opacity-0 translate-y-2 pointer-events-none inline-flex items-center gap-2 text-xs font-semibold text-white/80 bg-white/10 hover:bg-white/20 border border-white/10 px-4 py-2 rounded-xl transition-all duration-500 hover:text-white group">
                    Skip Intro
                    <svg class="w-3 h-3 transform transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"></path>
                    </svg>
                </button>
            </div>

        </div>
    </div>

    <!-- Gold Accent Divider Bar -->
    <div class="w-full h-[3px] bg-brandGold/80 z-10 relative shadow-sm shadow-brandGold/20"></div>

    <!-- Base Branding Footer (Matches graphic layout perfectly) -->
    <div class="z-10 bg-white w-full py-5 px-6 text-center shadow-[0_-8px_30px_rgba(0,0,0,0.04)]">
        <div class="max-w-md mx-auto flex flex-col sm:flex-row items-center justify-between gap-2 text-xs font-medium text-slate-500">
            <span class="tracking-wider uppercase text-brandBlue-deep font-bold">Connect with OAU ExamCompass</span>
            <span class="text-slate-400 hidden sm:inline">|</span>
            <span class="font-mono text-slate-600">v2.1.0 Stable Build</span>
        </div>
    </div>

    <!-- Flowbite JS Bundle dependency -->
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>

    <!-- App Init Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const targetRoute = '/tutor/Oau.html';
            const totalDuration = 10000; // Calibrated down to a steady, relaxed 10-second run
            const tickRate = 100;        // Fluid updates every 100ms
            
            const progressBar = document.getElementById('progress-bar');
            const progressPercentage = document.getElementById('progress-percentage');
            const statusText = document.getElementById('status-text');
            const skipBtn = document.getElementById('skip-btn');

            // Steady, informative step narration sequence
            const operationalMilestones = [
                { marker: 0, desc: "Synchronizing system dependencies..." },
                { marker: 15, desc: "Mapping campus node clusters..." },
                { marker: 35, desc: "Fetching current course indices..." },
                { marker: 55, desc: "Assembling custom workspace matrix..." },
                { marker: 75, desc: "Finalizing handshake protocols..." },
                { marker: 92, desc: "System operational. Entering..." }
            ];

            let runningTime = 0;

            const progressEngine = setInterval(() => {
                runningTime += tickRate;
                let activeMetrics = Math.min((runningTime / totalDuration) * 100, 100);
                
                // Update metrics layout
                progressBar.style.width = `${activeMetrics}%`;
                progressPercentage.textContent = `${Math.floor(activeMetrics)}%`;

                // Calculate textual string swap steps based on current percentage position
                const activeState = [...operationalMilestones]
                    .reverse()
                    .find(step => activeMetrics >= step.marker);
                
                if (activeState && statusText.textContent !== activeState.desc) {
                    statusText.textContent = activeState.desc;
                }

                // Show the interactive skip trigger smoothly after 20% completion (~2s)
                if (activeMetrics >= 20) {
                    skipBtn.classList.remove('opacity-0', 'translate-y-2', 'pointer-events-none');
                }

                // Kill interval engine upon standard termination path
                if (activeMetrics >= 100) {
                    clearInterval(progressEngine);
                    setTimeout(executeTransition, 500); 
                }
            }, tickRate);

            // Interface routing execution
            function executeTransition() {
                clearInterval(progressEngine);
                // Graceful fading out transformation prior to view swap
                const coreWrapper = document.querySelector('.z-10.w-full');
                if (coreWrapper) {
                    coreWrapper.classList.add('opacity-0', 'scale-95', 'duration-500');
                }
                setTimeout(() => {
                    window.location.href = targetRoute;
                }, 450);
            }

            // Click interceptors
            skipBtn.addEventListener('click', executeTransition);

            // Keyboard navigation overrides (Space or Enter keys triggers immediate bypass)
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    executeTransition();
                }
            });
        });
    </script>
</body>
</html>
