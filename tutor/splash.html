<!DOCTYPE html>
<html lang="en" class="overflow-x-hidden overflow-y-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.85">
    <title>ExamCompass</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Flowbite CSS CDN -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
    <!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Prefetch pages -->
<link rel="prefetch" href="../NextWeb/course.html">
<link rel="prefetch" href="../NextWeb/tp.html">
<link rel="prefetch" href="../NextWeb/reader.html">
<link rel="prefetch" href="../NextWeb/grpchat.html">
<link rel="prefetch" href="../loader">

<!-- PWA -->
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#1e3a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OAU Hub">

<!-- Icons -->
<script defer src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet" />
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            dark: '#1e3a8a',
                            active: '#2563eb',
                            accent: '#3b82f6',
                            light: '#f8fafc',
                            warm: '#f59e0b'
                        }
                    },
                    boxShadow: {
                        'premium': '0 4px 20px -2px rgba(0,0,0,0.05), 0 8px 16px -6px rgba(0,0,0,0.02)',
                        'floating': '0 10px 25px -5px rgba(37, 99, 235, 0.15)'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-light font-sans min-h-screen flex flex-col justify-between relative overflow-x-hidden overflow-y-hidden select-none">

    <!-- Top Canvas -->
    <div class="absolute top-0 left-0 w-full h-[82vh] bg-gradient-to-b from-brand-dark via-brand-active to-brand-accent rounded-b-[40px] md:rounded-b-[80px] shadow-floating z-0">
        <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-[150%] h-[50%] bg-gradient-to-t from-white/10 to-transparent blur-3xl pointer-events-none"></div>
    </div>

    <!-- Main Content Wrapper -->
    <div class="z-10 w-full max-w-md mx-auto px-6 flex-grow flex items-center justify-center pt-8">
        
        <!-- App Container Card -->
        <div class="w-full bg-slate-900/30 backdrop-blur-xl border border-white/10 rounded-3xl p-8 md:p-10 shadow-premium transition-all duration-500">
            
            <!-- Logo Section with Spin Ring -->
            <div class="relative w-28 h-28 mx-auto mb-8 flex items-center justify-center">
                <div class="absolute inset-0 rounded-3xl bg-gradient-to-tr from-brand-warm via-white to-brand-accent animate-spin opacity-90 shadow-md" style="animation-duration: 20s;"></div>
                <div class="absolute inset-[3px] bg-brand-dark rounded-[21px] flex items-center justify-center overflow-hidden border border-white/10">
                    <img src="../logo.png" alt="OAU Crest" class="w-20 h-20 object-contain" onerror="this.src='https://images.unsplash.com/photo-1546410531-bb4caa6b424d?auto=format&fit=crop&w=150&q=80'">
                </div>
            </div>

            <!-- Header Typography -->
            <div class="space-y-2 text-center mb-8">
                <span class="text-[10px] font-bold tracking-[0.25em] text-blue-200/80 uppercase">Global African Universities</span>
                <h1 class="text-4xl font-extrabold text-white tracking-tight">
                    <span class="text-brand-warm">ExamCompass</span>
                </h1>
                <div class="inline-block bg-brand-warm text-brand-dark font-bold text-xs px-4 py-1.5 rounded-full mt-2 shadow-sm">
                    • Secure Student Portal
                </div>
            </div>

            <!-- Loader Progress Track Interface -->
            <div id="loader-section" class="space-y-3 mb-4">
                <div class="flex justify-between items-center text-xs font-semibold px-1">
                    <span id="status-text" class="text-blue-100/80 transition-all duration-500 truncate max-w-[80%]">Establishing secure link...</span>
                    <span id="progress-percentage" class="text-brand-warm font-mono">0%</span>
                </div>
                
                <!-- Custom tracking track -->
                <div class="w-full bg-black/20 rounded-full h-2.5 overflow-hidden p-[2px] border border-white/5">
                    <div id="progress-bar" class="bg-gradient-to-r from-brand-accent via-white to-brand-warm h-full rounded-full w-0 transition-all duration-300 ease-out shadow-[0_0_10px_rgba(245,158,11,0.5)]"></div>
                </div>
            </div>

            <!-- Offline Mode Message (Hidden by default) -->
            <div id="offline-message" class="hidden space-y-3 mb-4">
                <div class="text-center">
                    <div class="text-5xl mb-3">📖</div>
                    <h2 class="text-xl font-bold text-white mb-2">Offline Mode Active</h2>
                    <p class="text-sm text-blue-100/80">You're offline. Launching Reader with pre-loaded content...</p>
                </div>
            </div>

            <!-- Loading Complete Message (Hidden by default) -->
            <div id="complete-message" class="h-10 flex items-center justify-center opacity-0 transition-opacity duration-500">
                <span class="text-sm font-semibold text-brand-warm">Ready to continue...</span>
            </div>

        </div>
    </div>

    <!-- Brand Divider Line -->
    <div class="w-full h-[3px] bg-brand-warm z-10 relative"></div>

    <!-- Base Branding Footer -->
    <div class="z-10 bg-brand-light w-full py-5 px-6 text-center">
        <div class="max-w-md mx-auto flex flex-col sm:flex-row items-center justify-between gap-2 text-xs font-medium text-slate-500">
            <span class="tracking-wider uppercase text-brand-dark font-bold">ExamCompass ICT Center Hub</span>
            <span class="text-slate-300 hidden sm:inline">|</span>
            <span id="status-footer" class="font-mono text-slate-400">v2.5.0 Stable</span>
        </div>
    </div>

    <!-- Flowbite JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>

    <!-- App Init Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const onlineRoute = '/tutor/Oau.html';
            const offlineRoute = '../NextWeb/reader.html';
            const totalDuration = 16000;
            const tickRate = 100;
            const backendUrl = 'https://examguide.onrender.com';
            
            const progressBar = document.getElementById('progress-bar');
            const progressPercentage = document.getElementById('progress-percentage');
            const statusText = document.getElementById('status-text');
            const completeMessage = document.getElementById('complete-message');
            const loaderSection = document.getElementById('loader-section');
            const offlineMessage = document.getElementById('offline-message');
            const statusFooter = document.getElementById('status-footer');

            const operationalMilestones = [
                { marker: 0, desc: "Initializing secure application kernels..." },
                { marker: 12, desc: "Connecting with OAU ICT Center dataset hubs..." },
                { marker: 28, desc: "Verifying encrypted infrastructure graphs..." },
                { marker: 45, desc: "Syncing exam timetable index metrics..." },
                { marker: 65, desc: "Caching real-time navigational maps..." },
                { marker: 82, desc: "Optimizing dashboard configuration profiles..." },
                { marker: 94, desc: "Pre-caching offline reader and passages..." }
            ];

            let runningTime = 0;
            let isOnline = navigator.onLine;

            // Register Service Worker if available
            async function registerServiceWorker() {
                if ('serviceWorker' in navigator) {
                    try {
                        const registration = await navigator.serviceWorker.register('../tutor/service-worker.js', {
                            scope: '/'
                        });
                        console.log('Service Worker registered:', registration);

                        // Listen for messages from service worker
                        navigator.serviceWorker.addEventListener('message', event => {
                            console.log('Message from SW:', event.data);
                        });

                        // Check for updates every 30 seconds
                        setInterval(() => {
                            registration.update();
                        }, 30000);

                        return registration;
                    } catch (error) {
                        console.log('Service Worker registration failed:', error);
                    }
                }
                return null;
            }

            // Precache offline resources via Service Worker
            async function precacheOfflineResources() {
                if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
                    navigator.serviceWorker.controller.postMessage({
                        type: 'PRECACHE_OFFLINE'
                    });
                    console.log('Sent precache request to Service Worker');
                } else {
                    // Fallback: direct fetch and cache
                    try {
                        const cache = await caches.open('oau-offline-reader-v1');
                        const resources = [
                            '../NextWeb/reader.html',
                            '../NextWeb/passages.json'
                        ];

                        for (const resource of resources) {
                            try {
                                const response = await fetch(resource);
                                if (response.ok) {
                                    await cache.put(resource, response);
                                    console.log('Cached:', resource);
                                }
                            } catch (error) {
                                console.log('Could not cache:', resource);
                            }
                        }
                    } catch (error) {
                        console.log('Fallback caching failed:', error);
                    }
                }
            }

            // Check online status immediately
            function checkConnectivity() {
                isOnline = navigator.onLine;
                console.log('Online status:', isOnline);
                
                if (!isOnline) {
                    handleOfflineMode();
                    return false;
                }
                return true;
            }

            // Handle offline mode
            function handleOfflineMode() {
                loaderSection.classList.add('hidden');
                offlineMessage.classList.remove('hidden');
                statusFooter.textContent = 'Offline Mode • Reader Available';
                
                // Redirect to reader after 2 seconds
                setTimeout(() => {
                    window.location.href = offlineRoute;
                }, 2000);
            }

            // Listen for online/offline events
            window.addEventListener('online', () => {
                console.log('Connection restored');
                isOnline = true;
                // Precache when coming back online
                precacheOfflineResources();
            });

            window.addEventListener('offline', () => {
                console.log('Connection lost');
                isOnline = false;
                if (!progressBar.style.width || progressBar.style.width === '0%') {
                    handleOfflineMode();
                }
            });

            // Initialize Service Worker
            registerServiceWorker();

            // Check if offline at start
            if (!checkConnectivity()) {
                return;
            }

            // Silent backend preload
            function preloadBackend() {
                fetch(backendUrl, {
                    method: 'GET',
                    mode: 'no-cors'
                })
                .then(() => {
                    console.log('Backend preload initiated');
                })
                .catch((error) => {
                    console.log('Backend preload in progress');
                });
            }

            // Start precaching immediately during boot
            precacheOfflineResources();

            // Initiate backend preload immediately
            preloadBackend();

            const progressEngine = setInterval(() => {
                // Re-check online status during loading
                if (!navigator.onLine) {
                    clearInterval(progressEngine);
                    handleOfflineMode();
                    return;
                }

                runningTime += tickRate;
                let activeMetrics = Math.min((runningTime / totalDuration) * 100, 100);
                
                // Update interface components
                progressBar.style.width = `${activeMetrics}%`;
                progressPercentage.textContent = `${Math.floor(activeMetrics)}%`;

                // Swap descriptive status text based on progress thresholds
                const activeState = [...operationalMilestones]
                    .reverse()
                    .find(step => activeMetrics >= step.marker);
                
                if (activeState && statusText.textContent !== activeState.desc) {
                    statusText.textContent = activeState.desc;
                }

                // Complete initialization natively
                if (activeMetrics >= 100) {
                    clearInterval(progressEngine);
                    setTimeout(executeTransition, 400); 
                }
            }, tickRate);

            // Outbound page forwarding transition
            function executeTransition() {
                clearInterval(progressEngine);
                const coreWrapper = document.querySelector('.z-10.w-full');
                
                // Show completion message
                if (completeMessage) {
                    completeMessage.classList.remove('opacity-0');
                }
                
                if (coreWrapper) {
                    coreWrapper.classList.add('opacity-0', 'scale-95', 'duration-500');
                }
                
                setTimeout(() => {
                    window.location.href = onlineRoute;
                }, 450);
            }
        });
    </script>
</body>
</html>
