<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAU ExamGuard - Face Verification</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            dark: '#1e3a8a',
                            active: '#2563eb',
                            light: '#f8fafc'
                        }
                    },
                    animation: {
                        'scan': 'scan 2s cubic-bezier(0.4, 0, 0.2, 1) infinite',
                    },
                    keyframes: {
                        scan: {
                            '0%, 100%': { top: '10%' },
                            '50%': { top: '90%' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Creates the darkened overlay with a clear oval cutout for the face */
        .camera-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse 140px 180px at center, transparent 95%, rgba(15, 23, 42, 0.85) 100%);
            z-index: 10;
        }
        
        /* The scanning laser line */
        .scan-line {
            position: absolute;
            left: 15%;
            right: 15%;
            height: 3px;
            background: #2563eb;
            box-shadow: 0 0 15px 3px rgba(37, 99, 235, 0.5);
            z-index: 20;
            display: none; /* Hidden by default */
        }
    </style>
</head>
<body class="bg-brand-light flex items-center justify-center min-h-screen p-4 text-slate-800">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden relative">
        
        <div class="p-6 text-center border-b border-slate-100">
            <div class="w-12 h-12 bg-brand-dark rounded-xl flex items-center justify-center mx-auto mb-3 shadow-md">
                <svg class="w-7 h-7 text-white" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>
            <h1 class="text-xl font-bold text-slate-900">Identity Verification</h1>
            <p class="text-sm text-slate-500 mt-1" id="instruction-text">Please align your face within the frame.</p>
        </div>

        <div class="relative bg-slate-900 aspect-[3/4] w-full overflow-hidden flex items-center justify-center">
            
            <video id="webcam" class="absolute w-full h-full object-cover transform scale-x-[-1]" autoplay playsinline muted></video>
            
            <div class="camera-overlay pointer-events-none"></div>

            <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-10">
                <div id="frame-guide" class="w-[280px] h-[360px] rounded-[100px] border-2 border-dashed border-white/50 transition-colors duration-300"></div>
            </div>

            <div id="scan-line" class="scan-line animate-scan"></div>

            <div id="camera-status" class="absolute inset-0 z-30 flex flex-col items-center justify-center bg-slate-900/90 text-white p-6 text-center hidden">
                <i id="status-icon" class="ph ph-spinner-gap animate-spin text-5xl mb-4 text-blue-500"></i>
                <h3 id="status-title" class="text-lg font-bold mb-1">Processing...</h3>
                <p id="status-message" class="text-xs text-slate-300">Analyzing biometric data</p>
            </div>
        </div>

        <div class="p-6 bg-white">
            <div class="flex items-start gap-3 mb-6 bg-blue-50 text-blue-800 p-4 rounded-xl text-xs leading-relaxed">
                <i class="ph-fill ph-lightbulb text-lg shrink-0 mt-0.5"></i>
                <p>Ensure you are in a well-lit environment and remove any glasses, hats, or masks before scanning.</p>
            </div>

            <button id="action-btn" onclick="startVerification()" class="w-full py-3.5 rounded-xl text-sm font-bold text-white bg-gradient-to-r from-blue-600 to-brand-dark shadow-lg shadow-blue-600/30 hover:shadow-blue-600/50 hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed">
                <i class="ph ph-scan text-lg"></i>
                <span>Capture & Verify</span>
            </button>
            
            <canvas id="canvas" class="hidden"></canvas>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const actionBtn = document.getElementById('action-btn');
        const scanLine = document.getElementById('scan-line');
        const frameGuide = document.getElementById('frame-guide');
        const instructionText = document.getElementById('instruction-text');
        
        const cameraStatus = document.getElementById('camera-status');
        const statusIcon = document.getElementById('status-icon');
        const statusTitle = document.getElementById('status-title');
        const statusMessage = document.getElementById('status-message');

        // URL to redirect to after process finishes
        const REDIRECT_URL = 'login.html'; 

        // Initialize Camera on page load
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: { ideal: 720 }, height: { ideal: 960 } } 
                });
                video.srcObject = stream;
            } catch (err) {
                console.error("Error accessing webcam:", err);
                showStatusScreen('error', 'Camera Error', 'Please allow camera permissions to continue.');
                actionBtn.disabled = true;
            }
        }

        function startVerification() {
            // 1. UI Changes for scanning state
            actionBtn.disabled = true;
            actionBtn.innerHTML = `<i class="ph ph-spinner animate-spin text-lg"></i><span>Scanning...</span>`;
            scanLine.style.display = 'block';
            frameGuide.classList.replace('border-white/50', 'border-brand-active');
            instructionText.innerText = "Hold still. Scanning your face...";

            // 2. Capture the frame (For real backend implementation)
            /*
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const base64Image = canvas.toDataURL('image/jpeg');
            // send base64Image to your API...
            */

            // 3. Simulate API Request (Wait 3 seconds)
            setTimeout(() => {
                scanLine.style.display = 'none';
                
                // Randomly simulate success or failure for demonstration purposes
                // Replace this block with your actual fetch/API response handling
                const isSuccess = Math.random() > 0.3; // 70% chance of success
                
                if (isSuccess) {
                    handleOutcome('success', 'Verification Successful', 'Identity confirmed. Redirecting...');
                } else {
                    handleOutcome('fail', 'Verification Failed', 'Face did not match records. Redirecting...');
                }

            }, 3000);
        }

        function handleOutcome(type, title, message) {
            // Stop the webcam stream to save resources
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }

            // Show status screen overlay
            showStatusScreen(type, title, message);

            // Redirect after 2.5 seconds
            setTimeout(() => {
                window.location.href = REDIRECT_URL;
            }, 2500);
        }

        function showStatusScreen(type, title, message) {
            cameraStatus.classList.remove('hidden');
            statusTitle.innerText = title;
            statusMessage.innerText = message;

            // Reset classes
            statusIcon.className = 'text-5xl mb-4 '; 

            if (type === 'success') {
                statusIcon.classList.add('ph-fill', 'ph-check-circle', 'text-emerald-500', 'animate-bounce');
                cameraStatus.classList.replace('bg-slate-900/90', 'bg-slate-900/95');
            } else if (type === 'fail' || type === 'error') {
                statusIcon.classList.add('ph-fill', 'ph-x-circle', 'text-red-500');
            } else {
                statusIcon.classList.add('ph', 'ph-spinner-gap', 'animate-spin', 'text-blue-500');
            }
        }

        // Start camera on load
        window.addEventListener('load', initCamera);

    </script>
</body>
</html>
