<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGPA Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f6bff',
                        background: '#f8fafc',
                        gradeA: '#16a34a', // green-600
                        gradeB: '#3b82f6', // blue-500
                        gradeC: '#eab308', // yellow-500
                        gradeD: '#f97316', // orange-500
                        gradeE: '#ef4444', // red-500
                        gradeF: '#b91c1c', // red-700
                    }
                }
            }
        }
    </script>
    <style>
        /* Hide scrollbar for clean UI */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        
        /* Custom styling for the select to match replica */
        .scale-select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
        }
    </style>
</head>
<body class="bg-background text-gray-800 font-sans antialiased pb-10 min-h-screen">

    <div class="max-w-md mx-auto bg-background min-h-screen relative">
        
        <header class="flex items-center justify-between p-4 bg-white border-b border-gray-100 sticky top-0 z-10">
            <div class="flex items-center gap-3">
                <div class="bg-primary text-white rounded-full flex items-center justify-center h-10 w-10 shadow-sm">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2.81-1.53.19-.11L12 3zm6.68 7.5l-6.68 3.64L5.32 10.5 12 6.86l6.68 3.64zM18 16.25l-6 3.27-6-3.27v-3.71l6 3.27 6-3.27v3.71z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-gray-900 leading-tight">CGPA Calculator</h1>
                    <p class="text-[11px] text-gray-500">Track your academic performance</p>
                </div>
            </div>
            <div>
                <select id="scale-selector" onchange="changeScale(this.value)" class="scale-select bg-white border border-gray-200 text-gray-700 text-sm rounded-xl focus:ring-primary focus:border-primary block w-[6.5rem] py-2 px-3 shadow-sm appearance-none cursor-pointer outline-none">
                    <option value="5.0">5.0 Scale</option>
                    <option value="4.0">4.0 Scale</option>
                </select>
            </div>
        </header>

        <main class="px-4">
            <div id="hero-section" class="bg-primary text-white rounded-2xl p-8 text-center mt-6 shadow-md shadow-blue-200 transition-all duration-300">
                <p class="text-xs font-bold tracking-widest text-blue-200 mb-6 uppercase">Cumulative GPA</p>
                <h2 id="total-cgpa" class="text-5xl font-bold mb-4 tracking-wider">--</h2>
                <p id="total-out-of" class="text-blue-200 text-sm">out of 5.00</p>
            </div>

            <div id="semester-summaries" class="grid grid-cols-2 gap-4 mt-6">
                </div>

            <div id="semester-inputs" class="mt-6 space-y-4">
                </div>

            <button onclick="addSemester()" class="mt-4 w-full py-3.5 rounded-xl border border-dashed border-gray-300 text-gray-500 font-medium flex items-center justify-center gap-2 hover:bg-gray-50 transition shadow-sm bg-transparent">
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Add Semester
            </button>

            <div class="bg-white rounded-2xl p-6 mt-6 border border-gray-100 shadow-sm">
                <p id="grade-reference-title" class="text-sm text-gray-500 font-semibold mb-5">Grade Reference — 5.0 Scale</p>
                <div id="grade-reference-content" class="flex flex-wrap gap-x-5 gap-y-3 text-sm">
                    </div>
            </div>

            <p class="text-center text-xs text-gray-400 mt-8 mb-4">Fill in all courses to calculate CGPA</p>
        </main>
    </div>

    <script>
        // Data & Configuration State
        let currentScale = '5.0';
        
        const scales = {
            '5.0': { A: 5.0, B: 4.0, C: 3.0, D: 2.0, E: 1.0, F: 0.0 },
            '4.0': { A: 4.0, B: 3.0, C: 2.0, D: 1.0, E: 0.5, F: 0.0 }
        };

        const gradeColors = {
            'A': 'text-gradeA', 'B': 'text-gradeB', 'C': 'text-gradeC',
            'D': 'text-gradeD', 'E': 'text-gradeE', 'F': 'text-gradeF'
        };

        let semesters = [
            { id: 1, title: 'Semester 1', courses: [{ id: 101, name: '', units: 3, grade: '' }] },
            { id: 2, title: 'Semester 2', courses: [{ id: 201, name: '', units: 3, grade: '' }] }
        ];

        // Global click listener to close dropdowns when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.custom-dropdown-container')) {
                document.querySelectorAll('.grade-dropdown-menu').forEach(menu => {
                    menu.classList.add('hidden');
                });
            }
        });

        // Initialization
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('scale-selector').value = currentScale;
            renderGradeReference();
            renderUI();
        });

        function generateId() {
            return Math.floor(Math.random() * 1000000);
        }

        function changeScale(scale) {
            currentScale = scale;
            
            // Re-evaluate grades if needed (e.g. if switching to 4.0, keep letters but math changes)
            document.getElementById('total-out-of').innerText = `out of ${scale}`;
            renderGradeReference();
            renderUI(); // Full re-render to update dropdown text values
        }

        function calculateGPA() {
            let totalPoints = 0;
            let totalUnits = 0;
            let globalIncomplete = false;

            const currentScaleValues = scales[currentScale];

            semesters.forEach(sem => {
                let semPoints = 0;
                let semUnits = 0;
                let semIncomplete = false;

                sem.courses.forEach(course => {
                    if (course.grade === '') {
                        semIncomplete = true;
                        globalIncomplete = true;
                    } else {
                        const units = parseInt(course.units) || 0;
                        semUnits += units;
                        semPoints += units * currentScaleValues[course.grade];
                    }
                });

                sem.gpa = semIncomplete || semUnits === 0 ? null : (semPoints / semUnits).toFixed(2);
                sem.status = semIncomplete ? 'incomplete' : 'completed';
                
                if (!semIncomplete) {
                    totalPoints += semPoints;
                    totalUnits += semUnits;
                }
            });

            const cgpa = globalIncomplete || totalUnits === 0 ? null : (totalPoints / totalUnits).toFixed(2);
            
            // Update UI Elements directly
            document.getElementById('total-cgpa').innerText = cgpa !== null ? cgpa : '--';
            
            semesters.forEach(sem => {
                const summaryEl = document.getElementById(`summary-gpa-${sem.id}`);
                const statusEl = document.getElementById(`summary-status-${sem.id}`);
                if (summaryEl && statusEl) {
                    summaryEl.innerText = sem.gpa !== null ? sem.gpa : '--';
                    statusEl.innerText = sem.status;
                }
            });
        }

        function updateCourseData(semId, courseId, field, value) {
            const sem = semesters.find(s => s.id === semId);
            const course = sem.courses.find(c => c.id === courseId);
            if (course) {
                course[field] = value;
                calculateGPA();
            }
        }

        function toggleDropdown(courseId, event) {
            // Prevent event from bubbling up to document click listener
            if(event) event.stopPropagation();
            
            const dropdown = document.getElementById(`dropdown-menu-${courseId}`);
            const isHidden = dropdown.classList.contains('hidden');
            
            // Close all other dropdowns first
            document.querySelectorAll('.grade-dropdown-menu').forEach(menu => {
                menu.classList.add('hidden');
            });

            // Toggle target dropdown
            if (isHidden) {
                dropdown.classList.remove('hidden');
            }
        }

        function selectGrade(semId, courseId, grade) {
            // Update data state
            updateCourseData(semId, courseId, 'grade', grade);
            
            // Update specific button UI
            const btn = document.getElementById(`dropdown-btn-${courseId}`);
            btn.innerHTML = `
                <span class="${gradeColors[grade]} font-medium">${grade}</span>
                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            `;
            
            // Hide menu
            document.getElementById(`dropdown-menu-${courseId}`).classList.add('hidden');
        }

        function addSemester() {
            semesters.push({
                id: generateId(),
                title: `Semester ${semesters.length + 1}`,
                courses: [{ id: generateId(), name: '', units: 3, grade: '' }]
            });
            renderUI();
        }

        function deleteSemester(semId) {
            semesters = semesters.filter(s => s.id !== semId);
            semesters.forEach((s, idx) => s.title = `Semester ${idx + 1}`); // Re-index
            renderUI();
        }

        function addCourse(semId) {
            const sem = semesters.find(s => s.id === semId);
            if (sem) {
                sem.courses.push({ id: generateId(), name: '', units: 3, grade: '' });
                renderUI();
            }
        }

        function deleteCourse(semId, courseId) {
            const sem = semesters.find(s => s.id === semId);
            if (sem) {
                sem.courses = sem.courses.filter(c => c.id !== courseId);
                renderUI();
            }
        }

        function renderGradeReference() {
            document.getElementById('grade-reference-title').innerText = `Grade Reference — ${currentScale} Scale`;
            
            const scaleData = scales[currentScale];
            const content = Object.keys(scaleData).map(g => `
                <div><span class="font-bold ${gradeColors[g]}">${g}</span> <span class="text-gray-500">= ${scaleData[g].toFixed(1)}</span></div>
            `).join('');
            
            document.getElementById('grade-reference-content').innerHTML = content;
        }

        function renderUI() {
            // 1. Render Summaries
            document.getElementById('semester-summaries').innerHTML = semesters.map(sem => `
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center text-center">
                    <p class="text-sm text-gray-500 mb-2">${sem.title}</p>
                    <p id="summary-gpa-${sem.id}" class="text-2xl font-bold text-gray-800 mb-1">--</p>
                    <p id="summary-status-${sem.id}" class="text-xs text-gray-500">incomplete</p>
                </div>
            `).join('');

            // 2. Render Inputs
            document.getElementById('semester-inputs').innerHTML = semesters.map(sem => `
                <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-visible mb-4">
                    <div class="flex items-center justify-between p-4 bg-white border-b border-gray-50 rounded-t-2xl">
                        <div class="flex items-center gap-3">
                            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path></svg>
                            <h3 class="font-bold text-gray-900">${sem.title}</h3>
                        </div>
                        <button onclick="deleteSemester(${sem.id})" class="text-gray-400 hover:text-red-500 transition p-1">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>

                    <div class="p-4 bg-white rounded-b-2xl overflow-visible">
                        <div class="flex gap-2 text-[11px] font-semibold text-gray-500 mb-2 px-1 tracking-wide">
                            <div class="flex-1">Course</div>
                            <div class="w-[4.5rem] text-center">Units</div>
                            <div class="w-[5.5rem] text-center">Grade</div>
                            <div class="w-8"></div>
                        </div>

                        <div class="space-y-3">
                            ${sem.courses.map(course => `
                                <div class="flex gap-2 items-center">
                                    <div class="flex-1">
                                        <input type="text" placeholder="e.g. Mathemat" 
                                            value="${course.name}"
                                            oninput="updateCourseData(${sem.id}, ${course.id}, 'name', this.value)"
                                            class="w-full border border-gray-200 rounded-xl p-2.5 text-sm focus:ring-primary focus:border-primary outline-none transition-colors">
                                    </div>
                                    <div class="w-[4.5rem]">
                                        <input type="number" min="1" max="10" 
                                            value="${course.units}"
                                            oninput="updateCourseData(${sem.id}, ${course.id}, 'units', this.value)"
                                            class="w-full border border-gray-200 rounded-xl p-2.5 text-sm text-center focus:ring-primary focus:border-primary outline-none transition-colors">
                                    </div>
                                    <div class="w-[5.5rem] relative custom-dropdown-container">
                                        <button id="dropdown-btn-${course.id}" onclick="toggleDropdown(${course.id}, event)" type="button" class="w-full flex items-center justify-between border border-gray-200 rounded-xl p-2.5 bg-white hover:bg-gray-50 transition-colors outline-none focus:border-primary focus:ring-1 focus:ring-primary">
                                            ${course.grade ? 
                                                `<span class="${gradeColors[course.grade]} font-medium">${course.grade}</span>` : 
                                                `<span class="text-gray-400">--</span>`
                                            }
                                            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                        </button>

                                        <div id="dropdown-menu-${course.id}" class="grade-dropdown-menu hidden absolute z-50 mt-1.5 w-full bg-white rounded-xl shadow-[0_4px_20px_-4px_rgba(0,0,0,0.1)] border border-gray-100 py-1.5 overflow-hidden">
                                            ${Object.keys(scales[currentScale]).map(g => `
                                                <div onclick="selectGrade(${sem.id}, ${course.id}, '${g}')" class="px-4 py-2.5 text-sm cursor-pointer hover:bg-blue-50 transition-colors ${course.grade === g ? 'bg-blue-100/50' : ''}">
                                                    <span class="${gradeColors[g]} font-medium">${g} (${scales[currentScale][g].toFixed(1)})</span>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                    <div class="w-8 flex justify-center">
                                        <button onclick="deleteCourse(${sem.id}, ${course.id})" class="text-gray-300 hover:text-red-500 transition">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                        </button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <button onclick="addCourse(${sem.id})" class="mt-4 text-[13px] text-gray-500 font-medium flex items-center gap-1.5 hover:text-gray-700 px-1 transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                            Add Course
                        </button>
                    </div>
                </div>
            `).join('');

            calculateGPA();
        }
    </script>
</body>
</html>
