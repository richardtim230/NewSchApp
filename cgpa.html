<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGPA Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f6bff',
                        background: '#f8fafc'
                    }
                }
            }
        }
    </script>
    <style>
        /* Hide scrollbar for clean UI */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
</head>
<body class="bg-background text-gray-800 font-sans antialiased pb-10 min-h-screen">

    <div class="max-w-md mx-auto bg-background min-h-screen relative">
        
        <header class="flex items-center justify-between p-4 bg-white border-b border-gray-200 sticky top-0 z-10">
            <div class="flex items-center gap-3">
                <div class="bg-primary text-white p-2 rounded-full flex items-center justify-center h-10 w-10">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2.81-1.53.19-.11L12 3zm6.68 7.5l-6.68 3.64L5.32 10.5 12 6.86l6.68 3.64zM18 16.25l-6 3.27-6-3.27v-3.71l6 3.27 6-3.27v3.71z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-gray-900 leading-tight">CGPA Calculator</h1>
                    <p class="text-xs text-gray-500">Track your academic performance</p>
                </div>
            </div>
            <div>
                <select class="bg-white border border-gray-200 text-gray-700 text-sm rounded-xl focus:ring-primary focus:border-primary block w-28 p-2 shadow-sm appearance-none cursor-pointer">
                    <option>5.0 Scale</option>
                    <option>4.0 Scale</option>
                </select>
            </div>
        </header>

        <main class="px-4">
            <div class="bg-primary text-white rounded-2xl p-8 text-center mt-6 shadow-md shadow-blue-200">
                <p class="text-xs font-bold tracking-widest text-blue-200 mb-6 uppercase">Cumulative GPA</p>
                <h2 id="total-cgpa" class="text-5xl font-bold mb-4 tracking-wider">--</h2>
                <p class="text-blue-200 text-sm">out of 5.00</p>
            </div>

            <div id="semester-summaries" class="grid grid-cols-2 gap-4 mt-6">
                </div>

            <div id="semester-inputs" class="mt-6 space-y-4">
                </div>

            <button onclick="addSemester()" class="mt-4 w-full py-3.5 rounded-xl border border-gray-200 text-gray-500 font-medium flex items-center justify-center gap-2 hover:bg-gray-100 transition shadow-sm bg-background">
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Add Semester
            </button>

            <div class="bg-white rounded-2xl p-6 mt-6 border border-gray-100 shadow-sm">
                <p class="text-sm text-gray-500 font-semibold mb-5">Grade Reference — 5.0 Scale</p>
                <div class="flex flex-wrap gap-4 text-sm">
                    <div><span class="font-bold text-green-600">A</span> <span class="text-gray-500">= 5.0</span></div>
                    <div><span class="font-bold text-blue-600">B</span> <span class="text-gray-500">= 4.0</span></div>
                    <div><span class="font-bold text-yellow-500">C</span> <span class="text-gray-500">= 3.0</span></div>
                    <div><span class="font-bold text-orange-500">D</span> <span class="text-gray-500">= 2.0</span></div>
                    <div><span class="font-bold text-red-500">E</span> <span class="text-gray-500">= 1.0</span></div>
                    <div><span class="font-bold text-red-700">F</span> <span class="text-gray-500">= 0.0</span></div>
                </div>
            </div>

            <p class="text-center text-xs text-gray-400 mt-8 mb-4">Fill in all courses to calculate CGPA</p>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>

    <script>
        // Data State
        let semesters = [
            { id: 1, title: 'Semester 1', courses: [{ id: 101, name: '', units: 3, grade: '' }] },
            { id: 2, title: 'Semester 2', courses: [{ id: 201, name: '', units: 3, grade: '' }] }
        ];

        const gradeValues = { 'A': 5.0, 'B': 4.0, 'C': 3.0, 'D': 2.0, 'E': 1.0, 'F': 0.0 };

        // Initialization
        document.addEventListener('DOMContentLoaded', () => {
            renderUI();
        });

        function generateId() {
            return Math.floor(Math.random() * 100000);
        }

        function calculateGPA() {
            let totalPoints = 0;
            let totalUnits = 0;
            let globalIncomplete = false;

            semesters.forEach(sem => {
                let semPoints = 0;
                let semUnits = 0;
                let semIncomplete = false;

                sem.courses.forEach(course => {
                    if (course.grade === '') {
                        semIncomplete = true;
                        globalIncomplete = true;
                    } else {
                        const units = parseInt(course.units) || 0;
                        semUnits += units;
                        semPoints += units * gradeValues[course.grade];
                    }
                });

                sem.gpa = semIncomplete || semUnits === 0 ? null : (semPoints / semUnits).toFixed(2);
                sem.status = semIncomplete ? 'incomplete' : 'completed';
                
                if (!semIncomplete) {
                    totalPoints += semPoints;
                    totalUnits += semUnits;
                }
            });

            const cgpa = globalIncomplete || totalUnits === 0 ? null : (totalPoints / totalUnits).toFixed(2);
            
            // Update UI Elements directly to maintain input focus
            document.getElementById('total-cgpa').innerText = cgpa !== null ? cgpa : '--';
            
            semesters.forEach((sem, index) => {
                const summaryEl = document.getElementById(`summary-gpa-${sem.id}`);
                const statusEl = document.getElementById(`summary-status-${sem.id}`);
                if (summaryEl && statusEl) {
                    summaryEl.innerText = sem.gpa !== null ? sem.gpa : '--';
                    statusEl.innerText = sem.status;
                }
            });
        }

        function updateCourseData(semId, courseId, field, value) {
            const sem = semesters.find(s => s.id === semId);
            const course = sem.courses.find(c => c.id === courseId);
            if (course) {
                course[field] = value;
                calculateGPA();
            }
        }

        function addSemester() {
            const newId = generateId();
            semesters.push({
                id: newId,
                title: `Semester ${semesters.length + 1}`,
                courses: [{ id: generateId(), name: '', units: 3, grade: '' }]
            });
            renderUI();
        }

        function deleteSemester(semId) {
            semesters = semesters.filter(s => s.id !== semId);
            // Re-index titles
            semesters.forEach((s, idx) => s.title = `Semester ${idx + 1}`);
            renderUI();
        }

        function addCourse(semId) {
            const sem = semesters.find(s => s.id === semId);
            if (sem) {
                sem.courses.push({ id: generateId(), name: '', units: 3, grade: '' });
                renderUI();
            }
        }

        function deleteCourse(semId, courseId) {
            const sem = semesters.find(s => s.id === semId);
            if (sem) {
                sem.courses = sem.courses.filter(c => c.id !== courseId);
                renderUI();
            }
        }

        function renderUI() {
            // Render Summaries
            const summariesContainer = document.getElementById('semester-summaries');
            summariesContainer.innerHTML = semesters.map(sem => `
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center text-center">
                    <p class="text-sm text-gray-500 mb-2">${sem.title}</p>
                    <p id="summary-gpa-${sem.id}" class="text-2xl font-bold text-gray-800 mb-1">--</p>
                    <p id="summary-status-${sem.id}" class="text-xs text-gray-500">incomplete</p>
                </div>
            `).join('');

            // Render Inputs
            const inputsContainer = document.getElementById('semester-inputs');
            inputsContainer.innerHTML = semesters.map(sem => `
                <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden mb-4">
                    <div class="flex items-center justify-between p-4 bg-white border-b border-gray-50 cursor-pointer">
                        <div class="flex items-center gap-3">
                            <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path></svg>
                            <h3 class="font-bold text-gray-900">${sem.title}</h3>
                        </div>
                        <button onclick="deleteSemester(${sem.id})" class="text-gray-400 hover:text-red-500 transition p-1">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>

                    <div class="p-4 bg-white">
                        <div class="flex gap-2 text-xs font-semibold text-gray-500 mb-2 px-1">
                            <div class="flex-1">Course</div>
                            <div class="w-20 text-center">Units</div>
                            <div class="w-20 text-center">Grade</div>
                            <div class="w-8"></div>
                        </div>

                        <div class="space-y-3">
                            ${sem.courses.map(course => `
                                <div class="flex gap-2 items-center">
                                    <div class="flex-1">
                                        <input type="text" placeholder="e.g. Mathemat" 
                                            value="${course.name}"
                                            oninput="updateCourseData(${sem.id}, ${course.id}, 'name', this.value)"
                                            class="w-full border border-gray-200 rounded-xl p-2.5 text-sm focus:ring-primary focus:border-primary">
                                    </div>
                                    <div class="w-20">
                                        <input type="number" min="1" max="10" 
                                            value="${course.units}"
                                            oninput="updateCourseData(${sem.id}, ${course.id}, 'units', this.value)"
                                            class="w-full border border-gray-200 rounded-xl p-2.5 text-sm text-center focus:ring-primary focus:border-primary">
                                    </div>
                                    <div class="w-20">
                                        <select onchange="updateCourseData(${sem.id}, ${course.id}, 'grade', this.value)"
                                            class="w-full border border-gray-200 rounded-xl p-2.5 text-sm text-center focus:ring-primary focus:border-primary appearance-none bg-white">
                                            <option value="" ${course.grade === '' ? 'selected' : ''}>--</option>
                                            <option value="A" ${course.grade === 'A' ? 'selected' : ''}>A</option>
                                            <option value="B" ${course.grade === 'B' ? 'selected' : ''}>B</option>
                                            <option value="C" ${course.grade === 'C' ? 'selected' : ''}>C</option>
                                            <option value="D" ${course.grade === 'D' ? 'selected' : ''}>D</option>
                                            <option value="E" ${course.grade === 'E' ? 'selected' : ''}>E</option>
                                            <option value="F" ${course.grade === 'F' ? 'selected' : ''}>F</option>
                                        </select>
                                    </div>
                                    <div class="w-8 flex justify-center">
                                        <button onclick="deleteCourse(${sem.id}, ${course.id})" class="text-gray-300 hover:text-red-500 transition">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                        </button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <button onclick="addCourse(${sem.id})" class="mt-4 text-sm text-gray-500 font-medium flex items-center gap-2 hover:text-gray-700 px-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                            Add Course
                        </button>
                    </div>
                </div>
            `).join('');

            calculateGPA();
        }
    </script>
</body>
</html>
