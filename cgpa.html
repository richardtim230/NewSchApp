<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGPA Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f6bff',
                        background: '#f8fafc',
                        card: '#ffffff'
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'dropdown': '0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1)'
                    }
                }
            }
        }
    </script>
    <style>
        /* Hide scrollbar for a cleaner mobile app feel */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        
        /* Remove number input arrows */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none; margin: 0;
        }
        input[type="number"] { -moz-appearance: textfield; }
    </style>
</head>
<body class="bg-background text-gray-800 font-sans antialiased min-h-screen pb-12">

    <div class="max-w-md mx-auto min-h-screen relative">
        
        <header class="flex items-center justify-between p-4 bg-white border-b border-gray-100 sticky top-0 z-20">
            <div class="flex items-center gap-3">
                <div class="bg-primary text-white p-2 rounded-full flex items-center justify-center h-10 w-10">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2.81-1.53.19-.11L12 3zm6.68 7.5l-6.68 3.64L5.32 10.5 12 6.86l6.68 3.64zM18 16.25l-6 3.27-6-3.27v-3.71l6 3.27 6-3.27v3.71z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-gray-900 leading-tight">CGPA Calculator</h1>
                    <p class="text-[11px] text-gray-500">Track your academic performance</p>
                </div>
            </div>
            <div>
                <select id="scale-selector" onchange="changeScale(this.value)" class="bg-white border border-gray-200 text-gray-600 text-sm rounded-xl focus:ring-primary focus:border-primary block w-28 p-2 shadow-sm cursor-pointer outline-none">
                    <option value="5.0">5.0 Scale</option>
                    <option value="4.0">4.0 Scale</option>
                </select>
            </div>
        </header>

        <main class="px-4 mt-6">
            
            <div id="cgpa-display-container" class="hidden bg-primary text-white rounded-3xl p-8 text-center mb-6 shadow-md shadow-blue-200">
                <p class="text-xs font-bold tracking-widest text-blue-200 mb-6 uppercase">Cumulative GPA</p>
                <h2 id="total-cgpa" class="text-5xl font-bold mb-4 tracking-wider">--</h2>
                <p id="total-cgpa-scale" class="text-blue-200 text-sm">out of 5.00</p>
            </div>

            <div id="semester-summaries" class="hidden grid-cols-2 gap-4 mb-6"></div>

            <div id="semester-inputs" class="space-y-4">
                </div>

            <button onclick="addSemester()" class="mt-4 w-full py-3.5 rounded-2xl border border-gray-200 text-gray-500 text-sm font-medium flex items-center justify-center gap-2 hover:bg-gray-50 transition bg-transparent border-dashed">
                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Add Semester
            </button>

            <div class="bg-white rounded-3xl p-6 mt-6 border border-gray-100 shadow-soft">
                <p id="reference-title" class="text-sm text-gray-500 font-semibold mb-5">Grade Reference — 5.0 Scale</p>
                <div id="reference-values" class="flex flex-wrap gap-4 text-sm">
                    </div>
            </div>

            <p class="text-center text-[11px] text-gray-400 mt-8 mb-4">Fill in all courses to calculate CGPA</p>
        </main>
    </div>

    <script>
        // App State
        let currentScale = '5.0';
        
        const scaleValues = {
            '5.0': { 'A': '5.0', 'B': '4.0', 'C': '3.0', 'D': '2.0', 'E': '1.0', 'F': '0.0' },
            '4.0': { 'A': '4.0', 'B': '3.0', 'C': '2.0', 'D': '1.0', 'E': '0.5', 'F': '0.0' }
        };

        const gradeColors = {
            'A': 'text-[#059669]', // Green
            'B': 'text-[#2563eb]', // Blue
            'C': 'text-[#d97706]', // Yellow/Gold
            'D': 'text-[#ea580c]', // Orange
            'E': 'text-[#ef4444]', // Red
            'F': 'text-[#b91c1c]'  // Dark Red
        };

        const dropdownGradeColors = {
            'A': 'text-[#3b82f6]', // The screenshot shows A as blue in the dropdown specifically
            'B': 'text-[#2563eb]', 
            'C': 'text-[#d97706]', 
            'D': 'text-[#ea580c]', 
            'E': 'text-[#ef4444]', 
            'F': 'text-[#b91c1c]'  
        };

        let semesters = [
            { id: 1, title: 'Semester 1', expanded: true, courses: [{ id: 101, name: '', units: 3, grade: '' }] },
            { id: 2, title: 'Semester 2', expanded: true, courses: [{ id: 201, name: '', units: 3, grade: '' }] }
        ];

        let activeDropdown = null;

        // Initialization
        document.addEventListener('DOMContentLoaded', () => {
            renderUI();
            
            // Close custom dropdowns when clicking outside
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.custom-dropdown-container')) {
                    closeAllDropdowns();
                }
            });
        });

        function generateId() {
            return Math.floor(Math.random() * 100000);
        }

        function changeScale(scale) {
            currentScale = scale;
            renderUI();
        }

        function toggleDropdown(id, event) {
            event.stopPropagation();
            if (activeDropdown === id) {
                closeAllDropdowns();
            } else {
                closeAllDropdowns();
                document.getElementById(`dropdown-menu-${id}`).classList.remove('hidden');
                activeDropdown = id;
            }
        }

        function closeAllDropdowns() {
            document.querySelectorAll('.dropdown-menu-list').forEach(el => el.classList.add('hidden'));
            activeDropdown = null;
        }

        function selectGrade(semId, courseId, grade) {
            const sem = semesters.find(s => s.id === semId);
            const course = sem.courses.find(c => c.id === courseId);
            if (course) {
                course.grade = grade;
                closeAllDropdowns();
                renderUI();
            }
        }

        function updateCourseData(semId, courseId, field, value) {
            const sem = semesters.find(s => s.id === semId);
            const course = sem.courses.find(c => c.id === courseId);
            if (course) {
                course[field] = value;
                // No need to re-render whole UI for text input, just update state
            }
        }

        function toggleSemester(semId) {
            const sem = semesters.find(s => s.id === semId);
            if (sem) {
                sem.expanded = !sem.expanded;
                renderUI();
            }
        }

        function addSemester() {
            const newId = generateId();
            semesters.push({
                id: newId,
                title: `Semester ${semesters.length + 1}`,
                expanded: true,
                courses: [{ id: generateId(), name: '', units: 3, grade: '' }]
            });
            renderUI();
        }

        function deleteSemester(semId, event) {
            event.stopPropagation();
            semesters = semesters.filter(s => s.id !== semId);
            semesters.forEach((s, idx) => s.title = `Semester ${idx + 1}`);
            renderUI();
        }

        function addCourse(semId) {
            const sem = semesters.find(s => s.id === semId);
            if (sem) {
                sem.courses.push({ id: generateId(), name: '', units: 3, grade: '' });
                renderUI();
            }
        }

        function deleteCourse(semId, courseId) {
            const sem = semesters.find(s => s.id === semId);
            if (sem) {
                sem.courses = sem.courses.filter(c => c.id !== courseId);
                renderUI();
            }
        }

        function renderUI() {
            renderInputs();
            renderGradeReference();
        }

        function renderGradeReference() {
            const titleEl = document.getElementById('reference-title');
            const valuesEl = document.getElementById('reference-values');
            
            titleEl.innerText = `Grade Reference — ${currentScale} Scale`;
            
            const scales = scaleValues[currentScale];
            valuesEl.innerHTML = Object.keys(scales).map(grade => `
                <div><span class="font-bold ${gradeColors[grade]}">${grade}</span> <span class="text-gray-500">= ${scales[grade]}</span></div>
            `).join('');
        }

        function renderInputs() {
            const container = document.getElementById('semester-inputs');
            
            container.innerHTML = semesters.map(sem => `
                <div class="bg-white rounded-3xl border border-gray-100 shadow-soft overflow-hidden mb-4">
                    
                    <div onclick="toggleSemester(${sem.id})" class="flex items-center justify-between p-5 bg-white cursor-pointer ${sem.expanded ? '' : 'border-b-0'}">
                        <div class="flex items-center gap-3">
                            <svg class="w-4 h-4 text-gray-500 transition-transform ${sem.expanded ? 'rotate-180' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            <h3 class="font-bold text-gray-900 text-[15px]">${sem.title}</h3>
                        </div>
                        <button onclick="deleteSemester(${sem.id}, event)" class="text-gray-400 hover:text-red-500 transition p-1">
                            <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>

                    <div class="${sem.expanded ? 'block' : 'hidden'} px-5 pb-5 bg-white">
                        
                        <div class="flex gap-2 text-[11px] font-semibold text-gray-500 mb-2 px-1">
                            <div class="flex-1">Course</div>
                            <div class="w-16 text-center">Units</div>
                            <div class="w-[88px]">Grade</div>
                            <div class="w-6"></div>
                        </div>

                        <div class="space-y-3">
                            ${sem.courses.map(course => `
                                <div class="flex gap-3 items-center">
                                    <div class="flex-1">
                                        <input type="text" placeholder="e.g. Mathemat" 
                                            value="${course.name}"
                                            oninput="updateCourseData(${sem.id}, ${course.id}, 'name', this.value)"
                                            class="w-full border border-gray-200 rounded-xl p-3 text-sm focus:ring-primary focus:border-primary placeholder-gray-400 text-gray-700 outline-none transition shadow-sm">
                                    </div>
                                    <div class="w-16">
                                        <input type="number" min="1" max="10" 
                                            value="${course.units}"
                                            oninput="updateCourseData(${sem.id}, ${course.id}, 'units', this.value)"
                                            class="w-full border border-gray-200 rounded-xl p-3 text-sm text-center focus:ring-primary focus:border-primary text-gray-700 outline-none transition shadow-sm">
                                    </div>
                                    
                                    <div class="w-[88px] relative custom-dropdown-container">
                                        <button onclick="toggleDropdown('${sem.id}-${course.id}', event)" 
                                            class="w-full border border-gray-200 rounded-xl p-3 text-sm flex justify-between items-center bg-white shadow-sm hover:border-gray-300 transition text-gray-600 outline-none">
                                            <span>${course.grade === '' ? '--' : course.grade}</span>
                                            <svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                        </button>
                                        
                                        <ul id="dropdown-menu-${sem.id}-${course.id}" class="dropdown-menu-list hidden absolute z-50 w-32 left-0 mt-1 bg-white border border-gray-100 rounded-2xl shadow-dropdown py-1.5 overflow-hidden">
                                            ${Object.keys(scaleValues[currentScale]).map(grade => {
                                                const isSelected = course.grade === grade;
                                                return `
                                                <li onclick="selectGrade(${sem.id}, ${course.id}, '${grade}')" 
                                                    class="px-4 py-2 text-[13px] cursor-pointer flex items-center transition 
                                                    ${isSelected ? 'bg-blue-100/50' : 'hover:bg-gray-50'}">
                                                    <span class="${dropdownGradeColors[grade]}">${grade} (${scaleValues[currentScale][grade]})</span>
                                                </li>
                                            `}).join('')}
                                        </ul>
                                    </div>

                                    <div class="w-6 flex justify-end">
                                        <button onclick="deleteCourse(${sem.id}, ${course.id})" class="text-gray-300 hover:text-gray-500 transition">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                        </button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <button onclick="addCourse(${sem.id})" class="mt-5 text-[13px] text-gray-500 font-medium flex items-center gap-2 hover:text-gray-800 transition px-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                            Add Course
                        </button>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
