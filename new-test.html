    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            dark: '#1e3a8a',
                            active: '#2563eb',
                            accent: '#3b82f6',
                            light: '#f8fafc'

                    },
                    boxShadow: {
                        'premium': '0 2px 10px -3px rgba(0,0,0,0.05), 0 4px 6px -4px rgba(0,0,0,0.02)',

        }
    </script>

    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }

        .matrix-btn-answered { border-color: #2563eb; background-color: #eff6ff; color: #1d4ed8; font-weight: 600; }
        .matrix-btn-flagged { border-color: #eab308; background-color: #fef9c3; color: #a16207; font-weight: 600; }

        </header>

        <!-- Main Examination Core Workspace Split -->

            <!-- Left Pane Viewport Container Wrapper -->

                <!-- Scrollable Main Canvas Body Space -->
                <main class="flex-1 overflow-y-auto px-4 lg:px-8 pt-6 pb-28 bg-[#f8fafc] w-full">
                    
                    <!-- ADAPTIVE BRANDING ASSIGNMENT: Injected under Header on Mobile/Tablet screens -->

                    <!-- Primary Question Card Canvas Area -->

            <!-- Right Grid Pane: Desktop Tracking Sidebar Dashboard -->
            <aside class="hidden lg:flex w-[320px] bg-white border-l border-slate-200 h-full flex-col shrink-0 overflow-hidden">
                
                <!-- ADAPTIVE BRANDING ASSIGNMENT -->
                <div class="p-5 border-b border-slate-100 bg-slate-50/20" id="desktopBrandingPlaceholder"></div>

                <!-- Collapsible Header Section for the Question Tracking Matrix Pallets -->
                <div class="px-5 py-4 border-b border-slate-100 bg-slate-50/50">
                    <button onclick="toggleDesktopPaletteDisplay()" class="w-full flex items-center justify-between text-sm font-bold text-slate-900 hover:text-brand-active transition-colors focus:outline-none group">
                        <span class="flex items-center gap-2 text-slate-700 group-hover:text-brand-dark">
                            <i class="ph-fill ph-grid text-brand-active text-base"></i> Navigation Overview
                        </span>
                        <div class="flex items-center gap-1">
                            <span class="text-[10px] bg-slate-200 text-slate-600 font-bold px-1.5 py-0.5 rounded" id="badgeMiniCount">0/0</span>
                            <i id="paletteChevronIcon" class="ph-bold ph-caret-down text-slate-400 transition-transform duration-200"></i>
                        </div>
                    </button>
                    <p class="text-[11px] text-slate-400 font-medium mt-1.5 hidden" id="paletteHelperText">Click a cell number to switch slots instantly.</p>

                <!-- Scrollable Grid Sheet mapping layout layer framework components -->
                <div class="flex-1 overflow-y-auto p-5 transition-all duration-300 hidden bg-slate-50/30" id="desktopPaletteDrawerWrapper">
                    <div class="grid grid-cols-5 gap-2" id="desktopMatrixGrid">

                    </div>
                </div>

                <!-- Sticky Footer actions layout layer framework buttons -->
                <div class="p-5 border-t border-slate-100 bg-white space-y-3 shrink-0">
                    <div class="grid grid-cols-2 gap-2 text-[11px] font-semibold text-slate-500 pb-2">

                        <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded bg-yellow-100 border border-yellow-400 block"></span> <span id="lblCountFlagged">0 Flagged</span></div>
                    </div>
                    <button onclick="triggerExamSubmission()" id="btnSubmitDesktop" class="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-bold text-sm rounded-xl transition-all shadow-md flex items-center justify-center gap-2 tracking-wide">
                        <i class="ph-bold ph-cloud-arrow-up text-base"></i> Submit Examination

        <!-- Mobile Drawer Action Bar Layout module -->
        <div class="lg:hidden bg-white border-t border-slate-200 h-16 shrink-0 flex items-center justify-between px-4 z-30 shadow-floating">
            <button data-drawer-target="mobileMatrixDrawer" data-drawer-toggle="mobileMatrixDrawer" class="flex items-center gap-2 bg-slate-100 px-3 py-2 rounded-xl text-slate-700 text-xs font-bold transition-all hover:bg-slate-200">
                <i class="ph-bold ph-squares-four text-base"></i> Overview Map (<span id="mobileCountSummary">0/0</span>)
            </button>
            <button onclick="triggerExamSubmission()" id="btnSubmitMobile" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition-all flex items-center gap-1.5 shadow-sm">
                Submit Exam
            </button>
        </div>

    <!-- Mobile Drawer Panel Canvas Overlay Content Sheet -->
    <div id="mobileMatrixDrawer" class="fixed bottom-0 left-0 right-0 z-40 w-full p-4 transition-transform translate-y-full bg-white rounded-t-3xl border-t border-slate-200 h-[60vh] max-h-[60vh] overflow-hidden flex flex-col" tabindex="-1">
        <div class="flex items-center justify-between pb-3 border-b border-slate-100 shrink-0">
            <h5 class="text-sm font-bold text-slate-800 uppercase tracking-wider flex items-center gap-2"><i class="ph ph-list-numbers text-brand-active text-lg"></i> Question Overview Map</h5>
            <button type="button" data-drawer-hide="mobileMatrixDrawer" class="text-slate-400 bg-transparent hover:bg-slate-100 hover:text-slate-900 rounded-lg text-sm w-8 h-8 inline-flex items-center justify-center">
                <i class="ph ph-x text-xl"></i>
            </button>
        </div>

    <!-- PREMIUM HIGH-FIDELITY ALERT & CONFIRM DIALOG MODAL FRAMEWORK -->
    <div id="customNotifyModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm hidden transition-all duration-200 opacity-0 animate-fade-in" tabindex="-1">
        <div class="bg-white rounded-2xl max-w-md w-full shadow-floating border border-slate-100 overflow-hidden transform scale-95 transition-all duration-200 ease-out" id="modalCardBody">
            <div class="p-6">
                <div class="flex items-start gap-4">
                    <div id="modalIconContainer" class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0">
                        <!-- Contextual Icon Injected via Execution Engines -->
                    </div>
                    <div class="flex-1 min-w-0">
                        <h3 id="modalTitle" class="text-base font-bold text-slate-900 mb-1">Notification</h3>
                        <p id="modalBody" class="text-sm text-slate-600 leading-relaxed whitespace-pre-line"></p>
                    </div>
                </div>
            </div>
            <div class="bg-slate-50/80 border-t border-slate-100 px-6 py-4 flex items-center justify-end gap-3" id="modalActions">
                <!-- Dynamic control loops injected natively -->
            </div>
        </div>
    </div>

    <!-- REUSABLE OAU BRANDING ASSET ELEMENT TEMPLATE -->
    <template id="oauBrandingCardTemplate">
        <div class="bg-gradient-to-br from-brand-dark to-blue-900 text-white p-4 rounded-2xl shadow-premium border border-white/10 w-full flex items-center gap-3.5">
            <!-- UPDATED LOGO IMAGE CONTAINER IN TEMPLATE -->
            <div class="w-12 h-12 bg-white rounded-xl flex items-center justify-center p-1.5 shadow-inner shrink-0 overflow-hidden">
                <img src="logo.png" alt="OAU Logo" class="w-full h-full object-contain" />
            </div>
            <div class="min-w-0 flex-1">
                <h4 class="text-[10px] lg:text-xs font-bold text-amber-400 uppercase tracking-widest leading-none mb-1 truncate">Obafemi Awolowo University</h4>
                <h3 class="text-sm font-bold text-white tracking-wide truncate" id="brandingExamTitle">Central Mock Test</h3>
                <p class="text-[10px] text-blue-200 font-medium mt-0.5 opacity-90">Computer Based Testing Centre</p>
            </div>
        </div>
    </template>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
    <script>
        // === CONFIG CONSTANTS ===
        const API_URL = "https://examguide.onrender.com/api/";
        const BACKEND_URL = "https://examguard-jmjv.onrender.com";
        const token = localStorage.getItem("token");
        
        // === CORE ENGINE STATE SYSTEM ===
        let examSessionState = {
            examTitle: "CBT Examination",
            examSetId: null,
            paletteExpanded: false,
            currentUser: "Guest",
            currentUserId: null,
            timeRemaining: 40 * 60, 
            maxSessionQuestions: 60,
            currentQuestionIndex: 0,
            questions: [],
            answers: {},  
            flags: {}     
        };

        let countdownTimerInterval = null;
        let modalConfirmCallback = null;
        let modalCloseCallback = null;

        // --- URL Query Parameter Parsing Utilities ---
        function getQueryParam(name) {
            const url = new URL(window.location.href);
            return url.searchParams.get(name);
        }

        // === ENGINE INITIALIZATION HOOK ===
        async function initializeSessionEngine() {
            injectAdaptiveBrandingCards();
            examSessionState.examSetId = getQueryParam('examSet');
            await fetchCurrentUserSession();
            await downloadExamQuestionsPayload();
        }

        // === ASYNC BACKEND ROUTING OPERATIONS ===
        async function fetchCurrentUserSession() {
            if (!token) {
                window.location.href = "mock.html";
                return;
            }
            try {
                const resp = await fetch(API_URL + "auth/me", {
                    headers: { Authorization: "Bearer " + token }
                });
                const data = await resp.json();
                if (resp.ok && data.user && data.user.username) {
                    examSessionState.currentUser = data.user.username;
                    examSessionState.currentUserId = data.user._id || data.user.id;
                    document.getElementById('headerStudentProfile').innerText = 
                        `CANDIDATE: ${examSessionState.currentUser} • ID: ${examSessionState.currentUserId || 'N/A'}`;
                } else {
                    localStorage.removeItem('token');
                    window.location.href = "mock.html";
                }
            } catch (e) {
                localStorage.removeItem('token');
                window.location.href = "mock.html";
            }
        }

        async function downloadExamQuestionsPayload() {
            if (!examSessionState.examSetId) {
                renderVisualErrorCanvas("No Exam Set Reference Specified inside Endpoint Parameter Queries.");
                return;
            }

            try {
                const res = await fetch(`${API_URL}questionsets/${examSessionState.examSetId}`, {
                    headers: { Authorization: "Bearer " + token }
                });
                if (!res.ok) throw new Error("Cloud synchronization failure returned on question packet stream.");
                
                const activeSet = await res.json();
                if (!activeSet || !activeSet.questions || activeSet.questions.length === 0) {
                    renderVisualErrorCanvas("Target Question Set parameters contains null or zero elements inside server arrays.");
                    return;
                }

                examSessionState.examTitle = activeSet.title || "CBT Test";
                document.getElementById('headerExamTitle').innerText = examSessionState.examTitle;
                
                const desktopBrandingTitle = document.querySelector("#desktopBrandingPlaceholder #brandingExamTitle");
                const mobileBrandingTitle = document.querySelector("#mobileBrandingPlaceholder #brandingExamTitle");
                if (desktopBrandingTitle) desktopBrandingTitle.innerText = examSessionState.examTitle;
                if (mobileBrandingTitle) mobileBrandingTitle.innerText = examSessionState.examTitle;

                const allQuestions = activeSet.questions.slice();

                let answeredIds = [];
                try {
                    const progressRes = await fetch(`${API_URL}progress?examSet=${encodeURIComponent(examSessionState.examTitle)}`, {
                        headers: { Authorization: "Bearer " + token }
                    });
                    if (progressRes.ok) {
                        const { progress } = await progressRes.json();
                        if (progress && Array.isArray(progress.answeredIds)) {
                            answeredIds = progress.answeredIds;
                        }
                    }
                } catch (progressError) { /* Treat as empty history */ }

                let unseenQuestions = allQuestions.filter(q => !answeredIds.includes(q.id));
                if (unseenQuestions.length === 0) unseenQuestions = allQuestions.slice();

                examSessionState.questions = shuffleArray(unseenQuestions).slice(0, examSessionState.maxSessionQuestions);
                examSessionState.answers = {};
                examSessionState.flags = {};
                examSessionState.currentQuestionIndex = 0;
                examSessionState.timeRemaining = 40 * 60; 

                buildQuestionNavigationMatrices();
                renderActiveQuestionCanvas();
                startSessionCountdownMetronome();

            } catch (err) {
                console.error(err);
                renderVisualErrorCanvas("Failed to synchronize examination vectors. Verify cloud connectivity and trace endpoints.");
            }
        }

        async function markQuizTaskDoneOnServer(userId, quizId) {
            const today = new Date();
            const dateStr = `${today.getFullYear()}-${(today.getMonth()+1).toString().padStart(2,"0")}-${today.getDate().toString().padStart(2,"0")}`;
            try {
                await fetch(`${BACKEND_URL}/api/users/${userId}/daily-tasks`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        Authorization: 'Bearer ' + (localStorage.getItem("token") || "")
                    },
                    body: JSON.stringify({ date: dateStr, taskId: `quiz-${quizId}` })
                });
            } catch (e) { /* fail silently */ }
        }

        // === CUSTOM INTERACTIVE DIALOG MODAL LAYOUT ENGINE ===
        function openNotifyModal() {
            const modal = document.getElementById('customNotifyModal');
            const card = document.getElementById('modalCardBody');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                card.classList.remove('scale-95');
            }, 10);
        }

        function closeNotifyModal(callbackExecutionBranch = null) {
            const modal = document.getElementById('customNotifyModal');
            const card = document.getElementById('modalCardBody');
            modal.classList.add('opacity-0');
            card.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                if (callbackExecutionBranch) callbackExecutionBranch();
            }, 200);
        }

        function showCustomAlert(title, message, iconVariant = 'info', onCloseCallback = null) {
            modalCloseCallback = onCloseCallback;
            
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerText = message;
            
            const iconBox = document.getElementById('modalIconContainer');
            iconBox.className = "w-10 h-10 rounded-xl flex items-center justify-center shrink-0";
            
            if (iconVariant === 'success') {
                iconBox.classList.add('bg-emerald-50', 'text-emerald-600');
                iconBox.innerHTML = `<i class="ph-bold ph-check-circle text-xl"></i>`;
            } else if (iconVariant === 'warning') {
                iconBox.classList.add('bg-amber-50', 'text-amber-600');
                iconBox.innerHTML = `<i class="ph-bold ph-warning text-xl"></i>`;
            } else if (iconVariant === 'error') {
                iconBox.classList.add('bg-red-50', 'text-red-600');
                iconBox.innerHTML = `<i class="ph-bold ph-x-circle text-xl"></i>`;
            } else {
                iconBox.classList.add('bg-blue-50', 'text-brand-active');
                iconBox.innerHTML = `<i class="ph-bold ph-info text-xl"></i>`;
            }

            document.getElementById('modalActions').innerHTML = `
                <button onclick="closeNotifyModal(modalCloseCallback)" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs rounded-xl transition-all shadow-sm">
                    Acknowledge
                </button>
            `;
            openNotifyModal();
        }

        function showCustomConfirm(title, message, onConfirm, onCancel = null) {
            modalConfirmCallback = onConfirm;
            modalCloseCallback = onCancel;

            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerText = message;

            const iconBox = document.getElementById('modalIconContainer');
            iconBox.className = "w-10 h-10 rounded-xl flex items-center justify-center shrink-0 bg-blue-50 text-brand-active";
            iconBox.innerHTML = `<i class="ph-bold ph-question text-xl"></i>`;

            document.getElementById('modalActions').innerHTML = `
                <button onclick="closeNotifyModal(modalCloseCallback)" class="px-4 py-2.5 border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 font-bold text-xs rounded-xl transition-all">
                    Cancel
                </button>
                <button onclick="closeNotifyModal(modalConfirmCallback)" class="px-4 py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold text-xs rounded-xl transition-all shadow-sm">
                    Confirm Submission
                </button>
            `;
            openNotifyModal();
        }

        // === RENDERING & CANVAS LAYOUT FLOW MANAGEMENT ===
        function renderVisualErrorCanvas(msgString) {
            document.getElementById('headerExamTitle').innerText = "System Synchronization Suspended";
            document.getElementById('canvasQuestionPrompt').innerHTML = `<span class="text-red-600 font-semibold flex items-center gap-2"><i class="ph-bold ph-warning-circle text-xl"></i> ${msgString}</span>`;
            document.getElementById('canvasOptionsContainer').innerHTML = `
                <p class="text-xs text-slate-500 leading-relaxed">Please verify your dashboard path queries, re-authenticate your secure user login configurations, or contact the Computer Based Testing Centre administrative routing infrastructure layers immediately.</p>
            `;
            document.getElementById('btnNext').disabled = true;
            document.getElementById('btnPrev').disabled = true;
            document.getElementById('btnFlag').disabled = true;
            document.getElementById('liveCountdown').innerText = "ERR!";
        }

        function injectAdaptiveBrandingCards() {
            const template = document.getElementById('oauBrandingCardTemplate');
            
            const mobileClone = template.content.cloneNode(true);
            const mContainer = document.getElementById('mobileBrandingPlaceholder');
            mContainer.appendChild(mobileClone);
            mContainer.classList.add("mb-5");

            const desktopClone = template.content.cloneNode(true);
            document.getElementById('desktopBrandingPlaceholder').appendChild(desktopClone);
        }

        function toggleDesktopPaletteDisplay() {
            const drawer = document.getElementById('desktopPaletteDrawerWrapper');
            const chevron = document.getElementById('paletteChevronIcon');
            const helper = document.getElementById('paletteHelperText');
            
            examSessionState.paletteExpanded = !examSessionState.paletteExpanded;

            if (examSessionState.paletteExpanded) {
                drawer.classList.remove('hidden');
                helper.classList.remove('hidden');
                chevron.style.transform = "rotate(180deg)";
            } else {
                drawer.classList.add('hidden');
                helper.classList.add('hidden');
                chevron.style.transform = "rotate(0deg)";
            }
        }

        function startSessionCountdownMetronome() {
            const timerDisplayElement = document.getElementById('liveCountdown');
            const timerContainer = document.getElementById('timerContainer');
            const timerIcon = document.getElementById('timerIcon');

            if (countdownTimerInterval) clearInterval(countdownTimerInterval);

            countdownTimerInterval = setInterval(() => {
                if (examSessionState.timeRemaining <= 0) {
                    clearInterval(countdownTimerInterval);
                    timerDisplayElement.innerText = "00:00:00";
                    executeAutomaticTimeoutSubmission();
                    return;
                }

                examSessionState.timeRemaining--;
                
                let hrs = Math.floor(examSessionState.timeRemaining / 3600);
                let mins = Math.floor((examSessionState.timeRemaining % 3600) / 60);
                let secs = examSessionState.timeRemaining % 60;

                timerDisplayElement.innerText = `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

                if (examSessionState.timeRemaining <= 300) {
                    timerContainer.className = "flex items-center gap-3 bg-red-50 border border-red-200 px-4 py-2 rounded-2xl shadow-sm shrink-0 animate-pulse";
                    timerDisplayElement.className = "text-base lg:text-xl font-mono font-bold text-red-600 tracking-tight";
                    timerIcon.className = "ph-bold ph-warning text-red-500 text-lg lg:text-xl";
                }
            }, 1000);
        }

        function buildQuestionNavigationMatrices() {
            const dGrid = document.getElementById('desktopMatrixGrid');
            const mGrid = document.getElementById('mobileMatrixGrid');
            
            dGrid.innerHTML = '';
            mGrid.innerHTML = '';

            examSessionState.questions.forEach((_, idx) => {
                [dGrid, mGrid].forEach((targetGrid) => {
                    const matrixButton = document.createElement('button');
                    matrixButton.id = `${targetGrid.id === 'desktopMatrixGrid' ? 'd' : 'm'}-btn-${idx}`;
                    matrixButton.innerText = idx + 1;
                    matrixButton.className = "h-11 w-full rounded-xl border text-xs font-bold transition-all flex items-center justify-center tracking-tight";
                    matrixButton.onclick = () => {
                        jumpToQuestionIndex(idx);
                        if(targetGrid.id === 'mobileMatrixGrid' && window.FlowbiteInstances) {
                            const drawerInst = window.FlowbiteInstances.getInstance('drawer', 'mobileMatrixDrawer');
                            if(drawerInst) drawerInst.hide();
                        }
                    };
                    targetGrid.appendChild(matrixButton);
                });
            });
            updateNavigationMatricesVisualStates();
        }

        function updateNavigationMatricesVisualStates() {
            let answeredCounter = 0;
            let flaggedCounter = 0;
            const total = examSessionState.questions.length;

            examSessionState.questions.forEach((q, idx) => {
                const isAnswered = examSessionState.answers[q.id] !== undefined;
                const isFlagged = examSessionState.flags[idx] === true;
                const isCurrent = examSessionState.currentQuestionIndex === idx;

                if (isAnswered) answeredCounter++;
                if (isFlagged) flaggedCounter++;

                ['d', 'm'].forEach((prefix) => {
                    const btn = document.getElementById(`${prefix}-btn-${idx}`);
                    if (!btn) return;

                    btn.className = "h-11 w-full rounded-xl border text-xs font-bold transition-all flex items-center justify-center tracking-tight";

                    if (isCurrent) {
                        btn.classList.add('matrix-btn-current');
                    } else if (isFlagged) {
                        btn.classList.add('matrix-btn-flagged');
                    } else if (isAnswered) {
                        btn.classList.add('matrix-btn-answered');
                    } else {
                        btn.classList.add('matrix-btn-unvisited');
                    }
                });
            });

            document.getElementById('lblCountAnswered').innerText = `${answeredCounter} Answered`;
            document.getElementById('lblCountFlagged').innerText = `${flaggedCounter} Flagged`;
            document.getElementById('badgeMiniCount').innerText = `${answeredCounter}/${total}`;
            document.getElementById('mobileCountSummary').innerText = `${answeredCounter}/${total}`;
        }

        function renderActiveQuestionCanvas() {
            const activeIdx = examSessionState.currentQuestionIndex;
            const q = examSessionState.questions[activeIdx];
            const totalQuestions = examSessionState.questions.length;

            if (!q) return;

            document.getElementById('currentQuestionBadge').innerText = `Question ${activeIdx + 1}`;
            document.getElementById('progressFractionText').innerText = `of ${totalQuestions} questions`;

            let finalPromptHTML = q.question || q.prompt || "";
            if (q.questionImage) {
                finalPromptHTML += `<div class="mt-4 max-w-full"><img src="${q.questionImage}" class="max-h-64 rounded-xl border border-slate-200 shadow-sm object-contain" alt="Question Resource Block"></div>`;
            }
            document.getElementById('canvasQuestionPrompt').innerHTML = finalPromptHTML;

            const calculationPercentage = totalQuestions ? ((activeIdx + 1) / totalQuestions) * 100 : 0;
            document.getElementById('headerProgressBar').style.width = `${calculationPercentage}%`;

            const optionsContainer = document.getElementById('canvasOptionsContainer');
            optionsContainer.innerHTML = '';

            const sourceOptionsArray = q.options || [];

            sourceOptionsArray.forEach((optItem) => {
                const isObjectStructure = (optItem !== null && typeof optItem === 'object');
                const textVal = isObjectStructure ? (optItem.text || "") : optItem;
                const imageVal = isObjectStructure ? (optItem.image || null) : null;

                const isSelectedOption = examSessionState.answers[q.id] === textVal;
                
                const optionWrapperCard = document.createElement('div');
                optionWrapperCard.className = `flex items-center p-4 rounded-xl border transition-all cursor-pointer min-w-0 w-full overflow-hidden group ${
                    isSelectedOption 
                        ? 'border-brand-active bg-blue-50/50 text-brand-dark font-medium shadow-sm' 
                        : 'border-slate-200 bg-white hover:bg-slate-50 text-slate-700'
                }`;
                
                optionWrapperCard.onclick = () => selectOptionChoiceIndex(q.id, textVal);

                const radioSimCircle = isSelectedOption
                    ? `<div class="w-5 h-5 rounded-full bg-brand-active border border-brand-active mr-4 flex-shrink-0 flex items-center justify-center text-white"><span class="w-1.5 h-1.5 rounded-full bg-white block"></span></div>`
                    : `<div class="w-5 h-5 rounded-full border-2 border-slate-300 group-hover:border-slate-400 mr-4 flex-shrink-0 bg-white"></div>`;

                let innerOptionContent = `<div class="text-sm break-words overflow-hidden flex-1 min-w-0">${textVal}</div>`;
                if (imageVal) {
                    innerOptionContent += `<div class="ml-3 shrink-0"><img src="${imageVal}" class="max-h-16 rounded border bg-white p-1 object-contain"></div>`;
                }

                optionWrapperCard.innerHTML = `${radioSimCircle} ${innerOptionContent}`;
                optionsContainer.appendChild(optionWrapperCard);
            });

            document.getElementById('btnPrev').disabled = activeIdx === 0;
            
            const nextButtonNode = document.getElementById('btnNext');
            if (activeIdx === totalQuestions - 1) {
                nextButtonNode.innerHTML = `Submit Examination <i class="ph-bold ph-cloud-arrow-up"></i>`;
                nextButtonNode.className = "px-5 py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl font-bold text-xs lg:text-sm transition-all flex items-center gap-2 shadow-sm animate-pulse";
            } else {
                nextButtonNode.innerHTML = `Next <i class="ph-bold ph-arrow-right"></i>`;
                nextButtonNode.className = "px-5 py-3 bg-brand-active hover:bg-brand-dark text-white rounded-xl font-bold text-xs lg:text-sm transition-all flex items-center gap-2 shadow-sm";
            }

            const isFlagged = examSessionState.flags[activeIdx] === true;
            const flagIcon = document.getElementById('flagIcon');
            const flagText = document.getElementById('flagText');
            const btnFlag = document.getElementById('btnFlag');

            if (isFlagged) {
                flagIcon.className = "ph-fill ph-bookmark text-amber-500";
                flagText.innerText = "Flagged for Review";
                btnFlag.className = "px-3 py-3 border border-amber-300 bg-amber-100 text-amber-800 rounded-xl font-bold text-xs lg:text-sm transition-all flex items-center gap-2";
            } else {
                flagIcon.className = "ph-bold ph-bookmark";
                flagText.innerText = "Flag for Review";
                btnFlag.className = "px-3 py-3 border border-slate-200 hover:bg-slate-50 text-slate-600 rounded-xl font-bold text-xs lg:text-sm transition-all flex items-center gap-2";
            }

            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise();
            }
        }

        function selectOptionChoiceIndex(questionId, targetTextValue) {
            if (examSessionState.answers[questionId] === targetTextValue) {
                delete examSessionState.answers[questionId];
            } else {
                examSessionState.answers[questionId] = targetTextValue;
            }
            renderActiveQuestionCanvas();
            updateNavigationMatricesVisualStates();
        }

        function toggleFlagCurrent() {
            const currentIdx = examSessionState.currentQuestionIndex;
            examSessionState.flags[currentIdx] = !examSessionState.flags[currentIdx];
            renderActiveQuestionCanvas();
            updateNavigationMatricesVisualStates();
        }

        function navigatePrevious() {
            if (examSessionState.currentQuestionIndex > 0) {
                examSessionState.currentQuestionIndex--;
                renderActiveQuestionCanvas();
                updateNavigationMatricesVisualStates();
            }
        }

        function navigateNext() {
            const totalQuestions = examSessionState.questions.length;
            if (examSessionState.currentQuestionIndex < totalQuestions - 1) {
                examSessionState.currentQuestionIndex++;
                renderActiveQuestionCanvas();
                updateNavigationMatricesVisualStates();
            } else {
                triggerExamSubmission();
            }
        }

        function jumpToQuestionIndex(idx) {
            if (idx >= 0 && idx < examSessionState.questions.length) {
                examSessionState.currentQuestionIndex = idx;
                renderActiveQuestionCanvas();
                updateNavigationMatricesVisualStates();
            }
        }

        // === SUBMISSION ENGINE EXECUTORS ===
        function executeAutomaticTimeoutSubmission() {
            showCustomAlert(
                "Time Elasped", 
                "Examination timeframe allocated has fully elapsed. Your active script input sequence details are being securely finalized and transmitted.", 
                "warning", 
                () => { processFinalSubmissionRoutine(); }
            );
        }

        function triggerExamSubmission() {
            const total = examSessionState.questions.length;
            const attempted = Object.keys(examSessionState.answers).length;
            const unattempted = total - attempted;

            let promptConfirmationMessage = `Are you absolutely certain you wish to finalize and submit your script for grading process routines?\n\nTotal Questions: ${total}\nAttempted: ${attempted}\nUnattempted: ${unattempted}`;
            
            if (unattempted > 0) {
                promptConfirmationMessage += `\n\nWARNING: You have left ${unattempted} question(s) blank!`;
            }

            showCustomConfirm(
                "Finalize Examination", 
                promptConfirmationMessage, 
                () => { processFinalSubmissionRoutine(); }
            );
        }

        async function processFinalSubmissionRoutine() {
            if (countdownTimerInterval) clearInterval(countdownTimerInterval);

            setSubmissionActionButtonsState(true);

            let calculatedScore = 0;
            examSessionState.questions.forEach(q => {
                const userAns = examSessionState.answers[q.id];
                if (typeof userAns !== "undefined" && userAns === q.answer) {
                    calculatedScore++;
                }
            });

            const sessionTimeLimitConst = 40 * 60;
            const timeTaken = sessionTimeLimitConst - examSessionState.timeRemaining;

            const payload = {
                examSet: examSessionState.examSetId,
                answers: examSessionState.answers,
                score: calculatedScore,
                timeTaken: timeTaken,
                questions: examSessionState.questions.map(q => ({
                    id: q.id,
                    question: q.question,
                    answer: q.answer,
                    options: q.options,
                    explanation: q.explanation || "",
                    questionImage: q.questionImage || null
                }))
            };

            try {
                const response = await fetch(API_URL + "results", {
                    method: "POST",
                    headers: {
                        Authorization: "Bearer " + token,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    showCustomAlert("Database Commit Failure", "Failed to securely save your test results on the server database. Please check your connections and try again.", "error");
                    setSubmissionActionButtonsState(false);
                    startSessionCountdownMetronome(); 
                    return;
                }

                if (examSessionState.currentUserId && examSessionState.examSetId) {
                    try { 
                        await markQuizTaskDoneOnServer(examSessionState.currentUserId, examSessionState.examSetId); 
                    } catch(e) { /* fail silently */ }
                }

                showCustomAlert(
                    "Submission Complete", 
                    "Submission successful! Your answers have been committed securely to OAU ExamGuard database routing infrastructure layers.", 
                    "success", 
                    () => {
                        window.location.href = `result-summary?examSet=${encodeURIComponent(examSessionState.examSetId)}`;
                    }
                );

            } catch (err) {
                console.error(err);
                showCustomAlert("Network Communication Error", "Network communication timeout error encountered during script processing. Please re-submit.", "error");
                setSubmissionActionButtonsState(false);
                startSessionCountdownMetronome();
            }
        }

        function setSubmissionActionButtonsState(isLoadingState) {
            const btnDesktop = document.getElementById("btnSubmitDesktop");
            const btnMobile = document.getElementById("btnSubmitMobile");
            const btnNext = document.getElementById("btnNext");
            
            if (isLoadingState) {
                const layoutSpinnerHTML = `<svg class="animate-spin h-4 w-4 text-white inline-block" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Submitting...`;
                if(btnDesktop) { btnDesktop.disabled = true; btnDesktop.innerHTML = layoutSpinnerHTML; }
                if(btnMobile) { btnMobile.disabled = true; btnMobile.innerText = "Submitting..."; }
                if(btnNext && examSessionState.currentQuestionIndex === examSessionState.questions.length - 1) {
                    btnNext.disabled = true; btnNext.innerHTML = layoutSpinnerHTML;
                }
            } else {
                if(btnDesktop) { btnDesktop.disabled = false; btnDesktop.innerHTML = `<i class="ph-bold ph-cloud-arrow-up text-base"></i> Submit Examination`; }
                if(btnMobile) { btnMobile.disabled = false; btnMobile.innerText = "Submit Exam"; }
                renderActiveQuestionCanvas(); 
            }
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        document.addEventListener('DOMContentLoaded', initializeSessionEngine);
        const isPWA =
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;

if (isPWA) {
    // Disable pull-to-refresh
    document.documentElement.style.overscrollBehavior = "none";
    document.body.style.overscrollBehavior = "none";

    // Force mobile layout
    document.documentElement.classList.add("pwa-mobile");
}

    </script>
</body>
