<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=0.9"/>
    <title>OAU ExamGuard - Secure Portal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            dark: '#1e3a8a',
                            active: '#2563eb',
                            accent: '#3b82f6',
                            light: '#f8fafc'
                        }
                    },
                    boxShadow: {
                        'premium': '0 2px 10px -3px rgba(0,0,0,0.05), 0 4px 6px -4px rgba(0,0,0,0.02)',
                        'floating': '0 10px 30px -5px rgba(0,0,0,0.08), 0 8px 15px -6px rgba(0,0,0,0.04)'
                    }
                }
            }
        }
    </script>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .matrix-btn-unvisited { border-color: #e2e8f0; background-color: #ffffff; color: #64748b; }
        .matrix-btn-answered { border-color: #2563eb; background-color: #eff6ff; color: #1d4ed8; font-weight: 600; }
        .matrix-btn-flagged { border-color: #eab308; background-color: #fef9c3; color: #a16207; font-weight: 600; }
        .matrix-btn-current { border-color: #1e3a8a; background-color: #1e3a8a; color: #ffffff !important; font-weight: 700; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25); }
    </style>
</head>
<body class="bg-brand-light text-slate-800 font-sans antialiased overflow-hidden">

    <div class="flex flex-col h-screen w-full">
        
        <!-- Top Banner Header Panel -->
        <header class="bg-white border-b border-slate-200 px-4 lg:px-8 h-20 flex items-center justify-between shrink-0 z-30 relative shadow-sm">
            <div class="flex items-center gap-3 lg:gap-4 min-w-0">
                <div class="w-10 h-10 bg-brand-dark rounded-xl flex items-center justify-center p-1.5 shadow-md shrink-0">
                    <svg class="w-full h-full text-white" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <div class="min-w-0">
                    <h1 class="font-bold text-sm lg:text-base text-slate-900 truncate" id="headerExamTitle">Loading Examination...</h1>
                    <p class="text-[11px] text-slate-500 font-medium truncate" id="headerStudentProfile">—</p>
                </div>
            </div>

            <!-- Live Session Dynamic Countdown Metronome -->
            <div class="flex items-center gap-3 bg-slate-50 border border-slate-200 px-4 py-2 rounded-2xl shadow-sm shrink-0" id="timerContainer">
                <i class="ph-bold ph-clock text-slate-500 text-lg lg:text-xl" id="timerIcon"></i>
                <div class="text-right">
                    <div class="text-xs text-slate-400 font-semibold uppercase tracking-wider leading-none mb-0.5">Time Remaining</div>
                    <div class="text-base lg:text-xl font-mono font-bold text-slate-800 tracking-tight transition-colors duration-300" id="liveCountdown">00:00:00</div>
                </div>
            </div>
        </header>

        <!-- Main Examination Core Workspace Split -->
        <div class="flex-1 flex w-full overflow-hidden relative">
            
            <!-- Left Pane Viewport Container Wrapper -->
            <div class="flex-1 flex flex-col h-full relative overflow-hidden min-w-0">
                
                <!-- Scrollable Main Canvas Body Space -->
                <main class="flex-1 overflow-y-auto px-4 lg:px-8 pt-6 pb-28 bg-[#f8fafc] w-full">
                    
                    <!-- ADAPTIVE BRANDING ASSIGNMENT: Injected under Header on Mobile/Tablet screens -->
                    <div class="block lg:hidden w-full" id="mobileBrandingPlaceholder"></div>
                    
                    <!-- Current Progress Strip Indicators -->
                    <div class="w-full bg-white border border-slate-200/60 p-4 rounded-2xl mb-5 shadow-premium flex flex-col sm:flex-row sm:items-center justify-between gap-3 shrink-0">
                        <div class="flex items-center gap-2">
                            <span class="text-xs bg-brand-active/10 text-brand-active font-bold px-2.5 py-1 rounded-lg uppercase tracking-wider" id="currentQuestionBadge">Question 1</span>
                            <span class="text-xs font-semibold text-slate-400" id="progressFractionText">of 0 questions</span>
                        </div>
                        <div class="w-full sm:w-48 bg-slate-100 rounded-full h-2">
                            <div class="bg-brand-active h-2 rounded-full transition-all duration-300" id="headerProgressBar" style="width: 0%"></div>
                        </div>
                    </div>

                    <!-- Primary Question Card Canvas Area -->
                    <div class="bg-white rounded-2xl border border-slate-200/60 shadow-premium flex flex-col min-w-0 overflow-hidden mb-6">
                        <div class="p-5 lg:p-8 border-b border-slate-100 bg-slate-50/30">
                            <div class="text-base lg:text-lg font-bold text-slate-800 leading-relaxed break-words" id="canvasQuestionPrompt">
                                Loading current item data prompt parameters...
                            </div>
                        </div>

                        <div class="p-5 lg:p-8 space-y-3" id="canvasOptionsContainer">
                            <!-- Options content dynamically injected -->
                        </div>
                    </div>
                </main>

                <!-- FIXED BASE CONTROLS FOOTER PANEL: Floating beautifully on the main content surface -->
                <div class="absolute bottom-4 left-4 right-4 lg:left-8 lg:right-8 bg-white/95 backdrop-blur-md border border-slate-200 p-4 rounded-2xl shadow-floating z-20 flex items-center justify-between gap-3 transition-all duration-200">
                    <button onclick="navigatePrevious()" id="btnPrev" class="px-4 py-3 border border-slate-200 bg-white hover:bg-slate-50 rounded-xl font-bold text-xs lg:text-sm text-slate-600 transition-all flex items-center gap-2 disabled:opacity-40 disabled:pointer-events-none">
                        <i class="ph-bold ph-arrow-left"></i> Previous
                    </button>

                    <button onclick="toggleFlagCurrent()" id="btnFlag" class="px-3 py-3 border border-amber-200 bg-amber-50/50 text-amber-700 hover:bg-amber-100 rounded-xl font-bold text-xs lg:text-sm transition-all flex items-center gap-2">
                        <i id="flagIcon" class="ph-bold ph-bookmark"></i> <span class="hidden sm:inline" id="flagText">Flag Question</span>
                    </button>

                    <button onclick="navigateNext()" id="btnNext" class="px-5 py-3 bg-brand-active hover:bg-brand-dark text-white rounded-xl font-bold text-xs lg:text-sm transition-all flex items-center gap-2 shadow-sm">
                        Next <i class="ph-bold ph-arrow-right"></i>
                    </button>
                </div>
            </div>

            <!-- Right Grid Pane: Desktop Tracking Sidebar Dashboard -->
            <aside class="hidden lg:flex w-[320px] bg-white border-l border-slate-200 h-full flex-col shrink-0 overflow-hidden">
                
                <!-- ADAPTIVE BRANDING ASSIGNMENT: Injected via script execution context inside Sidebar Top Desk -->
                <div class="p-5 border-b border-slate-100 bg-slate-50/20" id="desktopBrandingPlaceholder"></div>

                <!-- Collapsible Header Section for the Question Tracking Matrix Pallets -->
                <div class="px-5 py-4 border-b border-slate-100 bg-slate-50/50">
                    <button onclick="toggleDesktopPaletteDisplay()" class="w-full flex items-center justify-between text-sm font-bold text-slate-900 hover:text-brand-active transition-colors focus:outline-none group">
                        <span class="flex items-center gap-2 text-slate-700 group-hover:text-brand-dark">
                            <i class="ph-fill ph-grid text-brand-active text-base"></i> Navigation Overview
                        </span>
                        <div class="flex items-center gap-1">
                            <span class="text-[10px] bg-slate-200 text-slate-600 font-bold px-1.5 py-0.5 rounded" id="badgeMiniCount">0/0</span>
                            <i id="paletteChevronIcon" class="ph-bold ph-caret-down text-slate-400 transition-transform duration-200"></i>
                        </div>
                    </button>
                    <p class="text-[11px] text-slate-400 font-medium mt-1.5 hidden" id="paletteHelperText">Click a cell number to switch slots instantly.</p>
                </div>

                <!-- Scrollable Grid Sheet mapping layout layer framework components (Hidden by Default) -->
                <div class="flex-1 overflow-y-auto p-5 transition-all duration-300 hidden bg-slate-50/30" id="desktopPaletteDrawerWrapper">
                    <div class="grid grid-cols-5 gap-2" id="desktopMatrixGrid">
                        <!-- Generated matrix markers -->
                    </div>
                </div>

                <!-- Sticky Footer actions layout layer framework buttons -->
                <div class="p-5 border-t border-slate-100 bg-white space-y-3 shrink-0">
                    <div class="grid grid-cols-2 gap-2 text-[11px] font-semibold text-slate-500 pb-2">
                        <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded bg-blue-100 border border-blue-400 block"></span> <span id="lblCountAnswered">0 Answered</span></div>
                        <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded bg-yellow-100 border border-yellow-400 block"></span> <span id="lblCountFlagged">0 Flagged</span></div>
                    </div>
                    <button onclick="triggerExamSubmission()" class="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-bold text-sm rounded-xl transition-all shadow-md flex items-center justify-center gap-2 tracking-wide">
                        <i class="ph-bold ph-cloud-arrow-up text-base"></i> Submit Examination
                    </button>
                </div>
            </aside>
        </div>

        <!-- Mobile Drawer Action Bar Layout module -->
        <div class="lg:hidden bg-white border-t border-slate-200 h-16 shrink-0 flex items-center justify-between px-4 z-30 shadow-floating">
            <button data-drawer-target="mobileMatrixDrawer" data-drawer-toggle="mobileMatrixDrawer" class="flex items-center gap-2 bg-slate-100 px-3 py-2 rounded-xl text-slate-700 text-xs font-bold transition-all hover:bg-slate-200">
                <i class="ph-bold ph-squares-four text-base"></i> Overview Map (<span id="mobileCountSummary">0/0</span>)
            </button>
            <button onclick="triggerExamSubmission()" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition-all flex items-center gap-1.5 shadow-sm">
                Submit Exam
            </button>
        </div>
    </div>

    <!-- Mobile Drawer Panel Canvas Overlay Content Sheet -->
    <div id="mobileMatrixDrawer" class="fixed bottom-0 left-0 right-0 z-40 w-full p-4 transition-transform translate-y-full bg-white rounded-t-3xl border-t border-slate-200 h-[60vh] max-h-[60vh] overflow-hidden flex flex-col" tabindex="-1">
        <div class="flex items-center justify-between pb-3 border-b border-slate-100 shrink-0">
            <h5 class="text-sm font-bold text-slate-800 uppercase tracking-wider flex items-center gap-2"><i class="ph ph-list-numbers text-brand-active text-lg"></i> Question Overview Map</h5>
            <button type="button" data-drawer-hide="mobileMatrixDrawer" class="text-slate-400 bg-transparent hover:bg-slate-100 hover:text-slate-900 rounded-lg text-sm w-8 h-8 inline-flex items-center justify-center">
                <i class="ph ph-x text-xl"></i>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto py-4">
            <div class="grid grid-cols-5 gap-2" id="mobileMatrixGrid">
                <!-- Mobile generated items injection layer -->
            </div>
        </div>
    </div>

    <!-- REUSABLE OAU BRANDING ASSET ELEMENT TEMPLATE -->
    <template id="oauBrandingCardTemplate">
        <div class="bg-gradient-to-br from-brand-dark to-blue-900 text-white p-4 rounded-2xl shadow-premium border border-white/10 w-full flex items-center gap-3.5">
            <div class="w-12 h-12 bg-white rounded-xl flex items-center justify-center p-1.5 shadow-inner shrink-0">
                <!-- High-fidelity embedded vector crest illustration representing OAU portal anchors -->
                <svg class="w-full h-full text-amber-500" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.39.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.9-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.1-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.1.39-1.99 1.03-2.69-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.69 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/>
                </svg>
            </div>
            <div class="min-w-0 flex-1">
                <h4 class="text-[10px] lg:text-xs font-bold text-amber-400 uppercase tracking-widest leading-none mb-1 truncate">Obafemi Awolowo University</h4>
                <h3 class="text-sm font-bold text-white tracking-wide truncate">Central Mock Test</h3>
                <p class="text-[10px] text-blue-200 font-medium mt-0.5 opacity-90">Computer Based Testing Centre</p>
            </div>
        </div>
    </template>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
    <script>
        let examSessionState = {
            examTitle: "CHM 101 Mid-Semester Examination",
            courseCode: "CHM 101",
            durationSeconds: 3600, 
            currentQuestionIndex: 0,
            paletteExpanded: false, // Variable to track layout visibility states
            studentProfile: {
                fullname: "Oluwaseun Temitope",
                matricNumber: "CSC/2022/1049"
            },
            answers: {}, 
            flags: {},   
            questions: [
                {
                    prompt: "Which process converts unsaturated vegetable oil to a more solid margarine?[cite: 2]",
                    options: [
                        "Hydrogenation with H2 and Ni catalyst[cite: 2]",
                        "Hydrolysis with H2O at room temperature[cite: 2]",
                        "Oxidation with O2 in air[cite: 2]",
                        "Halogenation with Cl2 in cold solvent[cite: 2]"
                    ]
                },
                {
                    prompt: "Which ligand field effect leads to strong colours in many transition metal complexes?[cite: 2]",
                    options: [
                        "Crystal field splitting of d-orbitals and d-d transitions[cite: 2]",
                        "Complete pairing of all electrons in s orbitals[cite: 2]",
                        "Absence of unpaired electrons[cite: 2]",
                        "Ligand protonation only[cite: 2]"
                    ]
                },
                {
                    prompt: "For the complex [Co(NH3)5Cl]Cl2, the oxidation state of cobalt and the coordination number are:[cite: 2]",
                    options: [
                        "+3 and 6[cite: 2]",
                        "+2 and 5[cite: 2]",
                        "+3 and 5[cite: 2]",
                        "+2 and 6[cite: 2]"
                    ]
                },
                {
                    prompt: "An aqueous solution of a transition metal ion is colored. This color is primarily due to which transition matrix parameters?",
                    options: [
                        "d-d electron transitions within split subshells",
                        "Promotional excitation parameters to higher s shells",
                        "Inter-atomic resonance of nuclear particles",
                        "Complete cancellation of crystal fields"
                    ]
                },
                {
                    prompt: "Identify the element containing partially filled d-orbitals in its ground state parameters.",
                    options: [
                        "Iron (Fe)",
                        "Zinc (Zn)",
                        "Calcium (Ca)",
                        "Sodium (Na)"
                    ]
                }
            ]
        };

        let countdownTimerInterval = null;

        function initializeSessionEngine() {
            // Instantiate and place branding templates across responsive slots
            injectAdaptiveBrandingCards();

            document.getElementById('headerExamTitle').innerText = examSessionState.examTitle;
            document.getElementById('headerStudentProfile').innerText = `${examSessionState.studentProfile.fullname} • (${examSessionState.studentProfile.matricNumber})`;
            
            startSessionCountdownMetronome(examSessionState.durationSeconds);
            buildQuestionNavigationMatrices();
            renderActiveQuestionCanvas();
        }

        function injectAdaptiveBrandingCards() {
            const template = document.getElementById('oauBrandingCardTemplate');
            
            // Render inside Mobile viewport container slot
            const mobileClone = template.content.cloneNode(true);
            const mContainer = document.getElementById('mobileBrandingPlaceholder');
            mContainer.appendChild(mobileClone);
            mContainer.classList.add("mb-5"); // Inject baseline offset margin spacing layout parameters safely

            // Render inside Desktop Sidebar structural slot
            const desktopClone = template.content.cloneNode(true);
            document.getElementById('desktopBrandingPlaceholder').appendChild(desktopClone);
        }

        function toggleDesktopPaletteDisplay() {
            const drawer = document.getElementById('desktopPaletteDrawerWrapper');
            const chevron = document.getElementById('paletteChevronIcon');
            const helper = document.getElementById('paletteHelperText');
            
            examSessionState.paletteExpanded = !examSessionState.paletteExpanded;

            if (examSessionState.paletteExpanded) {
                drawer.classList.remove('hidden');
                helper.classList.remove('hidden');
                chevron.classList.transform = "rotate(180deg)";
                chevron.style.transform = "rotate(180deg)";
            } else {
                drawer.classList.add('hidden');
                helper.classList.add('hidden');
                chevron.style.transform = "rotate(0deg)";
            }
        }

        function startSessionCountdownMetronome(duration) {
            let contextRemainingTime = duration;
            const timerDisplayElement = document.getElementById('liveCountdown');
            const timerContainer = document.getElementById('timerContainer');
            const timerIcon = document.getElementById('timerIcon');

            countdownTimerInterval = setInterval(() => {
                if (contextRemainingTime <= 0) {
                    clearInterval(countdownTimerInterval);
                    timerDisplayElement.innerText = "00:00:00";
                    triggerAutomaticSubmissionTimeout();
                    return;
                }

                contextRemainingTime--;
                
                let hrs = Math.floor(contextRemainingTime / 3600);
                let mins = Math.floor((contextRemainingTime % 3600) / 60);
                let secs = contextRemainingTime % 60;

                timerDisplayElement.innerText = `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

                if (contextRemainingTime <= 300) {
                    timerContainer.className = "flex items-center gap-3 bg-red-50 border border-red-200 px-4 py-2 rounded-2xl shadow-sm shrink-0 animate-pulse";
                    timerDisplayElement.className = "text-base lg:text-xl font-mono font-bold text-red-600 tracking-tight";
                    timerIcon.className = "ph-bold ph-warning text-red-500 text-lg lg:text-xl";
                }
            }, 1000);
        }

        function buildQuestionNavigationMatrices() {
            const dGrid = document.getElementById('desktopMatrixGrid');
            const mGrid = document.getElementById('mobileMatrixGrid');
            
            dGrid.innerHTML = '';
            mGrid.innerHTML = '';

            examSessionState.questions.forEach((_, idx) => {
                [dGrid, mGrid].forEach((targetGrid) => {
                    const matrixButton = document.createElement('button');
                    matrixButton.id = `${targetGrid.id === 'desktopMatrixGrid' ? 'd' : 'm'}-btn-${idx}`;
                    matrixButton.innerText = idx + 1;
                    matrixButton.className = "h-11 w-full rounded-xl border text-xs font-bold transition-all flex items-center justify-center tracking-tight";
                    matrixButton.onclick = () => {
                        jumpToQuestionIndex(idx);
                        if(targetGrid.id === 'mobileMatrixGrid' && window.FlowbiteInstances) {
                            const drawerInst = window.FlowbiteInstances.getInstance('drawer', 'mobileMatrixDrawer');
                            if(drawerInst) drawerInst.hide();
                        }
                    };
                    targetGrid.appendChild(matrixButton);
                });
            });
            
            updateNavigationMatricesVisualStates();
        }

        function updateNavigationMatricesVisualStates() {
            let answeredCounter = 0;
            let flaggedCounter = 0;
            const total = examSessionState.questions.length;

            examSessionState.questions.forEach((_, idx) => {
                const isAnswered = examSessionState.answers[idx] !== undefined;
                const isFlagged = examSessionState.flags[idx] === true;
                const isCurrent = examSessionState.currentQuestionIndex === idx;

                if (isAnswered) answeredCounter++;
                if (isFlagged) flaggedCounter++;

                ['d', 'm'].forEach((prefix) => {
                    const btn = document.getElementById(`${prefix}-btn-${idx}`);
                    if (!btn) return;

                    btn.className = "h-11 w-full rounded-xl border text-xs font-bold transition-all flex items-center justify-center tracking-tight";

                    if (isCurrent) {
                        btn.classList.add('matrix-btn-current');
                    } else if (isFlagged) {
                        btn.classList.add('matrix-btn-flagged');
                    } else if (isAnswered) {
                        btn.classList.add('matrix-btn-answered');
                    } else {
                        btn.classList.add('matrix-btn-unvisited');
                    }
                });
            });

            document.getElementById('lblCountAnswered').innerText = `${answeredCounter} Answered`;
            document.getElementById('lblCountFlagged').innerText = `${flaggedCounter} Flagged`;
            document.getElementById('badgeMiniCount').innerText = `${answeredCounter}/${total}`;
            document.getElementById('mobileCountSummary').innerText = `${answeredCounter}/${total}`;
        }

        function renderActiveQuestionCanvas() {
            const activeIdx = examSessionState.currentQuestionIndex;
            const activeQuestion = examSessionState.questions[activeIdx];
            const totalQuestions = examSessionState.questions.length;

            document.getElementById('currentQuestionBadge').innerText = `Question ${activeIdx + 1}`;
            document.getElementById('progressFractionText').innerText = `of ${totalQuestions} questions`;
            document.getElementById('canvasQuestionPrompt').innerHTML = activeQuestion.prompt;

            const calculationPercentage = ((activeIdx + 1) / totalQuestions) * 100;
            document.getElementById('headerProgressBar').style.width = `${calculationPercentage}%`;

            const optionsContainer = document.getElementById('canvasOptionsContainer');
            optionsContainer.innerHTML = '';

            activeQuestion.options.forEach((optionText, optIdx) => {
                const isSelectedOption = examSessionState.answers[activeIdx] === optIdx;
                
                const optionWrapperCard = document.createElement('div');
                optionWrapperCard.className = `flex items-center p-4 rounded-xl border transition-all cursor-pointer min-w-0 w-full overflow-hidden group ${
                    isSelectedOption 
                        ? 'border-brand-active bg-blue-50/50 text-brand-dark font-medium shadow-sm' 
                        : 'border-slate-200 bg-white hover:bg-slate-50 text-slate-700'
                }`;
                
                optionWrapperCard.onclick = () => selectOptionChoiceIndex(optIdx);

                const radioSimCircle = isSelectedOption
                    ? `<div class="w-5 h-5 rounded-full bg-brand-active border border-brand-active mr-4 flex-shrink-0 flex items-center justify-center text-white"><span class="w-1.5 h-1.5 rounded-full bg-white block"></span></div>`
                    : `<div class="w-5 h-5 rounded-full border-2 border-slate-300 group-hover:border-slate-400 mr-4 flex-shrink-0 bg-white"></div>`;

                optionWrapperCard.innerHTML = `
                    ${radioSimCircle}
                    <div class="text-sm break-words overflow-hidden flex-1 min-w-0">${optionText}</div>
                `;
                optionsContainer.appendChild(optionWrapperCard);
            });

            document.getElementById('btnPrev').disabled = activeIdx === 0;
            
            const nextButtonNode = document.getElementById('btnNext');
            if (activeIdx === totalQuestions - 1) {
                nextButtonNode.innerHTML = `Review Overview <i class="ph-bold ph-magnifying-glass"></i>`;
                nextButtonNode.className = "px-5 py-3 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-bold text-xs lg:text-sm transition-all flex items-center gap-2 shadow-sm";
            } else {
                nextButtonNode.innerHTML = `Next <i class="ph-bold ph-arrow-right"></i>`;
                nextButtonNode.className = "px-5 py-3 bg-brand-active hover:bg-brand-dark text-white rounded-xl font-bold text-xs lg:text-sm transition-all flex items-center gap-2 shadow-sm";
            }

            const isFlagged = examSessionState.flags[activeIdx] === true;
            const flagIcon = document.getElementById('flagIcon');
            const flagText = document.getElementById('flagText');
            const btnFlag = document.getElementById('btnFlag');

            if (isFlagged) {
                flagIcon.className = "ph-fill ph-bookmark text-amber-500";
                flagText.innerText = "Flagged for Review";
                btnFlag.className = "px-3 py-3 border border-amber-300 bg-amber-100 text-amber-800 rounded-xl font-bold text-xs lg:text-sm transition-all flex items-center gap-2";
            } else {
                flagIcon.className = "ph-bold ph-bookmark";
                flagText.innerText = "Flag for Review";
                btnFlag.className = "px-3 py-3 border border-slate-200 hover:bg-slate-50 text-slate-600 rounded-xl font-bold text-xs lg:text-sm transition-all flex items-center gap-2";
            }
        }

        function selectOptionChoiceIndex(optIdx) {
            const currentIdx = examSessionState.currentQuestionIndex;
            if (examSessionState.answers[currentIdx] === optIdx) {
                delete examSessionState.answers[currentIdx];
            } else {
                examSessionState.answers[currentIdx] = optIdx;
            }
            renderActiveQuestionCanvas();
            updateNavigationMatricesVisualStates();
        }

        function toggleFlagCurrent() {
            const currentIdx = examSessionState.currentQuestionIndex;
            examSessionState.flags[currentIdx] = !examSessionState.flags[currentIdx];
            renderActiveQuestionCanvas();
            updateNavigationMatricesVisualStates();
        }

        function navigatePrevious() {
            if (examSessionState.currentQuestionIndex > 0) {
                examSessionState.currentQuestionIndex--;
                renderActiveQuestionCanvas();
                updateNavigationMatricesVisualStates();
            }
        }

        function navigateNext() {
            const totalQuestions = examSessionState.questions.length;
            if (examSessionState.currentQuestionIndex < totalQuestions - 1) {
                examSessionState.currentQuestionIndex++;
                renderActiveQuestionCanvas();
                updateNavigationMatricesVisualStates();
            } else {
                if(window.innerWidth < 1024) {
                    const drawerInst = window.FlowbiteInstances?.getInstance('drawer', 'mobileMatrixDrawer');
                    if(drawerInst) drawerInst.show();
                } else {
                    // Automatically pop open the desktop map dropdown on exam end if collapsed
                    if(!examSessionState.paletteExpanded) {
                        toggleDesktopPaletteDisplay();
                    }
                    alert("You have reached the end of the examination. Please review your answers inside the active Overview panel before clicking Submit.");
                }
            }
        }

        function jumpToQuestionIndex(idx) {
            if (idx >= 0 && idx < examSessionState.questions.length) {
                examSessionState.currentQuestionIndex = idx;
                renderActiveQuestionCanvas();
                updateNavigationMatricesVisualStates();
            }
        }

        function triggerAutomaticSubmissionTimeout() {
            alert("Examination time has elapsed. Your active script input sequence details are being securely finalized and saved.");
            window.location.reload();
        }

        function triggerExamSubmission() {
            const total = examSessionState.questions.length;
            const attempted = Object.keys(examSessionState.answers).length;
            const unattempted = total - attempted;

            let promptConfirmationMessage = `Are you absolutely certain you wish to finalize and submit your script for grading process routines?\n\nTotal Questions: ${total}\nAttempted: ${attempted}\nUnattempted: ${unattempted}`;
            
            if (unattempted > 0) {
                promptConfirmationMessage += `\n\nWARNING: You have left ${unattempted} question(s) blank!`;
            }

            if (confirm(promptConfirmationMessage)) {
                clearInterval(countdownTimerInterval);
                alert("Submission successful! Your answers have been committed securely to OAU ExamGuard database routing infrastructure layers.");
                window.history.back();
            }
        }

        document.addEventListener('DOMContentLoaded', initializeSessionEngine);
    </script>
</body>
</html>
