<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a3774" />
<title>SafeLife — Emergency Detection &amp; Response</title>
<style>
:root{--blue:#0866e8;--navy:#102b51;--muted:#687e99;--white:#fff;--page:#edf7ff;--gutter:clamp(18px,4vw,48px)}
*{box-sizing:border-box}
html{min-height:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--navy);background:#eaf5ff}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{position:relative;width:100%;min-height:100svh;margin:0 auto;overflow:hidden;background:linear-gradient(180deg,#0a3473 0%,#12569c 20%,#58a5e5 37%,#eaf6ff 57%,#f4faff 100%);padding:0 0 calc(96px + env(safe-area-inset-bottom));}
.statusbar{height:clamp(34px,5.5vh,58px);padding:clamp(9px,2vh,18px) var(--gutter) 0;color:#fff;display:flex;justify-content:space-between;align-items:flex-start;font-size:clamp(12px,1.4vw,17px);font-weight:650;letter-spacing:.1px}
.status-icons{display:flex;align-items:center;gap:7px;height:18px}.signal{display:flex;align-items:flex-end;gap:2px;height:15px}.signal i{display:block;width:3px;background:white;border-radius:3px}.signal i:nth-child(1){height:5px}.signal i:nth-child(2){height:8px}.signal i:nth-child(3){height:11px}.signal i:nth-child(4){height:15px}.wifi{width:19px;height:14px;position:relative;border-top:3px solid white;border-radius:50%;margin:0 2px}.wifi:before{content:"";position:absolute;left:4px;right:4px;top:3px;height:8px;border-top:2px solid white;border-radius:50%}.wifi:after{content:"";position:absolute;width:4px;height:4px;background:white;border-radius:50%;bottom:0;left:8px}.battery{width:27px;height:13px;border:2px solid #fff;border-radius:4px;position:relative}.battery:before{content:"";position:absolute;left:3px;top:2px;bottom:2px;right:3px;background:#fff;border-radius:1px}.battery:after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:5px;background:#fff;border-radius:0 2px 2px 0}
.brand{display:flex;align-items:center;padding:clamp(10px,2.5vh,24px) var(--gutter) 0;gap:clamp(10px,2vw,18px);color:#fff}.brand-shield{width:clamp(42px,7vw,70px);height:auto;aspect-ratio:90/104;flex:none;filter:drop-shadow(0 2px 2px #092c5c55)}.brand-copy{min-width:0;flex:1}.brand-name{font-size:clamp(24px,3vw,34px);line-height:1.05;font-weight:750;letter-spacing:-.7px}.brand-subtitle{font-size:clamp(12px,1.65vw,18px);line-height:1.3;margin-top:4px;color:#e4efff;white-space:normal}.settings{width:clamp(34px,5vw,44px);height:clamp(34px,5vw,44px);display:grid;place-items:center;color:#fff;background:transparent;border:0;flex:none;padding:0}.settings svg{width:100%;height:100%}
.greeting{padding:clamp(24px,4vh,42px) var(--gutter) 0;color:#fff}.hello{font-size:clamp(25px,3.3vw,36px);font-weight:650;line-height:1.18;letter-spacing:-.6px}.person{font-size:clamp(31px,4vw,43px);line-height:1.16;font-weight:760;letter-spacing:-.8px;margin-top:4px}.wave{font-size:.95em;vertical-align:-2px;margin-left:5px}.tagline{font-size:clamp(15px,2vw,22px);line-height:1.4;color:#e1efff;margin-top:10px;letter-spacing:.05px}
.sos-wrap{display:flex;justify-content:center;align-items:center;padding:clamp(22px,4vh,36px) 0 clamp(22px,4vh,34px);position:relative}.sos-halo{width:clamp(205px,58vw,390px);max-width:100%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.22);box-shadow:0 0 0 clamp(7px,1.6vw,14px) rgba(255,255,255,.13)}.sos-button{width:87%;height:87%;border-radius:50%;border:3px solid rgba(255,255,255,.82);outline:4px solid rgba(255,62,74,.23);background:radial-gradient(circle at 35% 25%,#ff252b 0%,#f10e17 57%,#d9000c 100%);box-shadow:inset 0 2px 3px #ffffff55,0 4px 10px #a8001830;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px}.sos-button:active{transform:scale(.98)}.sos-button svg{width:clamp(36px,9vw,65px);height:auto;aspect-ratio:1;margin-bottom:clamp(3px,1vw,9px)}.sos-title{font-size:clamp(32px,6vw,49px);font-weight:500;line-height:1.08;letter-spacing:-1px}.sos-caption{font-size:clamp(13px,2.5vw,21px);line-height:1.32;margin-top:5px;font-weight:400}
.feature-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,2.2vw,18px);padding:0 var(--gutter)}.feature{min-width:0;border:0;border-radius:clamp(14px,2vw,20px);background:rgba(255,255,255,.94);min-height:clamp(150px,23vw,205px);text-align:left;padding:clamp(14px,2.5vw,23px);box-shadow:0 2px 12px rgba(39,89,143,.025);color:var(--navy);transition:transform .15s,box-shadow .15s}.feature:active{transform:scale(.985);box-shadow:0 4px 14px #0d43831a}.feature-icon{width:clamp(35px,5vw,51px);height:clamp(37px,5.5vw,55px);color:var(--blue);display:block;margin-bottom:clamp(6px,1.3vw,10px)}.feature h2{font-size:clamp(16px,2vw,23px);line-height:1.22;margin:0 0 10px;font-weight:700;letter-spacing:-.3px;overflow-wrap:anywhere}.feature p{font-size:clamp(13px,1.7vw,19px);line-height:1.42;margin:0;color:#6d819b;font-weight:400}
.bottom-nav{position:fixed;z-index:10;bottom:0;left:0;width:100%;min-height:calc(76px + env(safe-area-inset-bottom));padding:8px max(12px,var(--gutter)) calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:rgba(255,255,255,.98);box-shadow:0 -3px 18px #31577a0d;border-top:1px solid #eaf1f8}.nav-item{position:relative;border:0;background:transparent;display:flex;align-items:center;flex-direction:column;gap:3px;color:#72869e;font-size:clamp(12px,1.5vw,17px);padding:3px 0 5px;font-weight:500;min-width:0}.nav-item svg{width:clamp(25px,3.2vw,34px);height:clamp(25px,3.2vw,34px);stroke:currentColor}.nav-item.active{color:var(--blue)}.nav-item.active:after{content:"";position:absolute;bottom:-5px;left:20%;right:20%;height:3px;border-radius:8px;background:var(--blue)}.nav-item.active span{font-weight:600}.toast{position:fixed;z-index:30;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#102b51;color:white;padding:12px 18px;border-radius:12px;box-shadow:0 6px 25px #102b5133;font-size:14px;transition:.2s;max-width:88%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
/* Wide screens: use the available space instead of enlarging a phone-sized layout. */
@media(min-width:760px){.app{min-height:100vh;padding:0 0 34px;display:grid;grid-template-columns:minmax(320px,.9fr) minmax(380px,1.1fr);grid-template-areas:"status status" "brand brand" "greeting greeting" "sos features";align-content:start;column-gap:clamp(24px,4vw,60px);row-gap:0;background:radial-gradient(ellipse at 18% 18%,#2879bd 0%,transparent 40%),linear-gradient(145deg,#0a3473 0%,#12569c 27%,#eaf6ff 60%,#f4faff 100%)}.statusbar{grid-area:status;height:48px;padding-left:clamp(28px,5vw,76px);padding-right:clamp(28px,5vw,76px)}.brand{grid-area:brand;padding:12px clamp(28px,5vw,76px) 0}.greeting{grid-area:greeting;padding:30px clamp(28px,5vw,76px) 10px}.sos-wrap{grid-area:sos;align-self:center;padding:28px 0 35px}.sos-halo{width:min(31vw,390px)}.feature-grid{grid-area:features;align-self:center;padding:20px clamp(28px,5vw,76px) 30px 0;gap:16px}.feature{min-height:190px;padding:22px}.feature h2{font-size:clamp(18px,1.6vw,23px)}.feature p{font-size:clamp(14px,1.35vw,18px)}.bottom-nav{position:fixed;left:50%;transform:translateX(-50%);width:min(100%,900px);border:1px solid #eaf1f8;border-bottom:0;border-radius:18px 18px 0 0;min-height:76px;padding:8px 28px 10px}.nav-item{font-size:14px}.nav-item svg{width:27px;height:27px}}
@media(min-width:1100px){.app{grid-template-columns:minmax(400px,.95fr) minmax(480px,1.05fr);column-gap:48px}.greeting{padding-top:38px}.hello{font-size:38px}.person{font-size:46px}.tagline{font-size:21px}.sos-halo{width:min(29vw,410px)}.feature-grid{gap:20px}.feature{min-height:205px}}
@media(max-width:390px){.brand{gap:9px}.brand-shield{width:42px}.brand-name{font-size:24px}.brand-subtitle{font-size:11.5px}.greeting{padding-top:22px}.tagline{font-size:14px;margin-top:8px}.sos-wrap{padding:22px 0}.sos-halo{width:min(58vw,250px)}.feature-grid{gap:10px;padding-left:16px;padding-right:16px}.feature{min-height:148px;padding:13px;border-radius:14px}.feature h2{font-size:15px;margin-bottom:8px}.feature p{font-size:12.5px}.bottom-nav{min-height:calc(70px + env(safe-area-inset-bottom));padding-left:10px;padding-right:10px}.nav-item{font-size:12px}}
@media(max-height:740px) and (max-width:759px){.greeting{padding-top:18px}.sos-wrap{padding-top:18px;padding-bottom:20px}.sos-halo{width:min(48vw,280px)}.feature{min-height:135px}.app{padding-bottom:88px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <div class="statusbar" aria-hidden="true"><span>9:41</span><div class="status-icons"><div class="signal"><i></i><i></i><i></i><i></i></div><div class="wifi"></div><div class="battery"></div></div></div>
  <header class="brand">
    <svg class="brand-shield" viewBox="0 0 90 104" aria-hidden="true"><path d="M45 3 83 16v29c0 26-16 44-38 56C23 89 7 71 7 45V16L45 3Z" fill="#fff"/><path d="M45 17 70 26v20c0 18-10 31-25 41C30 77 20 64 20 46V26l25-9Z" fill="#0c4d9f"/><path d="M45 24 63 31v15c0 14-7 23-18 31-11-8-18-17-18-31V31l18-7Z" fill="#fff"/><path d="M45 29 58 35v11c0 10-5 17-13 23-8-6-13-13-13-23V35l13-6Z" fill="#1268e9"/><circle cx="45" cy="47" r="8" fill="#fff"/><path d="M45 39c-3 0-5 3-5 7v10l5 4 5-4V46c0-4-2-7-5-7Z" fill="#d8ebff"/></svg>
    <div class="brand-copy"><div class="brand-name">SafeLife</div><div class="brand-subtitle">Emergency Detection &amp; Response</div></div>
    <button class="settings" aria-label="Settings" data-message="Settings will be available here."><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"><path d="M20 4h8l1.3 5.1a16 16 0 0 1 4.1 1.7l4.6-2.5 5.7 5.7-2.5 4.6a16 16 0 0 1 1.7 4.1L48 24v4l-5.1 1.3a16 16 0 0 1-1.7 4.1l2.5 4.6-5.7 5.7-4.6-2.5a16 16 0 0 1-4.1 1.7L28 48h-8l-1.3-5.1a16 16 0 0 1-4.1-1.7L10 43.7l-5.7-5.7 2.5-4.6a16 16 0 0 1-1.7-4.1L0 28v-8l5.1-1.3a16 16 0 0 1 1.7-4.1l-2.5-4.6L10 4.3l4.6 2.5a16 16 0 0 1 4.1-1.7L20 0" transform="translate(4 2) scale(.82)"/><circle cx="24" cy="24" r="8"/></svg></button>
  </header>
  <section class="greeting"><div class="hello">Good morning,</div><div class="person">Adeola <span class="wave">👋</span></div><div class="tagline">Your safety matters. We’re always here.</div></section>
  <section class="sos-wrap" aria-label="Emergency alert"><div class="sos-halo"><button class="sos-button" id="sosButton" aria-label="Send emergency alert"><svg viewBox="0 0 80 80" aria-hidden="true"><path d="M34 9c3-5 9-5 12 0l29 51c3 5 0 11-6 11H11c-6 0-9-6-6-11L34 9Z" fill="#fff"/><path d="M40 29v16" stroke="#f11920" stroke-width="7" stroke-linecap="round"/><circle cx="40" cy="55" r="4" fill="#f11920"/></svg><span class="sos-title">SOS</span><span class="sos-caption">Tap to send<br/>an emergency alert</span></button></div></section>
  <section class="feature-grid" aria-label="Safety features">
    <button class="feature" data-message="Journey Safety — plan a trip and get protected."><svg class="feature-icon" viewBox="0 0 56 60" aria-hidden="true"><path d="M28 3C14 3 4 14 4 27c0 16 24 32 24 32s24-16 24-32C52 14 42 3 28 3Z" fill="currentColor"/><circle cx="28" cy="26" r="8" fill="#fff"/></svg><h2>Journey Safety</h2><p>Plan your trip<br/>and get protected</p></button>
    <button class="feature" data-message="Live Tracking — share your location with trusted contacts."><svg class="feature-icon" viewBox="0 0 60 64" aria-hidden="true"><path d="M30 3 55 13v19c0 15-10 25-25 30C15 57 5 47 5 32V13L30 3Z" fill="currentColor"/><path d="m33 13-15 24h11l-2 15 15-25H31l2-14Z" fill="#fff"/></svg><h2>Live Tracking</h2><p>Share your location<br/>with trusted contacts</p></button>
    <button class="feature" data-message="Trusted Contacts — manage your emergency contacts."><svg class="feature-icon" viewBox="0 0 64 60" aria-hidden="true"><circle cx="22" cy="17" r="12" fill="currentColor"/><circle cx="45" cy="20" r="10" fill="currentColor"/><path d="M2 51c0-12 8-20 20-20s20 8 20 20v4H2v-4Z" fill="currentColor"/><path d="M39 34c12-3 23 5 23 17v4H45v-4c0-7-2-13-6-17Z" fill="currentColor"/></svg><h2>Trusted Contacts</h2><p>Manage your<br/>emergency contacts</p></button>
    <button class="feature" data-message="Safety History — view past alerts and activity."><svg class="feature-icon" viewBox="0 0 60 64" aria-hidden="true"><path d="M12 3h25l14 14v41a3 3 0 0 1-3 3H12a5 5 0 0 1-5-5V8a5 5 0 0 1 5-5Z" fill="currentColor"/><path d="M37 4v15h14" fill="#fff" opacity=".8"/><path d="M18 29h24M18 38h24M18 47h18" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg><h2>Safety History</h2><p>View past alerts<br/>and activity</p></button>
  </section>
</main>
<nav class="bottom-nav" aria-label="Main navigation">
  <button class="nav-item active" data-tab="Home"><svg viewBox="0 0 40 40" fill="currentColor" stroke="currentColor" stroke-width="1.8"><path d="m4 18 16-14 16 14h-5v17H9V18H4Z" stroke-linejoin="round"/><path d="M16 35V23h8v12" fill="#fff" stroke="#fff"/></svg><span>Home</span></button>
  <button class="nav-item" data-tab="Map"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3.3"><path d="M20 36S7 22 7 15a13 13 0 1 1 26 0c0 7-13 21-13 21Z"/><circle cx="20" cy="15" r="4.5"/></svg><span>Map</span></button>
  <button class="nav-item" data-tab="Alerts"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 28h20l-3-5V16a7 7 0 0 0-14 0v7l-3 5Z"/><path d="M16 33c1 4 7 4 8 0M17 7a3 3 0 0 1 6 0"/></svg><span>Alerts</span></button>
  <button class="nav-item" data-tab="More"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><path d="M4 10h32M4 20h32M4 30h32"/></svg><span>More</span></button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
  const toast = document.getElementById('toast');
  let toastTimer;
  function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2600)}
  document.querySelectorAll('[data-message]').forEach(button=>button.addEventListener('click',()=>showToast(button.dataset.message)));
  document.getElementById('sosButton').addEventListener('click',()=>{
    const confirmed=window.confirm('Do you need emergency assistance? Send an SOS alert?');
    if(confirmed) showToast('SOS requested. Connect this button to your emergency alert service to notify contacts.');
  });
  document.querySelectorAll('[data-tab]').forEach(button=>button.addEventListener('click',()=>{
    document.querySelectorAll('[data-tab]').forEach(item=>item.classList.remove('active'));
    button.classList.add('active');
    if(button.dataset.tab!=='Home') showToast(button.dataset.tab+' screen selected. Connect this tab to its page.');
  }));
</script>
</body>
</html>
