<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=0.8">
  <title>Notebook Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

  <style>
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .ql-editor { min-height: 220px; font-size: 0.95rem; }
    .toast {
      position: fixed;
      right: 1rem;
      top: 1rem;
      z-index: 60;
      background: rgba(16, 185, 129, 0.95);
      color: white;
      padding: .5rem .9rem;
      border-radius: .5rem;
      box-shadow: 0 8px 20px rgba(2,6,23,.08);
      display: none;
      align-items:center;
      gap:.5rem;
      font-weight:600;
      font-size:.95rem;
    }
    .toast.error { background: rgba(239,68,68,0.95); }
  </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans antialiased text-gray-900 pb-20 md:pb-6">

  <div id="toast" class="toast"><span id="toastText"></span></div>

  <div class="w-full max-w-6xl mx-auto bg-[#F8FAFC] min-h-screen md:min-h-[850px] md:my-6 md:rounded-3xl shadow-xl border border-gray-200 flex flex-col relative overflow-hidden">

    <header class="px-4 sm:px-6 py-3.5 flex items-center justify-between bg-white/80 backdrop-blur-md border-b border-gray-200 sticky top-0 z-30">
      <div class="flex items-center gap-3">
        <button id="backBtn" class="p-2 text-gray-700 hover:bg-gray-100 rounded-full transition" title="Back">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <div>
          <h1 id="header-book-title" class="text-base sm:text-lg font-bold text-gray-900 leading-tight">Loading…</h1>
          <p class="text-xs text-gray-500 font-medium">Manage your book and chapters</p>
        </div>
      </div>

      <div class="flex items-center gap-2 relative">
        <button id="newChapterBtn" class="bg-indigo-600 text-white px-3 py-2 rounded-md text-sm font-semibold hover:bg-indigo-700">+ New Chapter</button>
        <button id="refreshBtn" class="bg-white border px-3 py-2 rounded-md text-sm font-medium hover:bg-gray-50 ml-2">Refresh</button>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto px-4 sm:px-6 py-6 space-y-6">

      <div class="bg-white rounded-2xl p-4 sm:p-6 shadow-sm border border-gray-200 flex flex-col sm:flex-row gap-5 items-start">
        <div class="relative w-full sm:w-36 h-48 sm:h-52 rounded-xl overflow-hidden shadow-md shrink-0 flex flex-col justify-between p-3.5 text-white bg-emerald-950 group">
          <img id="cover-img" src="" class="absolute inset-0 w-full h-full object-cover opacity-90 transition" alt="cover">
          <div class="relative z-10 text-center mt-2">
            <p id="cover-sub" class="text-[9px] uppercase tracking-wider font-medium opacity-90"></p>
            <h3 id="cover-title-display" class="text-base font-serif font-bold tracking-wide uppercase leading-tight mt-0.5"></h3>
            <p id="cover-desc" class="text-[8px] leading-tight mt-3 text-emerald-100 font-light px-1"></p>
          </div>
        </div>

        <div class="flex-1 w-full min-w-0">
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              <h2 id="main-book-title" class="text-xl sm:text-2xl font-bold text-gray-900 truncate"></h2>
            </div>
            <div class="text-sm text-gray-500" id="book-meta-right"></div>
          </div>

          <p class="text-xs text-gray-500 mt-1" id="book-updated"></p>
          <p id="main-book-desc" class="text-xs text-gray-600 mt-2.5 leading-relaxed line-clamp-2 sm:line-clamp-none"></p>

          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3 mt-4 pt-3 border-t border-gray-100">
            <div>
              <p class="text-[9px] text-gray-400 uppercase font-semibold">Course</p>
              <p class="text-xs font-bold text-gray-800 leading-tight" id="book-course"></p>
            </div>
            <div>
              <p class="text-[9px] text-gray-400 uppercase font-semibold">Faculty</p>
              <p class="text-xs font-bold text-gray-800 leading-tight" id="book-faculty"></p>
            </div>
            <div>
              <p class="text-[9px] text-gray-400 uppercase font-semibold">Lecturer</p>
              <p class="text-xs font-bold text-gray-800 leading-tight" id="book-lecturer"></p>
            </div>
            <div>
              <p class="text-[9px] text-gray-400 uppercase font-semibold">Visibility</p>
              <p class="text-xs font-bold text-gray-800 leading-tight" id="book-visibility"></p>
            </div>
            <div>
              <p class="text-[9px] text-gray-400 uppercase font-semibold">Department</p>
              <p class="text-xs font-bold text-gray-800 leading-tight" id="book-dept"></p>
            </div>
            <div>
              <p class="text-[9px] text-gray-400 uppercase font-semibold">Created</p>
              <p class="text-xs font-bold text-gray-800 leading-tight" id="book-created"></p>
            </div>
          </div>
        </div>
      </div>

      <section class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-sm font-bold text-gray-900">Chapters</h3>
          <div class="text-xs text-gray-500" id="chaptersCount">0 chapters</div>
        </div>

        <div id="chaptersList" class="space-y-3"></div>

        <div class="mt-4 flex gap-2">
          <button id="saveOrderBtn" class="px-3 py-2 bg-indigo-600 text-white rounded-md text-sm font-semibold hover:bg-indigo-700">Save Order</button>
          <button id="collapseAllBtn" class="px-3 py-2 bg-white border rounded-md text-sm hover:bg-gray-50">Collapse All</button>
        </div>
      </section>

      <section id="chapterEditorSection" class="hidden bg-white rounded-2xl p-4 border border-gray-100 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <h3 id="editorTitle" class="text-sm font-bold text-gray-900">New Chapter</h3>
          <div class="flex items-center gap-2">
            <button id="cancelEditBtn" class="px-3 py-2 bg-white border rounded-md text-sm hover:bg-gray-50">Cancel</button>
            <button id="saveChapterBtn" class="px-3 py-2 bg-emerald-600 text-white rounded-md text-sm font-semibold hover:bg-emerald-700">Save Chapter</button>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div class="md:col-span-2">
            <label class="text-xs font-semibold text-gray-700">Title</label>
            <input id="chapterTitleInput" class="mt-1 w-full rounded-md border px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="Chapter title">

            <label class="text-xs font-semibold text-gray-700 mt-3 block">Content</label>
            <div id="chapterEditor" class="mt-2 bg-white rounded-md border"></div>
          </div>

          <div>
            <label class="text-xs font-semibold text-gray-700">Chapter Number</label>
            <input id="chapterNumberInput" type="number" min="1" class="mt-1 w-28 rounded-md border px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">

            <label class="text-xs font-semibold text-gray-700 mt-3 block">Status</label>
            <select id="chapterStatus" class="mt-1 w-full rounded-md border px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              <option value="draft">Draft</option>
              <option value="published">Published</option>
            </select>

            <label class="text-xs font-semibold text-gray-700 mt-3 block">Locked</label>
            <div class="mt-1">
              <label class="inline-flex items-center text-sm cursor-pointer">
                <input id="chapterLocked" type="checkbox" class="form-checkbox h-4 w-4 text-indigo-600 rounded border-gray-300 focus:ring-indigo-500">
                <span class="ml-2 text-gray-700">Is Locked</span>
              </label>
            </div>

            <div class="mt-6 p-3 bg-gray-50 rounded-lg border border-gray-100 text-xs text-gray-600 space-y-1">
              <p><strong>Word count:</strong> <span id="editorWordCount">0</span></p>
              <p><strong>Est. reading time:</strong> <span id="editorEst">0</span> min</p>
            </div>
          </div>
        </div>
      </section>

    </main>
  </div>

<script>
  const API_BASE = "https://examguide.onrender.com/api";
  const credentialsOpt = { credentials: 'include', headers: { 'Accept': 'application/json' } };

  function qsParam(name) { return new URLSearchParams(window.location.search).get(name); }
  const resourceId = qsParam('id');

  const toast = document.getElementById('toast');
  const toastText = document.getElementById('toastText');
  const headerTitle = document.getElementById('header-book-title');
  const coverImg = document.getElementById('cover-img');
  const coverTitleDisplay = document.getElementById('cover-title-display');
  const coverSub = document.getElementById('cover-sub');
  const coverDesc = document.getElementById('cover-desc');
  const mainBookTitle = document.getElementById('main-book-title');
  const mainBookDesc = document.getElementById('main-book-desc');
  const bookCourse = document.getElementById('book-course');
  const bookFaculty = document.getElementById('book-faculty');
  const bookLecturer = document.getElementById('book-lecturer');
  const bookVisibility = document.getElementById('book-visibility');
  const bookDept = document.getElementById('book-dept');
  const bookCreated = document.getElementById('book-created');
  const chaptersList = document.getElementById('chaptersList');
  const chaptersCount = document.getElementById('chaptersCount');
  const newChapterBtn = document.getElementById('newChapterBtn');
  const refreshBtn = document.getElementById('refreshBtn');
  const saveOrderBtn = document.getElementById('saveOrderBtn');
  const collapseAllBtn = document.getElementById('collapseAllBtn');

  const chapterEditorSection = document.getElementById('chapterEditorSection');
  const editorTitle = document.getElementById('editorTitle');
  const chapterTitleInput = document.getElementById('chapterTitleInput');
  const chapterNumberInput = document.getElementById('chapterNumberInput');
  const chapterStatus = document.getElementById('chapterStatus');
  const chapterLocked = document.getElementById('chapterLocked');
  const cancelEditBtn = document.getElementById('cancelEditBtn');
  const saveChapterBtn = document.getElementById('saveChapterBtn');
  const editorWordCount = document.getElementById('editorWordCount');
  const editorEst = document.getElementById('editorEst');

  const quill = new Quill('#chapterEditor', {
    theme: 'snow',
    placeholder: 'Write chapter content here...',
    modules: {
      toolbar: [
        [{ 'header': [1, 2, 3, false] }],
        ['bold', 'italic', 'underline', 'strike'],
        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
        ['link', 'blockquote', 'code-block'],
        ['clean']
      ]
    }
  });

  let chapters = [];
  let currentEditing = null;

  function showToast(msg, isError = false, t = 2500) {
    toastText.textContent = msg;
    toast.classList.toggle('error', isError);
    toast.style.display = 'flex';
    setTimeout(() => { toast.style.display = 'none'; }, t);
  }

  async function apiFetch(path, opts = {}) {
    const options = { ...credentialsOpt, ...opts };
    if (opts.body && !(opts.body instanceof FormData)) {
      options.headers = { ...options.headers, 'Content-Type': 'application/json' };
      options.body = JSON.stringify(opts.body);
    }
    const res = await fetch(API_BASE + path, options);
    if (!res.ok) {
      let txt = await res.text().catch(() => null);
      let err;
      try { err = JSON.parse(txt); } catch(e) { err = { message: txt || res.statusText }; }
      throw { status: res.status, body: err };
    }
    const ct = res.headers.get('content-type') || '';
    if (ct.includes('application/json')) return res.json();
    return res.text();
  }

  async function loadResource() {
    if (!resourceId) {
      showToast('Missing resource id', true);
      return;
    }
    try {
      const j = await apiFetch(`/resource/${encodeURIComponent(resourceId)}`);
      const res = j.resource || j.data || j;
      headerTitle.textContent = (res.title || res.name || 'Untitled');
      mainBookTitle.textContent = (res.title || 'Untitled');
      mainBookDesc.textContent = (res.description || res.introduction || '');
      coverTitleDisplay.textContent = (res.title || '').split(' ').slice(0,3).join(' ');
      coverSub.textContent = (res.subtitle || '').slice(0,40);
      coverDesc.textContent = (res.publisher || '');
      coverImg.src = (res.cover && res.cover.url) ? res.cover.url : '';

      bookCourse.textContent = res.courseCode || res.course || '—';
      bookFaculty.textContent = res.faculty || '—';
      bookLecturer.textContent = res.lecturer || res.uploaderName || '—';
      bookVisibility.textContent = res.visibility || '—';
      bookDept.textContent = res.department || '—';
      bookCreated.textContent = res.createdAt ? new Date(res.createdAt).toLocaleDateString() : '—';
    } catch (err) {
      console.error(err);
      showToast('Could not load resource details', true);
    }
  }

  async function loadChapters() {
    if (!resourceId) return;
    try {
      const q = await apiFetch(`/resource/${encodeURIComponent(resourceId)}/chapters`);
      chapters = q.chapters || q.data || [];
      chapters.sort((a,b) => (a.chapterNumber || 0) - (b.chapterNumber || 0));
      renderChapters();
    } catch (err) {
      console.error(err);
      showToast('Could not load chapters', true);
    }
  }

  function renderChapters() {
    chaptersList.innerHTML = '';
    if (!chapters || chapters.length === 0) {
      chaptersList.innerHTML = '<div class="text-sm text-gray-500 py-6 text-center">No chapters yet. Click "New Chapter" to add one.</div>';
      chaptersCount.textContent = '0 chapters';
      return;
    }
    chaptersCount.textContent = `${chapters.length} chapter${chapters.length === 1 ? '' : 's'}`;
    chapters.forEach((ch, idx) => {
      const el = document.createElement('div');
      el.className = 'bg-gray-50 rounded-md p-3 border border-gray-200 hover:border-gray-300 transition';
      el.dataset.id = ch._id || ch.id;

      const header = document.createElement('div');
      header.className = 'flex items-start justify-between gap-3';

      const left = document.createElement('div');
      left.className = 'min-w-0';
      left.innerHTML = `<div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-md bg-white border flex items-center justify-center text-sm font-semibold text-gray-700 shadow-sm">${ch.chapterNumber || (idx + 1)}</div>
        <div class="min-w-0">
          <div class="text-sm font-bold text-gray-900 truncate">${escapeHtml(ch.title || 'Untitled')}</div>
          <div class="text-xs text-gray-500 mt-0.5">${(ch.status || 'draft').toUpperCase()} ${ch.isLocked ? '• Locked' : ''}</div>
        </div>
      </div>`;

      const actions = document.createElement('div');
      actions.className = 'flex items-center gap-1.5';

      const upBtn = document.createElement('button');
      upBtn.className = 'px-2 py-1 bg-white border rounded text-xs hover:bg-gray-100 disabled:opacity-40 disabled:hover:bg-white';
      upBtn.textContent = '↑';
      upBtn.title = 'Move up';
      upBtn.disabled = idx === 0;
      upBtn.addEventListener('click', () => moveChapter(idx, idx - 1));

      const downBtn = document.createElement('button');
      downBtn.className = 'px-2 py-1 bg-white border rounded text-xs hover:bg-gray-100 disabled:opacity-40 disabled:hover:bg-white';
      downBtn.textContent = '↓';
      downBtn.title = 'Move down';
      downBtn.disabled = idx === chapters.length - 1;
      downBtn.addEventListener('click', () => moveChapter(idx, idx + 1));

      const editBtn = document.createElement('button');
      editBtn.className = 'px-3 py-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded text-xs font-medium transition';
      editBtn.textContent = 'Edit';
      editBtn.addEventListener('click', () => openEditorFor(ch._id || ch.id));

      const delBtn = document.createElement('button');
      delBtn.className = 'px-3 py-1 bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 rounded text-xs transition';
      delBtn.textContent = 'Delete';
      delBtn.addEventListener('click', () => attemptDeleteChapter(ch._id || ch.id));

      actions.appendChild(upBtn);
      actions.appendChild(downBtn);
      actions.appendChild(editBtn);
      actions.appendChild(delBtn);

      header.appendChild(left);
      header.appendChild(actions);

      const preview = document.createElement('div');
      preview.className = 'mt-3 text-xs text-gray-600 bg-white p-2.5 rounded border border-gray-100 line-clamp-2';
      preview.innerHTML = ch.contentHtml ? sanitizePreview(ch.contentHtml) : '<em class="text-gray-400">No content available</em>';

      el.appendChild(header);
      el.appendChild(preview);
      chaptersList.appendChild(el);
    });
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }

  function sanitizePreview(html) {
    const div = document.createElement('div');
    div.innerHTML = html || '';
    div.querySelectorAll('script, style').forEach(n => n.remove());
    const text = div.textContent || div.innerText || '';
    return escapeHtml(text.trim().slice(0, 300)) + (text.length > 300 ? '…' : '');
  }

  function clientSanitizeHtml(html) {
    const d = document.createElement('div');
    d.innerHTML = html;
    d.querySelectorAll('script').forEach(n => n.remove());
    return d.innerHTML;
  }

  function moveChapter(fromIdx, toIdx) {
    if (toIdx < 0 || toIdx >= chapters.length) return;
    const [item] = chapters.splice(fromIdx, 1);
    chapters.splice(toIdx, 0, item);
    chapters.forEach((c, i) => c.chapterNumber = i + 1);
    renderChapters();
  }

  async function saveOrder() {
    if (!resourceId) return;
    try {
      const order = chapters.map(c => c._id || c.id);
      await apiFetch(`/resource/${encodeURIComponent(resourceId)}/reorder`, { method: 'PUT', body: { order } });
      showToast('Order saved successfully');
      await loadChapters();
    } catch (err) {
      console.error(err);
      showToast('Could not save order', true);
    }
  }

  function openNewEditor() {
    currentEditing = null;
    editorTitle.textContent = 'New Chapter';
    chapterTitleInput.value = '';
    chapterNumberInput.value = (chapters.length + 1) || 1;
    chapterStatus.value = 'draft';
    chapterLocked.checked = false;
    quill.setText('');
    updateEditorStats();
    chapterEditorSection.classList.remove('hidden');
    chapterEditorSection.scrollIntoView({ behavior: 'smooth' });
  }

  async function openEditorFor(chapterId) {
    currentEditing = chapterId;
    editorTitle.textContent = 'Edit Chapter';
    chapterEditorSection.classList.remove('hidden');
    try {
      const j = await apiFetch(`/resource/${encodeURIComponent(resourceId)}/chapters/${encodeURIComponent(chapterId)}`);
      const c = j.chapter || j.data || j;
      chapterTitleInput.value = c.title || '';
      chapterNumberInput.value = c.chapterNumber || '';
      chapterStatus.value = c.status || 'draft';
      chapterLocked.checked = !!c.isLocked;
      quill.root.innerHTML = c.contentHtml || '';
      updateEditorStats();
      chapterEditorSection.scrollIntoView({ behavior: 'smooth' });
    } catch (err) {
      console.error(err);
      showToast('Could not load chapter content', true);
    }
  }

  cancelEditBtn.addEventListener('click', () => {
    chapterEditorSection.classList.add('hidden');
    currentEditing = null;
  });

  saveChapterBtn.addEventListener('click', async () => {
    const title = (chapterTitleInput.value || '').trim();
    const chapterNumber = Number(chapterNumberInput.value) || (chapters.length + 1);
    const status = chapterStatus.value || 'draft';
    const isLocked = !!chapterLocked.checked;
    const rawHtml = quill.root.innerHTML || '';
    const contentHtml = clientSanitizeHtml(rawHtml);

    if (!title) {
      showToast('Title is required', true);
      return;
    }

    try {
      const body = { title, chapterNumber, contentHtml, status, isLocked };
      if (currentEditing) {
        await apiFetch(`/resource/${encodeURIComponent(resourceId)}/chapters/${encodeURIComponent(currentEditing)}`, { method: 'PUT', body });
        showToast('Chapter updated successfully');
      } else {
        await apiFetch(`/resource/${encodeURIComponent(resourceId)}/chapters`, { method: 'POST', body });
        showToast('Chapter created successfully');
      }
      chapterEditorSection.classList.add('hidden');
      currentEditing = null;
      await loadChapters();
    } catch (err) {
      console.error(err);
      const msg = (err && err.body && err.body.error) ? err.body.error : 'Could not save chapter';
      showToast(msg, true);
    }
  });

  async function attemptDeleteChapter(chapterId) {
    if (!confirm('Are you sure you want to delete this chapter? This cannot be undone.')) return;
    try {
      await apiFetch(`/resource/${encodeURIComponent(resourceId)}/chapters/${encodeURIComponent(chapterId)}`, { method: 'DELETE' });
      showToast('Chapter deleted');
      await loadChapters();
    } catch (err) {
      console.error(err);
      showToast('Could not delete chapter', true);
    }
  }

  function updateEditorStats() {
    const text = quill.getText().trim();
    const words = text ? text.split(/\s+/).filter(Boolean).length : 0;
    editorWordCount.textContent = words;
    editorEst.textContent = words > 0 ? Math.max(1, Math.ceil(words / 200)) : 0;
  }
  quill.on('text-change', updateEditorStats);

  saveOrderBtn.addEventListener('click', saveOrder);
  newChapterBtn.addEventListener('click', openNewEditor);
  refreshBtn.addEventListener('click', async () => {
    await loadResource();
    await loadChapters();
    showToast('Refreshed');
  });

  collapseAllBtn.addEventListener('click', () => {
    chapterEditorSection.classList.add('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  chapterNumberInput.addEventListener('input', () => {
    const v = Number(chapterNumberInput.value) || 1;
    chapterNumberInput.value = Math.max(1, Math.floor(v));
  });

  document.getElementById('backBtn').addEventListener('click', () => {
    if (document.referrer) {
      window.location.href = document.referrer;
    } else {
      window.location.href = '/up.html';
    }
  });

  (async function init() {
    if (!resourceId) {
      showToast('No resource ID specified in URL', true);
      return;
    }
    await loadResource();
    await loadChapters();
  })();
</script>

</body>
</html>
