<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=0.88">
  <title>Notebook Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

  <style>
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Global Quill tweaks */
    .ql-container.ql-snow {
      border-bottom-left-radius: 0.375rem;
      border-bottom-right-radius: 0.375rem;
    }
    .ql-toolbar.ql-snow {
      border-top-left-radius: 0.375rem;
      border-top-right-radius: 0.375rem;
      background-color: #f8fafc;
    }

    /* Toast */
    .toast {
      position: fixed;
      right: 1rem;
      top: 1rem;
      z-index: 60;
      background: rgba(16, 185, 129, 0.95);
      color: white;
      padding: .5rem .9rem;
      border-radius: .5rem;
      box-shadow: 0 8px 20px rgba(2,6,23,.08);
      display: none;
      align-items: center;
      gap: .5rem;
      font-weight: 600;
      font-size: .95rem;
    }
    .toast.error { background: rgba(239,68,68,0.95); }

    /* Editor container layout & padding adjustments */
    #chapterEditor {
      height: 52vh;
      min-height: 320px;
      max-height: 720px;
      padding: 0.5rem;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      background: transparent;
    }

    #chapterEditor .ql-toolbar {
      flex: 0 0 auto;
      border-radius: 8px 8px 0 0;
      padding: 6px 8px;
      background: #f8fafc;
    }

    #chapterEditor .ql-container.ql-snow {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 4px 18px rgba(2,6,23,0.04);
      overflow: hidden;
    }

    #chapterEditor .ql-editor {
      padding: 1rem;
      box-sizing: border-box;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      flex: 1 1 auto;
      min-height: 0;
      font-size: 0.95rem;
      line-height: 1.6;
      background: white;
    }

    #chapterEditor .ql-editor p {
      margin: 0 0 0.75rem 0;
    }

    #chapterEditor .ql-formats {
      gap: 6px;
    }

    @media (min-width: 768px) {
      .grid .md\:col-span-2 { padding-right: 1rem; }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans antialiased text-gray-900 pb-20 md:pb-6">

  <div id="toast" class="toast"><span id="toastText"></span></div>

  <div class="w-full max-w-6xl mx-auto bg-[#F8FAFC] min-h-screen md:min-h-[850px] md:my-6 md:rounded-3xl shadow-xl border border-gray-200 flex flex-col relative">

    <!-- Sticky Header -->
    <header class="px-4 sm:px-6 py-3.5 flex items-center justify-between bg-white/90 backdrop-blur-md border-b border-gray-200 sticky top-0 z-40 md:rounded-t-3xl shadow-sm">
      <div class="flex items-center gap-3">
        <button id="backBtn" class="p-2 text-gray-700 hover:bg-gray-100 rounded-full transition" title="Back">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <div>
          <h1 id="header-book-title" class="text-base sm:text-lg font-bold text-gray-900 leading-tight">Loading…</h1>
          <p class="text-xs text-gray-500 font-medium">Manage your book and chapters</p>
        </div>
      </div>

      <div class="flex items-center gap-2 relative">
        <button id="newChapterBtn" class="bg-indigo-600 text-white px-3 py-2 rounded-md text-sm font-semibold hover:bg-indigo-700 transition inline-flex items-center justify-center">+ New Chapter</button>
        <button id="refreshBtn" class="bg-white border border-gray-300 px-3 py-2 rounded-md text-sm font-medium hover:bg-gray-50 transition inline-flex items-center justify-center">Refresh</button>
      </div>
    </header>

    <main class="flex-1 px-4 sm:px-6 py-6 space-y-6">

      <!-- Book Details Header Card -->
      <div class="bg-white rounded-2xl p-4 sm:p-6 shadow-sm border border-gray-200 flex flex-col sm:flex-row gap-5 items-start">
        <div class="relative w-full sm:w-36 h-48 sm:h-52 rounded-xl overflow-hidden shadow-md shrink-0 flex flex-col justify-between p-3.5 text-white bg-emerald-950 group">
          <img id="cover-img" src="" class="absolute inset-0 w-full h-full object-cover opacity-90 transition" alt="cover">
          <div class="relative z-10 text-center mt-2">
            <p id="cover-sub" class="text-[9px] uppercase tracking-wider font-medium opacity-90"></p>
            <h3 id="cover-title-display" class="text-base font-serif font-bold tracking-wide uppercase leading-tight mt-0.5"></h3>
            <p id="cover-desc" class="text-[8px] leading-tight mt-3 text-emerald-100 font-light px-1"></p>
          </div>
        </div>

        <div class="flex-1 w-full min-w-0">
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              <h2 id="main-book-title" class="text-xl sm:text-2xl font-bold text-gray-900 truncate"></h2>
            </div>
            <div class="text-sm text-gray-500" id="book-meta-right"></div>
          </div>

          <p class="text-xs text-gray-500 mt-1" id="book-updated"></p>

          <p id="main-book-desc" class="text-xs text-gray-600 mt-2.5 leading-relaxed line-clamp-2 sm:line-clamp-none"></p>

          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3 mt-4 pt-3 border-t border-gray-100">
            <div>
              <p class="text-[9px] text-gray-400 uppercase font-semibold">Course</p>
              <p class="text-xs font-bold text-gray-800 leading-tight" id="book-course"></p>
            </div>
            <div>
              <p class="text-[9px] text-gray-400 uppercase font-semibold">Faculty</p>
              <p class="text-xs font-bold text-gray-800 leading-tight" id="book-faculty"></p>
            </div>
            <div>
              <p class="text-[9px] text-gray-400 uppercase font-semibold">Lecturer</p>
              <p class="text-xs font-bold text-gray-800 leading-tight" id="book-lecturer"></p>
            </div>
            <div>
              <p class="text-[9px] text-gray-400 uppercase font-semibold">Visibility</p>
              <p class="text-xs font-bold text-gray-800 leading-tight" id="book-visibility"></p>
            </div>
            <div>
              <p class="text-[9px] text-gray-400 uppercase font-semibold">Department</p>
              <p class="text-xs font-bold text-gray-800 leading-tight" id="book-dept"></p>
            </div>
            <div>
              <p class="text-[9px] text-gray-400 uppercase font-semibold">Created</p>
              <p class="text-xs font-bold text-gray-800 leading-tight" id="book-created"></p>
            </div>
          </div>
        </div>
      </div>

      <!-- Chapters Section -->
      <section id="chaptersSection" class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-sm font-bold text-gray-900">Chapters</h3>
          <div class="text-xs text-gray-500" id="chaptersCount">0 chapters</div>
        </div>

        <div id="chaptersList" class="space-y-3"></div>

        <div class="mt-4 flex gap-2">
          <button id="saveOrderBtn" class="px-3 py-2 bg-indigo-600 text-white rounded-md text-sm font-semibold hover:bg-indigo-700 transition inline-flex items-center justify-center">Save Order</button>
          <button id="collapseAllBtn" class="px-3 py-2 bg-white border border-gray-300 rounded-md text-sm hover:bg-gray-50 transition inline-flex items-center justify-center">Collapse All</button>
        </div>
      </section>

      <!-- Chapter Editor Section -->
      <section id="chapterEditorSection" class="hidden bg-white rounded-2xl p-4 border border-gray-100 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <h3 id="editorTitle" class="text-sm font-bold text-gray-900">New Chapter</h3>
          <div class="flex items-center gap-2">
            <button id="cancelEditBtn" class="px-3 py-2 bg-white border border-gray-300 rounded-md text-sm hover:bg-gray-50 transition inline-flex items-center justify-center">Cancel</button>
            <button id="saveChapterBtn" class="px-3 py-2 bg-emerald-600 text-white rounded-md text-sm font-semibold hover:bg-emerald-700 transition inline-flex items-center justify-center">Save Chapter</button>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div class="md:col-span-2">
            <label class="text-xs font-semibold text-gray-700">Title</label>
            <input id="chapterTitleInput" class="mt-1 w-full rounded-md border px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Chapter title">

            <label class="text-xs font-semibold text-gray-700 mt-3 block">Content</label>
            <div id="chapterEditor" class="mt-1 bg-white rounded-md border"></div>
          </div>

          <div>
            <label class="text-xs font-semibold text-gray-700">Chapter Number</label>
            <input id="chapterNumberInput" type="number" min="1" class="mt-1 w-28 rounded-md border px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">

            <label class="text-xs font-semibold text-gray-700 mt-3 block">Status</label>
            <select id="chapterStatus" class="mt-1 w-full rounded-md border px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="draft">Draft</option>
              <option value="published">Published</option>
            </select>

            <label class="text-xs font-semibold text-gray-700 mt-3 block">Locked</label>
            <div class="mt-1">
              <label class="inline-flex items-center text-sm cursor-pointer">
                <input id="chapterLocked" type="checkbox" class="form-checkbox h-4 w-4 text-indigo-600 rounded">
                <span class="ml-2 text-gray-700">Is Locked</span>
              </label>
            </div>

            <div class="mt-4 text-sm text-gray-500 space-y-1">
              <p><strong>Word count:</strong> <span id="editorWordCount">0</span></p>
              <p><strong>Est. minutes:</strong> <span id="editorEst">0</span></p>
            </div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <!-- Mobile Bottom Navbar with Full Icons -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-gray-200 z-50 px-6 py-2 flex justify-between items-center md:hidden shadow-lg">
    <button id="navBack" class="flex flex-col items-center justify-center text-gray-600 hover:text-indigo-600 transition min-w-[50px] py-1">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
      <span class="text-[10px] mt-1 font-medium">Back</span>
    </button>
    <button id="navChapters" class="flex flex-col items-center justify-center text-gray-600 hover:text-indigo-600 transition min-w-[50px] py-1">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"/></svg>
      <span class="text-[10px] mt-1 font-medium">Chapters</span>
    </button>
    <button id="navNewChapter" class="flex flex-col items-center justify-center text-indigo-600 hover:text-indigo-800 transition min-w-[50px] py-1">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v6m3-3H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <span class="text-[10px] mt-0.5 font-bold">New</span>
    </button>
    <button id="navRefresh" class="flex flex-col items-center justify-center text-gray-600 hover:text-indigo-600 transition min-w-[50px] py-1">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
      <span class="text-[10px] mt-1 font-medium">Refresh</span>
    </button>
  </nav>

<script>
  const API_BASE = "https://examguide.onrender.com/api";
  const credentialsOpt = { credentials: 'include', headers: { 'Accept': 'application/json' } };

  function qsParam(name) { return new URLSearchParams(window.location.search).get(name); }
  const resourceId = qsParam('id');

  const toast = document.getElementById('toast');
  const toastText = document.getElementById('toastText');
  const headerTitle = document.getElementById('header-book-title');
  const coverImg = document.getElementById('cover-img');
  const coverTitleDisplay = document.getElementById('cover-title-display');
  const coverSub = document.getElementById('cover-sub');
  const coverDesc = document.getElementById('cover-desc');
  const mainBookTitle = document.getElementById('main-book-title');
  const mainBookDesc = document.getElementById('main-book-desc');
  const bookCourse = document.getElementById('book-course');
  const bookFaculty = document.getElementById('book-faculty');
  const bookLecturer = document.getElementById('book-lecturer');
  const bookVisibility = document.getElementById('book-visibility');
  const bookDept = document.getElementById('book-dept');
  const bookCreated = document.getElementById('book-created');
  const chaptersList = document.getElementById('chaptersList');
  const chaptersCount = document.getElementById('chaptersCount');
  const newChapterBtn = document.getElementById('newChapterBtn');
  const refreshBtn = document.getElementById('refreshBtn');
  const saveOrderBtn = document.getElementById('saveOrderBtn');
  const collapseAllBtn = document.getElementById('collapseAllBtn');

  const chapterEditorSection = document.getElementById('chapterEditorSection');
  const editorTitle = document.getElementById('editorTitle');
  const chapterTitleInput = document.getElementById('chapterTitleInput');
  const chapterNumberInput = document.getElementById('chapterNumberInput');
  const chapterStatus = document.getElementById('chapterStatus');
  const chapterLocked = document.getElementById('chapterLocked');
  const cancelEditBtn = document.getElementById('cancelEditBtn');
  const saveChapterBtn = document.getElementById('saveChapterBtn');
  const editorWordCount = document.getElementById('editorWordCount');
  const editorEst = document.getElementById('editorEst');

  const quill = new Quill('#chapterEditor', {
  theme: 'snow',
  placeholder: 'Write chapter content here...',
  modules: {
    toolbar: {
      container: [
        [{ header: [1, 2, 3, 4, false] }],
        ['bold', 'italic', 'underline', 'strike'],
        [{ color: [] }, { background: [] }],
        [{ script: 'sub' }, { script: 'super' }],
        [{ list: 'ordered' }, { list: 'bullet' }],
        [{ indent: '-1' }, { indent: '+1' }],
        [{ align: [] }],
        ['blockquote', 'code-block'],
        ['link', 'image'],
        ['clean']
      ],
      handlers: {
        image: imageHandler
      }
    }
  }
});
async function imageHandler() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';

  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;

    const form = new FormData();
    form.append('image', file);

    try {
      const token = localStorage.getItem("token");

      const resp = await fetch(`${API_BASE}/resource/uploads/editor`, {
        method: 'POST',
        body: form,
        credentials: 'include',
        headers: token
          ? { Authorization: `Bearer ${token}` }
          : {}
      });

      if (!resp.ok) {
        showToast('Image upload failed', true);
        return;
      }

      const data = await resp.json();

      const imageUrl =
        data.url ||
        data.imageUrl ||
        data.secure_url ||
        data.image?.url;

      if (!imageUrl) {
        showToast('No image URL returned', true);
        return;
      }

      const range = quill.getSelection(true) || {
        index: quill.getLength(),
        length: 0
      };

      quill.insertEmbed(range.index, 'image', imageUrl, 'user');
      quill.setSelection(range.index + 1, 0);

      showToast('Image uploaded');
    } catch (err) {
      console.error(err);
      showToast('Image upload failed', true);
    }
  };

  input.click();
}
  let chapters = [];
  let currentEditing = null;
  let previewsCollapsed = false;

  /**
   * Action Button Spinner Utility
   * Disables button and replaces content with a spinner during execution to prevent duplicate clicks.
   */
  async function withLoading(btn, asyncFn) {
    if (!btn || btn.disabled || btn.getAttribute('data-loading') === 'true') return;

    btn.setAttribute('data-loading', 'true');
    btn.disabled = true;

    const originalHTML = btn.innerHTML;
    const originalWidth = btn.offsetWidth;

    if (originalWidth > 0) {
      btn.style.minWidth = `${originalWidth}px`;
    }

    const isMobileNav = btn.classList.contains('flex-col');
    const isSmall = btn.classList.contains('px-2') || btn.classList.contains('py-1') || btn.classList.contains('p-2');
    const spinnerSize = isSmall ? 'w-3.5 h-3.5' : (isMobileNav ? 'w-5 h-5' : 'w-4 h-4');

    const spinnerSvg = `<svg class="animate-spin ${spinnerSize} text-current shrink-0 inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>`;

    if (isMobileNav) {
      const label = btn.querySelector('span')?.textContent || '';
      btn.innerHTML = `${spinnerSvg}<span class="text-[10px] mt-1 font-medium">${escapeHtml(label)}</span>`;
    } else {
      const text = btn.textContent.trim();
      if (text) {
        btn.innerHTML = `<span class="inline-flex items-center justify-center gap-1.5">${spinnerSvg}<span>${escapeHtml(text)}</span></span>`;
      } else {
        btn.innerHTML = spinnerSvg;
      }
    }

    try {
      await asyncFn();
    } catch (err) {
      console.error('Action error:', err);
    } finally {
      btn.innerHTML = originalHTML;
      btn.disabled = false;
      btn.style.minWidth = '';
      btn.removeAttribute('data-loading');
    }
  }

  function showToast(msg, isError = false, t = 2500) {
    toastText.textContent = msg;
    toast.classList.toggle('error', isError);
    toast.style.display = 'flex';
    setTimeout(() => { toast.style.display = 'none'; }, t);
  }

  async function apiFetch(path, opts = {}) {
    const options = { ...credentialsOpt, ...opts };
    if (opts.body && !(opts.body instanceof FormData)) {
      options.headers = { ...options.headers, 'Content-Type': 'application/json' };
      options.body = JSON.stringify(opts.body);
    }
    const res = await fetch(API_BASE + path, options);
    if (!res.ok) {
      let txt = await res.text().catch(()=>null);
      let err;
      try { err = JSON.parse(txt); } catch(e) { err = { message: txt || res.statusText }; }
      throw { status: res.status, body: err };
    }
    const ct = res.headers.get('content-type') || '';
    if (ct.includes('application/json')) return res.json();
    return res.text();
  }

  async function loadResource() {
    if (!resourceId) {
      showToast('Missing resource id', true);
      return;
    }
    try {
      const j = await apiFetch(`/resource/${encodeURIComponent(resourceId)}`);
      const res = j.resource || j.data || j;
      headerTitle.textContent = (res.title || res.name || 'Untitled');
      mainBookTitle.textContent = (res.title || 'Untitled');
      mainBookDesc.textContent = (res.description || res.introduction || '');
      coverTitleDisplay.textContent = (res.title || '').split(' ').slice(0,3).join(' ');
      coverSub.textContent = (res.subtitle || '').slice(0,40);
      coverDesc.textContent = (res.publisher || '');
      coverImg.src = (res.cover && res.cover.url) ? res.cover.url : '';

      bookCourse.textContent = res.courseCode || res.course || '—';
      bookFaculty.textContent = res.faculty || '—';
      bookLecturer.textContent = res.lecturer || res.uploaderName || '—';
      bookVisibility.textContent = res.visibility || '—';
      bookDept.textContent = res.department || '—';
      bookCreated.textContent = res.createdAt ? new Date(res.createdAt).toLocaleString() : '—';

    } catch (err) {
      console.error('loadResource error', err);
      showToast('Could not load resource', true);
    }
  }

  async function loadChapters() {
    if (!resourceId) return;
    try {
      const q = await apiFetch(`/resource/${encodeURIComponent(resourceId)}/chapters`);
      chapters = q.chapters || q.data || [];
      chapters.sort((a,b) => (a.chapterNumber||0) - (b.chapterNumber||0));
      renderChapters();
    } catch (err) {
      console.error('loadChapters error', err);
      showToast('Could not load chapters', true);
    }
  }

  function renderChapters() {
    chaptersList.innerHTML = '';
    if (!chapters || chapters.length === 0) {
      chaptersList.innerHTML = '<div class="text-sm text-gray-500 py-6 text-center">No chapters yet. Click "New Chapter" to add one.</div>';
      chaptersCount.textContent = '0 chapters';
      return;
    }
    chaptersCount.textContent = `${chapters.length} chapter${chapters.length===1 ? '' : 's'}`;
    chapters.forEach((ch, idx) => {
      const el = document.createElement('div');
      el.className = 'bg-gray-50 rounded-md p-3 border border-gray-100';
      el.dataset.id = ch._id || ch.id;

      const header = document.createElement('div');
      header.className = 'flex items-start justify-between gap-3';

      const left = document.createElement('div');
      left.className = 'min-w-0';
      left.innerHTML = `<div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-md bg-white border flex items-center justify-center text-sm font-semibold text-gray-700">${ch.chapterNumber || (idx+1)}</div>
        <div class="min-w-0">
          <div class="text-sm font-bold text-gray-900 truncate">${escapeHtml(ch.title || 'Untitled')}</div>
          <div class="text-xs text-gray-500 mt-0.5">${(ch.status || '').toUpperCase()} ${ch.isLocked ? '• Locked' : ''}</div>
        </div>
      </div>`;

      const actions = document.createElement('div');
      actions.className = 'flex items-center gap-2';

      const upBtn = document.createElement('button');
      upBtn.className = 'px-2 py-1 bg-white border rounded text-xs hover:bg-gray-50 transition disabled:opacity-40';
      upBtn.textContent = '↑';
      upBtn.title = 'Move up';
      upBtn.disabled = idx === 0;
      upBtn.addEventListener('click', () => moveChapter(idx, idx-1));

      const downBtn = document.createElement('button');
      downBtn.className = 'px-2 py-1 bg-white border rounded text-xs hover:bg-gray-50 transition disabled:opacity-40';
      downBtn.textContent = '↓';
      downBtn.title = 'Move down';
      downBtn.disabled = idx === chapters.length-1;
      downBtn.addEventListener('click', () => moveChapter(idx, idx+1));

      const editBtn = document.createElement('button');
      editBtn.className = 'px-3 py-1 bg-indigo-600 text-white rounded text-xs font-medium hover:bg-indigo-700 transition inline-flex items-center justify-center';
      editBtn.textContent = 'Edit';
      editBtn.addEventListener('click', () => {
        withLoading(editBtn, async () => {
          await openEditorFor(ch._id || ch.id);
        });
      });

      const delBtn = document.createElement('button');
      delBtn.className = 'px-3 py-1 bg-red-50 text-red-600 border border-red-200 rounded text-xs hover:bg-red-100 transition inline-flex items-center justify-center';
      delBtn.textContent = 'Delete';
      delBtn.addEventListener('click', () => {
        if (!confirm('Delete chapter? This cannot be undone.')) return;
        withLoading(delBtn, async () => {
          await attemptDeleteChapter(ch._id || ch.id);
        });
      });

      actions.appendChild(upBtn);
      actions.appendChild(downBtn);
      actions.appendChild(editBtn);
      actions.appendChild(delBtn);

      header.appendChild(left);
      header.appendChild(actions);

      const preview = document.createElement('div');
      preview.className = `chapter-preview mt-3 text-sm text-gray-700 ${previewsCollapsed ? 'hidden' : ''}`;
      preview.innerHTML = ch.contentHtml ? sanitizePreview(ch.contentHtml) : '<em class="text-gray-400">No content</em>';

      el.appendChild(header);
      el.appendChild(preview);
      chaptersList.appendChild(el);
    });
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }

  function sanitizePreview(html) {
    const div = document.createElement('div');
    div.innerHTML = html || '';
    div.querySelectorAll('script, style').forEach(n => n.remove());
    const text = div.textContent || div.innerText || '';
    return escapeHtml(text.trim().slice(0, 300)) + (text.length > 300 ? '…' : '');
  }

  function moveChapter(fromIdx, toIdx) {
    if (toIdx < 0 || toIdx >= chapters.length) return;
    const [item] = chapters.splice(fromIdx, 1);
    chapters.splice(toIdx, 0, item);
    chapters.forEach((c, i) => c.chapterNumber = i+1);
    renderChapters();
  }

  async function saveOrder() {
    if (!resourceId) return;
    try {
      const order = chapters.map(c => c._id || c.id);
      await apiFetch(`/resource/${encodeURIComponent(resourceId)}/reorder`, { method: 'PUT', body: { order } });
      showToast('Order saved');
      await loadChapters();
    } catch (err) {
      console.error('saveOrder err', err);
      showToast('Could not save order', true);
    }
  }

  function openNewEditor() {
    currentEditing = null;
    editorTitle.textContent = 'New Chapter';
    chapterTitleInput.value = '';
    chapterNumberInput.value = (chapters.length + 1) || 1;
    chapterStatus.value = 'draft';
    chapterLocked.checked = false;
    quill.setContents([{ insert: '\n' }]);
    updateEditorStats();
    chapterEditorSection.classList.remove('hidden');
    chapterEditorSection.scrollIntoView({ behavior: 'smooth' });
  }

  async function openEditorFor(chapterId) {
    currentEditing = chapterId;
    editorTitle.textContent = 'Edit Chapter';
    chapterEditorSection.classList.remove('hidden');
    try {
      const j = await apiFetch(`/resource/${encodeURIComponent(resourceId)}/chapters/${encodeURIComponent(chapterId)}`);
      const c = j.chapter || j.data || j;
      chapterTitleInput.value = c.title || '';
      chapterNumberInput.value = c.chapterNumber || '';
      chapterStatus.value = c.status || 'draft';
      chapterLocked.checked = !!c.isLocked;
      quill.setContents([]);
      quill.clipboard.dangerouslyPasteHTML(c.contentHtml || '');
      updateEditorStats();
      chapterEditorSection.scrollIntoView({ behavior: 'smooth' });
    } catch (err) {
      console.error('openEditorFor err', err);
      showToast('Could not load chapter', true);
    }
  }

  cancelEditBtn.addEventListener('click', () => {
    chapterEditorSection.classList.add('hidden');
    currentEditing = null;
  });

  async function handleSaveChapter() {
    const title = (chapterTitleInput.value || '').trim();
    const chapterNumber = Number(chapterNumberInput.value) || (chapters.length + 1);
    const status = chapterStatus.value || 'draft';
    const isLocked = !!chapterLocked.checked;
    const contentHtml = clientSanitizeHtml(quill.root.innerHTML || '');

    if (!title) { showToast('Title is required', true); return; }

    try {
      const body = { title, chapterNumber, contentHtml, status, isLocked };
      if (currentEditing) {
        await apiFetch(`/resource/${encodeURIComponent(resourceId)}/chapters/${encodeURIComponent(currentEditing)}`, { method: 'PUT', body });
        showToast('Chapter updated');
      } else {
        await apiFetch(`/resource/${encodeURIComponent(resourceId)}/chapters`, { method: 'POST', body });
        showToast('Chapter created');
      }
      chapterEditorSection.classList.add('hidden');
      currentEditing = null;
      await loadChapters();
    } catch (err) {
      console.error('saveChapter err', err);
      const msg = (err && err.body && err.body.error) ? err.body.error : 'Could not save chapter';
      showToast(msg, true);
    }
  }

  saveChapterBtn.addEventListener('click', () => {
    withLoading(saveChapterBtn, handleSaveChapter);
  });

  async function attemptDeleteChapter(chapterId) {
    try {
      await apiFetch(`/resource/${encodeURIComponent(resourceId)}/chapters/${encodeURIComponent(chapterId)}`, { method: 'DELETE' });
      showToast('Chapter deleted');
      await loadChapters();
    } catch (err) {
      console.error('deleteChapter err', err);
      showToast('Could not delete chapter', true);
    }
  }

  function updateEditorStats() {
    const text = quill.getText().trim();
    const words = text ? text.split(/\s+/).filter(Boolean).length : 0;
    editorWordCount.textContent = words;
    editorEst.textContent = Math.max(1, Math.ceil(words / 200));
  }
  quill.on('text-change', updateEditorStats);

  saveOrderBtn.addEventListener('click', () => {
    withLoading(saveOrderBtn, saveOrder);
  });

  newChapterBtn.addEventListener('click', () => {
    withLoading(newChapterBtn, async () => {
      openNewEditor();
    });
  });

  refreshBtn.addEventListener('click', () => {
    withLoading(refreshBtn, async () => {
      await loadResource();
      await loadChapters();
      showToast('Refreshed');
    });
  });
  
  collapseAllBtn.addEventListener('click', () => {
    previewsCollapsed = !previewsCollapsed;
    const previews = chaptersList.querySelectorAll('.chapter-preview');
    previews.forEach(p => p.classList.toggle('hidden', previewsCollapsed));
    collapseAllBtn.textContent = previewsCollapsed ? 'Expand All' : 'Collapse All';
  });

  chapterNumberInput.addEventListener('input', () => {
    const v = Number(chapterNumberInput.value) || 1;
    chapterNumberInput.value = Math.max(1, Math.floor(v));
  });

  function clientSanitizeHtml(html) {
    const d = document.createElement('div');
    d.innerHTML = html;

    d.querySelectorAll('script').forEach(n => n.remove());

    d.querySelectorAll('p, div').forEach(el => {
        const text = el.textContent.replace(/\u00A0/g, '').trim();
        const hasMedia = el.querySelector('img, video, iframe, table');
        if (!text && !hasMedia) {
            el.remove();
        }
    });

    d.querySelectorAll('br').forEach(br => br.remove());

    return d.innerHTML
        .replace(/>\s+</g, '><')
        .replace(/\s{2,}/g, ' ')
        .trim();
}

  const backNavHandler = () => {
    if (document.referrer) window.location.href = document.referrer;
    else window.location.href = '/up.html';
  };

  document.getElementById('backBtn').addEventListener('click', (e) => {
    withLoading(e.currentTarget, async () => {
      backNavHandler();
    });
  });

  document.getElementById('navBack').addEventListener('click', (e) => {
    withLoading(e.currentTarget, async () => {
      backNavHandler();
    });
  });
  
  document.getElementById('navChapters').addEventListener('click', () => {
    document.getElementById('chaptersSection').scrollIntoView({ behavior: 'smooth' });
  });
  
  document.getElementById('navNewChapter').addEventListener('click', (e) => {
    withLoading(e.currentTarget, async () => {
      openNewEditor();
    });
  });
  
  document.getElementById('navRefresh').addEventListener('click', (e) => {
    withLoading(e.currentTarget, async () => {
      await loadResource();
      await loadChapters();
      showToast('Refreshed');
    });
  });

  (async function init(){
    if (!resourceId) {
      showToast('No resource specified', true);
      return;
    }
    await loadResource();
    await loadChapters();
  })();
</script>

</body>
</html>
