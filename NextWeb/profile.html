<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.8">
    <title>User Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            blue: '#1664FF',
                            navy: '#0B1E3D',
                            bg: '#F5F7FA',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#F6F8FC] font-sans text-gray-800 min-h-screen pb-28">

    <div class="fixed top-0 left-0 w-full z-50 bg-[#0A1B36] text-white px-6 pt-3 pb-2 flex justify-between items-center text-xs font-semibold"></div>

    <header class="relative pt-12 pb-16 px-5 sm:px-8 text-white overflow-hidden bg-cover bg-center bg-no-repeat" style="background-image: url('https://res.cloudinary.com/da7o22rnq/image/upload/v1785284137/editor-uploads/a4ykb68wiszdwoyvqzz5.png');">
        <div class="absolute inset-0 bg-gradient-to-r from-[#061833]/80 via-[#0E2C58]/60 to-[#143B73]/30"></div>

        <div class="flex justify-between items-center py-3 relative z-20">
            <button onclick="history.back()" class="w-10 h-10 rounded-full bg-white/10 backdrop-blur-md border border-white/15 flex items-center justify-center text-white hover:bg-white/20 transition-all">
                <i class="fa-solid fa-chevron-left text-sm"></i>
            </button>
            <button class="w-10 h-10 rounded-full bg-white/10 backdrop-blur-md border border-white/15 flex items-center justify-center text-white hover:bg-white/20 transition-all">
                <i class="fa-solid fa-ellipsis-vertical text-sm"></i>
            </button>
        </div>

        <div class="relative z-10 grid grid-cols-1 md:grid-cols-12 gap-4 items-center mt-1 max-w-7xl mx-auto">
            <div class="md:col-span-7 space-y-2">
                <div class="flex items-center gap-1.5 text-blue-200 text-xs font-medium">
                    <i class="fa-regular fa-user text-[11px]"></i>
                    <span>User Library</span>
                </div>

                <h1 id="userName" class="text-3xl sm:text-4xl font-extrabold tracking-tight"></h1>

                <div class="space-y-1 pt-0.5">
                    <div class="flex items-center gap-2 text-xs sm:text-sm text-blue-100/90 font-medium">
                        <i class="fa-solid fa-graduation-cap text-xs"></i>
                        <span id="userDepartment"></span>
                    </div>

                    <div class="flex items-center gap-2 text-xs sm:text-sm text-blue-100/90 font-medium">
                        <i class="fa-solid fa-location-dot text-xs"></i>
                        <span id="userSchool"></span>
                    </div>
                </div>

                <p id="userBio" class="text-blue-100/80 text-xs sm:text-sm max-w-md pt-2 leading-relaxed"></p>
            </div>
        </div>
    </header>

    <div class="relative z-30 max-w-5xl mx-4 sm:mx-8 md:mx-auto -mt-8">
        <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-[0_10px_30px_rgba(0,0,0,0.06)] border border-gray-100/80 grid grid-cols-2 sm:grid-cols-4 divide-x divide-gray-100">
            
            <div class="flex items-center gap-3 px-1 sm:px-4">
                <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-xl bg-blue-50 text-brand-blue flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-book-open text-base sm:text-lg"></i>
                </div>
                <div>
                    <span id="booksCount" class="block text-base sm:text-lg font-bold text-gray-900 leading-none">0</span>
                    <span class="text-[11px] sm:text-xs text-gray-500 font-medium">Books</span>
                </div>
            </div>

            <div class="flex items-center gap-3 px-2 sm:px-4">
                <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0">
                    <i class="fa-regular fa-file-lines text-base sm:text-lg"></i>
                </div>
                <div>
                    <span id="notesCount" class="block text-base sm:text-lg font-bold text-gray-900 leading-none">0</span>
                    <span class="text-[11px] sm:text-xs text-gray-500 font-medium">Notes</span>
                </div>
            </div>

            <div class="flex items-center gap-3 px-2 sm:px-4">
                <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center shrink-0">
                    <i class="fa-regular fa-bookmark text-base sm:text-lg"></i>
                </div>
                <div>
                    <span class="block text-base sm:text-lg font-bold text-gray-900 leading-none">0</span>
                    <span class="text-[11px] sm:text-xs text-gray-500 font-medium">Borrowed Out</span>
                </div>
            </div>

            <div class="flex items-center gap-3 px-2 sm:px-4">
                <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-xl bg-amber-50 text-amber-500 flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-star text-base sm:text-lg"></i>
                </div>
                <div>
                    <span class="block text-base sm:text-lg font-bold text-gray-900 leading-none">5.0</span>
                    <span class="text-[11px] sm:text-xs text-gray-500 font-medium">Rating</span>
                </div>
            </div>

        </div>
    </div>

    <div class="max-w-5xl mx-auto px-4 sm:px-8 mt-6">
        <div class="flex justify-between items-center mb-4">
            <h2 id="libraryTitle" class="text-base font-bold text-gray-900"></h2>
            
            <div class="flex items-center gap-2">
                <button class="bg-blue-50 text-brand-blue hover:bg-blue-100 text-xs font-semibold px-3.5 py-1.5 rounded-xl transition-colors flex items-center gap-1.5">
                    <i class="fa-solid fa-user-plus text-[11px]"></i>
                    <span>Follow</span>
                </button>
                <button class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-semibold px-3.5 py-1.5 rounded-xl transition-colors flex items-center gap-1.5">
                    <i class="fa-solid fa-share-nodes text-[11px]"></i>
                    <span>Share</span>
                </button>
            </div>
        </div>

        <div class="border-b border-gray-200/80">
            <div class="flex gap-8 overflow-x-auto no-scrollbar whitespace-nowrap text-sm font-semibold">
                <button id="tabAll" onclick="filterTab('all')" class="pb-3 text-brand-blue border-b-2 border-brand-blue">All (<span id="tabAllCount">0</span>)</button>
                <button id="tabBooks" onclick="filterTab('textbook')" class="pb-3 text-gray-500 hover:text-gray-800 transition-colors">Books (<span id="tabBooksCount">0</span>)</button>
                <button id="tabNotes" onclick="filterTab('notebook')" class="pb-3 text-gray-500 hover:text-gray-800 transition-colors">Notebooks (<span id="tabNotesCount">0</span>)</button>
            </div>
        </div>
    </div>

    <main class="max-w-5xl mx-auto px-4 sm:px-8 mt-5 space-y-4">
        
        <div class="flex items-center gap-2">
            <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                <input id="searchInput" oninput="handleSearch()" type="text" placeholder="Search books in this library..." 
                       class="w-full bg-white border border-gray-200 rounded-xl pl-9 pr-4 py-2.5 text-xs text-gray-800 placeholder-gray-400 focus:outline-none focus:border-brand-blue transition-colors">
            </div>

            <button class="bg-white border border-gray-200 text-gray-700 font-semibold text-xs px-3 py-2.5 rounded-xl flex items-center gap-1.5 hover:border-brand-blue transition-colors shrink-0">
                <i class="fa-solid fa-filter text-[11px] text-brand-blue"></i>
                <span>Filter</span>
            </button>

            <div class="relative shrink-0">
                <select class="appearance-none bg-white border border-gray-200 rounded-xl pl-3 pr-7 py-2.5 text-xs font-semibold text-gray-700 cursor-pointer focus:outline-none focus:border-brand-blue">
                    <option>Recent</option>
                    <option>Popular</option>
                </select>
                <i class="fa-solid fa-chevron-down absolute right-2.5 top-1/2 -translate-y-1/2 text-[10px] text-gray-400 pointer-events-none"></i>
            </div>
        </div>

        <div id="resourcesContainer" class="space-y-3 pt-1"></div>

    </main>

    <nav class="fixed bottom-0 left-0 w-full bg-white/95 backdrop-blur-md border-t border-gray-200/80 z-50 px-4 py-2.5 shadow-lg">
        <div class="max-w-md mx-auto flex justify-between items-center text-center">
            <a href="#" class="flex flex-col items-center text-gray-400 hover:text-brand-blue transition-colors gap-1 min-w-[50px]">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] font-medium">Home</span>
            </a>
            <a href="#" class="flex flex-col items-center text-brand-blue font-bold gap-1 min-w-[50px]">
                <i class="fa-solid fa-book-open text-lg"></i>
                <span class="text-[10px]">Library</span>
            </a>
            <a href="#" class="flex flex-col items-center text-gray-400 hover:text-brand-blue transition-colors gap-1 min-w-[50px]">
                <i class="fa-solid fa-border-all text-lg"></i>
                <span class="text-[10px] font-medium">Subjects</span>
            </a>
            <a href="#" class="flex flex-col items-center text-gray-400 hover:text-brand-blue transition-colors gap-1 min-w-[50px]">
                <i class="fa-solid fa-cloud-arrow-up text-lg"></i>
                <span class="text-[10px] font-medium">Uploads</span>
            </a>
            <a href="#" class="flex flex-col items-center text-gray-400 hover:text-brand-blue transition-colors gap-1 min-w-[50px]">
                <i class="fa-solid fa-bars text-lg"></i>
                <span class="text-[10px] font-medium">More</span>
            </a>
        </div>
    </nav>

    <script>
        let allResources = [];
        let currentFilter = 'all';
        let searchQuery = '';

        function openResource(id) {
            location.href = `/reader.html?id=${id}`;
        }

        function filterTab(type) {
            currentFilter = type;
            
            const tabAll = document.getElementById('tabAll');
            const tabBooks = document.getElementById('tabBooks');
            const tabNotes = document.getElementById('tabNotes');

            const activeClass = 'pb-3 text-brand-blue border-b-2 border-brand-blue';
            const inactiveClass = 'pb-3 text-gray-500 hover:text-gray-800 transition-colors';

            if (tabAll) tabAll.className = type === 'all' ? activeClass : inactiveClass;
            if (tabBooks) tabBooks.className = type === 'textbook' ? activeClass : inactiveClass;
            if (tabNotes) tabNotes.className = type === 'notebook' ? activeClass : inactiveClass;

            renderResources();
        }

        function handleSearch() {
            const input = document.getElementById('searchInput');
            if (input) {
                searchQuery = input.value.toLowerCase().trim();
                renderResources();
            }
        }

        function renderResources() {
            const container = document.getElementById("resourcesContainer");
            if (!container) return;

            const filtered = allResources.filter(resource => {
                const matchesType = currentFilter === 'all' || resource.resourceType === currentFilter;
                const matchesSearch = !searchQuery || 
                    (resource.title && resource.title.toLowerCase().includes(searchQuery)) ||
                    (resource.courseCode && resource.courseCode.toLowerCase().includes(searchQuery)) ||
                    (resource.lecturer && resource.lecturer.toLowerCase().includes(searchQuery));
                
                return matchesType && matchesSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-8 text-center border border-gray-100">
                        <i class="fa-solid fa-folder-open text-gray-300 text-3xl mb-2"></i>
                        <p class="text-xs text-gray-500 font-medium">No resources found.</p>
                    </div>`;
                return;
            }

            container.innerHTML = filtered.map(resource => `
                <div onclick="openResource('${resource._id}')"
                     class="bg-white rounded-2xl p-3.5 border border-gray-100 shadow-sm flex items-center justify-between gap-3 cursor-pointer hover:shadow-md transition-shadow">

                    <div class="flex gap-3.5 items-center min-w-0">
                        <img
                            src="${resource.cover?.url || '/assets/images/default-book.png'}"
                            class="w-14 h-20 rounded-lg object-cover shrink-0 bg-gray-100">

                        <div class="min-w-0">
                            <h3 class="font-bold text-xs sm:text-sm text-gray-900 truncate">
                                ${resource.title || ''}
                            </h3>

                            <p class="text-[11px] text-gray-500 mt-0.5 truncate font-medium">
                                ${
                                    (resource.authors && resource.authors.length > 0)
                                    ? (Array.isArray(resource.authors) ? resource.authors.join(", ") : resource.authors)
                                    : (resource.lecturer || "Unknown")
                                }
                            </p>

                            <div class="flex items-center gap-2 mt-2 flex-wrap">
                                <span class="bg-blue-50 text-brand-blue px-2 py-0.5 rounded text-[10px] font-semibold">
                                    ${resource.resourceType === "textbook" ? "Book" : "Notebook"}
                                </span>

                                ${
                                    resource.courseCode
                                    ? `<span class="text-[10px] text-gray-400 font-medium">${resource.courseCode}</span>`
                                    : ""
                                }
                            </div>
                        </div>
                    </div>

                    <button class="text-gray-400 hover:text-gray-600 p-1 shrink-0">
                        <i class="fa-solid fa-chevron-right text-xs"></i>
                    </button>
                </div>
            `).join("");
        }

        async function init() {
            const userId = new URLSearchParams(location.search).get("id");
            if (!userId) return;

            try {
                const profileRes = await fetch(`https://examguide.onrender.com/api/resource/users/${userId}`);
                if (profileRes.ok) {
                    const profile = await profileRes.json();
                    
                    const userNameEl = document.getElementById("userName");
                    const libraryTitleEl = document.getElementById("libraryTitle");
                    const userDepartmentEl = document.getElementById("userDepartment");
                    const userSchoolEl = document.getElementById("userSchool");
                    const userBioEl = document.getElementById("userBio");

                    if (userNameEl) userNameEl.textContent = profile.fullName || '';
                    if (libraryTitleEl) libraryTitleEl.textContent = profile.fullName ? `${profile.fullName.split(" ")[0]}'s Library` : '';
                    if (userDepartmentEl) userDepartmentEl.textContent = `${profile.department || ''} • ${profile.level || ''} Level`;
                    if (userSchoolEl) userSchoolEl.textContent = profile.institution || "Obafemi Awolowo University";
                    if (userBioEl) userBioEl.textContent = profile.bio || "No bio available.";
                }

                const response = await fetch(`https://examguide.onrender.com/api/resources?uploader=${userId}&published=true`);
                if (response.ok) {
                    const data = await response.json();
                    allResources = data.items || data.resources || [];

                    const books = allResources.filter(r => r.resourceType === "textbook");
                    const notebooks = allResources.filter(r => r.resourceType === "notebook");

                    const booksCountEl = document.getElementById("booksCount");
                    const notesCountEl = document.getElementById("notesCount");
                    const tabAllCountEl = document.getElementById("tabAllCount");
                    const tabBooksCountEl = document.getElementById("tabBooksCount");
                    const tabNotesCountEl = document.getElementById("tabNotesCount");

                    if (booksCountEl) booksCountEl.textContent = books.length;
                    if (notesCountEl) notesCountEl.textContent = notebooks.length;
                    if (tabAllCountEl) tabAllCountEl.textContent = allResources.length;
                    if (tabBooksCountEl) tabBooksCountEl.textContent = books.length;
                    if (tabNotesCountEl) tabNotesCountEl.textContent = notebooks.length;

                    renderResources();
                }
            } catch (err) {}
        }

        document.addEventListener("DOMContentLoaded", init);
    </script>
</body>
</html>
