<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=0.8, maximum-scale=0.8, user-scalable=no">
  <title>StudySphere</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans','sans-serif'] },
          colors: {
            brand: { 50:'#f0f3ff',100:'#e0e7ff',500:'#6366f1',600:'#4f46e5',700:'#4338ca',900:'#1e1b4b', dark:'#0f172a' },
            peach: '#f89a74'
          }
        }
      }
    }
  </script>
  <style>
    html,body { width:100%; min-height:100%; margin:0; padding:0; overflow-x:hidden; font-family:'Plus Jakarta Sans',sans-serif; background:#f8fafc; -webkit-tap-highlight-color:transparent; }
    .no-scrollbar::-webkit-scrollbar { display:none; } .no-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }
    .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.6) 0%, rgba(0,0,0,0.03) 50%, rgba(255,255,255,0.6) 100%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
    @keyframes shimmer { 0% { background-position: 200% 0 } 100% { background-position: -200% 0 } }
  </style>
</head>
<body class="w-full min-h-screen bg-slate-50 flex flex-col relative">

  <div class="fixed top-0 left-0 right-0 z-50 w-full bg-slate-50/90 backdrop-blur-md border-b border-slate-200/60">
    <div class="w-full px-5 sm:px-8 pt-3 pb-1 flex justify-between items-center text-xs font-bold text-slate-900 tracking-tight"></div>
    <header class="w-full px-5 sm:px-8 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button id="menuBtn" class="text-slate-700 hover:text-slate-900"><i class="fa-solid fa-bars text-xl"></i></button>
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-blue-600 via-indigo-600 to-purple-500 flex items-center justify-center text-white shadow-md">
            <i class="fa-solid fa-compass text-lg"></i>
          </div>
          <div>
            <h1 class="text-lg font-extrabold text-slate-900 leading-none tracking-tight">StudySphere</h1>
            <p class="text-[10px] font-semibold text-slate-400 mt-0.5">Read. Learn. Grow.</p>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button id="notificationsBtn" class="relative w-9 h-9 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-700 shadow-2xs">
          <i class="fa-regular fa-bell text-base"></i>
          <span id="notifBadge" class="hidden absolute -top-0.5 -right-0.5 w-4 h-4 rounded-full bg-red-500 text-white text-[9px] font-bold flex items-center justify-center ring-2 ring-white">0</span>
        </button>
        <div id="userPanel" class="flex items-center gap-2.5 cursor-pointer pl-2 border-l border-slate-200">
          <img id="userAvatar" src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?auto=format&fit=crop&q=80&w=120" alt="User" class="w-9 h-9 rounded-full object-cover ring-2 ring-white">
          <span id="userName" class="hidden sm:inline-block text-xs font-bold text-slate-800">Sign in</span>
        </div>
      </div>
    </header>
  </div>

  <main class="w-full flex-1 pt-24 pb-28">
    <div class="w-full px-5 sm:px-8 my-3">
      <div class="flex items-center gap-2.5 max-w-7xl mx-auto">
        <div class="flex-1 bg-white border border-slate-200/80 rounded-2xl px-3.5 py-3 flex items-center gap-2.5 shadow-2xs">
          <i class="fa-solid fa-magnifying-glass text-slate-400 text-sm"></i>
          <input id="searchInput" type="text" placeholder="Search books, notes, authors, topics..." class="w-full text-xs font-medium text-slate-800 placeholder-slate-400 bg-transparent focus:outline-none">
        </div>
        <button id="filtersBtn" class="w-11 h-11 bg-white border border-slate-200/80 rounded-2xl flex items-center justify-center text-indigo-600 shadow-2xs hover:bg-slate-50 transition-colors">
          <i class="fa-solid fa-sliders text-sm"></i>
        </button>
      </div>
    </div>

    <div id="hero" class="w-full px-5 sm:px-8 my-4">
      <div id="heroCard" class="max-w-7xl mx-auto relative w-full rounded-3xl bg-slate-900 p-5 text-white overflow-hidden shadow-xl" style="min-height:140px;">
        <div id="heroContent" class="relative z-10 flex items-center justify-between">
          <div class="max-w-[240px]">
            <span id="heroBadge" class="inline-block text-[9px] font-extrabold uppercase tracking-wider bg-white/20 text-white px-2.5 py-0.5 rounded-full mb-2 border border-white/10">FEATURED</span>
            <h2 id="heroTitle" class="text-xl sm:text-2xl font-extrabold leading-tight tracking-tight">Loading...</h2>
            <p id="heroSubtitle" class="text-[10px] sm:text-xs text-indigo-100 font-medium leading-relaxed mt-1.5 mb-3.5">Fetching featured resource.</p>
            <button id="heroAction" class="bg-white text-indigo-950 font-bold text-xs px-4 py-2 rounded-full flex items-center gap-1.5 shadow-md hover:bg-indigo-50 transition-colors">
              <span>Open</span><i class="fa-solid fa-arrow-right text-[10px]"></i>
            </button>
          </div>
        </div>
        <div id="heroRings" class="pointer-events-none">
          <div class="absolute -right-10 -bottom-10 w-56 h-56 rounded-full border border-indigo-500/20"></div>
          <div class="absolute right-10 -bottom-20 w-64 h-64 rounded-full border border-purple-500/15"></div>
        </div>
      </div>
    </div>

    <div class="w-full px-5 sm:px-8 my-4">
      <div id="categoriesGrid" class="max-w-7xl mx-auto grid grid-cols-6 gap-2 sm:gap-4 text-center"></div>
    </div>

    <section class="w-full my-6">
      <div class="max-w-7xl mx-auto px-5 sm:px-8 flex items-center justify-between mb-3">
        <h3 class="text-sm sm:text-base font-extrabold text-slate-900 tracking-tight">Continue Reading</h3>
        <a id="continueSeeAll" href="#" class="text-xs sm:text-sm font-bold text-indigo-600 hover:underline">See All</a>
      </div>
      <div class="w-full overflow-x-auto no-scrollbar px-5 sm:px-8">
        <div id="continueList" class="max-w-7xl mx-auto flex gap-3.5 sm:gap-5"></div>
      </div>
    </section>

    <section class="w-full my-6">
      <div class="max-w-7xl mx-auto px-5 sm:px-8 flex items-center justify-between mb-3">
        <h3 class="text-sm sm:text-base font-extrabold text-slate-900 tracking-tight">Recently Added</h3>
        <a id="recentSeeAll" href="#" class="text-xs sm:text-sm font-bold text-indigo-600 hover:underline">See All</a>
      </div>
      <div class="w-full overflow-x-auto no-scrollbar px-5 sm:px-8">
        <div id="recentList" class="max-w-7xl mx-auto flex gap-3.5 sm:gap-5"></div>
      </div>
    </section>

    <div class="w-full px-5 sm:px-8 my-6">
      <div class="max-w-7xl mx-auto bg-gradient-to-r from-indigo-50 via-purple-50 to-blue-50 border border-indigo-100/80 rounded-2xl p-4 flex items-center justify-between gap-3 shadow-2xs">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-indigo-600 text-white flex items-center justify-center text-lg">
            <i class="fa-solid fa-crown text-amber-300"></i>
          </div>
          <div>
            <h4 class="text-xs sm:text-sm font-extrabold text-slate-900">Go Premium</h4>
            <p class="text-[10px] sm:text-xs text-slate-500 font-medium leading-tight mt-0.5">Unlock unlimited downloads, premium content and ad-free experience.</p>
          </div>
        </div>
        <button class="bg-indigo-100/80 hover:bg-indigo-200 text-indigo-700 text-xs font-extrabold px-3.5 py-2 rounded-xl flex items-center gap-1 transition-colors">
          <span>Upgrade Now</span><i class="fa-solid fa-arrow-right text-[10px]"></i>
        </button>
      </div>
    </div>

  </main>

  <nav class="fixed bottom-0 left-0 right-0 w-full bg-white/95 backdrop-blur-md border-t border-slate-200/80 px-6 py-2.5 flex justify-around items-center z-50 shadow-lg">
    <a href="#" class="flex flex-col items-center gap-1 text-indigo-600"><i class="fa-solid fa-house text-lg"></i><span class="text-[10px] font-bold">Home</span></a>
    <a href="#" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-border-all text-lg"></i><span class="text-[10px] font-medium">Categories</span></a>
    <a href="#" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600"><i class="fa-regular fa-bookmark text-lg"></i><span class="text-[10px] font-medium">My Library</span></a>
    <a href="#" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-download text-lg"></i><span class="text-[10px] font-medium">Downloads</span></a>
    <a href="#" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600"><i class="fa-regular fa-user text-lg"></i><span class="text-[10px] font-medium">Profile</span></a>
  </nav>

  <script>
    const API_BASE = "https://examguide.onrender.com";

    function normalizeUrl(u) {
      if (!u) return null;
      if (u.startsWith("http://") || u.startsWith("https://")) return u;
      if (u.startsWith("/")) return API_BASE + u;
      return API_BASE + (u.startsWith("uploads/") ? "/" + u : "/" + u);
    }

    async function tryFetch(url, opts) {
      try {
        const res = await fetch(url, opts);
        if (!res.ok) throw res;
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    async function fetchLoggedInUser() {
      const token = localStorage.getItem("token");
      const endpoints = ["/api/auth/me","/api/users/me","/api/me","/api/user/me"];
      for (const p of endpoints) {
        const j = await tryFetch(API_BASE + p, { credentials: "include", headers: token ? { "Authorization": "Bearer " + token } : undefined });
        if (j) {
          const u = j.user || j.data || j;
          return u;
        }
      }
      return null;
    }

    async function fetchResources({ limit = 10, page = 1, q = "", featured = false } = {}) {
      const candidates = [
        `${API_BASE}/api/resource?page=${page}&limit=${limit}${q ? "&q="+encodeURIComponent(q):""}${featured ? "&featured=true":""}`,
        `${API_BASE}/api/resources?page=${page}&limit=${limit}${q ? "&q="+encodeURIComponent(q):""}${featured ? "&featured=true":""}`
      ];
      for (const url of candidates) {
        const json = await tryFetch(url, { credentials: "include" });
        if (!json) continue;
        if (Array.isArray(json)) return json;
        if (json.items) return json.items;
        if (json.resources) return json.resources;
        if (json.data && Array.isArray(json.data)) return json.data;
      }
      return [];
    }

    async function fetchCategories() {
      const candidates = [`${API_BASE}/api/categories`, `${API_BASE}/api/resource/categories`, `${API_BASE}/api/resources/categories`];
      for (const url of candidates) {
        const json = await tryFetch(url, { credentials: "include" });
        if (!json) continue;
        if (Array.isArray(json)) return json;
        if (json.items) return json.items;
        if (json.data && Array.isArray(json.data)) return json.data;
      }
      return [];
    }

    function makeCard(resource) {
      const title = resource.title || resource.name || "Untitled";
      const authors = Array.isArray(resource.authors) ? resource.authors.join(", ") : (resource.authors || resource.author || "");
      const file = (resource.files && resource.files[0]) || resource.file || resource;
      const url = file && (file.url || file.path || file.filename) ? normalizeUrl(file.url || file.path || file.filename) : null;
      const cover = resource.cover && resource.cover.url ? normalizeUrl(resource.cover.url) : (resource.thumbnail ? normalizeUrl(resource.thumbnail) : null);
      const mimeLabel = file && file.mimeType ? file.mimeType.split("/")[0].toUpperCase() : (resource.type || "");
      const size = file && file.size ? (Math.round(file.size/1024) + " KB") : "";
      const card = document.createElement("div");
      card.className = "w-36 sm:w-44 shrink-0 group cursor-pointer";
      card.innerHTML = `
        <div class="relative w-36 sm:w-44 h-40 sm:h-48 rounded-2xl overflow-hidden bg-slate-200 shadow-md mb-2 p-3 flex flex-col justify-between">
          ${cover ? `<img src="${cover}" alt="${title}" class="absolute inset-0 w-full h-full object-cover">` : `<div class="absolute inset-0 bg-gradient-to-br from-slate-900 via-slate-800 to-slate-950 opacity-90 flex items-center justify-center"><i class="fa-solid fa-book-open text-white text-3xl"></i></div>`}
          <div class="relative z-10">
            <span class="bg-red-500 text-white text-[8px] font-black px-1.5 py-0.5 rounded-md uppercase">${mimeLabel || "FILE"}</span>
          </div>
          <div class="relative z-10 mt-auto">
            <h5 class="text-[9px] sm:text-[10px] font-black text-slate-800 leading-tight">${escapeHtml(title)}</h5>
            <p class="text-[10px] text-slate-500 truncate mt-1">${escapeHtml(authors)}</p>
          </div>
        </div>
      `;
      card.addEventListener("click", () => {
        if (url) window.open(url, "_blank");
        else showToast("No file available", false);
      });
      return card;
    }

    function escapeHtml(s) {
      if (!s) return "";
      return String(s).replace(/[&<>"']/g, function(m){ return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]; });
    }

    function showToast(msg, ok = true, t = 3000) {
      const el = document.createElement("div");
      el.className = `fixed top-5 right-5 z-50 px-4 py-2 rounded-xl text-white ${ok ? 'bg-emerald-600' : 'bg-amber-500'} shadow-lg`;
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(()=> el.remove(), t);
    }

    async function initPage() {
      const user = await fetchLoggedInUser();
      if (user) {
        document.getElementById("userName").textContent = user.fullname || user.username || (user.email ? user.email.split("@")[0] : "Me");
        document.getElementById("userName").classList.remove("hidden");
        if (user.profilePic || user.avatar) document.getElementById("userAvatar").src = normalizeUrl(user.profilePic || user.avatar);
      }

      const cats = await fetchCategories();
      const categoriesGrid = document.getElementById("categoriesGrid");
      categoriesGrid.innerHTML = "";
      if (cats && cats.length) {
        cats.slice(0,6).forEach(c => {
          const el = document.createElement("div");
          el.className = "flex flex-col items-center gap-1.5 cursor-pointer group";
          const icon = c.icon || "fa-layer-group";
          el.innerHTML = `<div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-indigo-100/70 text-indigo-600 flex items-center justify-center text-lg sm:text-xl group-hover:scale-105 transition-transform"><i class="${escapeHtml(icon)}"></i></div><span class="text-[10px] sm:text-xs font-bold text-slate-700">${escapeHtml(c.name || c.title || c.category)}</span>`;
          el.addEventListener("click", () => {
            window.location.href = `/browse.html?category=${encodeURIComponent(c.name || c.title || c.category)}`;
          });
          categoriesGrid.appendChild(el);
        });
      } else {
        // no categories returned, derive simple categories from resources
        const derived = ["Books","Notes","Videos","Audio","Journals","More"];
        derived.forEach(name=>{
          const el = document.createElement("div");
          el.className = "flex flex-col items-center gap-1.5 cursor-pointer group";
          el.innerHTML = `<div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-indigo-100/70 text-indigo-600 flex items-center justify-center text-lg sm:text-xl group-hover:scale-105 transition-transform"><i class="fa-solid fa-layer-group"></i></div><span class="text-[10px] sm:text-xs font-bold text-slate-700">${name}</span>`;
          categoriesGrid.appendChild(el);
        });
      }

      const featured = await fetchResources({ limit:1, featured:true });
      const heroTitle = document.getElementById("heroTitle");
      const heroSubtitle = document.getElementById("heroSubtitle");
      const heroAction = document.getElementById("heroAction");
      const heroCard = document.getElementById("heroCard");
      if (featured && featured.length) {
        const r = featured[0];
        heroTitle.textContent = r.title || r.name || "Featured Resource";
        heroSubtitle.textContent = r.subtitle || (r.authors ? (Array.isArray(r.authors) ? r.authors.join(", ") : r.authors) : "");
        const cover = r.cover && r.cover.url ? normalizeUrl(r.cover.url) : (r.thumbnail ? normalizeUrl(r.thumbnail) : null);
        if (cover) heroCard.style.backgroundImage = `linear-gradient(180deg, rgba(2,6,23,0.45), rgba(2,6,23,0.45)), url('${cover}')`;
        else heroCard.style.background = "linear-gradient(135deg,#4338ca,#4f46e5)";
        const file = (r.files && r.files[0]) || r.file;
        const fileUrl = file && (file.url || file.path || file.filename) ? normalizeUrl(file.url || file.path || file.filename) : null;
        heroAction.onclick = () => fileUrl ? window.open(fileUrl, "_blank") : showToast("No file available", false);
      } else {
        heroTitle.textContent = "Discover academic resources";
        heroSubtitle.textContent = "Search, read and download textbooks, notes, videos and more.";
        heroCard.style.background = "linear-gradient(135deg,#4338ca,#4f46e5)";
        heroAction.onclick = () => { window.location.href = "/browse.html"; };
      }

      const continueRes = await fetchResources({ limit:8, page:1 });
      const continueList = document.getElementById("continueList");
      continueList.innerHTML = "";
      if (continueRes && continueRes.length) {
        continueRes.forEach(r => continueList.appendChild(makeCard(r)));
      } else {
        for (let i=0;i<4;i++){
          const ph = document.createElement("div");
          ph.className = "w-36 sm:w-44 shrink-0";
          ph.innerHTML = `<div class="h-40 sm:h-48 rounded-2xl skeleton"></div>`;
          continueList.appendChild(ph);
        }
      }

      const recent = await fetchResources({ limit:12, page:1 });
      const recentList = document.getElementById("recentList");
      recentList.innerHTML = "";
      if (recent && recent.length) {
        recent.forEach(r => recentList.appendChild(makeCard(r)));
      } else {
        for (let i=0;i<6;i++){
          const ph = document.createElement("div");
          ph.className = "w-36 sm:w-44 shrink-0";
          ph.innerHTML = `<div class="h-40 sm:h-48 rounded-2xl skeleton"></div>`;
          recentList.appendChild(ph);
        }
      }
    }

    initPage();

    document.getElementById("searchInput").addEventListener("keydown", async (e) => {
      if (e.key === "Enter") {
        const q = e.target.value.trim();
        if (!q) return;
        const results = await fetchResources({ q, limit:24 });
        if (results && results.length) {
          window.location.href = `/search.html?q=${encodeURIComponent(q)}`;
        } else {
          showToast("No results found", false);
        }
      }
    });

  </script>
</body>
</html>
