<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.85">
    <title>OAU ExamCompass - Offline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .fade-in {
            animation: fadeIn 0.6s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .pulse-ring {
            animation: pulseRing 2s infinite;
        }

        @keyframes pulseRing {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.7;
            }
        }

        .bounce-slow {
            animation: bounceSlow 3s infinite;
        }

        @keyframes bounceSlow {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }
    </style>
</head>
<body class="font-sans text-white">

    <div class="min-h-screen flex items-center justify-center p-6">
        <div class="max-w-md w-full text-center fade-in">
            
            <!-- Icon with pulse effect -->
            <div class="mb-8 flex justify-center">
                <div class="relative">
                    <div class="absolute inset-0 bg-white/20 rounded-full blur-xl"></div>
                    <div class="relative w-24 h-24 bg-white/10 backdrop-blur-xl rounded-full flex items-center justify-center border border-white/30">
                        <i class="fa-solid fa-wifi-slash text-5xl pulse-ring"></i>
                    </div>
                </div>
            </div>

            <!-- Content -->
            <div class="space-y-4 mb-8">
                <h1 class="text-4xl font-bold">You're Offline</h1>
                <p class="text-white/80 text-lg">No internet connection detected</p>
            </div>

            <!-- Status message -->
            <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl p-6 mb-8 space-y-4">
                <div class="flex items-center gap-3 text-left">
                    <i class="fa-solid fa-check-circle text-green-400 text-xl flex-shrink-0"></i>
                    <p class="text-sm">Your offline content is saved locally</p>
                </div>
                <div class="flex items-center gap-3 text-left">
                    <i class="fa-solid fa-book text-blue-300 text-xl flex-shrink-0"></i>
                    <p class="text-sm">Reading trainer is fully accessible</p>
                </div>
                <div class="flex items-center gap-3 text-left">
                    <i class="fa-solid fa-database text-purple-300 text-xl flex-shrink-0"></i>
                    <p class="text-sm">Pre-loaded passages available</p>
                </div>
            </div>

            <!-- Action buttons -->
            <div class="space-y-3">
                <button onclick="window.location.href='../NextWeb/reader.html'" class="w-full bg-white text-brand-600 font-bold py-3 px-6 rounded-xl hover:bg-white/90 transition-all transform hover:scale-105 shadow-lg">
                    <i class="fa-solid fa-book-open-reader mr-2"></i>
                    Open Reading Trainer
                </button>

                <button onclick="location.reload()" class="w-full bg-white/20 backdrop-blur-sm border border-white/30 text-white font-semibold py-3 px-6 rounded-xl hover:bg-white/30 transition-all">
                    <i class="fa-solid fa-arrows-rotate mr-2"></i>
                    Try Reconnecting
                </button>
            </div>

            <!-- Footer info -->
            <div class="mt-12 text-white/60 text-sm space-y-2">
                <p>ExamCompass will sync when you're back online</p>
                <p class="text-xs">Version 2.5.0 Stable</p>
            </div>

        </div>
    </div>

    <script>
        // Check if connection is restored
        window.addEventListener('online', () => {
            // Smooth transition back to previous page
            document.body.style.opacity = '0';
            setTimeout(() => {
                history.back();
            }, 300);
        });

        // Optional: Add a listener to check connection status
        setInterval(() => {
            if (navigator.onLine) {
                // Connection restored, go back
                history.back();
            }
        }, 3000);
    </script>

</body>
</html>
