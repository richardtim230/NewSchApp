<script>
/* --------------- Config & helpers --------------- */
const API_BASE = "https://examguide.onrender.com";
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

function normalizeUrl(u){
    if(!u) return null;
    if(u.startsWith("http://")||u.startsWith("https://")) return u;
    if(u.startsWith("/")) return API_BASE + u;
    return API_BASE + (u.startsWith("uploads/") ? "/" + u : "/" + u);
}

async function tryFetch(url, opts){
    try { const res = await fetch(url, opts); if(!res.ok) throw res; const ct = res.headers.get('content-type') || ''; if(ct.includes('application/json')) return await res.json(); return res; } catch (e) { return null; }
}
function qsParam(name){ const params = new URLSearchParams(window.location.search); return params.get(name); }
async function fetchResourceById(id){
  if(!id) return null;
  const candidates = [`${API_BASE}/api/resource/${id}`, `${API_BASE}/api/resources/${id}`];
  for(const url of candidates){
    const j = await tryFetch(url, { credentials: 'include' });
    if(!j) continue;
    if(j.resource) return j.resource;
    if(j.data) return j.data;
    if(j._id || j.id) return j;
    if(j.item) return j.item;
  }
  return null;
}

/* --------------- IndexedDB small helper --------------- */
function openFilesDB(){
    return new Promise((resolve, reject) => {
        const req = indexedDB.open('reader-files', 1);
        req.onupgradeneeded = () => {
            const db = req.result;
            if(!db.objectStoreNames.contains('files')) db.createObjectStore('files', { keyPath: 'id' });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}
async function saveBlobToIDB(id, blob){
    const db = await openFilesDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction('files', 'readwrite');
        const store = tx.objectStore('files');
        store.put({ id, blob, updatedAt: Date.now() });
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => reject(tx.error);
    });
}
async function getBlobFromIDB(id){
    const db = await openFilesDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction('files', 'readonly');
        const store = tx.objectStore('files');
        const getReq = store.get(id);
        getReq.onsuccess = () => resolve(getReq.result ? getReq.result.blob : null);
        getReq.onerror = () => reject(getReq.error);
    });
}
async function deleteBlobFromIDB(id){
    const db = await openFilesDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction('files', 'readwrite');
        const store = tx.objectStore('files');
        const del = store.delete(id);
        del.onsuccess = () => resolve(true);
        del.onerror = () => reject(del.error);
    });
}

/* --------------- PDF download with progress --------------- */
async function fetchWithProgress(url, onProgress){
    const resp = await fetch(url, { credentials: 'include' });
    if(!resp.ok) throw new Error('Fetch failed: ' + resp.status);
    const contentLength = resp.headers.get('Content-Length') || resp.headers.get('content-length');
    const total = contentLength ? parseInt(contentLength, 10) : null;
    if(!resp.body) {
        // not streaming; fallback to arrayBuffer
        const ab = await resp.arrayBuffer();
        if(onProgress) onProgress(ab.byteLength, total || ab.byteLength);
        return ab;
    }
    const reader = resp.body.getReader();
    const chunks = [];
    let received = 0;
    while(true){
        const { done, value } = await reader.read();
        if(done) break;
        chunks.push(value);
        received += value.length;
        if(onProgress) onProgress(received, total);
    }
    // concatenate chunks
    const arr = new Uint8Array(received);
    let position = 0;
    for(const chunk of chunks){ arr.set(chunk, position); position += chunk.length; }
    return arr.buffer;
}

/* --------------- UI elements --------------- */
const resourceId = qsParam('id');
const bookTitleEl = document.getElementById('bookTitle');
const bookAuthorEl = document.getElementById('bookAuthor');
const readerArticle = document.getElementById('readerArticle');
const embedArea = document.getElementById('embedArea');
const pdfViewer = document.getElementById('pdfViewer');
const pdfCanvas = document.getElementById('pdfCanvas');
const pdfCanvasWrapper = document.getElementById('pdfCanvasWrapper');
const pageSlider = document.getElementById('pageSlider');
const currentPageEl = document.getElementById('currentPage');
const totalPagesEl = document.getElementById('totalPages');
const percentageDisplay = document.getElementById('percentageDisplay');
const downloadProgressEl = document.getElementById('downloadProgress');
const topFlash = document.getElementById('topFlash');
const downloadBtn = document.getElementById('downloadBtn');
const removeSavedBtn = document.getElementById('removeSavedBtn');
const pdfZoomIn = document.getElementById('pdfZoomIn');
const pdfZoomOut = document.getElementById('pdfZoomOut');

let pdfDoc = null;
let pdfScale = 1.0;
let currentPdfPage = 1;
let isPdfMode = false;
let resource = null;

/* --------------- PDF rendering helpers (reuseable) --------------- */
async function renderPdfPage(pdfDocument, pageNumber, canvasEl, scale = 1.0){
    try {
        const page = await pdfDocument.getPage(pageNumber);
        const viewport = page.getViewport({ scale });
        // fit width to wrapper
        const wrapperWidth = Math.min(pdfCanvasWrapper.clientWidth - 24, 1100);
        const fitScale = (wrapperWidth / viewport.width) * scale;
        const scaledViewport = page.getViewport({ scale: fitScale });
        canvasEl.width = Math.floor(scaledViewport.width);
        canvasEl.height = Math.floor(scaledViewport.height);
        canvasEl.style.width = canvasEl.width + 'px';
        canvasEl.style.height = canvasEl.height + 'px';
        const ctx = canvasEl.getContext('2d');
        const renderContext = { canvasContext: ctx, viewport: scaledViewport };
        const renderTask = page.render(renderContext);
        await renderTask.promise;
    } catch (err) {
        console.error('Error rendering PDF page', err);
    }
}

/* --------------- Top flash / progress --------------- */
function showTopFlash(msg, t = 2500){
    topFlash.textContent = msg;
    if(t) setTimeout(()=> { if(topFlash.textContent === msg) topFlash.textContent = ''; }, t);
}
function setDownloadProgress(loaded, total){
    if(total){
        const pct = Math.round((loaded/total)*100);
        downloadProgressEl.textContent = `Downloading: ${pct}%`;
    } else {
        downloadProgressEl.textContent = `Downloading: ${Math.round(loaded/1024)} KB`;
    }
}

/* --------------- Load & display PDF (from IDB or network) --------------- */
async function loadPdfFromBlob(blob){
    if(!blob) throw new Error('No blob provided');
    const arrayBuffer = await blob.arrayBuffer();
    return await openPdfDocumentFromArrayBuffer(arrayBuffer);
}

async function openPdfDocumentFromArrayBuffer(arrayBuffer){
    if(pdfDoc && pdfDoc.destroy) { try{ await pdfDoc.destroy(); } catch(_){} pdfDoc = null; }
    pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    const total = pdfDoc.numPages || 1;
    totalPagesEl.textContent = total;
    pageSlider.max = total;
    pageSlider.value = 1;
    currentPageEl.textContent = 1;
    percentageDisplay.textContent = '0%';
    pdfViewer.classList.remove('hidden');
    document.getElementById('readerArticle').classList.add('hidden');
    isPdfMode = true;
    currentPdfPage = 1;
    pdfScale = 1.0;
    await renderPdfPage(pdfDoc, currentPdfPage, pdfCanvas, pdfScale);
    updatePageUI();
}

/* --------------- Primary init: fetch resource and decide path --------------- */
async function initReader(){
    if(!resourceId){
        bookTitleEl.textContent = 'Resource not found';
        readerArticle.innerHTML = '<p class="text-center text-gray-500">No resource id provided in the URL.</p>';
        return;
    }

    document.title = 'Loading…';
    const res = await fetchResourceById(resourceId);
    if(!res){
        bookTitleEl.textContent = 'Resource not found';
        readerArticle.innerHTML = '<p class="text-center text-gray-500">Could not load the selected resource.</p>';
        return;
    }
    resource = res;
    document.title = `${res.title || res.name || 'Resource'} — Reader`;
    bookTitleEl.textContent = res.title || res.name || 'Untitled';
    const authors = Array.isArray(res.authors) ? res.authors.join(', ') : (res.authors || res.author || '');
    bookAuthorEl.textContent = authors || (res.uploader && (res.uploader.fullname || res.uploader.username)) || '';

    // page count fallback
    const pagesCount = Number(res.pages) || (res.files && res.files[0] && res.files[0].pages) || 1;
    totalPagesEl.textContent = Math.max(1, Math.floor(pagesCount));
    document.getElementById('footerTotalPages').textContent = totalPagesEl.textContent;

    // determine main file
    const mainFile = (res.files && res.files[0]) || res.file || null;
    const fileUrl = mainFile && (mainFile.url || mainFile.path) ? normalizeUrl(mainFile.url || mainFile.path) : null;
    const previewUrl = res.previewUrl ? normalizeUrl(res.previewUrl) : (res.readOnlineUrl ? normalizeUrl(res.readOnlineUrl) : null);
    const chosenUrl = previewUrl || fileUrl;

    // If resource has contentHtml or description, render text
    if(res.contentHtml){
        const sanitized = sanitizeHtml(res.contentHtml);
        readerArticle.innerHTML = sanitized || '<p class="text-gray-600">No readable content available.</p>';
        embedArea.classList.add('hidden');
        pdfViewer.classList.add('hidden');
        return;
    }
    if((res.description || res.summary) && !chosenUrl){
        const text = res.description || res.summary || '';
        const paragraphs = text.split(/\n{2,}/).filter(Boolean).map(p => `<p>${sanitizeHtml(p)}</p>`).join('\n');
        readerArticle.innerHTML = paragraphs || '<p class="text-gray-600">No readable content available.</p>';
        embedArea.classList.add('hidden');
        pdfViewer.classList.add('hidden');
        return;
    }

    // If file is present and appears to be PDF -> try to load from IDB first; else fetch and store
    if(chosenUrl){
        const isPdf = /\.pdf($|\?)/i.test(chosenUrl) || (mainFile && (mainFile.mimeType || mainFile.mimetype) && /pdf/i.test(mainFile.mimeType || mainFile.mimetype));
        if(isPdf){
            // Try load saved Blob from IndexedDB
            try {
                const saved = await getBlobFromIDB(resourceId);
                if(saved){
                    showTopFlash('Loaded saved copy');
                    await loadPdfFromBlob(saved);
                } else {
                    // Not saved — download in background with progress, save then open
                    showTopFlash('Downloading preview…');
                    try {
                        const arrayBuffer = await fetchWithProgress(chosenUrl, (loaded, total) => setDownloadProgress(loaded, total));
                        // create blob (try to preserve mime)
                        const blob = new Blob([arrayBuffer], { type: 'application/pdf' });
                        // save to IDB asynchronously (do not block render)
                        saveBlobToIDB(resourceId, blob).then(()=> showTopFlash('Saved for offline', 2000)).catch(()=>{/*ignore*/});
                        // open PDF from arrayBuffer
                        await openPdfDocumentFromArrayBuffer(arrayBuffer);
                    } catch (err) {
                        console.error('Download/render error', err);
                        showTopFlash('Could not download PDF', 3000);
                        readerArticle.innerHTML = '<p class="text-center text-gray-500">Could not load PDF preview.</p>';
                        embedArea.classList.remove('hidden');
                        embedArea.innerHTML = `<iframe src="${chosenUrl}" style="width:100%;height:100%;border:0;" loading="lazy"></iframe>`;
                    } finally {
                        downloadProgressEl.textContent = '';
                    }
                }
            } catch(err){
                console.error('IDB or PDF open error', err);
                showTopFlash('Error opening saved file', 3000);
            }
            return;
        } else {
            // non-pdf file -> embed in iframe
            readerArticle.classList.add('hidden');
            embedArea.classList.remove('hidden');
            embedArea.innerHTML = `<iframe src="${chosenUrl}" style="width:100%;height:100%;border:0;" loading="lazy"></iframe>`;
            return;
        }
    }

    // fallback: no content or file
    readerArticle.innerHTML = '<p class="text-center text-gray-500">No content available for this resource.</p>';
}

/* --------------- Event wiring for PDF controls --------------- */
async function updatePageUI(){
    const total = pdfDoc ? pdfDoc.numPages : Number(totalPagesEl.textContent) || 1;
    totalPagesEl.textContent = total;
    currentPageEl.textContent = currentPdfPage;
    pageSlider.max = total;
    pageSlider.value = currentPdfPage;
    const pct = Math.round((currentPdfPage / total) * 100);
    percentageDisplay.textContent = pct + '%';
    document.getElementById('footerCurrentPage').textContent = currentPdfPage;
    document.getElementById('footerTotalPages').textContent = total;
}

pageSlider.addEventListener('input', async (e) => {
    if(!isPdfMode || !pdfDoc) return;
    const p = Math.max(1, Math.min(pdfDoc.numPages, Number(e.target.value)));
    currentPdfPage = p;
    await renderPdfPage(pdfDoc, currentPdfPage, pdfCanvas, pdfScale);
    updatePageUI();
    localStorage.setItem(`readerCurrentPage:${resourceId}`, currentPdfPage);
});

pdfZoomIn.addEventListener('click', async () => {
    if(!pdfDoc) return;
    pdfScale = Math.min(3.0, pdfScale + 0.25);
    await renderPdfPage(pdfDoc, currentPdfPage, pdfCanvas, pdfScale);
});
pdfZoomOut.addEventListener('click', async () => {
    if(!pdfDoc) return;
    pdfScale = Math.max(0.4, pdfScale - 0.25);
    await renderPdfPage(pdfDoc, currentPdfPage, pdfCanvas, pdfScale);
});

// Save current downloaded PDF to IDB (explicit user trigger — useful if it wasn't saved automatically)
downloadBtn.addEventListener('click', async () => {
    try {
        // if already saved, inform user
        const existing = await getBlobFromIDB(resourceId);
        if(existing){
            showTopFlash('Already saved for offline', 1600);
            return;
        }
        // attempt network fetch + save
        const mainFile = (resource.files && resource.files[0]) || resource.file || null;
        const fileUrl = mainFile && (mainFile.url || mainFile.path) ? normalizeUrl(mainFile.url || mainFile.path) : null;
        const previewUrl = resource.previewUrl ? normalizeUrl(resource.previewUrl) : (resource.readOnlineUrl ? normalizeUrl(resource.readOnlineUrl) : null);
        const chosenUrl = previewUrl || fileUrl;
        if(!chosenUrl) { showTopFlash('No file to download', 1800); return; }
        showTopFlash('Downloading for offline…');
        const arrayBuffer = await fetchWithProgress(chosenUrl, (loaded, total) => setDownloadProgress(loaded, total));
        const blob = new Blob([arrayBuffer], { type: 'application/pdf' });
        await saveBlobToIDB(resourceId, blob);
        showTopFlash('Saved for offline', 2000);
    } catch (err) {
        console.error(err);
        showTopFlash('Could not save file', 2500);
    } finally {
        downloadProgressEl.textContent = '';
    }
});

// Remove saved copy
removeSavedBtn.addEventListener('click', async () => {
    const confirmed = confirm('Remove saved offline copy for this book?');
    if(!confirmed) return;
    try {
        await deleteBlobFromIDB(resourceId);
        showTopFlash('Saved copy removed', 1800);
    } catch(err){
        console.error(err);
        showTopFlash('Could not remove saved copy', 1800);
    }
});

/* --------------- Notes, appearance, and misc wiring (kept from previous implementation) --------------- */
// Notes (per-resource)
let notes = JSON.parse(localStorage.getItem(`readerNotes:${resourceId || 'unknown'}`) || '[]');
function saveNotes(){ localStorage.setItem(`readerNotes:${resourceId || 'unknown'}`, JSON.stringify(notes)); }
function renderNotes(){
    const notesList = document.getElementById('notesList');
    if(!notes || notes.length === 0){
        notesList.innerHTML = `<div class="text-center py-8"><i class="fa-regular fa-note-sticky text-4xl text-gray-300 mb-3 block"></i><p class="text-sm text-gray-500 font-sans">No notes yet</p><p class="text-xs text-gray-400 font-sans mt-1">Highlight text and add notes while reading</p></div>`;
        return;
    }
    notesList.innerHTML = notes.map((note, idx) => `
        <div class="bg-gray-50 rounded-lg p-4 border border-gray-200">
            <div class="flex items-start justify-between gap-3 mb-2">
                <p class="font-sans text-xs font-semibold text-gray-500">Page ${note.page}</p>
                <button onclick="deleteNote(${idx})" class="text-gray-400 hover:text-red-600 transition-colors"><i class="fa-solid fa-trash text-sm"></i></button>
            </div>
            <p class="font-serif text-sm leading-relaxed text-gray-700 mb-2 italic">"${note.highlight}"</p>
            <p class="font-sans text-sm text-gray-600">${note.text}</p>
            <p class="font-sans text-xs text-gray-400 mt-2">${new Date(note.timestamp).toLocaleString()}</p>
        </div>
    `).join('');
}
window.deleteNote = function(i){ notes.splice(i,1); saveNotes(); renderNotes(); };
function addNote(highlight, text){ notes.push({ page: currentPdfPage || 1, highlight, text, timestamp: new Date().toISOString() }); saveNotes(); renderNotes(); }

document.getElementById('notesBtn').addEventListener('click', () => { renderNotes(); document.getElementById('notesModal').classList.remove('hidden'); document.body.style.overflow = 'hidden'; });
document.getElementById('notesClose').addEventListener('click', () => { document.getElementById('notesModal').classList.add('hidden'); document.body.style.overflow = ''; });
document.getElementById('notesExport').addEventListener('click', () => {
    if(!notes || notes.length === 0){ alert('No notes to export'); return; }
    const text = notes.map(n => `Page ${n.page}\n"${n.highlight}"\n${n.text}\n---`).join('\n\n');
    const blob = new Blob([text], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = (resource && (resource.title || resource.name) ? (resource.title.replace(/\s+/g,'_')) : 'notes') + '.txt'; a.click(); URL.revokeObjectURL(url);
});
document.getElementById('notesClear').addEventListener('click', () => { if(confirm('Delete all notes?')){ notes = []; saveNotes(); renderNotes(); } });

/* --------------- Utility: sanitize HTML --------------- */
function sanitizeHtml(htmlString){
    if(!htmlString) return '';
    const parser = new DOMParser();
    const doc = parser.parseFromString(htmlString, 'text/html');
    doc.querySelectorAll('script, style').forEach(n => n.remove());
    const elements = doc.querySelectorAll('*');
    elements.forEach(el => {
        [...el.attributes].forEach(attr => {
            if(attr.name.startsWith('on')) el.removeAttribute(attr.name);
            if((attr.name === 'href' || attr.name === 'src') && attr.value && attr.value.trim().toLowerCase().startsWith('javascript:')) el.removeAttribute(attr.name);
        });
    });
    return doc.body.innerHTML;
}
