<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.85">
    <title>Clean Code Reader - Note Detail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Source Serif 4', 'Georgia', 'serif'],
                        titleSerif: ['Playfair Display', 'Georgia', 'serif']
                    },
                    colors: {
                        readerBg: '#FBF8F3',
                        readerText: '#1A1816',
                        readerBlue: '#2563EB',
                        readerMuted: '#6B7280',
                        readerHighlight: '#FEF08A',
                        readerCardBg: '#F4EFE6'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FBF8F3;
            color: #1A1816;
            font-family: 'Source Serif 4', Georgia, serif;
            margin: 0;
            padding: 0;
        }

        .decorative-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .decorative-line::before,
        .decorative-line::after {
            content: "";
            height: 1px;
            width: 60px;
            background-color: #E2DACD;
        }
    </style>
</head>
<body class="w-full min-h-screen flex flex-col justify-between bg-readerBg">

    <!-- Header Navigation -->
    <div class="sticky top-0 w-full bg-readerBg/90 backdrop-blur-sm z-20 border-b border-[#EAE3D9]">
        <header class="flex items-center justify-between px-5 py-3 max-w-2xl mx-auto w-full">
            <button id="backBtn" class="text-readerText hover:opacity-70 transition-opacity p-2 -ml-2 flex items-center gap-2 font-sans text-xs font-semibold">
                <i class="fa-solid fa-arrow-left text-[16px]"></i>
                <span>Back</span>
            </button>
            
            <div class="text-center flex flex-col items-center">
                <h1 class="font-sans font-bold text-[14px] text-readerText leading-tight">Note Details</h1>
                <p class="font-sans text-[11px] text-readerMuted font-medium" id="headerBookTitle">Clean Code</p>
            </div>

            <div class="flex items-center gap-2 text-readerText">
                <button id="shareBtn" class="hover:opacity-70 transition-opacity p-2 text-gray-600 hover:text-readerBlue" title="Copy Note">
                    <i class="fa-regular fa-copy text-[17px]"></i>
                </button>
                <button id="deleteBtn" class="hover:opacity-70 transition-opacity p-2 text-gray-600 hover:text-red-600" title="Delete Note">
                    <i class="fa-regular fa-trash-can text-[17px]"></i>
                </button>
            </div>
        </header>
    </div>

    <!-- Main Note View -->
    <main class="flex-1 max-w-xl w-full mx-auto px-6 pt-8 pb-16 flex flex-col">
        
        <!-- Note Metadata Header -->
        <div id="noteHeader" class="text-center mb-6">
            <div class="flex items-center justify-center gap-2 mb-2">
                <span id="notePageBadge" class="font-sans text-[11px] uppercase tracking-[0.15em] font-bold text-readerBlue bg-blue-50 px-2.5 py-1 rounded-full border border-blue-100">
                    PAGE --
                </span>
                <span id="noteDateBadge" class="font-sans text-[11px] text-readerMuted font-medium">
                    --
                </span>
            </div>
            
            <h2 id="noteTitleDisplay" class="font-titleSerif text-[28px] font-bold text-readerText mt-2 tracking-tight">
                Reading Annotation
            </h2>

            <div class="decorative-line my-4">
                <svg width="24" height="12" viewBox="0 0 24 12" fill="none" xmlns="http://www.w3.org/2000/svg" class="text-[#D3C7B5]">
                    <path d="M2 6C5 2 7 2 10 6C13 10 15 10 18 6C20 3.33 21.5 3.33 22 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M2 6C2.5 8.67 4 8.67 6 6C9 2 11 2 14 6C17 10 19 10 22 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
                </svg>
            </div>
        </div>

        <!-- Highlighted Excerpt Section -->
        <div class="mb-8">
            <span class="font-sans text-[11px] font-semibold text-readerMuted uppercase tracking-wider block mb-2">
                Highlighted Passages
            </span>
            <blockquote id="noteHighlight" class="relative bg-readerHighlight/40 border-l-4 border-amber-400 p-4 rounded-r-xl font-serif text-[17px] leading-[1.7] text-readerText italic shadow-sm">
                "Loading excerpt..."
            </blockquote>
        </div>

        <!-- User's Note / Annotation Content -->
        <div class="space-y-4">
            <span class="font-sans text-[11px] font-semibold text-readerMuted uppercase tracking-wider block mb-1">
                Your Thoughts & Notes
            </span>
            <div id="noteContent" class="bg-white/60 border border-[#EAE3D9] rounded-xl p-5 font-serif text-[18px] leading-[1.8] text-[#22201D] shadow-sm min-h-[140px] whitespace-pre-wrap">
                Loading note text...
            </div>
        </div>

        <!-- Missing Note / Error State Container -->
        <div id="notFoundState" class="hidden text-center py-12">
            <i class="fa-regular fa-face-frown text-5xl text-gray-300 mb-4 block"></i>
            <h3 class="font-sans font-bold text-lg text-readerText">Note Not Found</h3>
            <p class="font-sans text-sm text-readerMuted mt-1 mb-6">The requested note could not be loaded or may have been deleted.</p>
            <a href="javascript:history.back()" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-lg bg-readerBlue text-white text-sm font-sans font-medium hover:bg-blue-600 transition-colors">
                <i class="fa-solid fa-arrow-left"></i> Return to Reader
            </a>
        </div>

    </main>

    <!-- Footer Actions -->
    <footer class="sticky bottom-0 w-full bg-readerBg/95 backdrop-blur-md border-t border-[#EAE3D9] py-4 z-20">
        <div class="max-w-xl mx-auto px-6 flex justify-between items-center font-sans">
            <button id="editNoteBtn" class="flex items-center gap-2 text-readerText hover:text-readerBlue transition-colors text-sm font-semibold px-4 py-2 rounded-lg border border-[#E2DACD] bg-white">
                <i class="fa-regular fa-pen-to-square"></i>
                <span>Edit Note</span>
            </button>

            <button id="copyAllBtn" class="flex items-center gap-2 text-white bg-readerBlue hover:bg-blue-600 transition-colors text-sm font-semibold px-5 py-2 rounded-lg shadow-sm">
                <i class="fa-regular fa-copy"></i>
                <span>Copy Full Note</span>
            </button>
        </div>
    </footer>

    <script>
        // Retrieve ID from URL query params (e.g. ?id=1722400000000 or ?id=1)
        const urlParams = new URLSearchParams(window.location.search);
        const noteId = urlParams.get('id');

        // Fetch notes stored in localStorage
        let notes = JSON.parse(localStorage.getItem('readerNotes')) || [];

        // Fallback sample data if localStorage is empty and user opens with test parameters
        const sampleNotes = [
            {
                id: "1",
                page: "45",
                highlight: "Functions should do one thing. They should do it well. They should do it only.",
                text: "Refactor the authentication handler in project core to follow this principle. Split token validation and user database lookup into distinct helper modules.",
                timestamp: new Date().toISOString()
            }
        ];

        let activeNote = notes.find(n => String(n.id) === String(noteId));

        // If no stored note matches, but query parameter matches sample id or testing, fall back gracefully
        if (!activeNote && (noteId === "1" || notes.length === 0)) {
            activeNote = sampleNotes[0];
        }

        // DOM elements
        const notePageBadge = document.getElementById('notePageBadge');
        const noteDateBadge = document.getElementById('noteDateBadge');
        const noteHighlight = document.getElementById('noteHighlight');
        const noteContent = document.getElementById('noteContent');
        const notFoundState = document.getElementById('notFoundState');
        const mainHeader = document.getElementById('noteHeader');

        // Render functions
        function renderNoteDetails() {
            if (!activeNote) {
                // Display empty/error state
                mainHeader.classList.add('hidden');
                document.querySelector('article, div.mb-8').classList.add('hidden');
                document.querySelector('.space-y-4').classList.add('hidden');
                document.querySelector('footer').classList.add('hidden');
                notFoundState.classList.remove('hidden');
                return;
            }

            // Populate note content
            notePageBadge.textContent = `PAGE ${activeNote.page || 'N/A'}`;
            
            if (activeNote.timestamp) {
                const dateObj = new Date(activeNote.timestamp);
                noteDateBadge.textContent = dateObj.toLocaleDateString('en-US', {
                    month: 'short',
                    day: 'numeric',
                    year: 'numeric'
                });
            }

            noteHighlight.textContent = activeNote.highlight ? `"${activeNote.highlight}"` : "No text highlighted.";
            noteContent.textContent = activeNote.text || "No handwritten notes attached.";
        }

        // Handle Back navigation
        document.getElementById('backBtn').addEventListener('click', () => history.back());

        // Handle Delete Note
        document.getElementById('deleteBtn').addEventListener('click', () => {
            if (!activeNote) return;
            if (confirm('Are you sure you want to delete this note?')) {
                notes = notes.filter(n => String(n.id) !== String(activeNote.id));
                localStorage.setItem('readerNotes', JSON.stringify(notes));
                history.back();
            }
        });

        // Copy content helper
        function copyTextToClipboard(text, successMessage) {
            navigator.clipboard.writeText(text).then(() => {
                alert(successMessage);
            }).catch(() => {
                alert('Failed to copy to clipboard.');
            });
        }

        // Copy Note Excerpt / Full Note
        document.getElementById('shareBtn').addEventListener('click', () => {
            if (!activeNote) return;
            copyTextToClipboard(`" ${activeNote.highlight} "\n\nNote: ${activeNote.text}`, 'Note copied to clipboard!');
        });

        document.getElementById('copyAllBtn').addEventListener('click', () => {
            if (!activeNote) return;
            copyTextToClipboard(`Page ${activeNote.page}\nHighlight: "${activeNote.highlight}"\n\nNotes:\n${activeNote.text}`, 'Full note details copied!');
        });

        // Edit Note Inline Handler
        document.getElementById('editNoteBtn').addEventListener('click', () => {
            if (!activeNote) return;
            const updatedText = prompt('Edit your note:', activeNote.text);
            if (updatedText !== null) {
                activeNote.text = updatedText.trim();
                
                // Update in storage if present
                const index = notes.findIndex(n => String(n.id) === String(activeNote.id));
                if (index !== -1) {
                    notes[index].text = activeNote.text;
                    localStorage.setItem('readerNotes', JSON.stringify(notes));
                }
                
                renderNoteDetails();
            }
        });

        // Run initialization
        renderNoteDetails();
    </script>
</body>
</html>
