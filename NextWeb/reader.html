<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passage Reading Trainer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom scrollbar for text area */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        
        /* The fade-out effect at the top and bottom of the reading container */
        .reader-mask {
            mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex items-center justify-center p-4">

    <!-- SETUP SCREEN -->
    <main id="setupScreen" class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 w-full max-w-2xl transition-all duration-300">
        <h1 class="text-2xl font-bold text-gray-900 mb-2">Reading Pace Trainer</h1>
        <p class="text-gray-500 mb-6 text-sm">Paste your passage below and set your target reading speed.</p>

        <label class="block text-sm font-semibold text-gray-700 mb-2">Your Passage</label>
        <textarea id="passageInput" rows="8" class="w-full p-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none resize-y mb-6" placeholder="Paste the text you want to practice reading here..."></textarea>

        <div class="flex flex-col sm:flex-row items-start sm:items-end gap-4 mb-8">
            <div class="w-full sm:w-1/2">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Target Speed (Words Per Minute)</label>
                <div class="relative">
                    <input type="number" id="wpmInput" value="200" min="50" max="1000" class="w-full p-3 pl-4 pr-12 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-lg font-medium">
                    <span class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 font-medium">WPM</span>
                </div>
            </div>
            
            <div class="w-full sm:w-1/2 flex items-center justify-between bg-blue-50 p-3 rounded-xl border border-blue-100 h-[52px]">
                <span class="text-sm text-blue-800 font-medium">Est. Time:</span>
                <span id="estTimeDisplay" class="font-bold text-blue-600 text-lg">0:00</span>
            </div>
        </div>

        <button id="startBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-xl transition-colors flex items-center justify-center gap-2">
            <i class="fa-solid fa-play"></i> Start Reading Session
        </button>
    </main>

    <!-- READING SCREEN (Hidden by default) -->
    <main id="readScreen" class="hidden bg-white rounded-2xl shadow-sm border border-gray-100 w-full max-w-3xl overflow-hidden flex flex-col h-[85vh]">
        
        <!-- Header / Controls -->
        <div class="bg-white border-b border-gray-100 p-4 flex justify-between items-center z-10 shadow-sm">
            <button id="backBtn" class="text-gray-500 hover:text-gray-800 font-medium px-3 py-2 rounded-lg hover:bg-gray-100 transition-colors">
                <i class="fa-solid fa-arrow-left mr-1"></i> Back
            </button>
            
            <div class="flex items-center gap-4">
                <div class="text-sm text-gray-500 font-medium">
                    Target: <span id="displayWpm" class="text-gray-900 font-bold">200</span> WPM
                </div>
                <div class="w-px h-6 bg-gray-200"></div>
                <div id="countdownTimer" class="font-mono font-bold text-lg text-blue-600 w-[60px] text-right">0:00</div>
            </div>
        </div>

        <!-- Reader Area -->
        <div class="relative flex-1 bg-[#fdfdfc] reader-mask overflow-hidden" id="readerContainer">
            
            <!-- Focus Guide Line -->
            <div class="absolute top-1/3 left-0 w-full h-[40px] border-y border-blue-200 bg-blue-50/30 z-10 pointer-events-none flex items-center">
                <div class="w-1.5 h-full bg-blue-500"></div>
            </div>

            <!-- Text Content -->
            <div id="readerContent" class="text-2xl md:text-3xl leading-relaxed text-gray-800 font-medium px-8 md:px-16 max-w-prose mx-auto text-left py-[33vh]">
                <!-- Text injected here -->
            </div>
        </div>

        <!-- Play/Pause Controls -->
        <div class="bg-white border-t border-gray-100 p-4 flex justify-center z-10">
            <button id="playPauseBtn" class="bg-gray-900 hover:bg-gray-800 text-white w-14 h-14 rounded-full flex items-center justify-center text-xl transition-transform hover:scale-105 shadow-md">
                <i class="fa-solid fa-pause"></i>
            </button>
        </div>
    </main>

    <script>
        // DOM Elements
        const setupScreen = document.getElementById('setupScreen');
        const readScreen = document.getElementById('readScreen');
        const passageInput = document.getElementById('passageInput');
        const wpmInput = document.getElementById('wpmInput');
        const estTimeDisplay = document.getElementById('estTimeDisplay');
        const startBtn = document.getElementById('startBtn');
        const backBtn = document.getElementById('backBtn');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const readerContent = document.getElementById('readerContent');
        const readerContainer = document.getElementById('readerContainer');
        const displayWpm = document.getElementById('displayWpm');
        const countdownTimer = document.getElementById('countdownTimer');

        // State Variables
        let scrollAnimation = null;
        let isPlaying = false;
        let totalDurationMs = 0;
        let timerInterval = null;
        let startTime = 0;
        let elapsedTime = 0;

        // Calculate and update estimated time on input change
        function updateEstimates() {
            const text = passageInput.value.trim();
            if (!text) {
                estTimeDisplay.textContent = "0:00";
                return;
            }
            const words = text.split(/\s+/).length;
            const wpm = parseInt(wpmInput.value) || 200;
            const minutes = words / wpm;
            const totalSeconds = Math.ceil(minutes * 60);
            
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            estTimeDisplay.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        passageInput.addEventListener('input', updateEstimates);
        wpmInput.addEventListener('input', updateEstimates);

        // Start Reading Session
        startBtn.addEventListener('click', () => {
            const text = passageInput.value.trim();
            const wpm = parseInt(wpmInput.value) || 200;

            if (!text) {
                alert("Please paste some text first.");
                return;
            }

            const words = text.split(/\s+/).length;
            const minutes = words / wpm;
            totalDurationMs = minutes * 60 * 1000;

            // Setup UI
            displayWpm.textContent = wpm;
            
            // Format text (wrap paragraphs in p tags for spacing)
            const formattedText = text.split('\n\n').map(p => `<p class="mb-6">${p}</p>`).join('');
            readerContent.innerHTML = formattedText;

            // Switch Screens
            setupScreen.classList.add('hidden');
            readScreen.classList.remove('hidden');

            // Initialize Animation (Wait for DOM to render height)
            setTimeout(startScrollAnimation, 100);
        });

        function startScrollAnimation() {
            // Calculate how far we need to scroll.
            // We scroll from current position up to the end of the text.
            const distance = readerContent.scrollHeight - readerContainer.clientHeight;
            
            if (distance <= 0) return; // Text is too short to scroll

            // Web Animations API for smooth CSS-like animation in JS
            scrollAnimation = readerContent.animate([
                { transform: 'translateY(0px)' },
                { transform: `translateY(-${distance}px)` }
            ], {
                duration: totalDurationMs,
                easing: 'linear',
                fill: 'forwards'
            });

            isPlaying = true;
            updatePlayPauseIcon();
            
            // Handle Timer
            elapsedTime = 0;
            startTime = Date.now();
            clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 100);

            // Handle completion
            scrollAnimation.onfinish = () => {
                isPlaying = false;
                updatePlayPauseIcon();
                clearInterval(timerInterval);
            };
        }

        function updateTimer() {
            if (!isPlaying) return;
            
            const currentNow = Date.now();
            elapsedTime += (currentNow - startTime);
            startTime = currentNow;

            const remainingMs = Math.max(0, totalDurationMs - elapsedTime);
            const remainingSecs = Math.ceil(remainingMs / 1000);
            
            const mins = Math.floor(remainingSecs / 60);
            const secs = remainingSecs % 60;
            countdownTimer.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Play/Pause Control
        playPauseBtn.addEventListener('click', () => {
            if (!scrollAnimation) return;

            if (isPlaying) {
                scrollAnimation.pause();
                isPlaying = false;
                startTime = Date.now(); // Update start time so timer logic doesn't jump
            } else {
                scrollAnimation.play();
                isPlaying = true;
                startTime = Date.now();
            }
            updatePlayPauseIcon();
        });

        function updatePlayPauseIcon() {
            playPauseBtn.innerHTML = isPlaying 
                ? '<i class="fa-solid fa-pause"></i>' 
                : '<i class="fa-solid fa-play ml-1"></i>';
        }

        // Back Button
        backBtn.addEventListener('click', () => {
            if (scrollAnimation) scrollAnimation.cancel();
            clearInterval(timerInterval);
            readScreen.classList.add('hidden');
            setupScreen.classList.remove('hidden');
        });

    </script>
</body>
</html>
