<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.85">
    <title>Premium Reading Trainer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Lora', 'serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            900: '#312e81',
                        }
                    },
                    boxShadow: {
                        'soft': '0 20px 40px -15px rgba(0,0,0,0.05)',
                        'float': '0 10px 30px -10px rgba(79, 70, 229, 0.3)',
                    }
                }
            }
        }
    </script>
    <style>
        /* Refined Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        /* Smooth fade out at the top and bottom of the reading view */
        .reader-mask {
            mask-image: linear-gradient(to bottom, transparent 5%, black 25%, black 75%, transparent 95%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 5%, black 25%, black 75%, transparent 95%);
        }

        /* Subtle animated background */
        .bg-mesh {
            background-color: #fafafa;
            background-image: radial-gradient(at 40% 20%, hsla(228,100%,74%,0.08) 0px, transparent 50%),
                              radial-gradient(at 80% 0%, hsla(189,100%,56%,0.08) 0px, transparent 50%),
                              radial-gradient(at 0% 50%, hsla(355,100%,93%,0.08) 0px, transparent 50%);
        }

        /* Countdown Animation */
        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }
        .animate-pop {
            animation: pop 1s ease-in-out forwards;
        }

        /* Passage card hover effect */
        .passage-card {
            transition: all 0.3s ease;
        }
        .passage-card:hover {
            transform: translateY(-2px);
        }
        .passage-card.selected {
            border-color: #4f46e5;
            background-color: #eef2ff;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
    </style>
</head>
<body class="bg-mesh text-slate-800 font-sans min-h-screen selection:bg-brand-100 selection:text-brand-900">

    <!-- Hidden Audio Element -->
    <audio id="backgroundAudio" loop preload="none"></audio>

    <!-- SETUP SCREEN -->
    <main id="setupScreen" class="min-h-screen flex items-center justify-center p-4 transition-opacity duration-500 overflow-y-auto py-8">
        <div class="bg-white/80 backdrop-blur-xl p-8 md:p-12 rounded-[2rem] shadow-soft border border-white w-full max-w-4xl">
            
            <div class="text-center mb-10">
                <div class="w-16 h-16 bg-brand-50 text-brand-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-sm border border-brand-100">
                    <i class="fa-solid fa-book-open-reader text-2xl"></i>
                </div>
                <h1 class="text-3xl md:text-4xl font-bold text-slate-900 mb-3 tracking-tight">FlowRead</h1>
                <p class="text-slate-500 text-sm md:text-base max-w-md mx-auto">Enhance your comprehension and speed. Paste your passage and set your optimal pace.</p>
            </div>

            <div class="space-y-6">
                <!-- Tabs for Passage Selection -->
                <div class="flex gap-3 border-b border-slate-200">
                    <button id="customTab" class="px-4 py-2 font-semibold text-slate-700 border-b-2 border-brand-600 transition-colors">
                        Custom Text
                    </button>
                    <button id="libraryTab" class="px-4 py-2 font-semibold text-slate-500 border-b-2 border-transparent hover:text-slate-700 transition-colors">
                        Passage Library
                    </button>
                </div>

                <!-- Custom Text Tab -->
                <div id="customTabContent" class="space-y-6">
                    <div>
                        <label class="flex justify-between text-sm font-semibold text-slate-700 mb-2">
                            <span>Your Passage</span>
                            <span id="wordCountDisplay" class="text-slate-400 font-medium">0 words</span>
                        </label>
                        <textarea id="passageInput" rows="6" class="w-full p-5 bg-slate-50/50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-brand-500/10 focus:border-brand-500 outline-none resize-none" placeholder="Paste your passage here..."></textarea>
                    </div>
                </div>

                <!-- Library Tab -->
                <div id="libraryTabContent" class="hidden space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-96 overflow-y-auto pr-2">
                        <!-- Passages will be inserted here -->
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Target Speed</label>
                        <div class="relative">
                            <input type="number" id="wpmInput" value="250" min="50" max="1000" class="w-full p-4 pl-5 pr-16 bg-slate-50/50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-brand-500/10 focus:border-brand-500 outline-none">
                            <span class="absolute right-5 top-1/2 transform -translate-y-1/2 text-slate-400 font-medium text-sm">WPM</span>
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Estimated Duration</label>
                        <div class="flex items-center justify-center bg-brand-50 p-4 rounded-2xl border border-brand-100 h-[62px]">
                            <i class="fa-regular fa-clock text-brand-500 mr-2 text-lg"></i>
                            <span id="estTimeDisplay" class="font-bold text-brand-600 text-xl tracking-tight">0:00</span>
                        </div>
                    </div>
                </div>

                <!-- Background Audio Section -->
                <div class="space-y-4 border-t border-slate-200 pt-6">
                    <h3 class="text-sm font-semibold text-slate-700 flex items-center">
                        <i class="fa-solid fa-music mr-2"></i>
                        Background Audio (Optional)
                    </h3>

                    <!-- Tabs for Audio Selection -->
                    <div class="flex gap-3 border-b border-slate-200">
                        <button id="uploadAudioTab" class="px-4 py-2 font-semibold text-slate-700 border-b-2 border-brand-600 transition-colors text-sm">
                            Upload File
                        </button>
                        <button id="defaultAudioTab" class="px-4 py-2 font-semibold text-slate-500 border-b-2 border-transparent hover:text-slate-700 transition-colors text-sm">
                            Preset Music
                        </button>
                    </div>

                    <!-- Upload Audio Tab -->
                    <div id="uploadAudioTabContent" class="space-y-3">
                        <div class="relative">
                            <input type="file" id="audioInput" accept="audio/*" class="w-full p-4 bg-slate-50/50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-brand-500/10 focus:border-brand-500 outline-none cursor-pointer">
                            <span class="block text-xs text-slate-400 mt-1">MP3, WAV, or OGG format recommended</span>
                            <div id="audioFileName" class="text-sm text-brand-600 font-medium mt-2 hidden">
                                <i class="fa-solid fa-check mr-1"></i><span id="audioNameText"></span>
                            </div>
                        </div>
                    </div>

                    <!-- Default Audio Tab -->
                    <div id="defaultAudioTabContent" class="hidden grid grid-cols-1 md:grid-cols-2 gap-3">
                        <!-- Default music will be inserted here -->
                    </div>
                </div>

                <button id="startBtn" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-semibold text-lg py-4 px-6 rounded-2xl transition-all shadow-float flex items-center justify-center group">
                    Begin Session 
                    <i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition-transform ml-2"></i>
                </button>
            </div>
        </div>
    </main>

    <!-- COUNTDOWN OVERLAY (Hidden by default) -->
    <div id="countdownOverlay" class="fixed inset-0 bg-white/90 backdrop-blur-sm z-50 hidden flex-col items-center justify-center">
        <h2 class="text-2xl font-medium text-slate-500 mb-4">Get Ready</h2>
        <div id="countdownNumber" class="text-8xl font-bold text-brand-600">3</div>
    </div>

    <!-- READING SCREEN (Hidden by default) -->
    <main id="readScreen" class="hidden fixed inset-0 bg-white z-40 flex flex-col">
        
        <!-- Sleek Header -->
        <header class="absolute top-0 w-full bg-white/80 backdrop-blur-md border-b border-slate-100 px-6 py-4 flex justify-between items-center z-20">
            <button id="backBtn" class="group flex items-center text-slate-500 hover:text-slate-900 font-medium transition-colors">
                <div class="w-8 h-8 rounded-full bg-slate-100 group-hover:bg-slate-200 flex items-center justify-center mr-3 transition-colors">
                    <i class="fa-solid fa-arrow-left text-sm"></i>
                </div>
                Exit
            </button>
            
            <div class="flex items-center gap-6 bg-slate-50 px-4 py-2 rounded-full border border-slate-100 shadow-sm">
                <div class="text-sm font-medium text-slate-500 flex items-center gap-2">
                    <i class="fa-solid fa-gauge-high text-brand-500"></i>
                    <span id="displayWpm" class="text-slate-800 font-bold">250</span> WPM
                </div>
                <div class="w-px h-4 bg-slate-200"></div>
                <div class="text-sm font-medium text-slate-500 flex items-center gap-2">
                    <i class="fa-regular fa-clock text-brand-500"></i>
                    <span id="countdownTimer" class="font-bold text-slate-800 w-[45px]">0:00</span>
                </div>
            </div>
        </header>

        <!-- Immersive Reader Area -->
        <div class="relative flex-1 reader-mask overflow-hidden bg-white" id="readerContainer">
            
            <!-- Elegant Focus Guide -->
            <div class="absolute top-1/3 left-0 w-full h-[80px] pointer-events-none flex justify-center items-center z-10">
                <div class="w-full max-w-4xl h-full bg-brand-50/40 border-y border-brand-100 rounded-xl relative">
                    <!-- Left indicator line -->
                    <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-brand-500 rounded-l-xl"></div>
                </div>
            </div>

            <!-- Text Content -->
            <div id="readerContent" class="font-serif text-3xl md:text-[2.5rem] leading-[1.8] text-slate-800 px-6 md:px-12 max-w-4xl mx-auto text-left py-[35vh] pb-[65vh]">
                <!-- Text injected here -->
            </div>
        </div>

        <!-- Floating Controls Dock -->
        <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 z-20">
            <div class="bg-slate-900/90 backdrop-blur-xl p-2 rounded-full shadow-2xl border border-slate-700 flex items-center gap-2">
                
                <button id="restartBtn" class="w-12 h-12 rounded-full text-slate-300 hover:text-white hover:bg-slate-800 flex items-center justify-center transition-colors" title="Restart">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>

                <button id="playPauseBtn" class="w-14 h-14 bg-brand-600 hover:bg-brand-500 text-white rounded-full flex items-center justify-center text-xl transition-all shadow-float transform hover:scale-110">
                    <i class="fa-solid fa-pause"></i>
                </button>

                <button id="volumeBtn" class="w-12 h-12 rounded-full text-slate-300 hover:text-white hover:bg-slate-800 flex items-center justify-center transition-colors" title="Audio Volume">
                    <i class="fa-solid fa-volume-high"></i>
                </button>

                <button id="settingsBtn" class="w-12 h-12 rounded-full text-slate-300 hover:text-white hover:bg-slate-800 flex items-center justify-center transition-colors" title="Settings">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>
        </div>

        <!-- Volume Control Slider (Hidden by default) -->
        <div id="volumeControl" class="absolute bottom-24 left-1/2 transform -translate-x-1/2 z-20 hidden bg-slate-900/90 backdrop-blur-xl p-4 rounded-full shadow-2xl border border-slate-700 flex items-center gap-3">
            <i class="fa-solid fa-volume-low text-slate-300 text-sm"></i>
            <input type="range" id="volumeSlider" min="0" max="100" value="50" class="w-24 h-1 bg-slate-700 rounded-lg cursor-pointer accent-brand-500">
            <i class="fa-solid fa-volume-high text-slate-300 text-sm"></i>
        </div>
    </main>

    <script>
        // DOM Elements
        const setupScreen = document.getElementById('setupScreen');
        const readScreen = document.getElementById('readScreen');
        const countdownOverlay = document.getElementById('countdownOverlay');
        const countdownNumber = document.getElementById('countdownNumber');
        
        const passageInput = document.getElementById('passageInput');
        const wpmInput = document.getElementById('wpmInput');
        const estTimeDisplay = document.getElementById('estTimeDisplay');
        const wordCountDisplay = document.getElementById('wordCountDisplay');
        const audioInput = document.getElementById('audioInput');
        const audioFileName = document.getElementById('audioFileName');
        const audioNameText = document.getElementById('audioNameText');
        
        const startBtn = document.getElementById('startBtn');
        const backBtn = document.getElementById('backBtn');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const restartBtn = document.getElementById('restartBtn');
        const volumeBtn = document.getElementById('volumeBtn');
        const volumeControl = document.getElementById('volumeControl');
        const volumeSlider = document.getElementById('volumeSlider');
        
        const readerContent = document.getElementById('readerContent');
        const readerContainer = document.getElementById('readerContainer');
        const displayWpm = document.getElementById('displayWpm');
        const countdownTimer = document.getElementById('countdownTimer');
        const backgroundAudio = document.getElementById('backgroundAudio');

        // Tab elements
        const customTab = document.getElementById('customTab');
        const libraryTab = document.getElementById('libraryTab');
        const uploadAudioTab = document.getElementById('uploadAudioTab');
        const defaultAudioTab = document.getElementById('defaultAudioTab');
        
        const customTabContent = document.getElementById('customTabContent');
        const libraryTabContent = document.getElementById('libraryTabContent');
        const uploadAudioTabContent = document.getElementById('uploadAudioTabContent');
        const defaultAudioTabContent = document.getElementById('defaultAudioTabContent');

        // State Variables
        let scrollAnimation = null;
        let isPlaying = false;
        let totalDurationMs = 0;
        let timerInterval = null;
        let startTime = 0;
        let elapsedTime = 0;
        let selectedAudioFile = null;
        let selectedDefaultMusic = null;
        let passagesData = [];
        let defaultMusicData = [];

        // Load passages and music data
        async function loadData() {
            try {
                const response = await fetch('passages.json');
                const data = await response.json();
                passagesData = data.passages;
                defaultMusicData = data.defaultMusic;
                renderPassageLibrary();
                renderDefaultMusic();
            } catch (error) {
                console.log('Could not load passages.json:', error);
            }
        }

        loadData();

        // Render Passage Library
        function renderPassageLibrary() {
            const container = libraryTabContent.querySelector('div');
            container.innerHTML = passagesData.map(passage => `
                <div class="passage-card p-4 border border-slate-200 rounded-xl cursor-pointer bg-white hover:shadow-md" data-passage-id="${passage.id}">
                    <div class="flex justify-between items-start mb-2">
                        <h4 class="font-semibold text-slate-900 text-sm flex-1">${passage.title}</h4>
                        <span class="text-xs px-2 py-1 bg-brand-100 text-brand-700 rounded-full ml-2">${passage.difficulty}</span>
                    </div>
                    <p class="text-xs text-slate-500 mb-2">${passage.category}</p>
                    <p class="text-xs text-slate-600 line-clamp-2">${passage.text.substring(0, 80)}...</p>
                </div>
            `).join('');

            // Add click handlers
            document.querySelectorAll('.passage-card').forEach(card => {
                card.addEventListener('click', () => {
                    const passageId = parseInt(card.dataset.passageId);
                    const passage = passagesData.find(p => p.id === passageId);
                    if (passage) {
                        passageInput.value = passage.text;
                        updateEstimates();
                        customTab.click();
                        document.querySelectorAll('.passage-card').forEach(c => c.classList.remove('selected'));
                        card.classList.add('selected');
                    }
                });
            });
        }

        // Render Default Music
        function renderDefaultMusic() {
            defaultAudioTabContent.innerHTML = defaultMusicData.map(music => `
                <div class="music-card p-4 border border-slate-200 rounded-xl cursor-pointer bg-white hover:shadow-md transition-all" data-music-id="${music.id}">
                    <div class="flex items-start justify-between mb-2">
                        <i class="fa-solid fa-music text-brand-500 text-lg"></i>
                        <input type="radio" name="defaultMusic" value="${music.id}" class="music-radio">
                    </div>
                    <h4 class="font-semibold text-slate-900 text-sm">${music.title}</h4>
                    <p class="text-xs text-slate-500 mb-1">${music.artist}</p>
                    <p class="text-xs text-slate-600">${music.description}</p>
                </div>
            `).join('');

            // Add click handlers
            document.querySelectorAll('.music-card').forEach(card => {
                card.addEventListener('click', () => {
                    const musicId = parseInt(card.dataset.musicId);
                    const music = defaultMusicData.find(m => m.id === musicId);
                    if (music) {
                        selectedDefaultMusic = music;
                        selectedAudioFile = null;
                        audioFileName.classList.add('hidden');
                        card.querySelector('.music-radio').checked = true;
                    }
                });
            });
        }

        // Tab switching
        customTab.addEventListener('click', () => {
            customTabContent.classList.remove('hidden');
            libraryTabContent.classList.add('hidden');
            customTab.classList.add('border-brand-600');
            customTab.classList.remove('border-transparent', 'text-slate-500');
            libraryTab.classList.remove('border-brand-600');
            libraryTab.classList.add('border-transparent', 'text-slate-500');
        });

        libraryTab.addEventListener('click', () => {
            libraryTabContent.classList.remove('hidden');
            customTabContent.classList.add('hidden');
            libraryTab.classList.add('border-brand-600');
            libraryTab.classList.remove('border-transparent', 'text-slate-500');
            customTab.classList.remove('border-brand-600');
            customTab.classList.add('border-transparent', 'text-slate-500');
        });

        uploadAudioTab.addEventListener('click', () => {
            uploadAudioTabContent.classList.remove('hidden');
            defaultAudioTabContent.classList.add('hidden');
            uploadAudioTab.classList.add('border-brand-600');
            uploadAudioTab.classList.remove('border-transparent', 'text-slate-500');
            defaultAudioTab.classList.remove('border-brand-600');
            defaultAudioTab.classList.add('border-transparent', 'text-slate-500');
        });

        defaultAudioTab.addEventListener('click', () => {
            defaultAudioTabContent.classList.remove('hidden');
            uploadAudioTabContent.classList.add('hidden');
            defaultAudioTab.classList.add('border-brand-600');
            defaultAudioTab.classList.remove('border-transparent', 'text-slate-500');
            uploadAudioTab.classList.remove('border-brand-600');
            uploadAudioTab.classList.add('border-transparent', 'text-slate-500');
        });

        // Calculate words and estimated time
        function updateEstimates() {
            const text = passageInput.value.trim();
            if (!text) {
                wordCountDisplay.textContent = "0 words";
                estTimeDisplay.textContent = "0:00";
                return;
            }
            
            const words = text.split(/\s+/).length;
            wordCountDisplay.textContent = `${words} word${words !== 1 ? 's' : ''}`;
            
            const wpm = parseInt(wpmInput.value) || 250;
            const minutes = words / wpm;
            const totalSeconds = Math.ceil(minutes * 60);
            
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            estTimeDisplay.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        passageInput.addEventListener('input', updateEstimates);
        wpmInput.addEventListener('input', updateEstimates);

        // Audio file selection
        audioInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                selectedAudioFile = file;
                selectedDefaultMusic = null;
                audioNameText.textContent = file.name;
                audioFileName.classList.remove('hidden');
                document.querySelectorAll('.music-radio').forEach(r => r.checked = false);
            } else {
                selectedAudioFile = null;
                audioFileName.classList.add('hidden');
            }
        });

        // Volume control
        volumeBtn.addEventListener('click', () => {
            volumeControl.classList.toggle('hidden');
        });

        volumeSlider.addEventListener('input', (e) => {
            backgroundAudio.volume = e.target.value / 100;
        });

        // Start Flow
        startBtn.addEventListener('click', () => {
            const text = passageInput.value.trim();
            const wpm = parseInt(wpmInput.value) || 250;

            if (!text) {
                passageInput.classList.add('ring-2', 'ring-red-500', 'border-red-500');
                setTimeout(() => passageInput.classList.remove('ring-2', 'ring-red-500', 'border-red-500'), 1000);
                return;
            }

            const words = text.split(/\s+/).length;
            const minutes = words / wpm;
            totalDurationMs = minutes * 60 * 1000;

            displayWpm.textContent = wpm;
            
            const formattedText = text.split('\n\n')
                .filter(p => p.trim() !== '')
                .map(p => `<p class="mb-10 text-slate-700 opacity-90 transition-opacity hover:opacity-100">${p}</p>`)
                .join('');
            readerContent.innerHTML = formattedText;

            // Setup audio
            if (selectedAudioFile) {
                const audioUrl = URL.createObjectURL(selectedAudioFile);
                backgroundAudio.src = audioUrl;
                backgroundAudio.volume = volumeSlider.value / 100;
            } else if (selectedDefaultMusic) {
                backgroundAudio.src = selectedDefaultMusic.url;
                backgroundAudio.volume = volumeSlider.value / 100;
            }

            setupScreen.style.opacity = '0';
            setTimeout(() => {
                setupScreen.classList.add('hidden');
                setupScreen.style.opacity = '1';
                startCountdown();
            }, 300);
        });

        // 3-2-1 Countdown Sequence
        function startCountdown() {
            countdownOverlay.classList.remove('hidden');
            countdownOverlay.classList.add('flex');
            
            let count = 3;
            countdownNumber.textContent = count;
            countdownNumber.classList.add('animate-pop');

            const countInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownNumber.classList.remove('animate-pop');
                    void countdownNumber.offsetWidth;
                    countdownNumber.textContent = count;
                    countdownNumber.classList.add('animate-pop');
                } else {
                    clearInterval(countInterval);
                    countdownOverlay.classList.remove('flex');
                    countdownOverlay.classList.add('hidden');
                    readScreen.classList.remove('hidden');
                    
                    setTimeout(initScroll, 100);
                }
            }, 1000);
        }

        function initScroll() {
            if (scrollAnimation) scrollAnimation.cancel();
            
            const distance = readerContent.scrollHeight - readerContainer.clientHeight;
            
            if (distance <= 0) return;

            scrollAnimation = readerContent.animate([
                { transform: 'translateY(0px)' },
                { transform: `translateY(-${distance}px)` }
            ], {
                duration: totalDurationMs,
                easing: 'linear',
                fill: 'forwards'
            });

            isPlaying = true;
            updatePlayPauseIcon();
            
            if (backgroundAudio.src) {
                backgroundAudio.currentTime = 0;
                backgroundAudio.play().catch(err => console.log('Audio playback failed:', err));
            }
            
            elapsedTime = 0;
            startTime = Date.now();
            clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 100);

            scrollAnimation.onfinish = () => {
                isPlaying = false;
                updatePlayPauseIcon();
                clearInterval(timerInterval);
                backgroundAudio.pause();
            };
        }

        function updateTimer() {
            if (!isPlaying) return;
            
            const currentNow = Date.now();
            elapsedTime += (currentNow - startTime);
            startTime = currentNow;

            const remainingMs = Math.max(0, totalDurationMs - elapsedTime);
            const remainingSecs = Math.ceil(remainingMs / 1000);
            
            const mins = Math.floor(remainingSecs / 60);
            const secs = remainingSecs % 60;
            countdownTimer.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        playPauseBtn.addEventListener('click', () => {
            if (!scrollAnimation) return;

            if (isPlaying) {
                scrollAnimation.pause();
                backgroundAudio.pause();
                isPlaying = false;
                startTime = Date.now();
            } else {
                scrollAnimation.play();
                if (backgroundAudio.src) {
                    backgroundAudio.play().catch(err => console.log('Audio playback failed:', err));
                }
                isPlaying = true;
                startTime = Date.now();
            }
            updatePlayPauseIcon();
        });

        restartBtn.addEventListener('click', () => {
            if (!scrollAnimation) return;
            initScroll();
        });

        function updatePlayPauseIcon() {
            playPauseBtn.innerHTML = isPlaying 
                ? '<i class="fa-solid fa-pause"></i>' 
                : '<i class="fa-solid fa-play ml-1"></i>';
        }

        backBtn.addEventListener('click', () => {
            if (scrollAnimation) scrollAnimation.cancel();
            clearInterval(timerInterval);
            backgroundAudio.pause();
            backgroundAudio.src = '';
            volumeControl.classList.add('hidden');
            readScreen.classList.add('hidden');
            setupScreen.classList.remove('hidden');
        });

    </script>
</body>
</html>
