<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=0.80" />
  <title>Admin Panel - Course & Subcourse Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0B63E5; }
  </style>
</head>
<body class="min-h-screen w-full flex flex-col justify-between antialiased selection:bg-blue-100 relative">

  <div id="toastContainer" class="fixed top-20 right-4 z-50 flex flex-col gap-2 max-w-xs w-full pointer-events-none"></div>

  <header class="sticky top-0 z-40 w-full bg-[#0B63E5]/95 backdrop-blur-md text-white py-4 px-5 sm:px-8 shadow-md border-b border-blue-600/30">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-4">
        <button onclick="handleBackAction()" title="Go back" class="w-11 h-11 rounded-2xl bg-[#084FB9] hover:bg-[#0744A1] flex items-center justify-center text-white">
          <i class="fa-solid fa-arrow-left text-lg"></i>
        </button>
        <div>
          <h1 id="headerTitle" class="text-xl sm:text-2xl font-bold">Create Course</h1>
          <p class="text-blue-100/90 text-xs font-medium mt-0.5">Admin Panel</p>
        </div>
      </div>

      <button id="headerActionButton" onclick="scrollToForm()" class="flex flex-col items-center justify-center text-[#0B63E5] bg-white hover:bg-blue-50 rounded-2xl px-3 py-2">
        <div class="w-6 h-6 rounded-lg bg-blue-50 flex items-center justify-center text-[#0B63E5] font-bold">
          <i id="headerActionIcon" class="fa-solid fa-plus text-xs"></i>
        </div>
        <span id="headerActionText" class="text-[10px] font-bold mt-1 text-gray-700">New Course</span>
      </button>
    </div>
  </header>

  <main class="w-full flex-1 bg-[#F5F8FC] rounded-t-[32px] sm:rounded-t-[40px] px-4 sm:px-8 pt-6 pb-28 shadow-2xl max-w-4xl mx-auto mt-2">
    <div class="bg-[#EBF1FA] p-1.5 rounded-2xl flex items-center gap-1 mb-6">
      <button id="tabCourses" onclick="switchTab('courses')" class="flex-1 py-3 px-4 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 bg-white text-[#0B63E5] shadow-sm">
        <i class="fa-solid fa-graduation-cap text-base"></i><span>Courses</span>
      </button>
      <button id="tabSubcourses" onclick="switchTab('subcourses')" class="flex-1 py-3 px-4 rounded-xl text-xs sm:text-sm font-medium flex items-center justify-center gap-2 text-gray-500">
        <i class="fa-solid fa-book-open text-base"></i><span>Subcourses</span>
      </button>
    </div>

    <div id="formCourses" class="bg-white rounded-3xl p-5 sm:p-7 border border-gray-100 shadow mb-8">
      <div class="flex items-center gap-3.5 mb-6">
        <div class="w-12 h-12 rounded-2xl bg-blue-50 text-[#0B63E5] flex items-center justify-center text-xl">
          <i class="fa-solid fa-book-bookmark"></i>
        </div>
        <div>
          <h2 class="text-base sm:text-lg font-bold text-gray-900">Create New Course</h2>
          <p class="text-xs text-gray-500 font-medium mt-0.5">Add a new course for your institution</p>
        </div>
      </div>

      <form id="courseForm" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-800 mb-1.5">Course Title <span class="text-red-500">*</span></label>
          <div class="relative flex items-center">
            <i class="fa-regular fa-bookmark absolute left-4 text-gray-400 text-sm"></i>
            <input id="courseTitle" type="text" required placeholder="e.g. Computer Science" class="w-full bg-[#FAFCFF] border border-gray-200 rounded-2xl py-3 pl-11 pr-4 text-xs sm:text-sm text-gray-800">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-800 mb-1.5">Course Code <span class="text-red-500">*</span></label>
            <div class="relative flex items-center">
              <i class="fa-solid fa-hashtag absolute left-4 text-gray-400 text-xs"></i>
              <input id="courseCode" type="text" required placeholder="e.g. CSC" class="w-full bg-[#FAFCFF] border border-gray-200 rounded-2xl py-3 pl-11 pr-4 text-xs sm:text-sm text-gray-800">
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-800 mb-1.5">Level <span class="text-red-500">*</span></label>
            <div class="relative flex items-center">
              <i class="fa-solid fa-chart-simple absolute left-4 text-gray-400 text-xs"></i>
              <select id="courseLevel" required class="w-full bg-[#FAFCFF] border border-gray-200 rounded-2xl py-3 pl-11 pr-10 text-xs sm:text-sm text-gray-700">
                <option value="" disabled selected>Select level</option>
                <option value="100 Level">100 Level</option>
                <option value="200 Level">200 Level</option>
                <option value="300 Level">300 Level</option>
                <option value="400 Level">400 Level</option>
                <option value="500 Level">500 Level</option>
              </select>
              <i class="fa-solid fa-chevron-down absolute right-4 text-gray-400 text-xs"></i>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-800 mb-1.5">Description</label>
          <div class="relative">
            <i class="fa-solid fa-bars-staggered absolute left-4 top-3.5 text-gray-400 text-xs"></i>
            <textarea id="descCourses" oninput="updateCharCount('descCourses','counterCourses')" rows="3" maxlength="250" placeholder="Brief description about this course..." class="w-full bg-[#FAFCFF] border border-gray-200 rounded-2xl py-3 pl-11 pr-4 text-xs sm:text-sm text-gray-800 resize-none"></textarea>
            <span id="counterCourses" class="absolute right-4 bottom-2.5 text-[10px] font-semibold text-gray-400">0/250</span>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-800 mb-1.5">Course Icon / Cover (Optional)</label>
          <input type="file" id="courseIconInput" accept="image/*" class="hidden" onchange="handleImageSelect(event,'course')">
          <div id="courseUploadBox" onclick="document.getElementById('courseIconInput').click()" class="bg-[#F6F9FF] border-2 border-dashed border-blue-200 rounded-2xl p-4 sm:p-5 flex flex-col items-center cursor-pointer">
            <div id="coursePreviewContainer" class="flex flex-col items-center">
              <div class="w-10 h-10 rounded-full bg-white text-[#0B63E5] flex items-center justify-center shadow-xs mb-1.5">
                <i class="fa-solid fa-cloud-arrow-up text-lg"></i>
              </div>
              <span class="text-xs font-bold text-gray-800">Tap to upload image</span>
              <span class="text-[10px] font-medium text-gray-400 mt-0.5">PNG, JPG up to 2MB</span>
            </div>
          </div>
        </div>

        <button type="submit" id="courseSubmitBtn" class="w-full bg-[#0B63E5] hover:bg-[#0952C1] text-white font-bold text-xs sm:text-sm py-3.5 rounded-2xl flex items-center justify-center gap-2">
          <i class="fa-solid fa-square-plus text-base"></i><span>Create Course</span>
        </button>
      </form>
    </div>

    <div id="formSubcourses" class="bg-white rounded-3xl p-5 sm:p-7 border border-gray-100 shadow mb-8 hidden">
      <div class="flex items-center gap-3.5 mb-6">
        <div class="w-12 h-12 rounded-2xl bg-blue-50 text-[#0B63E5] flex items-center justify-center text-xl">
          <i class="fa-solid fa-layer-group"></i>
        </div>
        <div>
          <h2 class="text-base sm:text-lg font-bold text-gray-900">Create New Subcourse</h2>
          <p class="text-xs text-gray-500 font-medium mt-0.5">Add a new subcourse under a parent course</p>
        </div>
      </div>

      <form id="subcourseForm" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-800 mb-1.5">Parent Course <span class="text-red-500">*</span></label>
          <div class="relative flex items-center">
            <div class="absolute left-3.5 w-7 h-7 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center text-xs">
              <i class="fa-solid fa-desktop"></i>
            </div>
            <select id="subcourseParent" required class="w-full bg-[#FAFCFF] border border-gray-200 rounded-2xl py-3 pl-12 pr-10 text-xs sm:text-sm text-gray-800 font-semibold">
            </select>
            <i class="fa-solid fa-chevron-down absolute right-4 text-gray-400 text-xs"></i>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-800 mb-1.5">Subcourse Title <span class="text-red-500">*</span></label>
            <div class="relative flex items-center">
              <i class="fa-regular fa-bookmark absolute left-4 text-gray-400 text-xs"></i>
              <input id="subcourseTitle" type="text" required placeholder="e.g. Data Structures" class="w-full bg-[#FAFCFF] border border-gray-200 rounded-2xl py-3 pl-11 pr-4 text-xs sm:text-sm text-gray-800">
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-800 mb-1.5">Subcourse Code <span class="text-red-500">*</span></label>
            <div class="relative flex items-center">
              <i class="fa-solid fa-hashtag absolute left-4 text-gray-400 text-xs"></i>
              <input id="subcourseCode" type="text" required placeholder="e.g. CSC 201" class="w-full bg-[#FAFCFF] border border-gray-200 rounded-2xl py-3 pl-11 pr-4 text-xs sm:text-sm text-gray-800">
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-800 mb-1.5">Level <span class="text-red-500">*</span></label>
          <div class="relative flex items-center">
            <i class="fa-solid fa-chart-simple absolute left-4 text-gray-400 text-xs"></i>
            <select id="subcourseLevel" required class="w-full bg-[#FAFCFF] border border-gray-200 rounded-2xl py-3 pl-11 pr-10 text-xs sm:text-sm text-gray-700">
              <option value="" disabled selected>Select level</option>
              <option value="100 Level">100 Level</option>
              <option value="200 Level">200 Level</option>
              <option value="300 Level">300 Level</option>
              <option value="400 Level">400 Level</option>
              <option value="500 Level">500 Level</option>
            </select>
            <i class="fa-solid fa-chevron-down absolute right-4 text-gray-400 text-xs"></i>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-800 mb-1.5">Description</label>
          <div class="relative">
            <i class="fa-solid fa-bars-staggered absolute left-4 top-3.5 text-gray-400 text-xs"></i>
            <textarea id="descSubcourses" oninput="updateCharCount('descSubcourses','counterSubcourses')" rows="3" maxlength="250" placeholder="Brief description about this subcourse..." class="w-full bg-[#FAFCFF] border border-gray-200 rounded-2xl py-3 pl-11 pr-4 text-xs sm:text-sm text-gray-800 resize-none"></textarea>
            <span id="counterSubcourses" class="absolute right-4 bottom-2.5 text-[10px] font-semibold text-gray-400">0/250</span>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-800 mb-1.5">Subcourse Icon (Optional)</label>
          <input type="file" id="subcourseIconInput" accept="image/*" class="hidden" onchange="handleImageSelect(event,'subcourse')">
          <div id="subcourseUploadBox" onclick="document.getElementById('subcourseIconInput').click()" class="bg-[#F6F9FF] border-2 border-dashed border-blue-200 rounded-2xl p-4 sm:p-5 flex flex-col items-center cursor-pointer">
            <div id="subcoursePreviewContainer" class="flex flex-col items-center">
              <div class="w-10 h-10 rounded-full bg-white text-[#0B63E5] flex items-center justify-center shadow-xs mb-1.5">
                <i class="fa-solid fa-cloud-arrow-up text-lg"></i>
              </div>
              <span class="text-xs font-bold text-gray-800">Tap to upload image</span>
              <span class="text-[10px] font-medium text-gray-400 mt-0.5">PNG, JPG up to 2MB</span>
            </div>
          </div>
        </div>

        <button type="submit" id="subcourseSubmitBtn" class="w-full bg-[#0B63E5] hover:bg-[#0952C1] text-white font-bold text-xs sm:text-sm py-3.5 rounded-2xl flex items-center justify-center gap-2">
          <i class="fa-solid fa-square-plus text-base"></i><span>Create Subcourse</span>
        </button>
      </form>
    </div>

    <div class="flex justify-between items-center mb-4">
      <h3 id="listSectionTitle" class="text-sm sm:text-base font-bold text-gray-900">Your Courses</h3>
      <button id="listSectionLink" onclick="toggleViewAll()" class="text-xs font-bold text-[#0B63E5] hover:text-blue-700 flex items-center gap-1">View all <i class="fa-solid fa-chevron-right text-[10px]"></i></button>
    </div>

    <div id="listCourses" class="space-y-3"></div>
    <div id="listSubcourses" class="space-y-3 hidden"></div>
  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-gray-200/70 py-2.5 px-4 z-50 shadow-[0_-4px_25px_rgba(0,0,0,0.04)]">
    <div class="max-w-md mx-auto flex justify-around items-center text-center">
      <a href="#" onclick="showToast('Dashboard menu clicked','info');return false;" class="flex flex-col items-center gap-1 text-gray-400 hover:text-gray-700">
        <i class="fa-solid fa-house text-lg"></i><span class="text-[10px] font-medium">Dashboard</span>
      </a>
      <button onclick="switchTab('courses')" id="navCourses" class="flex flex-col items-center gap-1 text-[#0B63E5] font-bold">
        <i class="fa-solid fa-graduation-cap text-lg"></i><span class="text-[10px]">Courses</span>
      </button>
      <button onclick="switchTab('subcourses')" id="navSubcourses" class="flex flex-col items-center gap-1 text-gray-400 hover:text-gray-700">
        <i class="fa-solid fa-book-open text-lg"></i><span class="text-[10px] font-medium">Subcourses</span>
      </button>
      <a href="#" onclick="showToast('Students list section','info');return false;" class="flex flex-col items-center gap-1 text-gray-400 hover:text-gray-700">
        <i class="fa-solid fa-user-group text-lg"></i><span class="text-[10px] font-medium">Students</span>
      </a>
      <a href="#" onclick="showToast('More settings menu','info');return false;" class="flex flex-col items-center gap-1 text-gray-400 hover:text-gray-700">
        <i class="fa-solid fa-bars text-lg"></i><span class="text-[10px] font-medium">More</span>
      </a>
    </div>
  </nav>

<script>
  const API_BASE = 'https://examguide.onrender.com/api/courses';
  const API_SUB = 'https://examguide.onrender.com/api/subcourses';
  let activeTab = 'courses';
  let courseImages = { course: null, subcourse: null };
  let coursesData = [
    { id: 'c1', title: 'Computer Science', code: 'CSC', level: '100 Level', desc: 'Core computer science courses.', subcoursesCount: 4, iconClass: 'fa-desktop', bg: 'bg-[#EEF2FF]', color: 'text-[#0B63E5]' }
  ];
  let subcoursesData = [];

  document.addEventListener('DOMContentLoaded', () => {
    wireForms();
    populateParentSelect();
    renderCourses();
    renderSubcourses();
    loadCoursesFromServer();
  });

  function getAuthHeaders() {
    const headers = { 'Content-Type': 'application/json' };
    const token = localStorage.getItem('token') || sessionStorage.getItem('token');
    if (token) headers['Authorization'] = `Bearer ${token}`;
    return headers;
  }

  async function loadCoursesFromServer() {
    try {
      const res = await fetch(`${API_BASE}?limit=1000`);
      if (!res.ok) return;
      const payload = await res.json();
      const remote = payload.courses || payload;
      if (!Array.isArray(remote)) return;
      coursesData = remote.map(c => ({
        id: c._id || c.id,
        title: c.title || 'Untitled',
        code: c.code || '',
        level: c.level || '',
        desc: c.description || '',
        subcoursesCount: c.subcoursesCount || 0,
        image: c.imageUrl || c.cover?.url || null,
        rewardPoints: c.rewardPoints || 0
      }));
      populateParentSelect();
      renderCourses();
      renderSubcourses();
    } catch (err) {
      console.warn('Could not load remote courses', err);
    }
  }

  async function loadSubcoursesForParent(parentId) {
    if (!parentId) return;
    try {
      const res = await fetch(`${API_BASE}/${encodeURIComponent(parentId)}/subcourses?limit=1000`);
      if (!res.ok) {
        subcoursesData = [];
        renderSubcourses();
        return;
      }
      const payload = await res.json();
      subcoursesData = (payload.subcourses || payload.subcourses || payload) .map(s => ({
        id: s._id || s.id,
        parentId: s.parentCourse || s.parentCourse?._id || parentId,
        parentCode: s.parentCourse?.code || '',
        title: s.title,
        code: s.code,
        level: s.level,
        desc: s.description,
        resources: s.resources || 0,
        image: s.imageUrl || null
      }));
      renderSubcourses();
    } catch (err) {
      console.warn('Could not load subcourses', err);
    }
  }

  function wireForms() {
    document.getElementById('courseForm').addEventListener('submit', handleCourseSubmit);
    document.getElementById('subcourseForm').addEventListener('submit', handleSubcourseSubmit);
  }

  function switchTab(tab) {
    activeTab = tab;
    const isCourses = tab === 'courses';
    document.getElementById('headerTitle').textContent = isCourses ? 'Create Course' : 'Subcourses';
    document.getElementById('headerActionText').textContent = isCourses ? 'New Course' : 'Add Subcourse';
    document.getElementById('formCourses').classList.toggle('hidden', !isCourses);
    document.getElementById('formSubcourses').classList.toggle('hidden', isCourses);
    document.getElementById('listCourses').classList.toggle('hidden', !isCourses);
    document.getElementById('listSubcourses').classList.toggle('hidden', isCourses);
    if (!isCourses) {
      const select = document.getElementById('subcourseParent');
      const parentId = select?.value || (coursesData[0] && coursesData[0].id);
      if (parentId) loadSubcoursesForParent(parentId);
    }
  }

  function renderCourses() {
    const list = document.getElementById('listCourses');
    if (!coursesData || coursesData.length === 0) {
      list.innerHTML = `<div class="bg-white rounded-2xl p-6 text-center border border-gray-100"><i class="fa-solid fa-folder-open text-gray-300 text-3xl mb-2"></i><p class="text-xs font-bold text-gray-500">No courses created yet.</p></div>`;
      return;
    }
    list.innerHTML = coursesData.map(course => `
      <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-xs flex items-center justify-between hover:shadow-md transition-all">
        <div class="flex items-center gap-3.5 min-w-0">
          ${course.image ? `<img src="${escapeAttr(course.image)}" class="w-12 h-12 rounded-2xl object-cover shrink-0">` : `<div class="w-12 h-12 rounded-2xl ${course.bg||'bg-[#EEF2FF]'} ${course.color||''} flex items-center justify-center text-xl shrink-0"><i class="fa-solid ${course.iconClass||'fa-graduation-cap'}"></i></div>`}
          <div class="min-w-0">
            <h4 class="text-xs sm:text-sm font-bold text-gray-900 truncate">${escapeHtml(course.title)}</h4>
            <div class="flex items-center gap-2 mt-1 flex-wrap">
              <span class="text-[11px] font-medium text-gray-400">${escapeHtml(course.code||'')} • ${escapeHtml(course.level||'')}</span>
              <span class="bg-[#E6F7F0] text-[#059669] text-[10px] font-bold px-2.5 py-0.5 rounded-full">${course.subcoursesCount||0} Subcourses</span>
            </div>
          </div>
        </div>
        <div class="relative flex items-center gap-2">
          <a href="/NextWeb/course-item.html?id=${encodeURIComponent(course.id)}" target="_blank" class="text-brand-blue text-xs font-medium">Open</a>
          <button onclick="toggleActionMenu(event,'course-${course.id}')" class="text-gray-400 hover:text-gray-600 p-2"><i class="fa-solid fa-ellipsis-vertical text-sm"></i></button>
          <div id="action-course-${course.id}" class="hidden absolute right-0 top-8 bg-white border border-gray-100 shadow-xl rounded-xl py-1 w-28 z-30">
            <button onclick="deleteCourse('${course.id}')" class="w-full text-left px-3 py-1.5 text-xs text-red-600 hover:bg-red-50 flex items-center gap-2 font-medium"><i class="fa-solid fa-trash text-[10px]"></i> Delete</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  function renderSubcourses() {
    const list = document.getElementById('listSubcourses');
    const select = document.getElementById('subcourseParent');
    const selectedParentId = select?.value || null;
    const filtered = selectedParentId ? subcoursesData.filter(s => s.parentId === selectedParentId) : subcoursesData;
    if (!filtered || filtered.length === 0) {
      list.innerHTML = `<div class="bg-white rounded-2xl p-6 text-center border border-gray-100"><i class="fa-solid fa-layer-group text-gray-300 text-3xl mb-2"></i><p class="text-xs font-bold text-gray-500">No subcourses for this parent course yet.</p></div>`;
      return;
    }
    list.innerHTML = filtered.map(sub => `
      <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-xs flex items-center justify-between hover:shadow-md transition-all">
        <div class="flex items-center gap-3 min-w-0">
          <div class="text-gray-300 hover:text-gray-500 cursor-grab px-1 shrink-0"><i class="fa-solid fa-grip-vertical text-xs"></i></div>
          ${sub.image ? `<img src="${escapeAttr(sub.image)}" class="w-11 h-11 rounded-2xl object-cover shrink-0">` : `<div class="w-11 h-11 rounded-2xl ${sub.bg||'bg-[#EEF2FF]'} text-white flex items-center justify-center text-sm font-bold shrink-0"><i class="fa-solid ${sub.iconClass||'fa-book-open'}"></i></div>`}
          <div class="min-w-0">
            <h4 class="text-xs sm:text-sm font-bold text-gray-900 truncate">${escapeHtml(sub.title)}</h4>
            <p class="text-[11px] font-medium text-gray-400 mt-0.5">${escapeHtml(sub.code||'')} • ${escapeHtml(sub.level||'')}</p>
          </div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <span class="bg-[#E6F7F0] text-[#059669] text-[10px] font-bold px-2.5 py-1 rounded-full hidden sm:inline-block">${sub.resources||0} Resources</span>
          <div class="relative">
            <button onclick="toggleActionMenu(event,'sub-${sub.id}')" class="text-gray-400 hover:text-gray-600 p-2"><i class="fa-solid fa-ellipsis-vertical text-sm"></i></button>
            <div id="action-sub-${sub.id}" class="hidden absolute right-0 top-8 bg-white border border-gray-100 shadow-xl rounded-xl py-1 w-28 z-30">
              <button onclick="deleteSubcourse('${sub.id}')" class="w-full text-left px-3 py-1.5 text-xs text-red-600 hover:bg-red-50 flex items-center gap-2 font-medium"><i class="fa-solid fa-trash text-[10px]"></i> Delete</button>
            </div>
          </div>
        </div>
      </div>
    `).join('');
  }

  function populateParentSelect() {
    const select = document.getElementById('subcourseParent');
    if (!select) return;
    if (!coursesData || coursesData.length === 0) {
      select.innerHTML = '<option value="">No courses</option>';
      return;
    }
    select.innerHTML = coursesData.map(c => `<option value="${escapeAttr(c.id)}">${escapeHtml(c.title)} (${escapeHtml(c.code||'')})</option>`).join('');
    select.onchange = () => {
      const parentCourseObj = coursesData.find(c => c.id === select.value);
      document.getElementById('listSectionTitle').textContent = `Subcourses Under ${parentCourseObj ? parentCourseObj.title : 'Selected Course'}`;
      loadSubcoursesForParent(select.value);
    };
  }

  async function handleCourseSubmit(e) {
    e.preventDefault();
    const title = document.getElementById('courseTitle').value.trim();
    const code = (document.getElementById('courseCode').value || '').trim().toUpperCase();
    const level = document.getElementById('courseLevel').value;
    const desc = document.getElementById('descCourses').value.trim();
    if (!title || !code || !level) { showToast('Please fill in all required fields.','error'); return; }
    const payload = { title, description: desc, level, code, imageUrl: courseImages.course || undefined };
    const submitBtn = document.getElementById('courseSubmitBtn');
    submitBtn.disabled = true; submitBtn.classList.add('opacity-70','cursor-not-allowed');
    try {
      const res = await fetch(API_BASE, { method: 'POST', headers: getAuthHeaders(), credentials: 'include', body: JSON.stringify(payload) });
      const data = await parseResponse(res);
      if (res.ok) {
        const created = data;
        const newCourse = {
          id: created._id || created.id || ('c'+Date.now()),
          title: created.title || title,
          code: created.code || code,
          level: created.level || level,
          desc: created.description || desc,
          subcoursesCount: created.subcoursesCount || 0,
          image: created.imageUrl || created.cover?.url || payload.imageUrl || null
        };
        coursesData.unshift(newCourse);
        populateParentSelect(); renderCourses();
        document.getElementById('courseForm').reset(); resetImagePreview('course'); updateCharCount('descCourses','counterCourses');
        showToast(`Course "${newCourse.title}" created successfully!`,'success');
      } else {
        const errMsg = extractMessage(data, res.status);
        showToast(errMsg,'error');
      }
    } catch (err) {
      console.warn('Network error creating course', err);
      showToast('Network error — course created locally for now.','info');
      createCourseLocally({ title, code, level, desc });
    } finally {
      submitBtn.disabled = false; submitBtn.classList.remove('opacity-70','cursor-not-allowed');
    }
  }

  async function handleSubcourseSubmit(e) {
    e.preventDefault();
    const parentId = document.getElementById('subcourseParent').value;
    const title = document.getElementById('subcourseTitle').value.trim();
    const code = (document.getElementById('subcourseCode').value||'').trim().toUpperCase();
    const level = document.getElementById('subcourseLevel').value;
    const desc = document.getElementById('descSubcourses').value.trim();
    if (!parentId || !title || !code || !level) { showToast('Please fill in all required fields.','error'); return; }
    const payload = { title, code, description: desc, level, parentCourse: parentId, imageUrl: courseImages.subcourse || undefined, resources: 0 };
    const submitBtn = document.getElementById('subcourseSubmitBtn');
    submitBtn.disabled = true; submitBtn.classList.add('opacity-70','cursor-not-allowed');
    try {
      const res = await fetch(API_SUB, { method: 'POST', headers: getAuthHeaders(), credentials: 'include', body: JSON.stringify(payload) });
      const data = await parseResponse(res);
      if (res.ok) {
        const created = data;
        const newSub = {
          id: created._id || created.id || ('s'+Date.now()),
          parentId: created.parentCourse || parentId,
          title: created.title || title,
          code: created.code || code,
          level: created.level || level,
          desc: created.description || desc,
          resources: created.resources || 0,
          image: created.imageUrl || null
        };
        subcoursesData.unshift(newSub);
        const parent = coursesData.find(c => c.id === parentId);
        if (parent) parent.subcoursesCount = (parent.subcoursesCount||0)+1;
        renderSubcourses(); renderCourses();
        document.getElementById('subcourseForm').reset(); resetImagePreview('subcourse'); updateCharCount('descSubcourses','counterSubcourses');
        showToast(`Subcourse "${newSub.title}" created successfully!`,'success');
      } else {
        const errMsg = extractMessage(data, res.status);
        showToast(errMsg,'error');
      }
    } catch (err) {
      console.warn('Network error creating subcourse', err);
      showToast('Network error — subcourse added locally for now.','info');
      createSubcourseLocally({ parentId, title, code, level, desc });
    } finally {
      submitBtn.disabled = false; submitBtn.classList.remove('opacity-70','cursor-not-allowed');
    }
  }

  function createCourseLocally({ title, code, level, desc }) {
    const newCourse = { id: 'c'+Date.now(), title, code, level, desc, subcoursesCount:0, iconClass:'fa-graduation-cap', bg:'bg-[#EEF2FF]', color:'text-[#0B63E5]', image: courseImages.course };
    coursesData.unshift(newCourse);
    populateParentSelect(); renderCourses();
    document.getElementById('courseForm').reset(); resetImagePreview('course'); updateCharCount('descCourses','counterCourses');
  }

  function createSubcourseLocally({ parentId, title, code, level, desc }) {
    const newSub = { id: 's'+Date.now(), parentId, title, code, level, desc, resources:0, image: courseImages.subcourse };
    subcoursesData.unshift(newSub);
    const parent = coursesData.find(c => c.id === parentId); if (parent) parent.subcoursesCount = (parent.subcoursesCount||0)+1;
    renderSubcourses(); renderCourses();
    document.getElementById('subcourseForm').reset(); resetImagePreview('subcourse'); updateCharCount('descSubcourses','counterSubcourses');
  }

  async function deleteCourse(id) {
    if (!confirm('Delete this course? This will remove its subcourses.')) return;
    try {
      const res = await fetch(`${API_BASE}/${encodeURIComponent(id)}`, { method: 'DELETE', headers: getAuthHeaders(), credentials: 'include' });
      const data = await parseResponse(res);
      if (res.ok) {
        coursesData = coursesData.filter(c => c.id !== id);
        subcoursesData = subcoursesData.filter(s => s.parentId !== id);
        populateParentSelect(); renderCourses(); renderSubcourses();
        showToast('Course deleted','info');
      } else {
        showToast(extractMessage(data, res.status),'error');
      }
    } catch (err) {
      console.warn('Network error deleting course', err);
      showToast('Network error — could not delete.','error');
    }
  }

  async function deleteSubcourse(id) {
    if (!confirm('Delete this subcourse?')) return;
    try {
      const res = await fetch(`${API_SUB}/${encodeURIComponent(id)}`, { method: 'DELETE', headers: getAuthHeaders(), credentials: 'include' });
      const data = await parseResponse(res);
      if (res.ok) {
        const removed = subcoursesData.find(s => s.id === id);
        subcoursesData = subcoursesData.filter(s => s.id !== id);
        if (removed) {
          const parent = coursesData.find(c => c.id === removed.parentId);
          if (parent && parent.subcoursesCount > 0) parent.subcoursesCount -= 1;
        }
        renderSubcourses(); renderCourses();
        showToast('Subcourse deleted','info');
      } else {
        showToast(extractMessage(data, res.status),'error');
      }
    } catch (err) {
      console.warn('Network error deleting subcourse', err);
      showToast('Network error — could not delete.','error');
    }
  }

  function handleImageSelect(event, type) {
    const file = event.target.files[0];
    if (!file) return;
    if (file.size > 4 * 1024 * 1024) { showToast('Image must be under 4MB','error'); return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      courseImages[type] = e.target.result;
      const previewContainer = document.getElementById(`${type}PreviewContainer`);
      previewContainer.innerHTML = `<div class="relative group"><img src="${escapeAttr(e.target.result)}" class="w-16 h-16 rounded-2xl object-cover shadow-sm border border-gray-200"><span class="block text-xs font-bold text-gray-800 mt-2">${escapeHtml(file.name)}</span><span class="text-[10px] text-blue-600 underline font-semibold">Click to change</span></div>`;
    };
    reader.readAsDataURL(file);
  }

  function resetImagePreview(type) {
    courseImages[type] = null;
    const previewContainer = document.getElementById(`${type}PreviewContainer`);
    if (!previewContainer) return;
    previewContainer.innerHTML = `<div class="w-10 h-10 rounded-full bg-white text-[#0B63E5] flex items-center justify-center shadow-xs mb-1.5"><i class="fa-solid fa-cloud-arrow-up text-lg"></i></div><span class="text-xs font-bold text-gray-800">Tap to upload image</span><span class="text-[10px] font-medium text-gray-400 mt-0.5">PNG, JPG up to 2MB</span>`;
  }

  function updateCharCount(textareaId,counterId) {
    const textarea = document.getElementById(textareaId);
    const counter = document.getElementById(counterId);
    if (textarea && counter) counter.textContent = `${textarea.value.length}/250`;
  }

  function toggleActionMenu(e,id) {
    e.stopPropagation();
    document.querySelectorAll('[id^="action-"]').forEach(el=>{ if(el.id!==`action-${id}`) el.classList.add('hidden'); });
    const menu=document.getElementById(`action-${id}`);
    if(menu) menu.classList.toggle('hidden');
  }

  document.addEventListener('click', ()=>document.querySelectorAll('[id^="action-"]').forEach(el=>el.classList.add('hidden')));

  function showToast(message,type='success') {
    const toastContainer=document.getElementById('toastContainer');
    const toast=document.createElement('div');
    const bgClass = type==='success' ? 'bg-emerald-600 text-white' : type==='error' ? 'bg-red-600 text-white' : 'bg-gray-800 text-white';
    const iconClass = type==='success' ? 'fa-circle-check' : type==='error' ? 'fa-circle-exclamation' : 'fa-circle-info';
    toast.className = `${bgClass} px-4 py-3 rounded-2xl shadow-lg text-xs font-bold flex items-center gap-2.5 transition-all duration-300 opacity-0 translate-y-2 pointer-events-auto`;
    toast.innerHTML = `<i class="fa-solid ${iconClass} text-sm"></i> <span>${escapeHtml(message)}</span>`;
    toastContainer.appendChild(toast);
    setTimeout(()=>toast.classList.remove('opacity-0','translate-y-2'),10);
    setTimeout(()=>{ toast.classList.add('opacity-0','-translate-y-2'); setTimeout(()=>toast.remove(),300); },3000);
  }

  function extractMessage(data, status) {
    if (!data) return `Request failed (${status})`;
    if (typeof data === 'string') return data;
    if (data.error) return data.error;
    if (data.message) return data.message;
    return `Request failed (${status})`;
  }

  async function parseResponse(res) {
    try { const text = await res.text(); return text ? JSON.parse(text) : null; } catch { return null; }
  }

  function escapeHtml(str='') { return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
  function escapeAttr(s='') { return escapeHtml(s).replace(/"/g,'&quot;'); }

  function scrollToForm() { const activeForm = activeTab==='courses' ? 'formCourses' : 'formSubcourses'; document.getElementById(activeForm).scrollIntoView({ behavior:'smooth', block:'center' }); }
  function handleBackAction() { if(window.history.length>1) window.history.back(); else showToast('Already at the main admin dashboard.','info'); }
  function toggleViewAll(){ showToast(`Viewing all items under ${activeTab}`,'info'); }

</script>
</body>
</html>
