<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.80">
    <title>Admin Panel - Course & Subcourse Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0B63E5;
        }
        .custom-dashed {
            background-image: url("data:image/svg+xml,%c3%a4c3%a4%3Csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='100%25' height='100%25' fill='none' rx='16' ry='16' stroke='%2393C5FDFF' stroke-width='2' stroke-dasharray='6%2c 6' stroke-dashoffset='0' stroke-linecap='square'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body class="min-h-screen w-full flex flex-col justify-between antialiased selection:bg-blue-100 relative">

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toastContainer" class="fixed top-20 right-4 z-50 flex flex-col gap-2 max-w-xs w-full pointer-events-none"></div>

    <!-- STICKY TOP HEADER -->
    <header class="sticky top-0 z-40 w-full bg-[#0B63E5]/95 backdrop-blur-md text-white py-4 px-5 sm:px-8 shadow-md border-b border-blue-600/30 transition-all duration-300">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <button onclick="handleBackAction()" title="Go back" class="w-11 h-11 rounded-2xl bg-[#084FB9] hover:bg-[#0744A1] active:scale-95 flex items-center justify-center text-white transition-all shadow-sm">
                    <i class="fa-solid fa-arrow-left text-lg"></i>
                </button>
                <div>
                    <h1 id="headerTitle" class="text-xl sm:text-2xl font-bold tracking-tight">Create Course</h1>
                    <p class="text-blue-100/90 text-xs font-medium mt-0.5">Admin Panel</p>
                </div>
            </div>

            <button id="headerActionButton" onclick="scrollToForm()" class="flex flex-col items-center justify-center text-[#0B63E5] bg-white hover:bg-blue-50 active:scale-95 transition-all rounded-2xl px-3.5 py-1.5 shadow-md">
                <div class="w-6 h-6 rounded-lg bg-blue-50 flex items-center justify-center text-[#0B63E5] font-bold">
                    <i id="headerActionIcon" class="fa-solid fa-plus text-xs"></i>
                </div>
                <span id="headerActionText" class="text-[10px] font-bold mt-1 text-gray-700">New Course</span>
            </button>
        </div>
    </header>

    <!-- MAIN CARD CONTAINER -->
    <main class="w-full flex-1 bg-[#F5F8FC] rounded-t-[32px] sm:rounded-t-[40px] px-4 sm:px-8 pt-6 pb-28 shadow-2xl max-w-4xl mx-auto mt-2">
        
        <!-- TABS SWITCHER -->
        <div class="bg-[#EBF1FA] p-1.5 rounded-2xl flex items-center gap-1 mb-6 shadow-inner">
            <button id="tabCourses" onclick="switchTab('courses')" class="flex-1 py-3 px-4 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 transition-all duration-200 bg-white text-[#0B63E5] shadow-sm">
                <i class="fa-solid fa-graduation-cap text-base"></i>
                <span>Courses</span>
            </button>
            <button id="tabSubcourses" onclick="switchTab('subcourses')" class="flex-1 py-3 px-4 rounded-xl text-xs sm:text-sm font-medium flex items-center justify-center gap-2 transition-all duration-200 text-gray-500 hover:text-gray-800">
                <i class="fa-solid fa-book-open text-base"></i>
                <span>Subcourses</span>
            </button>
        </div>

        <!-- FORM CONTAINER: COURSES -->
        <div id="formCourses" class="bg-white rounded-3xl p-5 sm:p-7 border border-gray-100 shadow-[0_4px_25px_rgba(0,0,0,0.03)] mb-8 transition-all">
            <div class="flex items-center gap-3.5 mb-6">
                <div class="w-12 h-12 rounded-2xl bg-blue-50 text-[#0B63E5] flex items-center justify-center text-xl shrink-0">
                    <i class="fa-solid fa-book-bookmark"></i>
                </div>
                <div>
                    <h2 class="text-base sm:text-lg font-bold text-gray-900 leading-tight">Create New Course</h2>
                    <p class="text-xs text-gray-500 font-medium mt-0.5">Add a new course for your institution</p>
                </div>
            </div>

            <form id="courseForm" onsubmit="handleCourseSubmit(event)" class="space-y-4">
                <!-- Course Title -->
                <div>
                    <label class="block text-xs font-bold text-gray-800 mb-1.5">Course Title <span class="text-red-500">*</span></label>
                    <div class="relative flex items-center">
                        <i class="fa-regular fa-bookmark absolute left-4 text-gray-400 text-sm"></i>
                        <input id="courseTitle" type="text" required placeholder="e.g. Computer Science" class="w-full bg-[#FAFCFF] border border-gray-200 rounded-2xl py-3 pl-11 pr-4 text-xs sm:text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:border-[#0B63E5] focus:ring-2 focus:ring-blue-100 transition-all">
                    </div>
                </div>

                <!-- Course Code & Level Row -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-800 mb-1.5">Course Code <span class="text-red-500">*</span></label>
                        <div class="relative flex items-center">
                            <i class="fa-solid fa-hashtag absolute left-4 text-gray-400 text-xs"></i>
                            <input id="courseCode" type="text" required placeholder="e.g. CSC" class="w-full bg-[#FAFCFF] border border-gray-200 rounded-2xl py-3 pl-11 pr-4 text-xs sm:text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:border-[#0B63E5] focus:ring-2 focus:ring-blue-100 transition-all uppercase">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-800 mb-1.5">Level <span class="text-red-500">*</span></label>
                        <div class="relative flex items-center">
                            <i class="fa-solid fa-chart-simple absolute left-4 text-gray-400 text-xs"></i>
                            <select id="courseLevel" required class="w-full bg-[#FAFCFF] border border-gray-200 rounded-2xl py-3 pl-11 pr-10 text-xs sm:text-sm text-gray-700 appearance-none focus:outline-none focus:border-[#0B63E5] focus:ring-2 focus:ring-blue-100 transition-all cursor-pointer">
                                <option value="" disabled selected>Select level</option>
                                <option value="100 Level">100 Level</option>
                                <option value="200 Level">200 Level</option>
                                <option value="300 Level">300 Level</option>
                                <option value="400 Level">400 Level</option>
                                <option value="500 Level">500 Level</option>
                            </select>
                            <i class="fa-solid fa-chevron-down absolute right-4 text-gray-400 text-xs pointer-events-none"></i>
                        </div>
                    </div>
                </div>

                <!-- Description -->
                <div>
                    <label class="block text-xs font-bold text-gray-800 mb-1.5">Description</label>
                    <div class="relative">
                        <i class="fa-solid fa-bars-staggered absolute left-4 top-3.5 text-gray-400 text-xs"></i>
                        <textarea id="descCourses" oninput="updateCharCount('descCourses', 'counterCourses')" rows="3" maxlength="250" placeholder="Brief description about this course..." class="w-full bg-[#FAFCFF] border border-gray-200 rounded-2xl pt-3 pb-7 pl-11 pr-4 text-xs sm:text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:border-[#0B63E5] focus:ring-2 focus:ring-blue-100 transition-all resize-none"></textarea>
                        <span id="counterCourses" class="absolute right-4 bottom-2.5 text-[10px] font-semibold text-gray-400">0/250</span>
                    </div>
                </div>

                <!-- Icon Upload -->
                <div>
                    <label class="block text-xs font-bold text-gray-800 mb-1.5">Course Icon (Optional)</label>
                    <input type="file" id="courseIconInput" accept="image/*" class="hidden" onchange="handleImageSelect(event, 'course')">
                    <div id="courseUploadBox" onclick="document.getElementById('courseIconInput').click()" class="bg-[#F6F9FF] border-2 border-dashed border-blue-200 rounded-2xl p-4 sm:p-5 flex flex-col items-center justify-center text-center cursor-pointer hover:bg-blue-50/50 transition-all group">
                        <div id="coursePreviewContainer" class="flex flex-col items-center">
                            <div class="w-10 h-10 rounded-full bg-white text-[#0B63E5] flex items-center justify-center shadow-xs mb-1.5 group-hover:scale-105 transition-transform">
                                <i class="fa-solid fa-cloud-arrow-up text-lg"></i>
                            </div>
                            <span class="text-xs font-bold text-gray-800">Tap to upload image</span>
                            <span class="text-[10px] font-medium text-gray-400 mt-0.5">PNG, JPG up to 2MB</span>
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-[#0B63E5] hover:bg-[#0952C1] active:scale-[0.99] text-white font-bold text-xs sm:text-sm py-3.5 rounded-2xl shadow-md shadow-blue-500/20 flex items-center justify-center gap-2 transition-all mt-2">
                    <i class="fa-solid fa-square-plus text-base"></i>
                    <span>Create Course</span>
                </button>
            </form>
        </div>

        <!-- FORM CONTAINER: SUBCOURSES -->
        <div id="formSubcourses" class="bg-white rounded-3xl p-5 sm:p-7 border border-gray-100 shadow-[0_4px_25px_rgba(0,0,0,0.03)] mb-8 hidden transition-all">
            <div class="flex items-center gap-3.5 mb-6">
                <div class="w-12 h-12 rounded-2xl bg-blue-50 text-[#0B63E5] flex items-center justify-center text-xl shrink-0">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
                <div>
                    <h2 class="text-base sm:text-lg font-bold text-gray-900 leading-tight">Create New Subcourse</h2>
                    <p class="text-xs text-gray-500 font-medium mt-0.5">Add a new subcourse under a parent course</p>
                </div>
            </div>

            <form id="subcourseForm" onsubmit="handleSubcourseSubmit(event)" class="space-y-4">
                <!-- Parent Course -->
                <div>
                    <label class="block text-xs font-bold text-gray-800 mb-1.5">Parent Course <span class="text-red-500">*</span></label>
                    <div class="relative flex items-center">
                        <div class="absolute left-3.5 w-7 h-7 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center text-xs">
                            <i class="fa-solid fa-desktop"></i>
                        </div>
                        <select id="subcourseParent" required class="w-full bg-[#FAFCFF] border border-gray-200 rounded-2xl py-3 pl-12 pr-10 text-xs sm:text-sm text-gray-800 font-semibold appearance-none focus:outline-none focus:border-[#0B63E5] focus:ring-2 focus:ring-blue-100 transition-all cursor-pointer">
                            <!-- Populated dynamically via JS -->
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-4 text-gray-400 text-xs pointer-events-none"></i>
                    </div>
                </div>

                <!-- Subcourse Title & Code Row -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-800 mb-1.5">Subcourse Title <span class="text-red-500">*</span></label>
                        <div class="relative flex items-center">
                            <i class="fa-regular fa-bookmark absolute left-4 text-gray-400 text-xs"></i>
                            <input id="subcourseTitle" type="text" required placeholder="e.g. Data Structures" class="w-full bg-[#FAFCFF] border border-gray-200 rounded-2xl py-3 pl-11 pr-4 text-xs sm:text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:border-[#0B63E5] focus:ring-2 focus:ring-blue-100 transition-all">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-800 mb-1.5">Subcourse Code <span class="text-red-500">*</span></label>
                        <div class="relative flex items-center">
                            <i class="fa-solid fa-hashtag absolute left-4 text-gray-400 text-xs"></i>
                            <input id="subcourseCode" type="text" required placeholder="e.g. CSC 201" class="w-full bg-[#FAFCFF] border border-gray-200 rounded-2xl py-3 pl-11 pr-4 text-xs sm:text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:border-[#0B63E5] focus:ring-2 focus:ring-blue-100 transition-all uppercase">
                        </div>
                    </div>
                </div>

                <!-- Level -->
                <div>
                    <label class="block text-xs font-bold text-gray-800 mb-1.5">Level <span class="text-red-500">*</span></label>
                    <div class="relative flex items-center">
                        <i class="fa-solid fa-chart-simple absolute left-4 text-gray-400 text-xs"></i>
                        <select id="subcourseLevel" required class="w-full bg-[#FAFCFF] border border-gray-200 rounded-2xl py-3 pl-11 pr-10 text-xs sm:text-sm text-gray-700 appearance-none focus:outline-none focus:border-[#0B63E5] focus:ring-2 focus:ring-blue-100 transition-all cursor-pointer">
                            <option value="" disabled selected>Select level</option>
                            <option value="100 Level">100 Level</option>
                            <option value="200 Level">200 Level</option>
                            <option value="300 Level">300 Level</option>
                            <option value="400 Level">400 Level</option>
                            <option value="500 Level">500 Level</option>
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-4 text-gray-400 text-xs pointer-events-none"></i>
                    </div>
                </div>

                <!-- Description -->
                <div>
                    <label class="block text-xs font-bold text-gray-800 mb-1.5">Description</label>
                    <div class="relative">
                        <i class="fa-solid fa-bars-staggered absolute left-4 top-3.5 text-gray-400 text-xs"></i>
                        <textarea id="descSubcourses" oninput="updateCharCount('descSubcourses', 'counterSubcourses')" rows="3" maxlength="250" placeholder="Brief description about this subcourse..." class="w-full bg-[#FAFCFF] border border-gray-200 rounded-2xl pt-3 pb-7 pl-11 pr-4 text-xs sm:text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:border-[#0B63E5] focus:ring-2 focus:ring-blue-100 transition-all resize-none"></textarea>
                        <span id="counterSubcourses" class="absolute right-4 bottom-2.5 text-[10px] font-semibold text-gray-400">0/250</span>
                    </div>
                </div>

                <!-- Icon Upload -->
                <div>
                    <label class="block text-xs font-bold text-gray-800 mb-1.5">Subcourse Icon (Optional)</label>
                    <input type="file" id="subcourseIconInput" accept="image/*" class="hidden" onchange="handleImageSelect(event, 'subcourse')">
                    <div id="subcourseUploadBox" onclick="document.getElementById('subcourseIconInput').click()" class="bg-[#F6F9FF] border-2 border-dashed border-blue-200 rounded-2xl p-4 sm:p-5 flex flex-col items-center justify-center text-center cursor-pointer hover:bg-blue-50/50 transition-all group">
                        <div id="subcoursePreviewContainer" class="flex flex-col items-center">
                            <div class="w-10 h-10 rounded-full bg-white text-[#0B63E5] flex items-center justify-center shadow-xs mb-1.5 group-hover:scale-105 transition-transform">
                                <i class="fa-solid fa-cloud-arrow-up text-lg"></i>
                            </div>
                            <span class="text-xs font-bold text-gray-800">Tap to upload image</span>
                            <span class="text-[10px] font-medium text-gray-400 mt-0.5">PNG, JPG up to 2MB</span>
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-[#0B63E5] hover:bg-[#0952C1] active:scale-[0.99] text-white font-bold text-xs sm:text-sm py-3.5 rounded-2xl shadow-md shadow-blue-500/20 flex items-center justify-center gap-2 transition-all mt-2">
                    <i class="fa-solid fa-square-plus text-base"></i>
                    <span>Create Subcourse</span>
                </button>
            </form>
        </div>

        <!-- LIST SECTION HEADER -->
        <div class="flex justify-between items-center mb-4">
            <h3 id="listSectionTitle" class="text-sm sm:text-base font-bold text-gray-900">Your Courses</h3>
            <button id="listSectionLink" onclick="toggleViewAll()" class="text-xs font-bold text-[#0B63E5] hover:text-blue-700 flex items-center gap-1 transition-colors">
                <span>View all</span>
                <i class="fa-solid fa-chevron-right text-[10px]"></i>
            </button>
        </div>

        <!-- LIST CONTAINER: COURSES -->
        <div id="listCourses" class="space-y-3 transition-all">
            <!-- Dynamically populated -->
        </div>

        <!-- LIST CONTAINER: SUBCOURSES -->
        <div id="listSubcourses" class="space-y-3 hidden transition-all">
            <!-- Dynamically populated -->
        </div>

    </main>

    <!-- FIXED BOTTOM NAVIGATION BAR -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-gray-200/70 py-2.5 px-4 z-50 shadow-[0_-4px_25px_rgba(0,0,0,0.04)]">
        <div class="max-w-md mx-auto flex justify-around items-center text-center">
            
            <a href="#" onclick="showToast('Dashboard menu clicked', 'info'); return false;" class="flex flex-col items-center gap-1 text-gray-400 hover:text-gray-700 transition-colors">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] font-medium">Dashboard</span>
            </a>

            <button onclick="switchTab('courses')" id="navCourses" class="flex flex-col items-center gap-1 text-[#0B63E5] font-bold transition-colors">
                <i class="fa-solid fa-graduation-cap text-lg"></i>
                <span class="text-[10px]">Courses</span>
            </button>

            <button onclick="switchTab('subcourses')" id="navSubcourses" class="flex flex-col items-center gap-1 text-gray-400 hover:text-gray-700 transition-colors">
                <i class="fa-solid fa-book-open text-lg"></i>
                <span class="text-[10px] font-medium">Subcourses</span>
            </button>

            <a href="#" onclick="showToast('Students list section', 'info'); return false;" class="flex flex-col items-center gap-1 text-gray-400 hover:text-gray-700 transition-colors">
                <i class="fa-solid fa-user-group text-lg"></i>
                <span class="text-[10px] font-medium">Students</span>
            </a>

            <a href="#" onclick="showToast('More settings menu', 'info'); return false;" class="flex flex-col items-center gap-1 text-gray-400 hover:text-gray-700 transition-colors">
                <i class="fa-solid fa-bars text-lg"></i>
                <span class="text-[10px] font-medium">More</span>
            </a>

        </div>
    </nav>

    <!-- INTERACTIVE ENGINE & STATE MANAGEMENT -->
    <script>
        // State Data Memory
        let activeTab = 'courses';
        let courseImages = { course: null, subcourse: null };

        let coursesData = [
            { id: 'c1', title: 'Computer Science', code: 'CSC', level: '100 Level', desc: 'Core computer science and software development courses.', subcoursesCount: 4, iconClass: 'fa-desktop', bg: 'bg-[#EEF2FF]', color: 'text-[#4F46E5]', image: null },
            { id: 'c2', title: 'Mathematics', code: 'MTH', level: '100 Level', desc: 'Pure and applied mathematical computations.', subcoursesCount: 0, iconClass: 'fa-hashtag', bg: 'bg-[#ECFDF5]', color: 'text-[#10B981]', image: null },
            { id: 'c3', title: 'Physics', code: 'PHY', level: '100 Level', desc: 'Theoretical and practical physics principles.', subcoursesCount: 0, iconClass: 'fa-flask', bg: 'bg-[#FEF3C7]', color: 'text-[#D97706]', image: null }
        ];

        let subcoursesData = [
            { id: 's1', parentCode: 'CSC', title: 'Introduction to Programming', code: 'CSC 101', level: '100 Level', desc: 'Basic fundamentals of programming.', resources: 14, iconClass: 'fa-code', bg: 'bg-[#F59E0B]', image: null },
            { id: 's2', parentCode: 'CSC', title: 'Data Structures', code: 'CSC 201', level: '200 Level', desc: 'Linear and non-linear data structures.', resources: 18, iconClass: 'fa-hashtag', bg: 'bg-[#10B981]', image: null },
            { id: 's3', parentCode: 'CSC', title: 'Database Systems', code: 'CSC 301', level: '300 Level', desc: 'Relational databases and SQL.', resources: 22, iconClass: 'fa-database', bg: 'bg-[#8B5CF6]', image: null },
            { id: 's4', parentCode: 'CSC', title: 'Operating Systems', code: 'CSC 302', level: '300 Level', desc: 'Kernel structures and process scheduling.', resources: 16, iconClass: 'fa-network-wired', bg: 'bg-[#3B82F6]', image: null }
        ];

        // Initialize UI on startup
        document.addEventListener('DOMContentLoaded', () => {
            populateParentSelect();
            renderCourses();
            renderSubcourses();
        });

        // Tab Switcher
        function switchTab(tab) {
            activeTab = tab;
            const isCourses = tab === 'courses';

            // Top Header update
            document.getElementById('headerTitle').textContent = isCourses ? 'Create Course' : 'Subcourses';
            document.getElementById('headerActionText').textContent = isCourses ? 'New Course' : 'Add Subcourse';

            // Tabs styling
            const tabCourses = document.getElementById('tabCourses');
            const tabSubcourses = document.getElementById('tabSubcourses');
            
            if (isCourses) {
                tabCourses.className = "flex-1 py-3 px-4 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 transition-all duration-200 bg-white text-[#0B63E5] shadow-sm";
                tabSubcourses.className = "flex-1 py-3 px-4 rounded-xl text-xs sm:text-sm font-medium flex items-center justify-center gap-2 transition-all duration-200 text-gray-500 hover:text-gray-800";
            } else {
                tabSubcourses.className = "flex-1 py-3 px-4 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 transition-all duration-200 bg-white text-[#0B63E5] shadow-sm";
                tabCourses.className = "flex-1 py-3 px-4 rounded-xl text-xs sm:text-sm font-medium flex items-center justify-center gap-2 transition-all duration-200 text-gray-500 hover:text-gray-800";
            }

            // Forms toggle
            document.getElementById('formCourses').classList.toggle('hidden', !isCourses);
            document.getElementById('formSubcourses').classList.toggle('hidden', isCourses);

            // List Title & Link update
            const parentSelect = document.getElementById('subcourseParent');
            const selectedParentCode = parentSelect ? parentSelect.value : 'CSC';
            const parentCourseObj = coursesData.find(c => c.code === selectedParentCode);

            document.getElementById('listSectionTitle').textContent = isCourses ? 'Your Courses' : `Subcourses Under ${parentCourseObj ? parentCourseObj.title : 'Selected Course'}`;
            document.getElementById('listSectionLink').innerHTML = isCourses ? 
                '<span>View all</span><i class="fa-solid fa-chevron-right text-[10px]"></i>' : 
                '<span>Manage Course</span><i class="fa-solid fa-chevron-right text-[10px]"></i>';

            // Lists toggle
            document.getElementById('listCourses').classList.toggle('hidden', !isCourses);
            document.getElementById('listSubcourses').classList.toggle('hidden', isCourses);

            // Bottom Nav Sync
            const navCourses = document.getElementById('navCourses');
            const navSubcourses = document.getElementById('navSubcourses');
            
            if (isCourses) {
                navCourses.className = "flex flex-col items-center gap-1 text-[#0B63E5] font-bold transition-colors";
                navSubcourses.className = "flex flex-col items-center gap-1 text-gray-400 hover:text-gray-700 transition-colors";
            } else {
                navSubcourses.className = "flex flex-col items-center gap-1 text-[#0B63E5] font-bold transition-colors";
                navCourses.className = "flex flex-col items-center gap-1 text-gray-400 hover:text-gray-700 transition-colors";
            }

            renderSubcourses();
        }

        // Render Courses List
        function renderCourses() {
            const list = document.getElementById('listCourses');
            if (coursesData.length === 0) {
                list.innerHTML = `
                    <div class="bg-white rounded-2xl p-6 text-center border border-gray-100">
                        <i class="fa-solid fa-folder-open text-gray-300 text-3xl mb-2"></i>
                        <p class="text-xs font-bold text-gray-500">No courses created yet.</p>
                    </div>`;
                return;
            }

            list.innerHTML = coursesData.map(course => `
                <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-xs flex items-center justify-between hover:shadow-md transition-all">
                    <div class="flex items-center gap-3.5 min-w-0">
                        ${course.image ? 
                            `<img src="${course.image}" class="w-12 h-12 rounded-2xl object-cover shrink-0">` : 
                            `<div class="w-12 h-12 rounded-2xl ${course.bg} ${course.color} flex items-center justify-center text-xl shrink-0">
                                <i class="fa-solid ${course.iconClass}"></i>
                            </div>`
                        }
                        <div class="min-w-0">
                            <h4 class="text-xs sm:text-sm font-bold text-gray-900 truncate">${escapeHtml(course.title)}</h4>
                            <div class="flex items-center gap-2 mt-1 flex-wrap">
                                <span class="text-[11px] font-medium text-gray-400">${escapeHtml(course.code)} • ${escapeHtml(course.level)}</span>
                                <span class="bg-[#E6F7F0] text-[#059669] text-[10px] font-bold px-2.5 py-0.5 rounded-full">${course.subcoursesCount} Subcourses</span>
                            </div>
                        </div>
                    </div>
                    <div class="relative">
                        <button onclick="toggleActionMenu(event, 'course-${course.id}')" class="text-gray-400 hover:text-gray-600 p-2 shrink-0">
                            <i class="fa-solid fa-ellipsis-vertical text-sm"></i>
                        </button>
                        <div id="action-course-${course.id}" class="hidden absolute right-0 top-8 bg-white border border-gray-100 shadow-xl rounded-xl py-1 w-28 z-30">
                            <button onclick="deleteCourse('${course.id}')" class="w-full text-left px-3 py-1.5 text-xs text-red-600 hover:bg-red-50 flex items-center gap-2 font-medium">
                                <i class="fa-solid fa-trash text-[10px]"></i> Delete
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Render Subcourses List
        function renderSubcourses() {
            const list = document.getElementById('listSubcourses');
            const parentSelect = document.getElementById('subcourseParent');
            const selectedParentCode = parentSelect ? parentSelect.value : null;

            const filtered = selectedParentCode ? subcoursesData.filter(s => s.parentCode === selectedParentCode) : subcoursesData;

            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="bg-white rounded-2xl p-6 text-center border border-gray-100">
                        <i class="fa-solid fa-layer-group text-gray-300 text-3xl mb-2"></i>
                        <p class="text-xs font-bold text-gray-500">No subcourses for this parent course yet.</p>
                    </div>`;
                return;
            }

            list.innerHTML = filtered.map(sub => `
                <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-xs flex items-center justify-between hover:shadow-md transition-all">
                    <div class="flex items-center gap-3 min-w-0">
                        <div class="text-gray-300 hover:text-gray-500 cursor-grab px-1 shrink-0">
                            <i class="fa-solid fa-grip-vertical text-xs"></i>
                        </div>
                        ${sub.image ? 
                            `<img src="${sub.image}" class="w-11 h-11 rounded-2xl object-cover shrink-0">` :
                            `<div class="w-11 h-11 rounded-2xl ${sub.bg} text-white flex items-center justify-center text-sm font-bold shrink-0">
                                <i class="fa-solid ${sub.iconClass}"></i>
                            </div>`
                        }
                        <div class="min-w-0">
                            <h4 class="text-xs sm:text-sm font-bold text-gray-900 truncate">${escapeHtml(sub.title)}</h4>
                            <p class="text-[11px] font-medium text-gray-400 mt-0.5">${escapeHtml(sub.code)} • ${escapeHtml(sub.level)}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                        <span class="bg-[#E6F7F0] text-[#059669] text-[10px] font-bold px-2.5 py-1 rounded-full hidden sm:inline-block">${sub.resources} Resources</span>
                        <div class="relative">
                            <button onclick="toggleActionMenu(event, 'sub-${sub.id}')" class="text-gray-400 hover:text-gray-600 p-2">
                                <i class="fa-solid fa-ellipsis-vertical text-sm"></i>
                            </button>
                            <div id="action-sub-${sub.id}" class="hidden absolute right-0 top-8 bg-white border border-gray-100 shadow-xl rounded-xl py-1 w-28 z-30">
                                <button onclick="deleteSubcourse('${sub.id}')" class="w-full text-left px-3 py-1.5 text-xs text-red-600 hover:bg-red-50 flex items-center gap-2 font-medium">
                                    <i class="fa-solid fa-trash text-[10px]"></i> Delete
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Populate Parent Select Dropdown
        function populateParentSelect() {
            const select = document.getElementById('subcourseParent');
            if (!select) return;

            select.innerHTML = coursesData.map(c => `
                <option value="${c.code}">${c.title} (${c.code})</option>
            `).join('');

            select.onchange = () => {
                const parentCourseObj = coursesData.find(c => c.code === select.value);
                document.getElementById('listSectionTitle').textContent = `Subcourses Under ${parentCourseObj ? parentCourseObj.title : 'Selected Course'}`;
                renderSubcourses();
            };
        }

        // Handle Course Submit
        function handleCourseSubmit(e) {
            e.preventDefault();
            const title = document.getElementById('courseTitle').value.trim();
            const code = document.getElementById('courseCode').value.trim().toUpperCase();
            const level = document.getElementById('courseLevel').value;
            const desc = document.getElementById('descCourses').value.trim();

            if (!title || !code || !level) {
                showToast('Please fill in all required fields.', 'error');
                return;
            }

            const newCourse = {
                id: 'c' + Date.now(),
                title,
                code,
                level,
                desc,
                subcoursesCount: 0,
                iconClass: 'fa-graduation-cap',
                bg: 'bg-[#EEF2FF]',
                color: 'text-[#0B63E5]',
                image: courseImages.course
            };

            coursesData.unshift(newCourse);
            populateParentSelect();
            renderCourses();

            // Reset Form
            document.getElementById('courseForm').reset();
            updateCharCount('descCourses', 'counterCourses');
            resetImagePreview('course');

            showToast(`Course "${title}" created successfully!`, 'success');
        }

        // Handle Subcourse Submit
        function handleSubcourseSubmit(e) {
            e.preventDefault();
            const parentCode = document.getElementById('subcourseParent').value;
            const title = document.getElementById('subcourseTitle').value.trim();
            const code = document.getElementById('subcourseCode').value.trim().toUpperCase();
            const level = document.getElementById('subcourseLevel').value;
            const desc = document.getElementById('descSubcourses').value.trim();

            if (!parentCode || !title || !code || !level) {
                showToast('Please fill in all required fields.', 'error');
                return;
            }

            const newSubcourse = {
                id: 's' + Date.now(),
                parentCode,
                title,
                code,
                level,
                desc,
                resources: 0,
                iconClass: 'fa-book-open',
                bg: 'bg-[#10B981]',
                image: courseImages.subcourse
            };

            subcoursesData.unshift(newSubcourse);

            // Increment parent count
            const parent = coursesData.find(c => c.code === parentCode);
            if (parent) parent.subcoursesCount += 1;

            renderCourses();
            renderSubcourses();

            // Reset Form
            document.getElementById('subcourseForm').reset();
            updateCharCount('descSubcourses', 'counterSubcourses');
            resetImagePreview('subcourse');

            showToast(`Subcourse "${title}" added successfully!`, 'success');
        }

        // Delete Course
        function deleteCourse(id) {
            const courseIndex = coursesData.findIndex(c => c.id === id);
            if (courseIndex > -1) {
                const deletedTitle = coursesData[courseIndex].title;
                const deletedCode = coursesData[courseIndex].code;

                // Remove course & subcourses related
                coursesData.splice(courseIndex, 1);
                subcoursesData = subcoursesData.filter(s => s.parentCode !== deletedCode);

                populateParentSelect();
                renderCourses();
                renderSubcourses();
                showToast(`Course "${deletedTitle}" removed.`, 'info');
            }
        }

        // Delete Subcourse
        function deleteSubcourse(id) {
            const index = subcoursesData.findIndex(s => s.id === id);
            if (index > -1) {
                const sub = subcoursesData[index];
                subcoursesData.splice(index, 1);

                // Decrement parent subcourse count
                const parent = coursesData.find(c => c.code === sub.parentCode);
                if (parent && parent.subcoursesCount > 0) parent.subcoursesCount -= 1;

                renderCourses();
                renderSubcourses();
                showToast(`Subcourse "${sub.title}" deleted.`, 'info');
            }
        }

        // Image Handling Functions
        function handleImageSelect(event, type) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size > 2 * 1024 * 1024) {
                showToast('Image file size must be under 2MB.', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                courseImages[type] = e.target.result;
                const previewContainer = document.getElementById(`${type}PreviewContainer`);
                previewContainer.innerHTML = `
                    <div class="relative group">
                        <img src="${e.target.result}" class="w-16 h-16 rounded-2xl object-cover shadow-sm border border-gray-200">
                        <span class="block text-xs font-bold text-gray-800 mt-2">${file.name}</span>
                        <span class="text-[10px] text-blue-600 underline font-semibold">Click to change</span>
                    </div>
                `;
            };
            reader.readAsDataURL(file);
        }

        function resetImagePreview(type) {
            courseImages[type] = null;
            const previewContainer = document.getElementById(`${type}PreviewContainer`);
            previewContainer.innerHTML = `
                <div class="w-10 h-10 rounded-full bg-white text-[#0B63E5] flex items-center justify-center shadow-xs mb-1.5 group-hover:scale-105 transition-transform">
                    <i class="fa-solid fa-cloud-arrow-up text-lg"></i>
                </div>
                <span class="text-xs font-bold text-gray-800">Tap to upload image</span>
                <span class="text-[10px] font-medium text-gray-400 mt-0.5">PNG, JPG up to 2MB</span>
            `;
        }

        // Helper Functions
        function updateCharCount(textareaId, counterId) {
            const textarea = document.getElementById(textareaId);
            const counter = document.getElementById(counterId);
            counter.textContent = `${textarea.value.length}/250`;
        }

        function scrollToForm() {
            const activeForm = activeTab === 'courses' ? 'formCourses' : 'formSubcourses';
            document.getElementById(activeForm).scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function handleBackAction() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                showToast('Already at the main admin dashboard.', 'info');
            }
        }

        function toggleViewAll() {
            showToast(`Viewing all items under ${activeTab}`, 'info');
        }

        function toggleActionMenu(e, id) {
            e.stopPropagation();
            // Close all open action menus
            document.querySelectorAll('[id^="action-"]').forEach(el => {
                if (el.id !== `action-${id}`) el.classList.add('hidden');
            });
            const menu = document.getElementById(`action-${id}`);
            if (menu) menu.classList.toggle('hidden');
        }

        // Close action dropdown menus when clicking outside
        document.addEventListener('click', () => {
            document.querySelectorAll('[id^="action-"]').forEach(el => el.classList.add('hidden'));
        });

        // Toast Feedback System
        function showToast(message, type = 'success') {
            const toastContainer = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            const bgClass = type === 'success' ? 'bg-emerald-600 text-white' : type === 'error' ? 'bg-red-600 text-white' : 'bg-gray-800 text-white';
            const iconClass = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-info';

            toast.className = `${bgClass} px-4 py-3 rounded-2xl shadow-lg text-xs font-bold flex items-center gap-2.5 transition-all duration-300 opacity-0 translate-y-2 pointer-events-auto`;
            toast.innerHTML = `<i class="fa-solid ${iconClass} text-sm"></i> <span>${escapeHtml(message)}</span>`;

            toastContainer.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('opacity-0', 'translate-y-2');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, (m) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            })[m]);
        }
    </script>
</body>
</html>
