<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.8">
    <title>My Library App UI Replica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            blue: '#1664FF',
                            lightblue: '#EEF2FF',
                            graybg: '#F9FAFB',
                            border: '#E5E7EB',
                            textmain: '#111827',
                            textsub: '#6B7280'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #FFFFFF; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .tab-btn.active {
            color: #1664FF;
            border-bottom: 2.5px solid #1664FF;
            font-weight: 600;
        }
        .tab-btn.active i {
            color: #1664FF;
        }
        .tab-btn:not(.active) {
            color: #9CA3AF;
        }

        /* small helper for card action buttons */
        .card-actions > button { width: 34px; height: 34px; }
    </style>
</head>

    </div>

                </div>

                <div class="bg-emerald-50/50 border border-emerald-100/60 rounded-2xl p-3.5 sm:p-4 relative overflow-hidden">
                    <div class="flex items-center gap-2.5 mb-2">
                        <div class="w-7 h-7 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center text-[12px]">

                    </div>
                    <span class="text-[12px] text-gray-500 font-medium">Completed</span>

    <nav class="fixed bottom-0 left-0 w-full bg-white/95 backdrop-blur-md border-t border-gray-200/80 z-50 px-4 py-2.5 shadow-lg">
        <div class="max-w-md mx-auto flex justify-between items-center text-center">
            <a href="/tutor/Oau.html" class="flex flex-col items-center text-gray-400 hover:text-brand-blue transition-colors gap-1 min-w-[50px]">
                <i class="fa-solid fa-house text-lg"></i>

            </a>
            <a href="course.html" class="flex flex-col items-center text-gray-400 hover:text-brand-blue transition-colors gap-1 min-w-[50px]">
                <i class="fa-solid fa-layer-group text-lg"></i>
                <span class="text-[10px] font-medium">Categories</span>
            </a>
            <a href="user-lib.html" class="flex flex-col items-center text-brand-blue font-bold gap-1 min-w-[50px]">
                <i class="fa-solid fa-book-bookmark text-lg"></i>
                <span class="text-[10px]">My Library</span>
            </a>
            <a href="oausphere.html" class="flex flex-col items-center text-gray-400 hover:text-brand-blue transition-colors gap-1 min-w-[50px]">
                <i class="fa-solid fa-book-atlas text-lg"></i>
                <span class="text-[10px] font-medium">GoodLibrary</span>
            </a>
            <a href="view-pro.html" class="flex flex-col items-center text-gray-400 hover:text-brand-blue transition-colors gap-1 min-w-[50px]">
                <i class="fa-solid fa-circle-user text-lg"></i>
                <span class="text-[10px] font-medium">Profile</span>

    <script>
        // Global UI state switch
        function switchTab(tabName) {
            const tabs = ['library', 'notes', 'history'];
            tabs.forEach(tab => {
                const btn = document.getElementById(`tab-${tab}`);
                const content = document.getElementById(`content-${tab}`);
                if (tab === tabName) {
                    btn?.classList.add('active');
                    content?.classList.remove('hidden');
                } else {
                    btn?.classList.remove('active');
                    content?.classList.add('hidden');
                }
            });
        }

        // Start loader on DOMContentLoaded
        document.addEventListener("DOMContentLoaded", fetchUserAndLibrary);

        // Helper to safely parse JSON & preserve raw body for debugging
        async function fetchAndParse(url, options = {}) {
            try {
                const res = await fetch(url, options);
                const raw = await res.text().catch(() => null);
                let parsed = null;
                try { parsed = raw ? JSON.parse(raw) : null; } catch (e) { parsed = null; }
                return { ok: res.ok, status: res.status, statusText: res.statusText, raw, parsed };
            } catch (err) {
                // network/CORS error
                return { ok: false, error: err };
            }
        }

        // Escape HTML for UI-inserted messages
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Fetch both /api/auth/me and /api/users/me/library, merge results, render
        async function fetchUserAndLibrary() {
            const spinner = document.getElementById('loading-spinner');
            if (spinner) spinner.classList.remove('hidden');

            const booksGrid = document.getElementById('books-grid');

            try {
                const token = localStorage.getItem("token");
                const base = 'https://examguide.onrender.com';
                const headers = {
                    'Content-Type': 'application/json',
                    ...(token ? { 'Authorization': `Bearer ${token}` } : {})
                };

                // Run requests in parallel
                const [authRes, libRes] = await Promise.all([
                    fetchAndParse(`${base}/api/auth/me`, { method: 'GET', headers, credentials: 'include' }),
                    fetchAndParse(`${base}/api/resource/users/me/library`, { method: 'GET', headers, credentials: 'include' })
                ]);

                // Handle auth response (not fatal)
                if (authRes && authRes.error) {
                    console.warn('Auth fetch failed (network/CORS):', authRes.error);
                } else if (authRes && !authRes.ok) {
                    console.warn('Auth fetch HTTP error:', authRes.status, authRes.statusText, authRes.raw || authRes.parsed);
                } else if (authRes && authRes.parsed && authRes.parsed.user) {
                    // Render user profile immediately with /api/auth/me result
                    renderUserProfile(authRes.parsed.user);
                }

                // Handle library response (primary)
                if (!libRes) throw new Error('No response from library endpoint');
                if (libRes.error) {
                    // Network-level failure
                    console.error('Library fetch network/CORS error:', libRes.error);
                    throw new Error(libRes.error.message || 'Network error while fetching library');
                }

                if (!libRes.ok) {
                    // Non-2xx status
                    console.error('Library fetch HTTP error', {
                        status: libRes.status,
                        statusText: libRes.statusText,
                        raw: libRes.raw,
                        parsed: libRes.parsed
                    });
                    const serverMsg = (libRes.parsed && (libRes.parsed.error || libRes.parsed.message || (libRes.parsed.success === false && JSON.stringify(libRes.parsed)))) || libRes.raw || `HTTP ${libRes.status} ${libRes.statusText}`;
                    throw new Error(serverMsg);
                }

                const data = libRes.parsed;
                if (!data) {
                    console.error('Library returned empty or invalid JSON', { raw: libRes.raw });
                    throw new Error('Invalid server response for library');
                }

                if (!data.success && data.success !== undefined) {
                    const serverMsg = data.error || data.message || 'Failed to load library';
                    throw new Error(serverMsg);
                }

                // If auth didn't provide a user earlier, prefer library.user if present
                if ((!authRes || !authRes.parsed || !authRes.parsed.user) && data.user) {
                    renderUserProfile(data.user);
                }

                // Render other sections
                renderStats(data.stats || {});
                renderBooks(data.library?.books || []);
                renderNotes(data.library?.notes || [], data.bookmarks || []);
                // accessed (borrowed) is displayed inside history per request
                renderHistory(data.history || [], data.accessed || [], data.library?.books || []);

            } catch (err) {
                console.error("Failed to fetch user library:", err);
                const msg = (err && err.message) ? err.message : 'Please check your connection and try again.';
                if (booksGrid) {
                    booksGrid.innerHTML = `
                        <div class="col-span-full py-12 text-center w-full">
                            <div class="w-12 h-12 mx-auto mb-3 rounded-full bg-red-50 text-red-500 flex items-center justify-center">
                                <i class="fa-solid fa-triangle-exclamation"></i>
                            </div>
                            <h3 class="font-semibold text-gray-800">
                                Unable to load library
                            </h3>
                            <p class="text-sm text-gray-500 mt-1">
                                ${escapeHtml(msg)}
                            </p>
                            <button onclick="fetchUserAndLibrary()" class="mt-4 px-4 py-2 rounded-lg bg-brand-blue text-white text-sm font-medium">
                                Try Again
                            </button>
                        </div>
                    `;
                }
            } finally {
                if (spinner) spinner.classList.add('hidden');
            }
        }

        // 1. Render User Details (NULL-safe)
        function renderUserProfile(user) {
            if (!user) return;

            // Name
            const fullname = user.fullname || user.fullName || 'Library User';
            const fullnameEl = document.getElementById('user-fullname');
            if (fullnameEl) fullnameEl.textContent = fullname;

            // Department (handle null, string, or object with { name })
            let deptStr = 'General';
            if (user.department !== undefined && user.department !== null) {
                if (typeof user.department === 'object') {
                    if (user.department && typeof user.department.name === 'string' && user.department.name.trim() !== '') {
                        deptStr = user.department.name;
                    } else {
                        deptStr = user.department.toString ? String(user.department) : 'General';
                    }
                } else {
                    deptStr = String(user.department);
                }
            }

            // Level
            const levelStr = user.level ? `${user.level} Level` : 'Student';
            const acadEl = document.getElementById('user-academic-info');
            if (acadEl) acadEl.textContent = `${deptStr} • ${levelStr}`;

            // Username / Faculty fallback (faculty may be object or string or null)
            let facultyName = '';
            if (user.faculty !== undefined && user.faculty !== null) {
                if (typeof user.faculty === 'object') {
                    facultyName = (user.faculty && (user.faculty.name || user.faculty.fullname || '')) || '';
                } else {
                    facultyName = String(user.faculty);
                }
            }
            const userNameEl = document.getElementById('user-username');
            if (userNameEl) userNameEl.textContent = user.username ? `@${user.username}` : (facultyName || '');

            // Avatar
            if (user.profilePic) {
                const avatar = document.getElementById('user-avatar');
                if (avatar) avatar.src = user.profilePic;
            }
        }

        // 2. Render Header & Tab Statistics
        function renderStats(stats) {
            if (!stats) return;
            const setText = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
            setText('stat-total-books', stats.totalBooks || 0);
            setText('stat-total-notes', stats.totalNotes || 0);
            setText('stat-completed-notes', stats.totalOpened || 0);
            setText('stat-bookmarked-notes', stats.totalBookmarks || 0);
            setText('stat-total-accessed', stats.totalAccessed || 0);
        }

        // 3. Dynamic Rendering for Books (cards include Edit + View buttons)
        function renderBooks(books = []) {
            const container = document.getElementById('books-grid');
            if (!container) return;
            container.innerHTML = '';

            books.forEach(book => {
                const id = book._id || book.id || '';
                const progressPct = book.progress?.progressPercent || 0;
                const coverImage = book.coverImage || book.thumbnail || (book.cover && book.cover.url) || 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&q=80&w=300';
                const title = book.title || '';
                const uploaderName = (book.uploader && (book.uploader.fullname || book.uploader.username)) || 'Unknown Author';
                const resourceType = book.resourceType || (book.type || '');

                // Determine edit URL (textbook -> up.html, notebook -> Noteworkspace.html)
                const editBase = (resourceType && resourceType.toLowerCase() === 'notebook') ? 'Noteworkspace.html' : 'up.html';
                const editHref = `${editBase}?id=${encodeURIComponent(String(id))}`;
                const viewHref = `book.html?id=${encodeURIComponent(String(id))}`;

                const card = `
                    <div class="flex flex-col bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden hover:shadow-md transition-shadow cursor-pointer relative">
                        <div class="w-full aspect-[2/2.8] bg-gray-900 relative flex flex-col items-center justify-center text-center p-2">
                            <img src="${escapeHtml(coverImage)}" alt="${escapeHtml(title)}" class="absolute inset-0 w-full h-full object-cover opacity-80" />
                            <span class="text-white text-[12px] sm:text-[14px] font-bold leading-tight relative z-10 drop-shadow-md">${escapeHtml(title)}</span>
                            <div class="absolute top-2 right-2 flex gap-2 card-actions z-20">
                                <a href="${escapeHtml(editHref)}" title="Edit" class="inline-flex items-center justify-center bg-white/90 text-gray-700 rounded-md shadow-sm hover:bg-white px-2 py-1">
                                    <i class="fa-solid fa-pen"></i>
                                </a>
                                <a href="${escapeHtml(viewHref)}" title="View" class="inline-flex items-center justify-center bg-white/90 text-gray-700 rounded-md shadow-sm hover:bg-white px-2 py-1">
                                    <i class="fa-solid fa-eye"></i>
                                </a>
                            </div>
                        </div>
                        <div class="p-2.5 flex-1 flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-start gap-1">
                                    <h3 class="text-[11px] sm:text-[13px] font-bold text-gray-900 leading-tight line-clamp-1">${escapeHtml(title)}</h3>
                                    <button class="text-gray-400 shrink-0 hover:text-gray-700"><i class="fa-solid fa-ellipsis-vertical text-[12px]"></i></button>
                                </div>
                                <p class="text-[9px] sm:text-[11px] text-gray-500 mt-0.5 line-clamp-1">${escapeHtml(uploaderName)}</p>
                            </div>
                            <div class="flex items-center gap-2 mt-2">
                                <div class="flex-1 h-[4px] sm:h-[5px] bg-gray-100 rounded-full overflow-hidden">
                                    <div class="h-full bg-brand-blue rounded-full" style="width: ${progressPct}%"></div>
                                </div>
                                <span class="text-[9px] sm:text-[11px] font-medium text-gray-500">${progressPct}%</span>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });

            // Append persistent "Add Books" CTA tile (redirects to up.html)
            const addTile = `
                <div class="flex flex-col bg-brand-graybg rounded-xl border-2 border-dashed border-gray-200 overflow-hidden items-center justify-center p-3 sm:p-4 text-center aspect-[2/2.8] cursor-pointer hover:border-brand-blue transition-colors">
                    <a href="up.html" class="flex flex-col items-center justify-center w-full h-full p-2">
                        <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-brand-lightblue text-brand-blue flex items-center justify-center mb-3 sm:mb-4">
                            <i class="fa-solid fa-plus text-[18px] sm:text-[22px]"></i>
                        </div>
                        <h3 class="text-[13px] sm:text-[15px] font-bold text-brand-blue mb-1.5">Add Books</h3>
                        <p class="text-[10px] sm:text-[12px] text-gray-500 leading-snug px-1">Import or add new books to your library</p>
                    </a>
                </div>
            `;
            container.innerHTML += addTile;

            const summary = document.getElementById('books-count-summary');
            if (summary) summary.textContent = `Showing 1 - ${books.length} of ${books.length} books`;
        }

        // 4. Dynamic Rendering for Notes (add Edit + View buttons; edit -> Noteworkspace.html, view -> book.html?id=)
        function renderNotes(notes = [], bookmarks = []) {
            const container = document.getElementById('notes-list-container');
            if (!container) return;
            container.innerHTML = '';
            const headerCount = document.getElementById('notes-header-count');
            if (headerCount) headerCount.textContent = `${notes.length} notes`;

            if (notes.length === 0) {
                container.innerHTML = `<p class="text-sm text-gray-500 py-4 text-center">No notes found in library.</p>`;
                return;
            }

            notes.forEach(note => {
                const id = note._id || note.id || '';
                const isBookmarked = bookmarks.some(b => String(b._id) === String(note._id));
                const title = note.title || '';
                const uploaderName = (note.uploader && (note.uploader.fullname || note.uploader.username)) || 'Notebook';
                const editHref = `Noteworkspace.html?id=${encodeURIComponent(String(id))}`;
                const viewHref = `book.html?id=${encodeURIComponent(String(id))}`;

                const card = `
                    <div class="bg-white border border-gray-100 rounded-2xl p-3.5 sm:p-4 shadow-sm hover:shadow-md transition-shadow flex items-center justify-between gap-3 w-full">
                        <div class="flex items-start gap-3.5">
                            <div class="w-10 h-10 rounded-xl bg-blue-50 text-brand-blue flex items-center justify-center shrink-0 mt-0.5">
                                <i class="fa-regular fa-file-lines text-[16px]"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-gray-900 text-[14px] sm:text-[15px]">${escapeHtml(title)}</h3>
                                <p class="text-[12px] text-gray-500 font-medium mb-2">${escapeHtml(uploaderName)}</p>
                                <div class="flex flex-wrap gap-1.5">
                                    <span class="bg-blue-50 text-brand-blue text-[10px] font-semibold px-2 py-0.5 rounded-md">Notebook</span>
                                    ${note.courseCode ? `<span class="bg-emerald-50 text-emerald-600 text-[10px] font-semibold px-2 py-0.5 rounded-md">${escapeHtml(note.courseCode)}</span>` : ''}
                                </div>
                            </div>
                        </div>
                        <div class="flex flex-col items-end justify-between self-stretch shrink-0">
                            <div class="flex items-center gap-2">
                                <a href="${escapeHtml(editHref)}" title="Edit" class="inline-flex items-center justify-center bg-white/90 text-gray-700 rounded-md shadow-sm hover:bg-white px-2 py-1">
                                    <i class="fa-solid fa-pen"></i>
                                </a>
                                <a href="${escapeHtml(viewHref)}" title="View" class="inline-flex items-center justify-center bg-white/90 text-gray-700 rounded-md shadow-sm hover:bg-white px-2 py-1">
                                    <i class="fa-solid fa-eye"></i>
                                </a>
                            </div>
                            <div class="flex items-center gap-3 mt-2">
                                <i class="${isBookmarked ? 'fa-solid fa-bookmark text-brand-blue' : 'fa-regular fa-bookmark text-gray-400'} text-[14px]"></i>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        // 5/6. Dynamic Rendering for History (merges uploads, accessed (borrowed) and reading history)
        // signature: renderHistory(historyItems = [], accessedItems = [], uploaded = [])
        function renderHistory(historyItems = [], accessedItems = [], uploaded = []) {
            const container = document.getElementById('history-list-container');
            if (!container) return;
            container.innerHTML = '';

            // Build unified event list:
            // - uploads => { type: 'upload', date: resource.createdAt || createdAt, resource }
            // - accessed => { type: 'access', date: access.paidAt || createdAt, resource, access }
            // - reads (historyItems) => { type: 'read', date: progress.updatedAt || progress.lastOpenedAt, resource, progress }
            const events = [];

            if (Array.isArray(uploaded)) {
                for (const r of uploaded) {
                    events.push({
                        type: 'upload',
                        date: r.createdAt || r.uploadedAt || null,
                        resource: r,
                        meta: {}
                    });
                }
            }

            if (Array.isArray(accessedItems)) {
                for (const a of accessedItems) {
                    events.push({
                        type: 'access',
                        date: a.access?.paidAt || a.access?.createdAt || a.paidAt || a.createdAt || null,
                        resource: a,
                        meta: { access: a.access || {} }
                    });
                }
            }

            if (Array.isArray(historyItems)) {
                for (const h of historyItems) {
                    events.push({
                        type: 'read',
                        date: h.progress?.updatedAt || h.progress?.lastOpenedAt || h.updatedAt || null,
                        resource: h,
                        meta: { progress: h.progress || {} }
                    });
                }
            }

            // sort newest first; items without date go to the end
            events.sort((a, b) => {
                if (!a.date && !b.date) return 0;
                if (!a.date) return 1;
                if (!b.date) return -1;
                return new Date(b.date) - new Date(a.date);
            });

            if (events.length === 0) {
                container.innerHTML = `<p class="text-sm text-gray-500 py-4 text-center">No history record found.</p>`;
                return;
            }

            // Render each event with a consistent card, showing event type, title, uploader, date and actions (view/edit where applicable)
            let html = `<div class="space-y-3">`;

            for (const ev of events) {
                const r = ev.resource || {};
                const id = r._id || r.id || '';
                const title = r.title || r.subtitle || 'Untitled';
                const uploaderName = (r.uploader && (r.uploader.fullname || r.uploader.username)) || (r.authors || 'System');
                const cover = r.coverImage || r.cover?.url || r.thumbnail || 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&q=80&w=200';
                const dateStr = ev.date ? new Date(ev.date).toLocaleString() : '—';

                // event label
                let label = '';
                if (ev.type === 'upload') label = 'Uploaded';
                else if (ev.type === 'access') label = 'Accessed / Borrowed';
                else if (ev.type === 'read') label = `${(ev.meta.progress && ev.meta.progress.progressPercent) ? ev.meta.progress.progressPercent + '% Read' : 'Read'}`;

                // determine edit link: notebook -> Noteworkspace.html, textbook -> up.html
                const resourceType = r.resourceType || r.type || '';
                const editBase = (resourceType && resourceType.toLowerCase() === 'notebook') ? 'Noteworkspace.html' : 'up.html';
                const editHref = `${editBase}?id=${encodeURIComponent(String(id))}`;
                const viewHref = `book.html?id=${encodeURIComponent(String(id))}`;

                html += `
                    <div class="bg-white border border-gray-100 rounded-2xl p-3.5 flex items-center justify-between gap-3 hover:shadow-sm transition-shadow w-full">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-14 rounded-md overflow-hidden bg-slate-900 shrink-0">
                                <img src="${escapeHtml(cover)}" alt="${escapeHtml(title)}" class="w-full h-full object-cover">
                            </div>
                            <div>
                                <div class="flex items-center gap-2 mb-1">
                                    <h4 class="font-bold text-gray-900 text-[14px]">${escapeHtml(title)}</h4>
                                    <span class="text-[11px] text-gray-400 px-2 py-0.5 rounded-md bg-gray-50">${escapeHtml(label)}</span>
                                </div>
                                <p class="text-[12px] text-gray-500 mb-1">${escapeHtml(uploaderName)}</p>
                                <div class="text-[11px] text-gray-400">When: <span class="text-gray-700 font-semibold">${escapeHtml(dateStr)}</span></div>
                            </div>
                        </div>
                        <div class="flex flex-col items-end justify-between gap-2">
                            <div class="flex items-center gap-2">
                                <a href="${escapeHtml(viewHref)}" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-md border border-gray-200 bg-white text-sm text-gray-700 hover:bg-gray-50">
                                    <i class="fa-solid fa-eye"></i> View
                                </a>
                                <a href="${escapeHtml(editHref)}" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-md border border-gray-200 bg-white text-sm text-gray-700 hover:bg-gray-50">
                                    <i class="fa-solid fa-pen"></i> Edit
                                </a>
                            </div>
                            ${ev.type === 'access' ? `<div class="text-[11px] text-green-600 font-semibold">Unlocked</div>` : `<div class="text-[11px] text-gray-400">&nbsp;</div>`}
                        </div>
                    </div>
                `;
            }

            html += `</div>`;
            container.innerHTML = html;
        }
    </script>
</body>
