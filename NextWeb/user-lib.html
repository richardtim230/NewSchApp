<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.8">
    <title>My Library App UI Replica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            blue: '#1664FF',
                            lightblue: '#EEF2FF',
                            graybg: '#F9FAFB',
                            border: '#E5E7EB',
                            textmain: '#111827',
                            textsub: '#6B7280'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #FFFFFF; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .tab-btn.active {
            color: #1664FF;
            border-bottom: 2.5px solid #1664FF;
            font-weight: 600;
        }
        .tab-btn.active i {
            color: #1664FF;
        }
        .tab-btn:not(.active) {
            color: #9CA3AF;
        }
    </style>
</head>
<body class="w-full h-screen flex flex-col bg-white">

    <!-- Loading Overlay -->
    <div id="loading-spinner" class="fixed inset-0 bg-white/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center">
        <div class="w-10 h-10 border-4 border-brand-blue border-t-transparent rounded-full animate-spin"></div>
        <span class="mt-3 text-sm font-medium text-gray-600">Loading your library...</span>
    </div>

    <header class="px-4 sm:px-6 py-3 flex items-center justify-between w-full border-b border-gray-100 bg-white z-10 shrink-0">
        <button class="w-10 h-10 flex items-center justify-start text-gray-700 hover:text-gray-900 transition-colors">
            <i class="fa-solid fa-chevron-left text-[20px]"></i>
        </button>
        <h1 class="text-[18px] sm:text-[20px] font-bold text-gray-900 tracking-tight">My Library</h1>
        <button class="w-10 h-10 flex items-center justify-end text-gray-700 hover:text-gray-900 transition-colors">
            <i class="fa-solid fa-ellipsis text-[22px]"></i>
        </button>
    </header>

    <div class="flex border-b border-gray-100 px-2 sm:px-4 bg-white shrink-0 z-10 w-full">
        <button onclick="switchTab('library')" id="tab-library" class="tab-btn active flex-1 pb-3 pt-3 flex items-center justify-center gap-2 relative top-[1px] hover:bg-gray-50 transition-colors">
            <i class="fa-solid fa-book-open text-[15px]"></i>
            <span class="text-[13px] sm:text-[14px]">Library</span>
        </button>
        <button onclick="switchTab('notes')" id="tab-notes" class="tab-btn flex-1 pb-3 pt-3 flex items-center justify-center gap-2 relative top-[1px] hover:bg-gray-50 transition-colors">
            <i class="fa-regular fa-file-lines text-[15px]"></i>
            <span class="text-[13px] sm:text-[14px]">Notes</span>
        </button>
        <button onclick="switchTab('borrowed')" id="tab-borrowed" class="tab-btn flex-1 pb-3 pt-3 flex items-center justify-center gap-2 relative top-[1px] hover:bg-gray-50 transition-colors">
            <i class="fa-regular fa-clock text-[15px]"></i>
            <span class="text-[13px] sm:text-[14px]">Borrowed</span>
        </button>
        <button onclick="switchTab('history')" id="tab-history" class="tab-btn flex-1 pb-3 pt-3 flex items-center justify-center gap-2 relative top-[1px] hover:bg-gray-50 transition-colors">
            <i class="fa-solid fa-clock-rotate-left text-[15px]"></i>
            <span class="text-[13px] sm:text-[14px]">History</span>
        </button>
    </div>

    <main class="flex-1 overflow-y-auto no-scrollbar w-full bg-white flex flex-col pb-24">
        
        <!-- LIBRARY TAB CONTENT -->
        <div id="content-library" class="w-full pb-6">
            <div class="px-4 sm:px-6 py-4 flex items-center justify-between flex-wrap gap-4 w-full">
                <div class="flex items-center gap-4">
                    <img id="user-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=200" alt="User Profile" class="w-16 h-16 sm:w-20 sm:h-20 rounded-full object-cover shadow-sm">
                    <div class="flex flex-col">
                        <h2 id="user-fullname" class="text-[18px] sm:text-[22px] font-bold text-gray-900 mb-1">Loading...</h2>
                        <div class="flex items-center gap-2 text-[12px] sm:text-[14px] text-gray-600 mb-1">
                            <i class="fa-solid fa-graduation-cap text-[10px] sm:text-[12px]"></i>
                            <span id="user-academic-info">...</span>
                        </div>
                        <div class="flex items-center gap-2 text-[12px] sm:text-[14px] text-gray-600">
                            <i class="fa-solid fa-envelope text-[10px] sm:text-[12px]"></i>
                            <span id="user-username">...</span>
                        </div>
                    </div>
                </div>
                
                <div class="bg-[#F5F8FF] rounded-2xl p-4 sm:p-5 flex flex-col items-center justify-center min-w-[80px] sm:min-w-[100px] border border-blue-50">
                    <div class="flex items-center gap-2.5 mb-1">
                        <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-white text-brand-blue flex items-center justify-center shadow-sm">
                            <i class="fa-solid fa-book-open text-[12px] sm:text-[14px]"></i>
                        </div>
                        <span id="stat-total-books" class="text-[24px] sm:text-[28px] font-bold text-brand-blue">0</span>
                    </div>
                    <span class="text-[11px] sm:text-[12px] text-gray-500 font-medium">Total Books</span>
                </div>
            </div>

            <div class="px-4 sm:px-6 py-4 flex flex-wrap sm:flex-nowrap items-center gap-3 w-full">
                <div class="flex-1 bg-brand-graybg border border-gray-200 rounded-xl px-4 py-2.5 flex items-center gap-2 min-w-[200px]">
                    <i class="fa-solid fa-magnifying-glass text-gray-400 text-[15px]"></i>
                    <input type="text" id="search-books-input" placeholder="Search books..." class="bg-transparent flex-1 w-full outline-none text-[15px] placeholder-gray-400 text-gray-800">
                </div>
                
                <div class="flex items-center gap-3 shrink-0">
                    <button class="border border-gray-200 rounded-xl px-4 py-2.5 flex items-center gap-2 bg-white hover:bg-gray-50 transition-colors">
                        <span class="text-[14px] font-medium text-gray-700">Recent</span>
                        <i class="fa-solid fa-chevron-down text-[10px] text-gray-500"></i>
                    </button>
                    
                    <div class="flex bg-brand-graybg rounded-xl p-1 border border-gray-200">
                        <button class="w-9 h-9 rounded-lg bg-brand-blue text-white flex items-center justify-center shadow-sm">
                            <i class="fa-solid fa-table-cells-large text-[15px]"></i>
                        </button>
                        <button class="w-9 h-9 rounded-lg text-gray-400 flex items-center justify-center hover:text-gray-600">
                            <i class="fa-solid fa-list text-[15px]"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- BOOKS GRID CONTAINER -->
            <div id="books-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 sm:gap-4 lg:gap-5 px-4 sm:px-6 pb-2 w-full">
                <!-- Dynamic Books populated via Javascript -->
            </div>

            <div class="flex flex-col items-center pb-6 pt-6 w-full">
                <p id="books-count-summary" class="text-[13px] sm:text-[14px] text-gray-500 font-medium">Showing books</p>
            </div>
        </div>

        <!-- NOTES TAB CONTENT -->
        <div id="content-notes" class="w-full px-4 sm:px-6 py-4 hidden">
            <div class="flex flex-wrap items-center gap-2 sm:gap-3 mb-5 w-full">
                <div class="flex-1 bg-gray-100/80 rounded-xl px-4 py-2.5 flex items-center gap-2 min-w-[200px]">
                    <i class="fa-solid fa-magnifying-glass text-gray-400 text-[14px]"></i>
                    <input type="text" placeholder="Search your notes..." class="bg-transparent flex-1 outline-none text-[14px] placeholder-gray-400 text-gray-800">
                </div>
            </div>

            <div class="grid grid-cols-3 gap-3 mb-6 w-full">
                <div class="bg-blue-50/50 border border-blue-100/60 rounded-2xl p-3.5 sm:p-4 relative overflow-hidden">
                    <div class="flex items-center gap-2.5 mb-2">
                        <div class="w-7 h-7 rounded-lg bg-blue-100 text-brand-blue flex items-center justify-center text-[12px]">
                            <i class="fa-regular fa-file-lines"></i>
                        </div>
                        <span id="stat-total-notes" class="text-[20px] sm:text-[24px] font-bold text-brand-blue">0</span>
                    </div>
                    <span class="text-[12px] text-gray-500 font-medium">Total Notes</span>
                    <div class="absolute bottom-0 left-0 right-0 h-1 bg-brand-blue/30 rounded-b-2xl"></div>
                </div>

                <div class="bg-emerald-50/50 border border-emerald-100/60 rounded-2xl p-3.5 sm:p-4 relative overflow-hidden">
                    <div class="flex items-center gap-2.5 mb-2">
                        <div class="w-7 h-7 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center text-[12px]">
                            <i class="fa-solid fa-check"></i>
                        </div>
                        <span id="stat-completed-notes" class="text-[20px] sm:text-[24px] font-bold text-emerald-600">0</span>
                    </div>
                    <span class="text-[12px] text-gray-500 font-medium">Completed</span>
                    <div class="absolute bottom-0 left-0 right-0 h-1 bg-emerald-500/30 rounded-b-2xl"></div>
                </div>

                <div class="bg-purple-50/50 border border-purple-100/60 rounded-2xl p-3.5 sm:p-4 relative overflow-hidden">
                    <div class="flex items-center gap-2.5 mb-2">
                        <div class="w-7 h-7 rounded-lg bg-purple-100 text-purple-600 flex items-center justify-center text-[12px]">
                            <i class="fa-regular fa-bookmark"></i>
                        </div>
                        <span id="stat-bookmarked-notes" class="text-[20px] sm:text-[24px] font-bold text-purple-600">0</span>
                    </div>
                    <span class="text-[12px] text-gray-500 font-medium">Bookmarked</span>
                    <div class="absolute bottom-0 left-0 right-0 h-1 bg-purple-500/30 rounded-b-2xl"></div>
                </div>
            </div>

            <div class="flex justify-between items-center mb-3 w-full">
                <h2 class="text-[16px] font-bold text-gray-900">My Notes</h2>
                <span id="notes-header-count" class="text-[12px] text-gray-400 font-medium">0 notes</span>
            </div>

            <!-- DYNAMIC NOTES CONTAINER -->
            <div id="notes-list-container" class="space-y-3 w-full"></div>
        </div>

        <!-- BORROWED / ACCESSED TAB CONTENT -->
        <div id="content-borrowed" class="w-full px-4 sm:px-6 py-4 hidden">
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6 w-full">
                <div class="bg-blue-50/50 border border-blue-100/60 rounded-2xl p-3.5 relative overflow-hidden">
                    <div class="flex items-center gap-2.5 mb-1.5">
                        <div class="w-7 h-7 rounded-lg bg-blue-100 text-brand-blue flex items-center justify-center text-[12px]">
                            <i class="fa-solid fa-bag-shopping"></i>
                        </div>
                        <span id="stat-total-accessed" class="text-[20px] font-bold text-brand-blue">0</span>
                    </div>
                    <span class="text-[12px] text-gray-500 font-medium">Accessed</span>
                    <div class="absolute bottom-0 left-0 right-0 h-1 bg-brand-blue/30 rounded-b-2xl"></div>
                </div>
            </div>

            <div class="flex justify-between items-center mb-3 w-full">
                <h2 class="text-[16px] font-bold text-gray-900">Accessed Resources</h2>
                <span id="accessed-header-count" class="text-[12px] text-gray-400 font-medium">0 items</span>
            </div>

            <!-- DYNAMIC ACCESSED CONTAINER -->
            <div id="accessed-list-container" class="space-y-3 w-full"></div>
        </div>

        <!-- HISTORY TAB CONTENT -->
        <div id="content-history" class="w-full px-4 sm:px-6 py-4 hidden">
            <h2 class="text-[20px] font-bold text-gray-900 mb-1">History</h2>
            <p class="text-[13px] text-gray-500 mb-4">A record of your recent reading activity.</p>

            <!-- DYNAMIC HISTORY CONTAINER -->
            <div id="history-list-container" class="space-y-6 relative pl-2 w-full"></div>
        </div>

    </main>

    <nav class="fixed bottom-0 left-0 w-full bg-white/95 backdrop-blur-md border-t border-gray-200/80 z-50 px-4 py-2.5 shadow-lg">
        <div class="max-w-md mx-auto flex justify-between items-center text-center">
            <a href="/tutor/Oau.html" class="flex flex-col items-center text-gray-400 hover:text-brand-blue transition-colors gap-1 min-w-[50px]">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] font-medium">Home</span>
            </a>
            <a href="course.html" class="flex flex-col items-center text-gray-400 hover:text-brand-blue transition-colors gap-1 min-w-[50px]">
                <i class="fa-solid fa-layer-group text-lg"></i>
                <span class="text-[10px] font-medium">Categories</span>
            </a>
            <a href="user-lib.html" class="flex flex-col items-center text-brand-blue font-bold gap-1 min-w-[50px]">
                <i class="fa-solid fa-book-bookmark text-lg"></i>
                <span class="text-[10px]">My Library</span>
            </a>
            <a href="oausphere.html" class="flex flex-col items-center text-gray-400 hover:text-brand-blue transition-colors gap-1 min-w-[50px]">
                <i class="fa-solid fa-book-atlas text-lg"></i>
                <span class="text-[10px] font-medium">GoodLibrary</span>
            </a>
            <a href="view-pro.html" class="flex flex-col items-center text-gray-400 hover:text-brand-blue transition-colors gap-1 min-w-[50px]">
                <i class="fa-solid fa-circle-user text-lg"></i>
                <span class="text-[10px] font-medium">Profile</span>
            </a>
        </div>
    </nav>

    <script>
        // Global UI state switch
        function switchTab(tabName) {
            const tabs = ['library', 'notes', 'borrowed', 'history'];
            tabs.forEach(tab => {
                const btn = document.getElementById(`tab-${tab}`);
                const content = document.getElementById(`content-${tab}`);
                if (tab === tabName) {
                    btn?.classList.add('active');
                    content?.classList.remove('hidden');
                } else {
                    btn?.classList.remove('active');
                    content?.classList.add('hidden');
                }
            });
        }

        // Fetch user data from backend API endpoint
        document.addEventListener("DOMContentLoaded", fetchUserLibrary);

        async function fetchUserLibrary() {
            try {
                const token = localStorage.getItem("token");
                const response = await fetch('https://examguide.onrender.com/api/users/me/library', {
                    method: 'GET',
                    headers: { 
                        'Content-Type': 'application/json',
                        ...(token ? { 'Authorization': `Bearer ${token}` } : {})
                    },
                    credentials: 'include'
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error || 'Failed to load library');
                }

                renderUserProfile(data.user);
                renderStats(data.stats);
                renderBooks(data.library?.books || []);
                renderNotes(data.library?.notes || [], data.bookmarks || []);
                renderAccessed(data.accessed || []);
                renderHistory(data.history || []);
                
            } catch (err) {
                console.error("Failed to fetch user library:", err);
                const booksGrid = document.getElementById('books-grid');
                if (booksGrid) {
                    booksGrid.innerHTML = `
                        <div class="col-span-full py-12 text-center w-full">
                            <div class="w-12 h-12 mx-auto mb-3 rounded-full bg-red-50 text-red-500 flex items-center justify-center">
                                <i class="fa-solid fa-triangle-exclamation"></i>
                            </div>
                            <h3 class="font-semibold text-gray-800">
                                Unable to load library
                            </h3>
                            <p class="text-sm text-gray-500 mt-1">
                                Please check your connection and try again.
                            </p>
                            <button onclick="fetchUserLibrary()" class="mt-4 px-4 py-2 rounded-lg bg-brand-blue text-white text-sm font-medium">
                                Try Again
                            </button>
                        </div>
                    `;
                }
            } finally {
                const spinner = document.getElementById('loading-spinner');
                if (spinner) spinner.classList.add('hidden');
            }
        }

        // 1. Render User Details
        function renderUserProfile(user) {
            if (!user) return;
            document.getElementById('user-fullname').textContent = user.fullname || 'Library User';
            document.getElementById('user-academic-info').textContent = `${user.department || 'General'} • ${user.level ? user.level + ' Level' : 'Student'}`;
            document.getElementById('user-username').textContent = user.username ? `@${user.username}` : (user.faculty || '');
            if (user.profilePic) {
                document.getElementById('user-avatar').src = user.profilePic;
            }
        }

        // 2. Render Header & Tab Statistics
        function renderStats(stats) {
            if (!stats) return;
            document.getElementById('stat-total-books').textContent = stats.totalBooks || 0;
            document.getElementById('stat-total-notes').textContent = stats.totalNotes || 0;
            document.getElementById('stat-completed-notes').textContent = stats.totalOpened || 0;
            document.getElementById('stat-bookmarked-notes').textContent = stats.totalBookmarks || 0;
            document.getElementById('stat-total-accessed').textContent = stats.totalAccessed || 0;
        }

        // 3. Dynamic Rendering for Books
        function renderBooks(books = []) {
            const container = document.getElementById('books-grid');
            container.innerHTML = '';

            books.forEach(book => {
                const progressPct = book.progress?.progressPercent || 0;
                const coverImage = book.coverImage || book.thumbnail || 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&q=80&w=300';
                
                const card = `
                    <div class="flex flex-col bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden hover:shadow-md transition-shadow cursor-pointer">
                        <div class="w-full aspect-[2/2.8] bg-gray-900 relative flex flex-col items-center justify-center text-center p-2">
                            <img src="${coverImage}" alt="${book.title}" class="absolute inset-0 w-full h-full object-cover opacity-80" />
                            <span class="text-white text-[12px] sm:text-[14px] font-bold leading-tight relative z-10 drop-shadow-md">${book.title}</span>
                        </div>
                        <div class="p-2.5 flex-1 flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-start gap-1">
                                    <h3 class="text-[11px] sm:text-[13px] font-bold text-gray-900 leading-tight line-clamp-1">${book.title}</h3>
                                    <button class="text-gray-400 shrink-0 hover:text-gray-700"><i class="fa-solid fa-ellipsis-vertical text-[12px]"></i></button>
                                </div>
                                <p class="text-[9px] sm:text-[11px] text-gray-500 mt-0.5 line-clamp-1">${book.uploader?.fullname || 'Unknown Author'}</p>
                            </div>
                            <div class="flex items-center gap-2 mt-2">
                                <div class="flex-1 h-[4px] sm:h-[5px] bg-gray-100 rounded-full overflow-hidden">
                                    <div class="h-full bg-brand-blue rounded-full" style="width: ${progressPct}%"></div>
                                </div>
                                <span class="text-[9px] sm:text-[11px] font-medium text-gray-500">${progressPct}%</span>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });

            // Append persistent "Add Books" CTA tile
            const addTile = `
                <div class="flex flex-col bg-brand-graybg rounded-xl border-2 border-dashed border-gray-200 overflow-hidden items-center justify-center p-3 sm:p-4 text-center aspect-[2/2.8] cursor-pointer hover:border-brand-blue transition-colors">
                    <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-brand-lightblue text-brand-blue flex items-center justify-center mb-3 sm:mb-4">
                        <i class="fa-solid fa-plus text-[18px] sm:text-[22px]"></i>
                    </div>
                    <h3 class="text-[13px] sm:text-[15px] font-bold text-brand-blue mb-1.5">Add Books</h3>
                    <p class="text-[10px] sm:text-[12px] text-gray-500 leading-snug px-1">Import or add new books to your library</p>
                </div>
            `;
            container.innerHTML += addTile;

            document.getElementById('books-count-summary').textContent = `Showing 1 - ${books.length} of ${books.length} books`;
        }

        // 4. Dynamic Rendering for Notes
        function renderNotes(notes = [], bookmarks = []) {
            const container = document.getElementById('notes-list-container');
            container.innerHTML = '';
            document.getElementById('notes-header-count').textContent = `${notes.length} notes`;

            if (notes.length === 0) {
                container.innerHTML = `<p class="text-sm text-gray-500 py-4 text-center">No notes found in library.</p>`;
                return;
            }

            notes.forEach(note => {
                const isBookmarked = bookmarks.some(b => String(b._id) === String(note._id));
                const card = `
                    <div class="bg-white border border-gray-100 rounded-2xl p-3.5 sm:p-4 shadow-sm hover:shadow-md transition-shadow flex items-center justify-between gap-3 w-full">
                        <div class="flex items-start gap-3.5">
                            <div class="w-10 h-10 rounded-xl bg-blue-50 text-brand-blue flex items-center justify-center shrink-0 mt-0.5">
                                <i class="fa-regular fa-file-lines text-[16px]"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-gray-900 text-[14px] sm:text-[15px]">${note.title}</h3>
                                <p class="text-[12px] text-gray-500 font-medium mb-2">${note.uploader?.fullname || 'Notebook'}</p>
                                <div class="flex flex-wrap gap-1.5">
                                    <span class="bg-blue-50 text-brand-blue text-[10px] font-semibold px-2 py-0.5 rounded-md">Notebook</span>
                                    ${note.courseCode ? `<span class="bg-emerald-50 text-emerald-600 text-[10px] font-semibold px-2 py-0.5 rounded-md">${note.courseCode}</span>` : ''}
                                </div>
                            </div>
                        </div>
                        <div class="flex flex-col items-end justify-between self-stretch shrink-0">
                            <button class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-ellipsis text-[14px]"></i></button>
                            <div class="flex items-center gap-3">
                                <i class="${isBookmarked ? 'fa-solid fa-bookmark text-brand-blue' : 'fa-regular fa-bookmark text-gray-400'} text-[14px]"></i>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        // 5. Dynamic Rendering for Accessed Items
        function renderAccessed(accessedItems = []) {
            const container = document.getElementById('accessed-list-container');
            container.innerHTML = '';
            document.getElementById('accessed-header-count').textContent = `${accessedItems.length} items`;

            if (accessedItems.length === 0) {
                container.innerHTML = `<p class="text-sm text-gray-500 py-4 text-center">No accessed resources yet.</p>`;
                return;
            }

            accessedItems.forEach(item => {
                const paidDate = item.access?.paidAt ? new Date(item.access.paidAt).toLocaleDateString() : 'Active';
                const card = `
                    <div class="bg-white border border-gray-100 rounded-2xl p-3.5 sm:p-4 shadow-sm hover:shadow-md transition-shadow flex items-center justify-between gap-3 w-full">
                        <div class="flex items-center gap-3.5">
                            <div class="w-14 h-16 sm:w-16 sm:h-20 rounded-lg overflow-hidden shrink-0 bg-slate-900">
                                <img src="${item.coverImage || 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&q=80&w=200'}" alt="${item.title}" class="w-full h-full object-cover">
                            </div>
                            <div>
                                <h3 class="font-bold text-gray-900 text-[14px] sm:text-[15px]">${item.title}</h3>
                                <p class="text-[12px] text-gray-500 font-medium mb-2">${item.uploader?.fullname || 'System'}</p>
                                <span class="bg-blue-50 text-brand-blue text-[11px] font-medium px-2.5 py-1 rounded-md">Purchased Access</span>
                            </div>
                        </div>
                        <div class="flex flex-col items-end justify-between self-stretch shrink-0">
                            <div class="flex items-center gap-1.5 bg-emerald-50 text-emerald-600 border border-emerald-100 px-2.5 py-1 rounded-full text-[11px] font-semibold">
                                <i class="fa-regular fa-circle-check"></i> Unlocked
                            </div>
                            <div class="text-right">
                                <div class="text-[11px] text-gray-400">Access Date</div>
                                <div class="text-[12px] font-bold text-gray-800">${paidDate}</div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        // 6. Dynamic Rendering for Reading History
        function renderHistory(historyItems = []) {
            const container = document.getElementById('history-list-container');
            container.innerHTML = '';

            if (historyItems.length === 0) {
                container.innerHTML = `<p class="text-sm text-gray-500 py-4 text-center">No history record found.</p>`;
                return;
            }

            let historyHTML = `
                <div>
                    <div class="flex items-center gap-2 mb-3">
                        <div class="w-2.5 h-2.5 rounded-full bg-brand-blue"></div>
                        <h3 class="font-bold text-gray-900 text-[14px]">Recent Activity</h3>
                    </div>
                    <div class="space-y-3 pl-4 border-l-2 border-gray-100 ml-1">
            `;

            historyItems.forEach(item => {
                const formattedTime = item.progress?.updatedAt ? new Date(item.progress.updatedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
                historyHTML += `
                    <div class="bg-white border border-gray-100 rounded-2xl p-3.5 flex items-center justify-between gap-3 hover:shadow-sm transition-shadow w-full">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-14 rounded-md overflow-hidden bg-slate-900 shrink-0">
                                <img src="${item.coverImage || 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&q=80&w=200'}" alt="${item.title}" class="w-full h-full object-cover">
                            </div>
                            <div>
                                <h4 class="font-bold text-gray-900 text-[14px]">${item.title}</h4>
                                <p class="text-[12px] text-gray-500 mb-1">${item.uploader?.fullname || 'Resource'}</p>
                                <span class="bg-blue-50 text-brand-blue text-[10px] font-semibold px-2 py-0.5 rounded-md">${item.progress?.progressPercent || 0}% Read</span>
                            </div>
                        </div>
                        <div class="text-right flex items-center gap-3">
                            <div>
                                <div class="text-[11px] text-gray-400"><i class="fa-regular fa-clock"></i> ${formattedTime}</div>
                            </div>
                            <i class="fa-solid fa-chevron-right text-gray-300 text-[12px]"></i>
                        </div>
                    </div>
                `;
            });

            historyHTML += `</div></div>`;
            container.innerHTML = historyHTML;
        }
    </script>
</body>
</html>
