<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Resource UI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Flowbite CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#081432',
                            blue: '#1a6cfb',
                            button: '#065afb',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom styles to refine the glow and positioning */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        body {
            background-color: #f8fafc;
            font-family: 'Inter', sans-serif;
        }

        /* Hide scrollbar for the categories on smaller screens */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 md:p-8">

    <div class="w-full max-w-[850px] mx-auto space-y-6">
        
        <!-- Hero Banner -->
        <div class="relative bg-brand-dark rounded-[32px] p-8 md:p-12 overflow-hidden shadow-lg flex flex-col md:flex-row items-center min-h-[340px]">
            <!-- Background Glow Effect -->
            <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-[#143477] rounded-full blur-[80px] -translate-y-1/2 translate-x-1/4 opacity-60 pointer-events-none"></div>

            <!-- Left Content -->
            <div class="relative z-10 w-full md:w-1/2 text-left space-y-5">
                <h1 class="text-white text-4xl md:text-[42px] font-bold leading-[1.15] tracking-tight">
                    Knowledge at your <br>
                    <span class="text-brand-blue">fingertips</span>
                </h1>
                <p class="text-gray-200 text-[17px] leading-relaxed max-w-[280px]">
                    Access thousands of academic resources anytime, anywhere.
                </p>
                <div class="pt-2">
                    <button type="button" class="text-white bg-brand-button hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 font-medium rounded-xl text-base px-6 py-3 mr-2 mb-2 focus:outline-none transition-all shadow-md">
                        Explore Now
                    </button>
                </div>
            </div>

            <!-- Right Illustration (Placeholder for the 3D Image) -->
            <div class="relative z-10 w-full md:w-1/2 mt-8 md:mt-0 flex justify-center md:justify-end items-center pointer-events-none">
                <!-- Replace the src with your actual 3D books image. 
                     Using a placeholder block to represent the space the image occupies -->
                <div class="w-64 h-64 md:w-80 md:h-80 bg-transparent flex items-center justify-center relative">
                     <!-- 
                        <img src="path_to_your_3d_books_image.png" alt="Academic Resources" class="w-full h-full object-contain object-right" /> 
                     -->
                </div>
            </div>

            <!-- Carousel Indicators -->
            <div class="absolute bottom-6 left-0 right-0 flex justify-center space-x-3 z-20">
                <button type="button" class="w-2.5 h-2.5 rounded-full bg-white" aria-current="true" aria-label="Slide 1"></button>
                <button type="button" class="w-2.5 h-2.5 rounded-full border-[1.5px] border-white/50 bg-transparent hover:bg-white/20 transition-colors" aria-current="false" aria-label="Slide 2"></button>
                <button type="button" class="w-2.5 h-2.5 rounded-full border-[1.5px] border-white/50 bg-transparent hover:bg-white/20 transition-colors" aria-current="false" aria-label="Slide 3"></button>
                <button type="button" class="w-2.5 h-2.5 rounded-full border-[1.5px] border-white/50 bg-transparent hover:bg-white/20 transition-colors" aria-current="false" aria-label="Slide 4"></button>
            </div>
        </div>

        <!-- Category Menu -->
        <div class="bg-white rounded-[32px] p-6 md:px-10 md:py-8 shadow-[0_8px_30px_rgb(0,0,0,0.04)] overflow-x-auto no-scrollbar">
            <div class="flex justify-between items-start min-w-[600px] md:min-w-0">
                
                <!-- All Resources -->
                <a href="#" class="flex flex-col items-center group w-20">
                    <div class="w-[60px] h-[60px] rounded-[18px] bg-[#eef3ff] flex items-center justify-center text-brand-button shadow-sm group-hover:scale-105 transition-transform duration-200">
                        <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M4 4a2 2 0 012-2h12a2 2 0 012 2v16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm6 2a1 1 0 000 2h4a1 1 0 100-2h-4zm-1 6a1 1 0 00-1 1v4a1 1 0 001 1h6a1 1 0 001-1v-4a1 1 0 00-1-1H9z"></path>
                        </svg>
                    </div>
                    <span class="mt-3 text-[13px] font-semibold text-[#1f2937] text-center leading-[1.3]">All<br>Resources</span>
                </a>

                <!-- Books -->
                <a href="#" class="flex flex-col items-center group w-20">
                    <div class="w-[60px] h-[60px] rounded-[18px] bg-[#feeff1] flex items-center justify-center text-[#ff4c61] shadow-sm group-hover:scale-105 transition-transform duration-200">
                        <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M4 4a2 2 0 012-2h12a2 2 0 012 2v16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm4 4v2h8V8H8zm0 4v2h8v-2H8zm0 4v2h5v-2H8z"></path>
                        </svg>
                    </div>
                    <span class="mt-3 text-[13px] font-semibold text-[#1f2937] text-center">Books</span>
                </a>

                <!-- Notes -->
                <a href="#" class="flex flex-col items-center group w-20">
                    <div class="w-[60px] h-[60px] rounded-[18px] bg-[#f5f0ff] flex items-center justify-center text-[#9b51e0] shadow-sm group-hover:scale-105 transition-transform duration-200">
                        <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M9 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8.828a2 2 0 00-.586-1.414l-5.414-5.414A2 2 0 0012.586 2H9zm4 1.414L18.586 9H13V3.414zM8 11h8v2H8v-2zm0 4h8v2H8v-2z"></path>
                        </svg>
                    </div>
                    <span class="mt-3 text-[13px] font-semibold text-[#1f2937] text-center">Notes</span>
                </a>

                <!-- Videos -->
                <a href="#" class="flex flex-col items-center group w-20">
                    <div class="w-[60px] h-[60px] rounded-[18px] bg-[#ebfcf1] flex items-center justify-center text-[#219653] shadow-sm group-hover:scale-105 transition-transform duration-200">
                        <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path fill-rule="evenodd" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z" clip-rule="evenodd"></path>
                        </svg>
                    </div>
                    <span class="mt-3 text-[13px] font-semibold text-[#1f2937] text-center">Videos</span>
                </a>

                <!-- Audio -->
                <a href="#" class="flex flex-col items-center group w-20">
                    <div class="w-[60px] h-[60px] rounded-[18px] bg-[#fff4ea] flex items-center justify-center text-[#f2994a] shadow-sm group-hover:scale-105 transition-transform duration-200">
                        <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 3a9 9 0 00-9 9v7a2 2 0 002 2h3a2 2 0 002-2v-5a2 2 0 00-2-2H5.03A7 7 0 0112 5a7 7 0 016.97 7H16a2 2 0 00-2 2v5a2 2 0 002 2h3a2 2 0 002-2v-7a9 9 0 00-9-9z"></path>
                        </svg>
                    </div>
                    <span class="mt-3 text-[13px] font-semibold text-[#1f2937] text-center">Audio</span>
                </a>

                <!-- More -->
                <a href="#" class="flex flex-col items-center group w-20">
                    <div class="w-[60px] h-[60px] rounded-[18px] bg-[#f3f4f6] flex items-center justify-center text-[#6b7280] shadow-sm group-hover:scale-105 transition-transform duration-200">
                        <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path fill-rule="evenodd" d="M5 4a1 1 0 00-1 1v6a1 1 0 001 1h6a1 1 0 001-1V5a1 1 0 00-1-1H5zm8 0a1 1 0 00-1 1v6a1 1 0 001 1h6a1 1 0 001-1V5a1 1 0 00-1-1h-6zm-8 10a1 1 0 00-1 1v6a1 1 0 001 1h6a1 1 0 001-1v-6a1 1 0 00-1-1H5zm8 0a1 1 0 00-1 1v6a1 1 0 001 1h6a1 1 0 001-1v-6a1 1 0 00-1-1h-6z" clip-rule="evenodd"></path>
                        </svg>
                    </div>
                    <span class="mt-3 text-[13px] font-semibold text-[#1f2937] text-center">More</span>
                </a>

            </div>
        </div>
    </div>

    <!-- Flowbite JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
</body>
</html>
