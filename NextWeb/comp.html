<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Resource UI - Fixed Dimensions</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Flowbite CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0a1738',
                            blue: '#1a6cfb',
                            button: '#0d5dff',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        body {
            background-color: #f4f6f9;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
    </style>
</head>
<body>

    <!-- Main Fixed Wrapper (Exact Width) -->
    <div class="w-[840px] space-y-[24px]">
        
        <!-- Top Hero Banner (Fixed 840x330) -->
        <div class="relative w-[840px] h-[330px] bg-brand-dark rounded-[32px] overflow-hidden shadow-[0_12px_24px_rgb(0,0,0,0.15)] flex items-center">
            
            <!-- Background Glow Effect -->
            <div class="absolute top-0 right-0 w-[550px] h-[550px] bg-[#143477] rounded-full blur-[90px] -translate-y-[150px] translate-x-[150px] opacity-70 pointer-events-none"></div>

            <!-- Left Content (Fixed Dimensions and Padding) -->
            <div class="relative z-10 w-[450px] pl-[50px]">
                <h1 class="text-white text-[42px] font-bold leading-[1.15] tracking-tight mb-[16px]">
                    Knowledge at your <br>
                    <span class="text-[#2b7cff]">fingertips</span>
                </h1>
                <p class="text-[#cbd5e1] text-[17px] leading-[1.5] w-[310px] mb-[28px]">
                    Access thousands of academic resources anytime, anywhere.
                </p>
                <button type="button" class="w-[145px] h-[48px] text-white bg-brand-button hover:bg-blue-700 font-semibold rounded-[12px] text-[16px] flex items-center justify-center transition-all shadow-md">
                    Explore Now
                </button>
            </div>

            <!-- Right Illustration Placeholder (Fixed Positioning) -->
            <div class="absolute right-[30px] bottom-[25px] z-10 w-[340px] h-[280px] bg-transparent flex justify-end items-end pointer-events-none">
                <!-- Image placeholder area for the 3D book asset -->
                <!-- <img src="file_00000000599481f4bc45c275d4fc45b4.png" alt="Books" class="w-full h-full object-contain" /> -->
            </div>

            <!-- Carousel Indicators -->
            <div class="absolute bottom-[24px] left-0 right-0 flex justify-center space-x-[10px] z-20">
                <button type="button" class="w-[10px] h-[10px] rounded-full bg-white shadow-sm" aria-current="true"></button>
                <button type="button" class="w-[10px] h-[10px] rounded-full border-[1.5px] border-white/40 bg-transparent" aria-current="false"></button>
                <button type="button" class="w-[10px] h-[10px] rounded-full border-[1.5px] border-white/40 bg-transparent" aria-current="false"></button>
                <button type="button" class="w-[10px] h-[10px] rounded-full border-[1.5px] border-white/40 bg-transparent" aria-current="false"></button>
            </div>
        </div>

        <!-- Category Menu (Fixed 840x150) -->
        <div class="w-[840px] h-[150px] bg-white rounded-[32px] px-[40px] shadow-[0_8px_30px_rgb(0,0,0,0.06)] flex items-center justify-between">
            
            <!-- All Resources -->
            <a href="#" class="flex flex-col items-center group w-[80px]">
                <div class="w-[68px] h-[68px] rounded-[22px] bg-[#eff4ff] flex items-center justify-center text-[#2b7cff] shadow-sm group-hover:scale-105 transition-transform duration-200">
                    <svg class="w-[30px] h-[30px]" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 4a2 2 0 012-2h12a2 2 0 012 2v16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm6 2a1 1 0 000 2h4a1 1 0 100-2h-4zm-1 6a1 1 0 00-1 1v4a1 1 0 001 1h6a1 1 0 001-1v-4a1 1 0 00-1-1H9z"></path>
                    </svg>
                </div>
                <span class="mt-[12px] text-[14px] font-semibold text-[#111827] text-center leading-[1.2]">All<br>Resources</span>
            </a>

            <!-- Books -->
            <a href="#" class="flex flex-col items-center group w-[80px]">
                <div class="w-[68px] h-[68px] rounded-[22px] bg-[#ffeff1] flex items-center justify-center text-[#ff4c61] shadow-sm group-hover:scale-105 transition-transform duration-200">
                    <svg class="w-[30px] h-[30px]" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 4a2 2 0 012-2h12a2 2 0 012 2v16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm4 4v2h8V8H8zm0 4v2h8v-2H8zm0 4v2h5v-2H8z"></path>
                    </svg>
                </div>
                <span class="mt-[12px] text-[14px] font-semibold text-[#111827] text-center block w-full">Books</span>
            </a>

            <!-- Notes -->
            <a href="#" class="flex flex-col items-center group w-[80px]">
                <div class="w-[68px] h-[68px] rounded-[22px] bg-[#f5efff] flex items-center justify-center text-[#9b51e0] shadow-sm group-hover:scale-105 transition-transform duration-200">
                    <svg class="w-[30px] h-[30px]" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8.828a2 2 0 00-.586-1.414l-5.414-5.414A2 2 0 0012.586 2H9zm4 1.414L18.586 9H13V3.414zM8 11h8v2H8v-2zm0 4h8v2H8v-2z"></path>
                    </svg>
                </div>
                <span class="mt-[12px] text-[14px] font-semibold text-[#111827] text-center block w-full">Notes</span>
            </a>

            <!-- Videos -->
            <a href="#" class="flex flex-col items-center group w-[80px]">
                <div class="w-[68px] h-[68px] rounded-[22px] bg-[#e6fcf0] flex items-center justify-center text-[#219653] shadow-sm group-hover:scale-105 transition-transform duration-200">
                    <svg class="w-[34px] h-[34px]" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z" clip-rule="evenodd"></path>
                    </svg>
                </div>
                <span class="mt-[12px] text-[14px] font-semibold text-[#111827] text-center block w-full">Videos</span>
            </a>

            <!-- Audio -->
            <a href="#" class="flex flex-col items-center group w-[80px]">
                <div class="w-[68px] h-[68px] rounded-[22px] bg-[#fff5eb] flex items-center justify-center text-[#f2994a] shadow-sm group-hover:scale-105 transition-transform duration-200">
                    <svg class="w-[30px] h-[30px]" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 3a9 9 0 00-9 9v7a2 2 0 002 2h3a2 2 0 002-2v-5a2 2 0 00-2-2H5.03A7 7 0 0112 5a7 7 0 016.97 7H16a2 2 0 00-2 2v5a2 2 0 002 2h3a2 2 0 002-2v-7a9 9 0 00-9-9z"></path>
                    </svg>
                </div>
                <span class="mt-[12px] text-[14px] font-semibold text-[#111827] text-center block w-full">Audio</span>
            </a>

            <!-- More -->
            <a href="#" class="flex flex-col items-center group w-[80px]">
                <div class="w-[68px] h-[68px] rounded-[22px] bg-[#f3f4f6] flex items-center justify-center text-[#6b7280] shadow-sm group-hover:scale-105 transition-transform duration-200">
                    <svg class="w-[30px] h-[30px]" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" d="M5 4a1 1 0 00-1 1v6a1 1 0 001 1h6a1 1 0 001-1V5a1 1 0 00-1-1H5zm8 0a1 1 0 00-1 1v6a1 1 0 001 1h6a1 1 0 001-1V5a1 1 0 00-1-1h-6zm-8 10a1 1 0 00-1 1v6a1 1 0 001 1h6a1 1 0 001-1v-6a1 1 0 00-1-1H5zm8 0a1 1 0 00-1 1v6a1 1 0 001 1h6a1 1 0 001-1v-6a1 1 0 00-1-1h-6z" clip-rule="evenodd"></path>
                    </svg>
                </div>
                <span class="mt-[12px] text-[14px] font-semibold text-[#111827] text-center block w-full">More</span>
            </a>

        </div>
    </div>

    <!-- Flowbite JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
</body>
</html>
